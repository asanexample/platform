# Dependabot — dependency + GitHub Actions update PRs.
# Free on private repos (unlike Code Scanning / GHAS). Part of #112 (108a, supply-chain hardening).
version: 2
updates:
  # Go modules: the Terratest suites + the platctl orchestrator CLI.
  - package-ecosystem: "gomod"
    directories:
      - "/infra/tests/aws"
      - "/cmd/platctl"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    # One batched PR/week instead of one-per-module (less noise; a single CI run).
    groups:
      go-modules:
        patterns: ["*"]

  # GitHub Actions in workflows + composite actions. Surfaces unpinned/outdated actions
  # (and lets us move pins forward) — directly relevant after the trivy-action tag-hijack.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns: ["*"]

  # OpenTofu/Terraform provider + module version constraints across the shared modules.
  - package-ecosystem: "terraform"
    directories:
      - "/infra/modules/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "terraform"]
    groups:
      terraform:
        patterns: ["*"]

  # Base images in the self-hosted GitHub Actions runner image (ADR-065).
  # (Scaffolded product repos get their own docker coverage via the skeleton's dependabot.yml.)
  - package-ecosystem: "docker"
    directory: "/docker/gha-runner"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    groups:
      docker:
        patterns: ["*"]
