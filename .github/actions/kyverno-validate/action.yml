name: Kyverno Validate (shift-left)
description: >-
  Render the platform tenant Kyverno policies for a team, INJECT the derived route hostnames into the app's
  manifests (the way argocd-apps does at deploy, ADR-060/061), then apply the policies — the same checks
  admission enforces, run pre-merge. The team's allowed hostnames are DERIVED from its XTenant claim
  (gitops/tenant-claims/<env>/<team>.yaml), the sole source of truth. Cluster-free; needs no AWS credentials
  or secrets, so it is safe on pull_request (including forks). Image signature verification is intentionally
  skipped (the image isn't built/signed at PR time); admission remains the enforcement point.
inputs:
  team:
    description: Tenant team key (namespace is team-<team>), e.g. "alpha".
    required: true
  app:
    description: >-
      App key (the route host is <app>-<team>.<base-domain>). Optional — when omitted, inferred from the
      claim's sole spec.apps entry (required for multi-app teams).
    required: false
    default: ""
  manifests-path:
    description: Path in the calling repo to the app's kustomize dir (contains kustomization.yaml).
    required: false
    default: k8s/preprod
  env:
    description: Platform environment whose XTenant claim supplies the team's apps + domain aliases.
    required: false
    default: preprod
  base-domain:
    description: Base domain for derived route hostnames (must match the cluster's EnvironmentConfig baseDomain).
    required: false
    default: preprod.aws.refplat.org
  ecr-registry:
    description: Platform ECR host that tenant images must come from.
    required: false
    default: "829808296602.dkr.ecr.us-east-1.amazonaws.com"
  kyverno-version:
    description: Kyverno CLI version — pin to the cluster chart's appVersion so semantics match.
    required: false
    default: "1.18.1"
  yq-version:
    description: mikefarah yq release version used to read the XTenant claim + inject route hostnames.
    required: false
    default: "4.44.3"
outputs:
  hostnames:
    description: The team's allowed route hostnames derived from its XTenant claim (JSON array).
    value: ${{ steps.hostnames.outputs.json }}
runs:
  using: composite
  steps:
    - uses: azure/setup-helm@v4
    - uses: azure/setup-kubectl@v4
    # ${{ }} expressions are passed via env (not interpolated into the script) to
    # avoid the shell-injection class (semgrep run-shell-injection / #112).
    - name: Install Kyverno CLI
      shell: bash
      env:
        KYVERNO_VERSION: ${{ inputs.kyverno-version }}
      run: |
        set -euo pipefail
        url="https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
        curl -fsSL "$url" -o /tmp/kyverno.tgz
        tar -C /tmp -xzf /tmp/kyverno.tgz kyverno
        sudo install -m 0755 /tmp/kyverno /usr/local/bin/kyverno
        kyverno version
    - name: Install yq
      shell: bash
      env:
        YQ_VERSION: ${{ inputs.yq-version }}
      run: |
        set -euo pipefail
        url="https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
        curl -fsSL "$url" -o /tmp/yq
        sudo install -m 0755 /tmp/yq /usr/local/bin/yq
        yq --version
    # Derive the team's allowed route hostnames the SAME way the Crossplane Tenant Composition does (ADR-060/
    # 061), from its XTenant claim (the sole source of truth) — not teams.hcl:
    #   allow-list (the Kyverno guard, team-wide): per app  <app>-<team>.<base> + <app>-<team>-pr-*.<base>,
    #                                              plus every spec.domains[].host alias.
    #   inject set (this app, mirrors argocd-apps): <app>-<team>.<base> + the aliases (single-app teams only).
    - name: Derive route hostnames from the XTenant claim
      id: hostnames
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ENV_NAME: ${{ inputs.env }}
        TEAM: ${{ inputs.team }}
        APP: ${{ inputs.app }}
        BASE_DOMAIN: ${{ inputs.base-domain }}
      run: |
        set -euo pipefail
        claim="${ACTION_PATH}/../../../gitops/tenant-claims/${ENV_NAME}/${TEAM}.yaml"
        if [ ! -f "$claim" ]; then
          echo "::error::XTenant claim not found at $claim — cannot derive the team's route hostnames."
          exit 1
        fi
        mapfile -t apps < <(yq '.spec.apps | keys | .[]' "$claim")
        if [ "${#apps[@]}" -eq 0 ]; then
          echo "::error::claim ${claim} declares no spec.apps."
          exit 1
        fi
        if [ -z "$APP" ]; then
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::error::team-${TEAM} has ${#apps[@]} apps — pass the 'app' input to select one."
            exit 1
          fi
          APP="${apps[0]}"
        fi
        # spec.domains[].host aliases (may be absent → empty; traversing a missing key yields no output).
        mapfile -t aliases < <(yq '.spec.domains[].host' "$claim")

        # allow-list (team-wide)
        allow="$( {
          for a in "${apps[@]}"; do
            printf '%s\n' "${a}-${TEAM}.${BASE_DOMAIN}" "${a}-${TEAM}-pr-*.${BASE_DOMAIN}"
          done
          printf '%s\n' "${aliases[@]}"
        } | jq -R -s -c 'split("\n") | map(select(length>0)) | unique' )"

        # inject set (this app); aliases only when the team is single-app (matches argocd-apps targeting).
        inject="$( {
          printf '%s\n' "${APP}-${TEAM}.${BASE_DOMAIN}"
          if [ "${#apps[@]}" -eq 1 ]; then printf '%s\n' "${aliases[@]}"; fi
        } | jq -R -s -c 'split("\n") | map(select(length>0))' )"

        echo "json=$allow" >> "$GITHUB_OUTPUT"
        echo "inject=$inject" >> "$GITHUB_OUTPUT"
        echo "team-${TEAM} app-${APP} allow-list: $allow"
        echo "team-${TEAM} app-${APP} inject: $inject"
    - name: Validate manifests against platform policies
      shell: bash
      env:
        TEAM: ${{ inputs.team }}
        MANIFESTS_PATH: ${{ inputs.manifests-path }}
        POLICIES_CHART: ${{ github.action_path }}/../../../infra/modules/policy/policies-chart
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        HOSTNAMES_JSON: ${{ steps.hostnames.outputs.json }}
        INJECT_HOSTS_JSON: ${{ steps.hostnames.outputs.inject }}
      run: ${{ github.action_path }}/validate.sh
