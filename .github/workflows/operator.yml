# Activation operator (operators/activation) — build, generated-drift gate, lint, and envtest tests.
# Path-filtered so the heavy controller-runtime/k8s.io build only runs on PRs that touch the operator.
# Go is pinned by operators/activation/go.mod via setup-go's go-version-file (kept current by Dependabot).
name: Activation Operator

on:
  push:
    branches: [main]
    paths:
      - "operators/activation/**"
      - "infra/modules/crossplane/charts/governance-registry/**"
      - "infra/modules/activation-operator/chart/**"
      - ".github/workflows/operator.yml"
      - ".github/scripts/sync-operator-crds.sh"
  pull_request:
    paths:
      - "operators/activation/**"
      - "infra/modules/crossplane/charts/governance-registry/**"
      - "infra/modules/activation-operator/chart/**"
      - ".github/workflows/operator.yml"
      - ".github/scripts/sync-operator-crds.sh"

permissions:
  contents: read

jobs:
  operator-test:
    name: Activation Operator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operators/activation/go.mod
          cache-dependency-path: operators/activation/go.sum

      - name: Generated manifests + deepcopy are up to date
        working-directory: operators/activation
        run: |
          make manifests generate
          git diff --exit-code -- config api || {
            echo "::error::CRD/deepcopy are stale — run 'make manifests generate' and commit." ; exit 1 ; }

      - name: Chart CRDs match the operator schema
        run: |
          .github/scripts/sync-operator-crds.sh
          git diff --exit-code -- \
            infra/modules/crossplane/charts/governance-registry/templates \
            infra/modules/activation-operator/chart/templates/activation-crd.yaml || {
            echo "::error::vendored chart CRDs are stale vs operators/activation/api/* — run .github/scripts/sync-operator-crds.sh and commit." ; exit 1 ; }

      - name: Vet
        working-directory: operators/activation
        run: make vet

      - name: Lint
        working-directory: operators/activation
        run: make lint

      - name: Test (envtest)
        working-directory: operators/activation
        run: make test
