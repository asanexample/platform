name: gitops — gate on PR

# Validate the ADR-067 registry surfaces on a PR: the Product registry (gitops/products/**) and the
# Environment claims (gitops/environments/**). Shift-left for the admission controls a PR will hit:
#   - Product: schema shape + enums + ownership (the owning Team exists) — see validate-products.sh
#   - Environment: schema + enums + the ENVELOPE (stage/tier ∈ Team envelope, team == Product.team,
#     customer-iff-per-customer-prod, the policyStatements IAM deny-set) — the same checks
#     restrict-environment-envelope (#387) makes at admission, run pre-merge — see validate-environments.sh
#
# Sibling of the Teams Gate / Tenant Claims Gate. Validation-only and meant to be a REQUIRED status check on
# main (the classify step short-circuits to trivially-green on non-PRs, so a path filter — which would never
# report on unrelated PRs and block them forever — is deliberately NOT used). The surface are empty until
# the cutover (docs/runbooks/v3-cutover.md), so today this is inert; it activates the moment the first
# gitops/products or gitops/environments file lands.
#
# AUTO-MERGE + DELETION GUARD + GATED PROD (ADR-062 §3-4, ADR-067 §8 / #377, ADR-068 §7 / #501). Decision table:
#   author          diff                                outcome
#   promote/scaff   ⊆ gitops/{products,environments,    gate green + auto-merge armed (merges when ALL
#    App            releases ≤ staging}, no deletions    required checks pass) — auto ≤ staging
#   promote/scaff   a PROD release (…/prod.yaml)         NOT auto-armed + an approval (≠ author) from the
#    App                                                 release-approver set (derived from Person grants, ADR-090) on
#                                                        the "gitops Approval" check; pci/hipaa ⇒ ≥2 — gated prod
#   any             a Product spec.roles edit            an admin/maintainer approval (≠ author) — can't add an
#                                                        approver then self-approve (#501 two-step guard)
#   scaffolder App  ⊆ those paths, validation fails      gate red, no merge
#   scaffolder App  a claim DELETION on a purge branch   permitted (Deprovision Product/Environment): decommission-
#                   (product/purge-* | environment/      first + completeness guards + an admin/maintainer approval
#                    purge-*)                             (≠ author), + the release-approver if a PROD env is in the
#                                                        bundle (#501); never auto-armed (ADR-062 #283)
#   scaffolder App  a claim DELETION off a purge branch  rejected (deletions only via the Deprovision purge path)
#   promote App     a claim DELETION                     rejected (the promote App only bumps digests — never deletes)
#   any             an Environment DECOMMISSION          validated; NOT auto-armed AND requires ANY one approving
#                   (spec.lifecycle.phase → suspend)      review ≠ author on "gitops Approval" — draining a
#                                                        Product/env (incl. prod) needs an explicit human sign-off
#                                                        even though reversible
#   human           a claim deletion                     decommission-first guard + an admin/maintainer approval
#                                                        (≠ author) on the "gitops Approval" check; never auto-armed
#   human           adds/edits, no deletion              validated, never auto-armed
# "gitops Approval" must be a REQUIRED status check on main (gates deletions, prod, Product roles edits). Team
# roles edits are gated by the SEPARATE Teams Gate ("Teams Approval"). docs/runbooks/tenant-claims-automerge.md.
#
# CI-GATE INTEGRITY: `pull_request_target` means THIS definition and every script it calls run from the
# PROTECTED BASE BRANCH — a PR cannot edit the gate that judges it. The PR's registry files are checked out
# separately, sparse, credential-free, and read strictly as YAML DATA (yq only); nothing from the head
# checkout is ever executed, templated, or interpolated.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: write # gh pr merge --auto
  pull-requests: write
  statuses: write # publish the "gitops Approval" commit status (last-write-wins; see the verdict step)

concurrency:
  group: gitops-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gitops Gate
    runs-on: ubuntu-latest # pure YAML validation — no cluster/private-API access needed
    env:
      # IAM deny-set for Service policyStatements (mirrors the policy's iamSensitiveServices / #387).
      IAM_SENSITIVE: "iam sts organizations account"
      CROSSPLANE_VERSION: "v2.2.3" # crank CLI (built from the Go module proxy — see install step). Newest that still ships cmd/crank; removed from the main module at v2.3.0.
      SCAFFOLDER_APP_LOGIN: "asanexample-backstage-scaffolder[bot]"
      # The promote App (ADR-071) authors release digest-bump PRs (gitops/releases/**) from app CI; it is
      # least-privilege (contents+pull_requests write on THIS repo only — no repo-create). Its release-only,
      # non-deletion PRs auto-merge on the same path as the scaffolder. See docs/runbooks/promote-github-app.md.
      PROMOTE_APP_LOGIN: "asanexample-promote[bot]"
    steps:
      # Trusted: the gate scripts + the Team/Product registries (envelope + ownership authority) all come from
      # BASE. Always runs (classify needs the script).
      # (nosemgrep — the rule flags any checkout under pull_request_target; this is the protected base, and the
      # PR head below is sparse, data-only.)
      # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
      - name: Checkout base (trusted)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      # Classify FIRST (cheap, gh-api only) so the rest short-circuits on non-PRs → the job still reports
      # the "gitops Gate" check (required-check compatible) without doing any validation work.
      - name: Classify diff
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash base/.github/scripts/gitops-gate/classify-diff.sh

      # Untrusted: ONLY the registry trees, sparse, no credentials, data-only. Nothing here runs; the
      # validators (from base) read these files with yq as data. A new Product added by the same PR is read
      # from head (the environment validator resolves the Product from head, falling back to base).
      # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
      - name: Checkout PR registry (untrusted, data-only)
        if: steps.classify.outputs.any == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          sparse-checkout: |
            gitops/products
            gitops/teams
            gitops/environments
            gitops/releases
            gitops/agents
            gitops/grants
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Install yq
        # needed by the validators (any==true) AND the decommission-first deletion guard (deletions==true,
        # which can be a pure-deletion PR where any==false)
        if: steps.classify.outputs.any == 'true' || steps.classify.outputs.deletions == 'true'
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # A Product/Environment DECOMMISSION (spec.lifecycle.phase → decommissioning/suspended) drains workloads
      # (incl. prod), so it is reviewer-merged, NOT self-service auto-merged — even though it's reversible and
      # non-deletion. Detect it from HEAD so the Arm auto-merge step can exclude it (Deprovision Product, ADR-062).
      - name: Detect lifecycle decommission (exclude from auto-merge)
        id: lifecycle
        if: steps.classify.outputs.environment_files != ''
        env:
          HEAD_DIR: ${{ github.workspace }}/head
          ENVIRONMENT_FILES: ${{ steps.classify.outputs.environment_files }}
        run: bash base/.github/scripts/gitops-gate/detect-lifecycle-decommission.sh

      - name: Validate Products
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.product_files != ''
        env:
          BASE_DIR: ${{ github.workspace }}/base
          HEAD_DIR: ${{ github.workspace }}/head
          PRODUCT_FILES: ${{ steps.classify.outputs.product_files }}
        run: bash base/.github/scripts/gitops-gate/validate-products.sh

      - name: Validate Environments (schema + envelope shift-left)
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.environment_files != ''
        env:
          BASE_DIR: ${{ github.workspace }}/base
          HEAD_DIR: ${{ github.workspace }}/head
          ENVIRONMENT_FILES: ${{ steps.classify.outputs.environment_files }}
        run: bash base/.github/scripts/gitops-gate/validate-environments.sh

      - name: Validate Releases (ADR-071 digest records)
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.release_files != ''
        env:
          BASE_DIR: ${{ github.workspace }}/base
          HEAD_DIR: ${{ github.workspace }}/head
          RELEASE_FILES: ${{ steps.classify.outputs.release_files }}
        run: bash base/.github/scripts/gitops-gate/validate-releases.sh

      - name: Validate Agents (XAgent schema + deny-set shift-left, ADR-082)
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.agent_files != ''
        env:
          BASE_DIR: ${{ github.workspace }}/base
          HEAD_DIR: ${{ github.workspace }}/head
          AGENT_FILES: ${{ steps.classify.outputs.agent_files }}
        run: bash base/.github/scripts/gitops-gate/validate-agents.sh

      - name: Validate Service Grants (ServiceGrant schema + directory-team + regulated-tier shift-left, ADR-101)
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.grant_files != ''
        env:
          BASE_DIR: ${{ github.workspace }}/base
          HEAD_DIR: ${{ github.workspace }}/head
          GRANT_FILES: ${{ steps.classify.outputs.grant_files }}
        run: bash base/.github/scripts/gitops-gate/validate-service-grants.sh

      # --- composition render: prove each Environment claim BUILDS against the Composition (the
      # Environment+Product join), catching schema/envelope-valid-but-render-breaking claims. Only when there
      # are Environment files. Docker is preinstalled on ubuntu-latest; crank is built from the Go module proxy
      # (releases.crossplane.io intermittently 403s runner IPs — same install as the Tenant Claims Gate).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.environment_files != ''
        with:
          go-version: stable
      - name: Install Crossplane CLI (build crank from the Go module proxy)
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.environment_files != ''
        run: |
          go install -ldflags "-X github.com/crossplane/crossplane/v2/internal/version.version=${CROSSPLANE_VERSION}" "github.com/crossplane/crossplane/v2/cmd/crank@${CROSSPLANE_VERSION}"
          sudo install -m 0755 "$(go env GOPATH)/bin/crank" /usr/local/bin/crossplane

      - name: Render Environments (composition build proof)
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.environment_files != ''
        env:
          BASE_DIR: ${{ github.workspace }}/base
          HEAD_DIR: ${{ github.workspace }}/head
          ENVIRONMENT_FILES: ${{ steps.classify.outputs.environment_files }}
        run: bash base/.github/scripts/gitops-gate/render-environments.sh

      # ---- auto-merge + deletion lifecycle (ADR-062 §3-4) -------------------------------------------
      - name: Identify author
        id: author
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          bot=false
          # The write Apps (scaffolder: onboarding PRs; promote: ADR-071 release digest bumps) only ever push
          # branches in this repo; require same-repo (a fork claiming the name would be a different login anyway
          # — belt and braces). Both author registry-only, non-deletion PRs that auto-merge on the same path.
          if { [ "$AUTHOR" = "$SCAFFOLDER_APP_LOGIN" ] || [ "$AUTHOR" = "$PROMOTE_APP_LOGIN" ]; } && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            bot=true
          fi
          echo "bot=$bot" >>"$GITHUB_OUTPUT"

      # Bot-authored deletions are PERMITTED for the scaffolder, but ONLY on a sanctioned Deprovision purge
      # branch — a guardrail against an accidental/buggy mass-delete (the real control is the admin (+ release-
      # approver) approval on "gitops Approval" + the decommission-first/completeness guards below; ADR-062 #283).
      # The promote App only ever bumps release digests, so it must never author a deletion. Human deletions skip
      # this step (bot==false) and are caught by the same downstream guards + approval.
      - name: Guard bot-authored deletions (scaffolder purge-branch only; promote never deletes)
        if: steps.author.outputs.bot == 'true' && steps.classify.outputs.deletions == 'true'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$AUTHOR" = "$PROMOTE_APP_LOGIN" ]; then
            echo "::error::the promote App only bumps release digests (ADR-071) — it never deletes registry files. Deletion PRs come from the Deprovision templates."
            exit 1
          fi
          case "$HEAD_REF" in
            product/purge-* | environment/purge-*)
              echo "scaffolder deletion on a sanctioned purge branch ($HEAD_REF) — decommission-first/completeness guards + approval apply" ;;
            *)
              echo "::error::scaffolder deletions are only permitted on a Deprovision purge branch (product/purge-* or environment/purge-*); got '$HEAD_REF'. Use the Deprovision Product/Environment template."
              exit 1 ;;
          esac

      # Decommission-first guard (deterministic per-SHA, a hard gate) for ANY claim deletion (bot deletions are
      # now permitted via the scoped guard above, then judged here just like human deletions). yq is installed
      # below when there's anything to read.
      - name: Guard claim deletions (decommission-first)
        if: steps.classify.outputs.deletions == 'true'
        env:
          BASE_DIR: ${{ github.workspace }}/base
          DELETED_FILES: ${{ steps.classify.outputs.deleted_files }}
        run: bash base/.github/scripts/gitops-gate/validate-deletions.sh

      # Arm GitHub auto-merge ONLY for App-authored, registry-only, non-deletion, fully-validated PRs. GitHub
      # performs the merge once ALL required checks pass (this job racing ci.yml is harmless). Idempotent for
      # synchronize/review re-runs. NB: GITHUB_TOKEN merges don't trigger main's push workflows — ArgoCD pulls
      # git directly, so provisioning is unaffected.
      - name: Arm auto-merge
        if: >
          steps.author.outputs.bot == 'true' &&
          steps.classify.outputs.non_registry_changes == 'false' &&
          steps.classify.outputs.deletions == 'false' &&
          steps.classify.outputs.prod_release_files == '' &&
          steps.lifecycle.outputs.decommission != 'true' &&
          steps.classify.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # --repo everywhere: the workspace root is not a git repo (checkouts live in base/ and head/).
        run: |
          if [ -n "$(gh pr view "$PR_NUMBER" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest // empty')" ]; then
            echo "auto-merge already armed"
          elif gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash 2>/tmp/merge_err; then
            echo "auto-merge armed (squash) — merges when all required checks pass"
          else
            # GitHub REFUSES to arm auto-merge once the PR is already mergeable (mergeStateStatus CLEAN/UNSTABLE —
            # all REQUIRED checks have passed; only non-required ones are pending, e.g. the reconcile-on-product-merge
            # dispatcher, which sits IN_PROGRESS for ~15 min). There's then nothing to wait for, so merge directly —
            # a squash still honours branch protection's required checks, so this can't merge an unvalidated PR.
            # Without this, a fast-passing PR (or any pending non-required check) would silently never merge.
            if grep -qiE 'unstable status|clean status|not in the correct state|not mergeable' /tmp/merge_err; then
              echo "auto-merge not applicable (PR already mergeable) — merging directly"
              gh pr merge "$PR_NUMBER" --repo "$REPO" --squash
            else
              echo "::error::failed to arm auto-merge"; cat /tmp/merge_err >&2; exit 1
            fi
          fi

      # The deletion admin-approval requirement is published HERE as a commit status — NOT a job failure — so it
      # survives the pull_request_target → pull_request_review handoff (commit statuses are last-write-wins per
      # (sha, context): the post-approval run overwrites the pre-approval failure, unblocking WITHOUT a manual
      # re-run). Default success; required only for claim deletions. Make "gitops Approval" the
      # branch-protection required check for the deletion-approval gate.
      # A Product `spec.roles` edit (the approver list itself) is a privileged surface — gate it like a deletion
      # so you can't quietly add yourself as a release-approver then approve a prod promotion (#501 two-step guard).
      # base-vs-head subtree diff so a NEW product or any non-roles edit does NOT trip it (self-service auto-merge
      # is preserved). Teams are gated by the Teams Gate (separate workflow).
      - name: Detect Product roles edits
        id: roles
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.product_files != ''
        env:
          PRODUCT_FILES: ${{ steps.classify.outputs.product_files }}
        run: |
          set -euo pipefail
          changed=false
          for f in $PRODUCT_FILES; do
            b="$(yq -o=json -I=0 '.spec.roles // {}' "base/$f" 2>/dev/null || echo '{}')"
            h="$(yq -o=json -I=0 '.spec.roles // {}' "head/$f" 2>/dev/null || echo '{}')"
            [ "$b" != "$h" ] && { changed=true; break; }
          done
          echo "product_roles_changes=${changed}" >> "$GITHUB_OUTPUT"

      # The single approval verdict (shared with the Teams Gate) → the `gitops Approval` required check. Gates
      # registry deletions (#283), prod promotions (#377, via the per-(team,product) release-approver set #501),
      # prod-ENV teardown (a Deprovision Product purge deleting a prod env → the same release-approver set), and
      # Product approver-list edits (#501). Reads approver sets ONLY from the trusted base/ checkout.
      - name: Publish approval verdict (commit status)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_DIR: ${{ github.workspace }}/base
          STATUS_CONTEXT: gitops Approval
          SOLO_MAINTAINER: ${{ vars.SOLO_MAINTAINER }} # single-admin project: admin author self-attests (publish-verdict.sh)
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DELETIONS: ${{ steps.classify.outputs.deletions }}
          DELETED_FILES: ${{ steps.classify.outputs.deleted_files }}
          PROD_RELEASES: ${{ steps.classify.outputs.prod_release_files }}
          PRODUCT_ROLES_CHANGES: ${{ steps.roles.outputs.product_roles_changes }}
          LIFECYCLE_DECOMMISSION: ${{ steps.lifecycle.outputs.decommission }}
        run: bash base/.github/scripts/gitops-gate/publish-verdict.sh
