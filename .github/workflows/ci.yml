name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tofu-fmt:
    name: OpenTofu Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - name: Check formatting
        run: tofu fmt -check -recursive infra/modules/

  tofu-validate:
    name: OpenTofu Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - name: Validate all modules
        run: |
          read -r -d '' AWS_VERSIONS << 'TFEOF' || true
          terraform {
            required_version = ">= 1.6.0"
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 6.0"
              }
            }
          }
          TFEOF

          read -r -d '' HELM_VERSIONS << 'TFEOF' || true
          terraform {
            required_version = ">= 1.6.0"
            required_providers {
              helm = {
                source  = "hashicorp/helm"
                version = "~> 2.0"
              }
              kubernetes = {
                source  = "hashicorp/kubernetes"
                version = "~> 2.0"
              }
            }
          }
          TFEOF

          # Modules with known provider compatibility issues (fix separately)
          SKIP_VALIDATE="infra/modules/argocd infra/modules/vcluster"

          FAILED=0

          for dir in $(find infra/modules -type f -name "*.tf" -not -path "*/.terraform/*" -exec dirname {} \; | sort -u | grep -v /templates); do
            if echo "$SKIP_VALIDATE" | grep -qw "$dir"; then
              echo "::group::Skipping $dir (known issues)"
              echo "::endgroup::"
              continue
            fi

            echo "::group::Validating $dir"

            GENERATED=false
            if [ ! -f "$dir/versions.tf" ]; then
              GENERATED=true
              case "$dir" in
                infra/modules/aws/*)   echo "$AWS_VERSIONS"   > "$dir/versions.tf" ;;
                *)                     echo "$HELM_VERSIONS"   > "$dir/versions.tf" ;;
              esac
            fi

            if tofu -chdir="$dir" init -backend=false -input=false > /dev/null 2>&1; then
              if tofu -chdir="$dir" validate; then
                echo "OK: $dir"
              else
                echo "FAIL: $dir"
                FAILED=1
              fi
            else
              echo "FAIL (init): $dir"
              FAILED=1
            fi

            if [ "$GENERATED" = true ]; then
              rm -f "$dir/versions.tf" "$dir/.terraform.lock.hcl"
              rm -rf "$dir/.terraform"
            fi

            echo "::endgroup::"
          done

          exit $FAILED

  terragrunt-hclfmt:
    name: Terragrunt HCL Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Terragrunt
        run: |
          LATEST=$(curl -s https://api.github.com/repos/gruntwork-io/terragrunt/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/${LATEST}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
      - name: Check HCL formatting
        run: terragrunt hcl fmt --check

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint changed markdown files
        run: |
          npm install -g markdownlint-cli2
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD -- '*.md' | grep -v '.terraform/' | grep -v '.terragrunt-cache/' || true)
          else
            FILES=$(git diff --name-only --diff-filter=ACM HEAD~1 -- '*.md' | grep -v '.terraform/' | grep -v '.terragrunt-cache/' || true)
          fi
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs markdownlint-cli2
          else
            echo "No changed markdown files to lint."
          fi

  kyverno-policy-test:
    name: Kyverno Policy Test
    runs-on: ubuntu-latest
    env:
      # Pin to the chart's appVersion (helm_versions.kyverno = 3.8.1) so test semantics match.
      KYVERNO_VERSION: "1.18.1"
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install Kyverno CLI
        run: |
          curl -fsSL "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz" -o kyverno.tgz
          tar xzf kyverno.tgz kyverno
          sudo install -m 0755 kyverno /usr/local/bin/kyverno
          kyverno version
      - name: Render policies and run tests
        run: infra/modules/policy/.kyverno-tests/run.sh

  # Dogfoods the shift-left composite action (.github/actions/kyverno-validate) against committed
  # sample apps, proving it works without the app repos: the compliant app must pass, the broken app
  # must fail, and the teams.hcl hostname extraction must resolve. This is what app-repo PR CI runs.
  kyverno-shift-left:
    name: Kyverno Shift-Left (dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compliant sample (must pass)
        id: compliant
        uses: ./.github/actions/kyverno-validate
        with:
          team: alpha
          manifests-path: infra/modules/policy/.kyverno-tests/sample-app/compliant
          env: preprod
      - name: Assert hostname extraction (hcl2json → teams.hcl) resolved
        shell: bash
        run: |
          echo "extracted hostnames: ${{ steps.compliant.outputs.hostnames }}"
          echo '${{ steps.compliant.outputs.hostnames }}' | grep -q 'demo.preprod.aws.refplat.org' \
            || { echo "::error::hostname extraction from teams.hcl failed (got '${{ steps.compliant.outputs.hostnames }}')"; exit 1; }
      - name: Validate broken sample (must fail)
        id: broken
        continue-on-error: true
        uses: ./.github/actions/kyverno-validate
        with:
          team: alpha
          manifests-path: infra/modules/policy/.kyverno-tests/sample-app/broken
          env: preprod
      - name: Assert broken sample was rejected
        shell: bash
        run: |
          if [ "${{ steps.broken.outcome }}" != "failure" ]; then
            echo "::error::Broken sample app should have FAILED policy validation but did not."; exit 1
          fi
          echo "✅ Broken sample correctly rejected by the shift-left gate."

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - name: Lint all modules
        run: |
          FAILED=0
          for dir in $(find infra/modules -type f -name "*.tf" -not -path "*/.terraform/*" -exec dirname {} \; | sort -u | grep -v /templates); do
            echo "::group::Linting $dir"
            if tflint --chdir="$dir" --minimum-failure-severity=error 2>&1; then
              echo "OK: $dir"
            else
              echo "FAIL: $dir"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED
