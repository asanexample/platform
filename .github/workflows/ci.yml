name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Single source of truth for CLI tool versions: read /.tool-versions once and expose each pin as a job
  # output, so every job below installs the SAME version operators + the self-hosted runner image use.
  # Bump versions in /.tool-versions, never inline here.
  versions:
    name: Tool Versions
    runs-on: ubuntu-latest
    outputs:
      opentofu: ${{ steps.read.outputs.opentofu }}
      terragrunt: ${{ steps.read.outputs.terragrunt }}
      helm: ${{ steps.read.outputs.helm }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        name: Read /.tool-versions
        run: |
          while read -r tool version _; do
            case "$tool" in '' | \#*) continue ;; esac
            echo "${tool}=${version}" >> "$GITHUB_OUTPUT"
          done < .tool-versions

  tofu-fmt:
    name: OpenTofu Format
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ needs.versions.outputs.opentofu }}
      - name: Check formatting
        run: tofu fmt -check -recursive infra/modules/

  tofu-validate:
    name: OpenTofu Validate
    runs-on: ubuntu-latest
    needs: versions
    env:
      # Provider plugin cache — without it every module's `tofu init` re-downloads aws/helm/kubernetes (~30×).
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ needs.versions.outputs.opentofu }}

      # Scope: a PR that changes no infra/**/*.tf can't change module validation — short-circuit to green (the
      # job still runs + reports, so it stays a valid required check). Push events always run the full validate.
      - name: Scope to infra changes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "non-PR event → full validate"; exit 0
          fi
          if gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" --paginate \
               --jq '.[].filename' | grep -qE '^infra/.*\.tf$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "infra/*.tf changed → validating"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no infra/*.tf changed → skipping module validation"
          fi

      # Persist the provider plugins across runs; restore-keys give a partial hit when versions change.
      - name: Cache provider plugins
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-plugins-${{ runner.os }}-${{ hashFiles('infra/modules/**/versions.tf', '.github/workflows/ci.yml') }}
          restore-keys: |
            tofu-plugins-${{ runner.os }}-

      - name: Validate all modules
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/ci/validate-modules.sh

  terragrunt-hclfmt:
    name: Terragrunt HCL Format
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v6
      - name: Install Terragrunt
        env:
          # Version from /.tool-versions (the `versions` job); the release tag is v-prefixed.
          TG_VERSION: v${{ needs.versions.outputs.terragrunt }}
        run: |
          # Pinned + fail-closed. The old `releases/latest` lookup hit the UNAUTHENTICATED GitHub API (rate-limit
          # prone, non-reproducible), and `curl -sL` without --fail silently saved the 4xx body ("Not Found") AS
          # the binary — so the next step died with "/usr/local/bin/terragrunt: line 1: Not: command not found"
          # (exit 127). -f makes curl fail on HTTP errors; --version verifies a real binary landed.
          curl -fsSL "https://github.com/gruntwork-io/terragrunt/releases/download/${TG_VERSION}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version
      - name: Check HCL formatting
        run: terragrunt hcl fmt --check

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Lint changed markdown files
        # ${{ }} via env, not interpolated into the script (semgrep run-shell-injection / #112).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          npm install -g markdownlint-cli2
          if [ "$EVENT_NAME" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACM "origin/${BASE_REF}...HEAD" -- '*.md' | grep -v '.terraform/' | grep -v '.terragrunt-cache/' || true)
          else
            FILES=$(git diff --name-only --diff-filter=ACM HEAD~1 -- '*.md' | grep -v '.terraform/' | grep -v '.terragrunt-cache/' || true)
          fi
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs markdownlint-cli2
          else
            echo "No changed markdown files to lint."
          fi

  gate-scripts:
    # Run the gitops/teams gate-script unit tests (verdict, validators) — these guard security-critical merge
    # gating (release-approver #501, prod #377, deletions #283). Previously local-only, which let a classify-diff
    # `set -e` regression slip through; now CI-enforced.
    name: Gate Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install yq (mikefarah)
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Run gate unit tests
        run: |
          rc=0
          for t in .github/scripts/gitops-gate/test-*.sh .github/scripts/teams/test-*.sh; do
            [ -f "$t" ] || continue
            echo "::group::$t"
            bash "$t" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  kyverno-policy-test:
    name: Kyverno Policy Test
    runs-on: ubuntu-latest
    needs: versions
    env:
      # Pin to the chart's appVersion (helm_versions.kyverno = 3.8.1) so test semantics match.
      KYVERNO_VERSION: "1.18.1"
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          # Canonical Helm pin from /.tool-versions — keep CLI rendering on the 3.x line (not floating to v4).
          version: v${{ needs.versions.outputs.helm }}
      - name: Install Kyverno CLI
        run: |
          curl -fsSL "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz" -o kyverno.tgz
          tar xzf kyverno.tgz kyverno
          sudo install -m 0755 kyverno /usr/local/bin/kyverno
          kyverno version
      - name: Render policies and run tests
        run: infra/modules/policy/.kyverno-tests/run.sh
      - name: Render & test environment control-plane policies (crossplane)
        # restrict-environment-envelope / restrict-environment-control-plane moved to the crossplane module (they match
        # Crossplane CRDs, so they install after them — see charts/environment-policies/Chart.yaml). Same tooling.
        run: infra/modules/crossplane/.kyverno-tests/run.sh

  # (The v2 "Kyverno Shift-Left (dogfood)" job was removed at the v3 cutover: the kyverno-validate composite
  # action it dogfooded is v2-coupled — it derived the route host from the now-deleted XTenant claim and rendered
  # the per-team restrict-images/route-hostnames policies, both retired (Composition-owned per-Environment now).
  # The app shift-left = the app-repo overlays-build guard + the platform gitops Gate envelope check, #388.)

  # Offline schema validation of the Environment API XRD (ADR-067). Validates the example claims against the
  # v1beta1 OpenAPI schema + CEL rules with `crossplane beta validate` — no cluster. The CLI is installed at a
  # pinned version (download + SHA-256 verify, no `curl | sh`), matching the Trivy job's posture.
  environment-api-schema:
    name: Environment API Schema
    runs-on: ubuntu-latest
    needs: versions
    env:
      CROSSPLANE_VERSION: "v2.2.1" # crank CLI version (built from source — see install step)
    steps:
      - uses: actions/checkout@v6
      # Scope: this validates the crossplane module's OWN example fixtures (.environment-api-tests) against the
      # XRD — a PR that changes no infra/modules/crossplane/** can't affect it. Short-circuit to green (the job
      # still runs + reports, so it stays a valid required check), skipping the ~2-min crank build. Registry PRs
      # (gitops/**, e.g. a decommission) have their actual claims validated by the gitops Gate, not here.
      - name: Scope to crossplane changes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "non-PR event → full validate"; exit 0
          fi
          if gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" --paginate \
               --jq '.[].filename' | grep -qE '^infra/modules/crossplane/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "crossplane module changed → validating"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no crossplane module change → skipping (gitops claims are validated by the gitops Gate)"
          fi
      - uses: azure/setup-helm@v5 # the harness renders the crossplane-teams chart (registry → projection)
        if: steps.scope.outputs.run == 'true'
        with:
          # Canonical Helm pin from /.tool-versions — keep CLI rendering on the 3.x line (not floating to v4).
          version: v${{ needs.versions.outputs.helm }}
      - uses: actions/setup-go@v6
        if: steps.scope.outputs.run == 'true'
        with:
          go-version: stable
      - name: Install Crossplane CLI (build crank from the Go module proxy)
        if: steps.scope.outputs.run == 'true'
        run: |
          # The crank CLI is only published on releases.crossplane.io, which intermittently 403s GitHub runner
          # IPs. Build it from the Go module proxy instead — checksum-verified via go.sum/sum.golang.org and
          # rock-solid from CI. The binary is `crank`; install it as `crossplane` on PATH. -ldflags injects the
          # version (go install leaves it blank), which `beta validate` needs to resolve the base-schema image.
          go install -ldflags "-X github.com/crossplane/crossplane/v2/internal/version.version=${CROSSPLANE_VERSION}" "github.com/crossplane/crossplane/v2/cmd/crank@${CROSSPLANE_VERSION}"
          sudo install -m 0755 "$(go env GOPATH)/bin/crank" /usr/local/bin/crossplane
          crossplane version --client || true
      - name: Validate Environment API example claims against the XRD
        if: steps.scope.outputs.run == 'true'
        run: infra/modules/crossplane/.environment-api-tests/run.sh

  # Offline `crossplane render` of the Environment Composition (delivery-plan A3). Runs the Pipeline functions
  # via Docker (pre-installed on the runner) and asserts the rendered footprint — no cluster. Separate from the
  # fast schema job because it pulls function images (minutes, not seconds).
  environment-composition-render:
    name: Environment Composition Render
    runs-on: ubuntu-latest
    env:
      CROSSPLANE_VERSION: "v2.2.1" # crank CLI version (built from source — see install step)
    steps:
      - uses: actions/checkout@v6
      # Scope: this renders the crossplane module's OWN Composition + example fixtures — a PR that changes no
      # infra/modules/crossplane/** can't affect it. Short-circuit to green (skip the ~2.5-min crank build +
      # function-image pulls), staying a valid required check. Registry PRs (gitops/**, e.g. a decommission) have
      # their actual claims rendered by the gitops Gate's render-environments step, not here.
      - name: Scope to crossplane changes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "non-PR event → full render"; exit 0
          fi
          if gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" --paginate \
               --jq '.[].filename' | grep -qE '^infra/modules/crossplane/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "crossplane module changed → rendering"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no crossplane module change → skipping (gitops claims are rendered by the gitops Gate)"
          fi
      - uses: actions/setup-go@v6
        if: steps.scope.outputs.run == 'true'
        with:
          go-version: stable
      - name: Install Crossplane CLI (build crank from the Go module proxy)
        if: steps.scope.outputs.run == 'true'
        run: |
          # The crank CLI is only published on releases.crossplane.io, which intermittently 403s GitHub runner
          # IPs. Build it from the Go module proxy instead — checksum-verified via go.sum/sum.golang.org and
          # rock-solid from CI. The binary is `crank`; install it as `crossplane` on PATH. -ldflags injects the
          # version (go install leaves it blank), which `beta validate` needs to resolve the base-schema image.
          go install -ldflags "-X github.com/crossplane/crossplane/v2/internal/version.version=${CROSSPLANE_VERSION}" "github.com/crossplane/crossplane/v2/cmd/crank@${CROSSPLANE_VERSION}"
          sudo install -m 0755 "$(go env GOPATH)/bin/crank" /usr/local/bin/crossplane
          crossplane version --client || true
      - name: Render the Composition and assert the environment footprint
        if: steps.scope.outputs.run == 'true'
        run: infra/modules/crossplane/.environment-api-tests/render.sh

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: terraform-linters/setup-tflint@v6
      - name: Lint all modules
        run: |
          FAILED=0
          for dir in $(find infra/modules -type f -name "*.tf" -not -path "*/.terraform/*" -exec dirname {} \; | sort -u | grep -v /templates); do
            echo "::group::Linting $dir"
            if tflint --chdir="$dir" --minimum-failure-severity=error 2>&1; then
              echo "OK: $dir"
            else
              echo "FAIL: $dir"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED

  # ---------------------------------------------------------------------------
  # Security scanning (#112 / 108a) — OSS scanners. These repos are private
  # without GitHub Advanced Security, so Code Scanning / the Security-tab SARIF
  # integration is unavailable; findings surface in job logs + SARIF artifacts.
  # Scanner CLIs are installed at PINNED versions (downloaded + SHA-256 verified)
  # rather than via their GitHub Actions: aquasecurity/trivy-action + setup-trivy
  # were compromised in 03/2026 (tags force-pushed to malware; a malicious Trivy
  # v0.69.4 was published). We avoid those Actions, pin the clean post-incident
  # v0.70.0, and verify the binary's checksum — minimal third-party trust on the
  # very job meant to harden the supply chain. (We do not `curl | sh` either.)
  # ENFORCING: blocks on HIGH/CRITICAL (the baseline was triaged clean first —
  # Audit->Enforce, per ADR-014). Accepted findings live in `.trivyignore.yaml`
  # (path-scoped + justified); Go-dep CVEs are fixed by bumping (Dependabot keeps
  # them current). New HIGH/CRITICAL findings fail the PR.
  # ---------------------------------------------------------------------------

  trivy:
    name: Trivy (IaC + deps)
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: "0.70.0" # pinned clean release; v0.69.4 was the malicious one
    steps:
      - uses: actions/checkout@v6
      - name: Install Trivy CLI (download release binary + verify SHA-256)
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          # keep the original asset name so `sha256sum -c` (which reads the name
          # from the checksums line) can find the downloaded file.
          curl -sfL "${base}/${asset}" -o "${asset}"
          curl -sfL "${base}/trivy_${TRIVY_VERSION}_checksums.txt" -o trivy_checksums.txt
          grep " ${asset}\$" trivy_checksums.txt | sha256sum -c -
          tar xzf "${asset}" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm -f trivy "${asset}" trivy_checksums.txt
          trivy --version
      - name: IaC misconfig (infra/modules) + Go dependency SCA (infra/tests)
        run: |
          # IaC — skip provider caches + the Kyverno test fixtures (deliberately
          # non-compliant sample manifests, not deployed infra). Accepted findings
          # are in .trivyignore.yaml (path-scoped). For each scan: SARIF artifact
          # (exit 0, always written) then the BLOCKING table gate (exit 1) so the
          # findings are visible in the log when the gate fails.
          iac() { trivy config infra/modules --severity HIGH,CRITICAL \
            --skip-dirs '**/.terraform' --skip-dirs '**/.kyverno-tests' --skip-dirs '**/.environment-api-tests' \
            --ignorefile "$PWD/.trivyignore.yaml" "$@"; }
          iac --format sarif --output trivy-iac.sarif --exit-code 0
          echo "::group::Trivy IaC findings"; iac --format table --exit-code 1; echo "::endgroup::"

          # Go dependency vulnerabilities (Terratest suite).
          dep() { trivy fs infra/tests/aws --scanners vuln --severity HIGH,CRITICAL "$@"; }
          dep --format sarif --output trivy-deps.sarif --exit-code 0
          echo "::group::Trivy dependency findings"; dep --format table --exit-code 1; echo "::endgroup::"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-sarif
          path: trivy-*.sarif

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Semgrep (pinned)
        run: pip install --quiet semgrep==1.164.0 # latest stable; verify before bumping
      - name: Static analysis (terraform / actions / secrets / go / dockerfile)
        run: |
          # SARIF artifact (exit 0, always written) then the BLOCKING text gate
          # (--error exits non-zero on any finding OR invalid config). Registry
          # packs only (no p/bash — it 404s; shell rules aren't a registry pack).
          # --exclude '*.sarif' so the gate run doesn't scan the artifact the first
          # run just wrote (semgrep would otherwise flag token-like strings in it).
          rulesets="--config p/terraform --config p/github-actions --config p/secrets --config p/golang --config p/dockerfile"
          semgrep scan $rulesets --exclude '*.sarif' --metrics off --sarif --output semgrep.sarif || true
          echo "::group::Semgrep findings"
          semgrep scan $rulesets --exclude '*.sarif' --metrics off --error
          echo "::endgroup::"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
