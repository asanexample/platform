name: AWS Infrastructure Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am UTC

permissions:
  id-token: write
  contents: read

env:
  TEST_AWS_REGION: us-west-2
  # Canonical pin — keep in sync with /.tool-versions (the single source of truth). This weekly Terratest
  # workflow uses a workflow-level env (one place to change) rather than the `versions` job in ci.yml.
  TOFU_VERSION: "1.12.1"
  GO_VERSION: "1.22"

jobs:
  test-networking:
    name: Networking Module
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TEST_ROLE_ARN }}
          aws-region: ${{ env.TEST_AWS_REGION }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: infra/tests/aws/go.sum

      - name: Run networking tests
        working-directory: infra/tests/aws
        run: go test -v -timeout 25m ./networking/...
        env:
          TEST_ROLE_ARN: ""

  test-eks:
    name: EKS Module
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TEST_ROLE_ARN }}
          aws-region: ${{ env.TEST_AWS_REGION }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: infra/tests/aws/go.sum

      - name: Run EKS tests
        working-directory: infra/tests/aws
        run: go test -v -timeout 40m ./eks/...
        env:
          TEST_ROLE_ARN: ""
