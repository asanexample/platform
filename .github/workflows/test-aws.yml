name: AWS Infrastructure Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am UTC

permissions:
  id-token: write
  contents: read

env:
  TEST_AWS_REGION: us-west-2

jobs:
  # Single source of truth for CLI tool versions: read /.tool-versions once and expose each pin as a job
  # output (mirrors the `versions` job in ci.yml). Bump versions in /.tool-versions, never inline here.
  # (Go is pinned by the test module's go.mod via setup-go's go-version-file, kept current by Dependabot.)
  versions:
    name: Tool Versions
    runs-on: ubuntu-latest
    outputs:
      opentofu: ${{ steps.read.outputs.opentofu }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: read
        name: Read /.tool-versions
        run: |
          while read -r tool version _; do
            case "$tool" in '' | \#*) continue ;; esac
            echo "${tool}=${version}" >> "$GITHUB_OUTPUT"
          done < .tool-versions

  test-networking:
    name: Networking Module
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.TEST_ROLE_ARN }}
          aws-region: ${{ env.TEST_AWS_REGION }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ needs.versions.outputs.opentofu }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: infra/tests/aws/go.mod
          cache-dependency-path: infra/tests/aws/go.sum

      - name: Run networking tests
        working-directory: infra/tests/aws
        run: go test -v -timeout 25m ./networking/...
        env:
          TEST_ROLE_ARN: ""

  test-eks:
    name: EKS Module
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.TEST_ROLE_ARN }}
          aws-region: ${{ env.TEST_AWS_REGION }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ needs.versions.outputs.opentofu }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: infra/tests/aws/go.mod
          cache-dependency-path: infra/tests/aws/go.sum

      - name: Run EKS tests
        working-directory: infra/tests/aws
        run: go test -v -timeout 40m ./eks/...
        env:
          TEST_ROLE_ARN: ""

  test-ssm-bastion:
    name: SSM Bastion Module
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.TEST_ROLE_ARN }}
          aws-region: ${{ env.TEST_AWS_REGION }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ needs.versions.outputs.opentofu }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: infra/tests/aws/go.mod
          cache-dependency-path: infra/tests/aws/go.sum

      - name: Run SSM bastion tests
        working-directory: infra/tests/aws
        run: go test -v -timeout 25m ./ssm-bastion/...
        env:
          TEST_ROLE_ARN: ""
