name: Dispatch registry-reconcile on Product merge

# A new Product's per-Product Terragrunt-derived units (github-oidc / preprod-policy / argocd-apps) are
# fileset-derived from gitops/products and don't exist until a privileged apply (registry-reconcile). The gitops
# Gate auto-merges scaffolder Product PRs with GITHUB_TOKEN — which deliberately does NOT fire registry-reconcile's
# `push` trigger (GitHub's recursion prevention), and the `schedule` is unreliable to start. So a brand-new Product
# would otherwise never reconcile hands-off (its first app build times out waiting for the OIDC role + ECR).
#
# This watches scaffolder Product PRs and, once one auto-merges, dispatches registry-reconcile. workflow_dispatch
# is the ONE event GITHUB_TOKEN is allowed to trigger (the documented exception to recursion prevention), so this
# fires reliably where `push` can't. It runs in PARALLEL with the Gate and is NOT a required check, so it can wait
# for the merge without deadlocking auto-merge (which can't complete until the Gate — a required check — finishes).
# The registry-reconcile cron remains the backstop if this lapses.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - gitops/products/**

permissions:
  contents: read
  actions: write # workflow_dispatch registry-reconcile
  pull-requests: read

concurrency:
  group: reconcile-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Reconcile on merge
    runs-on: ubuntu-latest
    # Only the scaffolder's own Product PRs (the New Product ADD path). Same-repo head — a fork can't impersonate
    # the login anyway, but belt-and-braces (mirrors the Gate's author check). This dispatcher exists ONLY because
    # GITHUB_TOKEN auto-merges (New Product) don't fire registry-reconcile's `push` trigger. A DEPROVISION purge
    # (branch product/purge-*) is a deletion → never auto-merged → a HUMAN merges it → that push DOES fire
    # registry-reconcile directly, so the dispatcher is redundant. Skip purges so the job doesn't sit in_progress
    # for ~15 min on every teardown looking stuck. (Decommission PRs touch gitops/environments, not the
    # gitops/products path filter above, so they never reach here.)
    if: >
      github.event.pull_request.user.login == 'asanexample-backstage-scaffolder[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'product/purge-')
    steps:
      # Need the script on disk. pull_request_target → checkout defaults to the trusted BASE (main), and the
      # script only calls `gh` (no PR input is read/executed), so this is safe. (#506 extracted this from an
      # inline run: block but didn't add the checkout — the script then 127'd; this restores it.)
      - uses: actions/checkout@v7
      - name: Wait for the Product PR to merge, then dispatch reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/registry/wait-and-dispatch-reconcile.sh
