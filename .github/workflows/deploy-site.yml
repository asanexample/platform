name: Deploy Site

# Publish the refplat.org docs site to Railway. Content is single-sourced from docs/learn + docs/adrs
# (copied in by site/sync.mjs at build time), so this fires on any change to the docs or the site itself.
on:
  push:
    branches: [main]
    paths:
      - 'docs/learn/**'
      - 'docs/adrs/**'
      - 'site/**'
      - '.github/workflows/deploy-site.yml'

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Regenerate the site content from the canonical docs. sync.mjs derives the repo root from its own
      # location and uses only Node built-ins, so no install is needed for this step.
      - name: Sync canonical docs -> site content
        working-directory: site
        run: node sync.mjs

      # railway up uploads site/ and Railway rebuilds via Nixpacks (npm ci -> astro build -> serve dist).
      # --no-gitignore so the freshly-synced (git-ignored) content is uploaded; .railwayignore still
      # excludes node_modules/dist/.astro. RAILWAY_TOKEN is a project token scoped to refplat-site.
      - name: Deploy to Railway
        working-directory: site
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway up --ci --no-gitignore --service refplat-site
