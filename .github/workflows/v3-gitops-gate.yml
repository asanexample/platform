name: v3 gitops — gate on PR

# Validate the ADR-067 v3 registry surfaces on a PR: the Product registry (gitops/products/**) and the
# Environment claims (gitops/environments/**). Shift-left for the admission controls a v3 PR will hit:
#   - Product: schema shape + enums + ownership (the owning Team exists) — see validate-products.sh
#   - Environment: schema + enums + the ENVELOPE (stage/tier ∈ Team envelope, team == Product.team,
#     customer-iff-per-customer-prod, the policyStatements IAM deny-set) — the same checks
#     restrict-environment-envelope (#387) makes at admission, run pre-merge — see validate-environments.sh
#
# Sibling of the Teams Gate / Tenant Claims Gate. Validation-only and meant to be a REQUIRED status check on
# main (the classify step short-circuits to trivially-green on non-v3 PRs, so a path filter — which would never
# report on unrelated PRs and block them forever — is deliberately NOT used). The v3 surfaces are empty until
# the cutover (docs/runbooks/v3-cutover.md), so today this is inert; it activates the moment the first
# gitops/products or gitops/environments file lands.
#
# NB (deferred): automerge arming + the deletion / decommission-first lifecycle (cf. the Tenant Claims Gate)
# belong to v3 self-service (L3a) once the Environment deprovisioning semantics are defined — not here. This
# gate is the schema+envelope backstop a reviewer can't eyeball.
#
# CI-GATE INTEGRITY: `pull_request_target` means THIS definition and every script it calls run from the
# PROTECTED BASE BRANCH — a PR cannot edit the gate that judges it. The PR's registry files are checked out
# separately, sparse, credential-free, and read strictly as YAML DATA (yq only); nothing from the head
# checkout is ever executed, templated, or interpolated.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: v3-gitops-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: v3 gitops Gate
    runs-on: ubuntu-latest # pure YAML validation — no cluster/private-API access needed
    env:
      # IAM deny-set for Service policyStatements (mirrors the policy's iamSensitiveServices / #387).
      IAM_SENSITIVE: "iam sts organizations account"
      CROSSPLANE_VERSION: "v2.2.1" # crank CLI (built from the Go module proxy — see install step)
    steps:
      # Trusted: the gate scripts + the Team/Product registries (envelope + ownership authority) all come from
      # BASE. Always runs (classify needs the script).
      # (nosemgrep — the rule flags any checkout under pull_request_target; this is the protected base, and the
      # PR head below is sparse, data-only.)
      # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
      - name: Checkout base (trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      # Classify FIRST (cheap, gh-api only) so the rest short-circuits on non-v3 PRs → the job still reports
      # the "v3 gitops Gate" check (required-check compatible) without doing any validation work.
      - name: Classify diff
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash base/.github/scripts/v3-gate/classify-diff.sh

      # Untrusted: ONLY the v3 registry trees, sparse, no credentials, data-only. Nothing here runs; the
      # validators (from base) read these files with yq as data. A new Product added by the same PR is read
      # from head (the environment validator resolves the Product from head, falling back to base).
      # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
      - name: Checkout PR v3 registry (untrusted, data-only)
        if: steps.classify.outputs.any == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          sparse-checkout: |
            gitops/products
            gitops/environments
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Install yq
        if: steps.classify.outputs.any == 'true'
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Validate Products
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.product_files != ''
        env:
          BASE_DIR: ${{ github.workspace }}/base
          HEAD_DIR: ${{ github.workspace }}/head
          PRODUCT_FILES: ${{ steps.classify.outputs.product_files }}
        run: bash base/.github/scripts/v3-gate/validate-products.sh

      - name: Validate Environments (schema + envelope shift-left)
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.environment_files != ''
        env:
          BASE_DIR: ${{ github.workspace }}/base
          HEAD_DIR: ${{ github.workspace }}/head
          ENVIRONMENT_FILES: ${{ steps.classify.outputs.environment_files }}
        run: bash base/.github/scripts/v3-gate/validate-environments.sh

      # --- composition render: prove each Environment claim BUILDS against the v3 Composition (the
      # Environment+Product join), catching schema/envelope-valid-but-render-breaking claims. Only when there
      # are Environment files. Docker is preinstalled on ubuntu-latest; crank is built from the Go module proxy
      # (releases.crossplane.io intermittently 403s runner IPs — same install as the Tenant Claims Gate).
      - uses: actions/setup-go@v5
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.environment_files != ''
        with:
          go-version: stable
      - name: Install Crossplane CLI (build crank from the Go module proxy)
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.environment_files != ''
        run: |
          go install -ldflags "-X github.com/crossplane/crossplane/v2/internal/version.version=${CROSSPLANE_VERSION}" "github.com/crossplane/crossplane/v2/cmd/crank@${CROSSPLANE_VERSION}"
          sudo install -m 0755 "$(go env GOPATH)/bin/crank" /usr/local/bin/crossplane

      - name: Render Environments (composition build proof)
        if: steps.classify.outputs.any == 'true' && steps.classify.outputs.environment_files != ''
        env:
          BASE_DIR: ${{ github.workspace }}/base
          HEAD_DIR: ${{ github.workspace }}/head
          ENVIRONMENT_FILES: ${{ steps.classify.outputs.environment_files }}
        run: bash base/.github/scripts/v3-gate/render-environments.sh
