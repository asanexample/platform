name: Runner smoke test

# Proves the self-hosted ARC pool end to end (ADR-065 / #323): a job lands on an in-VPC runner, gets AWS
# creds from its Pod Identity, assumes PlatformDeployer (the PR-D trust), reaches the PRIVATE EKS API that
# hosted runners can't, and has the baked-in toolchain. Manual-only — this is a proof, not a gate. The real
# apply-on-merge workflows are #305.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLUSTER_NAME: platform-use1-eks
  AWS_REGION: us-east-1
  DEPLOYER_ARN: arn:aws:iam::829808296602:role/PlatformDeployer

jobs:
  smoke:
    # The ARC runner scale set (gha-runner-scale-set, runnerScaleSetName=platform-infra).
    runs-on: platform-infra
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain is baked in
        run: |
          tofu version
          terragrunt --version
          kubectl version --client
          aws --version

      - name: Runner identity (EKS Pod Identity)
        run: |
          echo "Runner's AWS identity (should be the platform-use1-eks-arc-runner role):"
          aws sts get-caller-identity

      - name: Assume PlatformDeployer + reach the PRIVATE EKS API
        run: |
          # Explicitly assume PlatformDeployer (proves the PR-D trust admits the runner role), then talk to the
          # cluster AS PlatformDeployer — which holds the perms (eks:DescribeCluster) + the EKS access entry.
          # NB: `aws eks update-kubeconfig --role-arn` does NOT assume the role for its own DescribeCluster call
          # (that runs as the runner role, which has no cluster perms by design), so we assume up-front here —
          # the same shape a CI apply would use before invoking terragrunt.
          creds=$(aws sts assume-role --role-arn "$DEPLOYER_ARN" --role-session-name runner-smoke --query Credentials --output json)
          export AWS_ACCESS_KEY_ID="$(echo "$creds" | jq -r .AccessKeyId)"
          export AWS_SECRET_ACCESS_KEY="$(echo "$creds" | jq -r .SecretAccessKey)"
          export AWS_SESSION_TOKEN="$(echo "$creds" | jq -r .SessionToken)"
          echo "Now acting as (should be PlatformDeployer):"; aws sts get-caller-identity
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl get namespaces
          echo "✅ in-VPC runner assumed PlatformDeployer and reached the private EKS API"
