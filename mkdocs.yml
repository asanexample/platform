# TechDocs config for the platform Learning Portal (#938).
# The canonical markdown lives in docs/learn/**; this file is rendered by the
# techdocs-cli in CI (builder: external) and published to S3, then served by
# Backstage on the `platform-learning-portal` catalog entity (see catalog-info.yaml).
# Cross-tree links (../../adrs, ../../architecture, ...) are rewritten to absolute
# GitHub URLs by .github/scripts/docs/techdocs-linkfix.sh before generation, so the
# canonical docs keep their repo-relative links. Mermaid renders via the Backstage
# frontend techdocs mermaid addon (no mkdocs mermaid plugin needed).
site_name: Platform Learning Portal
site_description: Teaching docs for the reference platform — spine + 17 subsystem modules.

docs_dir: docs/learn

plugins:
  - techdocs-core

nav:
  - Home: README.md
  - The Spine:
      - spine/why-the-platform-exists.md
      - spine/how-the-platform-fits.md
      - spine/life-of-a-deployment.md
