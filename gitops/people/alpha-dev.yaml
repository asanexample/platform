# Sample developer for team alpha (ADR-039 per-team isolation). Unifies the Identity Center `alpha-dev` user
# (Developers-alpha → Dev-alpha permission set) and the keycloak-config `dev-alpha` seed user (group alpha).
apiVersion: platform.refplat.org/v1beta1
kind: Person
metadata:
  name: alpha-dev
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: identity-access
spec:
  person: dev-alpha # the Keycloak anchor (the `dev-alpha` seed user / group alpha).
  grants:
    - { role: developer, team: alpha } # standing — everyday access to team alpha
