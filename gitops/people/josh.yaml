# Josh Deeden — the platform owner / sole admin + platform Team lead. His Keycloak identity is now his OWN
# `josh` user (decoupled from the generic `admin` seed, ADR-088): one named identity across Identity Center,
# Keycloak, the Person record, Backstage login, and every borrow's audit trail. Access facts only — no PII
# (the email/identity live in Keycloak + the ADR-084 directory).
apiVersion: platform.refplat.org/v1beta1
kind: Person
metadata:
  name: josh
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: identity-access
spec:
  person: josh # the Keycloak anchor — his own named user (email josh@<org>; groups platform-admins + platform).
  handles:
    github: gangster # bootstrap (ADR-084 `declared`) — the release-approver login across the registries.
  grants:
    - { role: access-admin, scope: platform }                       # standing — runs the access system (the gate's access-admin)
    - { role: team-admin, team: platform }                          # standing — platform Team lead/member (group platform; deploys its products)
    - { role: release-approver, team: platform }                    # standing — gated-prod approver for platform (ADR-090; replaces Team.roles.releaseApprover)
    - { role: release-approver, team: alpha }                       # standing — gated-prod approver for the alpha demo team (was the team's hand-authored field)
    - { role: release-approver, team: bravo }                       # standing — gated-prod approver for the bravo demo team (was the team's hand-authored field)
    - { role: break-glass, scope: platform, activation: on-demand } # eligible (not standing) — the time-boxed emergency door (ADR-088)
