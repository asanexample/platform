# prod-stage twin of allow-alpha-shop-orders-to-dispatch-intake.yaml (ADR-101) — same grant, same SPIRE
# mutual-auth requirement (ADR-057 Phase 2), scoped to the prod stage so orders/intake stay in lockstep as
# both products promote through test/uat/staging/prod together. See the dev grant for the full rationale.
apiVersion: platform.refplat.org/v1beta1
kind: ServiceGrant
metadata:
  name: allow-alpha-shop-orders-to-dispatch-intake-prod
spec:
  target: { team: bravo, product: dispatch, stage: prod, service: intake }
  subject: { team: alpha, product: shop, stage: prod, service: orders }
  capability:
    network:
      ports: [8080]
      protocol: TCP
      http:
        - method: POST
          path: /shipments
      authentication:
        mode: required
