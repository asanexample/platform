# Environment (alpha × demo × dev) — the developer-authored claim (ADR-067). Namespace alpha-demo-dev.
# Synced by ArgoCD, reconciled by the Crossplane Environment Composition (v3). One claim per (product, stage[,
# customer]); the image digest is promoted in by PR (promote-by-PR). See docs/architecture/platform-domain-api.md.
apiVersion: platform.refplat.org/v1alpha3
kind: XEnvironment
metadata:
  name: demo-dev
spec:
  team: alpha
  product: demo
  stage: dev
  tier: standard
  services:
    web:
      repoPath: services/web
      serviceAccount: demo-web
      # image omitted until the first CI build's digest-bump (the New-Product first-deploy state)
