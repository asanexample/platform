# Environment (alpha × checkout × prod) — provisioned to verify #377 Phase 3 (GATED prod). Namespace
# alpha-checkout-prod. Synced by ArgoCD + reconciled by the Crossplane Environment Composition (v3). The prod
# digest is promoted in ONLY via a gated Release PR (release-approver review, author ≠ approver); the auto-promoter
# never touches prod.
apiVersion: platform.refplat.org/v1beta1
kind: XEnvironment
metadata:
  name: alpha-checkout-prod
  annotations:
    platform.refplat.org/requested-by: user:default/dev-alpha
spec:
  team: alpha
  product: checkout
  stage: prod # in alpha's allowedStages
  tier: standard
  services:
    web:
      serviceAccount: app-alpha
      preview: false
