# Environment (alpha × shop × dev) — the first stage, authored by the Backstage
# New Product template (ADR-067 v1beta1). Namespace alpha-shop-dev. Synced by
# ArgoCD (the `environments` registry-sync app) and reconciled by the Crossplane Environment Composition (v3).
# The image is omitted until the new repo's first CI build pins a signed digest into k8s/overlays/dev.
apiVersion: platform.refplat.org/v1beta1
kind: XEnvironment
metadata:
  # CLUSTER-scoped XR → team-prefixed, globally unique (ADR-067).
  name: alpha-shop-dev
  annotations:
    platform.refplat.org/requested-by: user:default/dev-alpha
spec:
  team: alpha # validated == Product.team at the gate + admission
  product: shop
  stage: dev
  tier: standard
  services:
    web:
      serviceAccount: app-alpha # Pod Identity binds this named SA; the app repo's serviceaccount.yaml creates it
      # image omitted — declared but NOT yet deployed (the first-deploy state). The per-Product ApplicationSet
      # skips this (Environment × Service) pair until the first CI build promotes a digest into k8s/overlays/dev.
      # Self-service SQS queue (ADR-073 A.1, #552 e2e): the Composition provisions an SSE+TLS-only queue and
      # derives queue-scoped send/receive IAM onto this service's Pod-Identity role; the URL lands in web-resources.
      resources:
        jobs: { kind: stream, engine: sqs, access: readwrite }
