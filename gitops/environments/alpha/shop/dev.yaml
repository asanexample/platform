# Environment (alpha × shop × dev) — the first stage, authored by the Backstage
# New Product template (ADR-067 v1beta1). Namespace alpha-shop-dev. Synced by
# ArgoCD (the `environments` registry-sync app) and reconciled by the Crossplane Environment Composition (v3).
apiVersion: platform.refplat.org/v1beta1
kind: XEnvironment
metadata:
  # CLUSTER-scoped XR → team-prefixed, globally unique (ADR-067).
  name: alpha-shop-dev
  annotations:
    platform.refplat.org/requested-by: user:default/dev-alpha
spec:
  team: alpha # validated == Product.team at the gate + admission
  product: shop
  stage: dev
  tier: standard
  preview: true # ADR-032: opt into PR-preview delivery (pr-preview.tf) — alpha-shop is the reference product for its first live verification
  # One Product, many services (ADR-067). Browse: storefront (edge — SPA + BFF, the only HTTPRoute) + catalog
  # (internal). Buy path (P2): cart + orders + payment (internal, east-west). cart/orders own self-service AWS
  # data (ADR-073) so each needs its OWN SA (Pod Identity binds one role per SA); the Composition mints their
  # least-privilege DynamoDB/SQS IAM and publishes the connection info into the <svc>-resources ConfigMap
  # (ITEMS_TABLE / ORDERS_TABLE + EVENTS_QUEUE_URL). storefront/catalog/payment are stateless → share app-alpha.
  # 3 resources total, within the alpha envelope (allowedEngines s3/sqs/sns/dynamodb, maxPerEnvironment 10).
  services:
    storefront:
      serviceAccount: app-alpha
    catalog:
      serviceAccount: app-alpha
    payment:
      serviceAccount: app-alpha
    cart:
      serviceAccount: app-alpha-cart
      resources:
        items: { kind: keyvalue, engine: dynamodb, access: readwrite }
    orders:
      serviceAccount: app-alpha-orders
      resources:
        orders: { kind: keyvalue, engine: dynamodb, access: readwrite }
        events: { kind: stream, engine: sqs, access: readwrite }
