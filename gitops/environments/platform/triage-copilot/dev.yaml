# Environment (platform × triage-copilot × dev) — the reference platform-owned Environment (ADR-081). Namespace
# platform-triage-copilot-dev. Synced by the `environments` registry-sync app and reconciled by the SAME Crossplane
# Environment Composition as tenants. Placement is deferred (ADR-081): with no spec.cluster routing yet it is
# reconciled by the existing (preprod) control plane and runs there — which is also what it triages.
#
# Two platform-trust things tenants can't do (both gated by Team platform's envelope at admission):
#   - platformTrust.clusterRoles: bind the read-only cluster role so the agent reads pods/Applications cluster-wide.
#   - services.copilot bedrock:InvokeModel: the agent's only AWS permission (bedrock is outside the deny-set).
# The image is omitted until the first signed CI build promotes a digest into k8s/overlays/dev.
apiVersion: platform.refplat.org/v1beta1
kind: XEnvironment
metadata:
  name: platform-triage-copilot-dev
  annotations:
    platform.refplat.org/requested-by: user:default/platform
spec:
  team: platform # validated == Product.team at the gate + admission
  product: triage-copilot
  stage: dev
  tier: standard
  platformTrust:
    clusterRoles: ["platform-trust-observability-reader"]
  services:
    copilot:
      serviceAccount: triage-copilot # Pod Identity binds this named SA; the app repo's k8s/ creates it
      permissions:
        aws:
          policyStatements:
            - actions: ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"]
              # the Claude inference profile + the foundation models it routes to (cross-region invoke); the
              # Composition boundary-caps the minted role. Account/region wildcarded so it works on any placement.
              resources:
                - "arn:aws:bedrock:*:*:inference-profile/us.anthropic.claude-sonnet-4-6"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6*"
