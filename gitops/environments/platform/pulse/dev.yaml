# Environment (platform × pulse × dev) — the synthetic-traffic generator that keeps alpha-shop-dev and
# bravo-dispatch-dev demo-ready: continuous organic browse/checkout/tracking traffic, an env-gated chaos
# hook for real 5xx, and an on-demand admin trigger to reliably trip an SLO burn-rate alert on cue.
# Namespace platform-pulse-dev. Synced by ArgoCD (the `environments` registry-sync app) and reconciled by
# the Crossplane Environment Composition (v3).
#
# spec.dependencies + the ServiceGrants authored in gitops/grants/{alpha,bravo}/ are what actually wire the
# cross-team network access (ADR-101) — this claim alone is not sufficient; see those grant files for the
# other half. Deliberately dev-only for now (ADR-101 is only proven at dev stage); the shape here doesn't
# block adding other stages later.
apiVersion: platform.refplat.org/v1beta1
kind: XEnvironment
metadata:
  # CLUSTER-scoped XR → team-prefixed, globally unique (ADR-067).
  name: platform-pulse-dev
  annotations:
    platform.refplat.org/requested-by: josh
spec:
  team: platform # validated == Product.team at the gate + admission (ADR-081 D1: platform is a first-class Team)
  product: pulse
  stage: dev
  tier: standard
  services:
    generator:
      serviceAccount: app-platform # Pod Identity binds this named SA; the repo's serviceaccount.yaml creates it
      # image omitted — declared but NOT yet deployed (first-deploy state). The per-Product ApplicationSet skips
      # this (Environment × Service) pair until the first CI build promotes a signed digest.
  dependencies:
    - { team: alpha, product: shop, stage: dev, service: storefront }
    - { team: bravo, product: dispatch, stage: dev, service: intake }
    - { team: bravo, product: dispatch, stage: dev, service: tracker }
