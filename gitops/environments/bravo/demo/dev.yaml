# Environment (bravo × demo × dev) — the developer-authored claim (ADR-067). Namespace bravo-demo-dev.
# Synced by ArgoCD, reconciled by the Crossplane Environment Composition (v3). One claim per (product, stage[,
# customer]); the image digest is promoted in by PR (promote-by-PR). See docs/architecture/platform-domain-api.md.
apiVersion: platform.refplat.org/v1beta1
kind: XEnvironment
metadata:
  # XEnvironment is CLUSTER-scoped, so the name must be globally unique — team-prefixed (matches the namespace
  # <team>-<product>-<stage> + the v2 XTenant naming). Bare <product>-<stage> collides across teams (same product).
  name: bravo-demo-dev
  annotations:
    platform.refplat.org/decommissioned-at: "2026-06-16T16:40:00Z"
    platform.refplat.org/requested-by: user:default/josh
spec:
  team: bravo
  product: demo
  stage: dev
  tier: standard
  lifecycle:
    phase: decommissioning
  services:
    web:
      serviceAccount: app-bravo # matches app-bravo's k8s/base/serviceaccount.yaml (Pod Identity binds it)
      # preview omitted (false) — app-bravo does not publish PR previews (carried over from the v2 claim)
      # image omitted until the first CI build's digest-bump (the first-deploy state); the ApplicationSet
      # skips this (Environment × Service) pair until the digest lands in k8s/overlays/dev.
