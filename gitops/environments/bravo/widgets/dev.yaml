# Environment (bravo × widgets × dev) — the first stage, authored by the Backstage
# New Product template (ADR-067 v1beta1). Namespace bravo-widgets-dev. Synced by
# ArgoCD (the `environments` registry-sync app) and reconciled by the Crossplane Environment Composition (v3).
# The image is omitted until the new repo's first CI build pins a signed digest into k8s/overlays/dev.
#
# DECOMMISSIONING (2026-07-12): superseded by bravo-dispatch (asanexample/bravo-dispatch), a real last-mile
# parcel-tracking demo — this was always a bare scaffolder stub (a second P13 observability-isolation tenant,
# no real logic). Reversible: the Composition zeroes the ResourceQuota only; namespace/IAM/ECR/policies are
# retained. Hard-delete (claim + Product removal) follows in a separate PR after the gitops Gate's
# decommission-first requirement is satisfied (docs/runbooks/environment-deprovisioning.md).
apiVersion: platform.refplat.org/v1beta1
kind: XEnvironment
metadata:
  # CLUSTER-scoped XR → team-prefixed, globally unique (ADR-067).
  name: bravo-widgets-dev
  annotations:
    platform.refplat.org/requested-by: josh
spec:
  team: bravo # validated == Product.team at the gate + admission
  product: widgets
  stage: dev
  tier: standard
  lifecycle:
    phase: decommissioning
  services:
    web:
      serviceAccount: app-bravo # Pod Identity binds this named SA; the app repo's serviceaccount.yaml creates it
      # image omitted — declared but NOT yet deployed (the first-deploy state). The per-Product ApplicationSet
      # skips this (Environment × Service) pair until the first CI build promotes a digest into k8s/overlays/dev.
