# Manual promotion of the dev-proven web image up to the test stage (the same signed digest moves up). Until the
# #377 promotion ladder is built, a non-dev Release is a deliberate, human-merged PR (the gate validates it; only
# the promote bot auto-merges). The ApplicationSet injects this digest into the alpha-checkout-test Environment.
apiVersion: platform.refplat.org/v1beta1
kind: Release
metadata:
  name: alpha-checkout-test
spec:
  environmentRef: alpha-checkout-test
  services:
    web:
      digest: sha256:1fa5a03110fe8a9711617769d3b4d545d36e8dac6364f29bdc3eed13e6007add
