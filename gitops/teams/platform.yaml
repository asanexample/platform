# Team platform — the first PLATFORM-OWNED Team (ADR-081). Same first-class git-native governance object as a
# tenant Team (ADR-063), but with a platformTrust envelope: capabilities tenants can't request (cluster-scoped read
# RBAC + IAM actions past the deny-set). Platform-authored, admin-only — like every Team CR. The triage copilot
# (ADR-080) is its first Product.
apiVersion: platform.refplat.org/v1beta1
kind: Team
metadata:
  name: platform
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: environment-api
spec:
  ssoGroup: Platform
  roles:
    releaseApprover: ["gangster"]
  # Incident routing (ADR-084 D6) — the resolution floor for every platform-owned incident, including the
  # triage agent's OWN (team=platform). The agent posts platform incidents into this channel; its bot must be
  # invited. Channel name (resolved to an id at runtime); change to your real platform incident channel.
  slack:
    channel: "#platform-incidents"
  envelope:
    allowedTiers: ["standard"]
    allowedStages: ["dev", "prod"]
    allowedLocations: ["*"]
    quotaCap:
      cpu: "16"
      memory: 32Gi
      pods: 60
    maxDedicatedIsolation: { cluster: 0, account: 0 }
    # Platform agents are read-only/stateless — no self-service cloud resources.
    resources:
      allowedEngines: []
      maxPerEnvironment: 0
      isolationFloor: shared
  # platformTrust envelope removed (ADR-082): platform agents now run on the hub via the XAgent runtime and get
  # cluster-read (+ their Bedrock grant) from the XAgent Composition's obsRead/model, NOT from a tenant
  # Environment requesting the Team's platformTrust. The platform Team deploys agents (XAgent), not XEnvironments,
  # so the envelope is no longer used. Re-add if a non-agent platform Environment ever needs it.
