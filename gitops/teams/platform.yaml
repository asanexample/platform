# Team platform — the first PLATFORM-OWNED Team (ADR-081). Same first-class git-native governance object as a
# tenant Team (ADR-063), but with a platformTrust envelope: capabilities tenants can't request (cluster-scoped read
# RBAC + IAM actions past the deny-set). Platform-authored, admin-only — like every Team CR. The triage copilot
# (ADR-080) is its first Product.
apiVersion: platform.refplat.org/v1beta1
kind: Team
metadata:
  name: platform
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: tenant-api
spec:
  ssoGroup: Platform
  roles:
    releaseApprover: ["gangster"]
  envelope:
    allowedTiers: ["standard"]
    allowedStages: ["dev", "prod"]
    allowedLocations: ["*"]
    quotaCap:
      cpu: "16"
      memory: 32Gi
      pods: 60
    maxDedicatedIsolation: { cluster: 0, account: 0 }
    # Platform agents are read-only/stateless — no self-service cloud resources.
    resources:
      allowedEngines: []
      maxPerEnvironment: 0
      isolationFloor: shared
  # Platform-trust envelope (ADR-081) — what this Team's Environments may request beyond a tenant's:
  platformTrust:
    # cluster-scoped read RBAC the Composition may bind (a pre-created, platform-labeled read-only ClusterRole)
    clusterRoles: ["platform-trust-observability-reader"]
    # IAM actions allowed past the policyStatements deny-set (documentary — bedrock is already outside the deny-set)
    allowedIamActions: ["bedrock:InvokeModel"]
