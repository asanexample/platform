# Team delta — first-class git-native governance object (ADR-063).
# The envelope is the bound on every Product/Environment this team may author; Kyverno reads the projected Team
# CR during XEnvironment admission (restrict-environment-envelope, ADR-067). Platform-authored (admin-only);
# developers author Products/Environments, not this. Source of truth for the team's identity (ssoGroup) + envelope.
apiVersion: platform.refplat.org/v1alpha3
kind: Team
metadata:
  name: delta
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: tenant-api
spec:
  ssoGroup: Dev-delta
  envelope:
    allowedTiers: ["standard"]
    allowedStages: ["dev"]
    allowedLocations: ["*"]
    quotaCap:
      cpu: "8"
      memory: 16Gi
      pods: 40
    maxDedicatedIsolation: { cluster: 0, account: 0 }
