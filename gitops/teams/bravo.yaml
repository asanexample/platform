# Team bravo — first-class git-native governance object (ADR-063). See alpha.yaml for the model.
apiVersion: platform.refplat.org/v1beta1
kind: Team
metadata:
  name: bravo
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: environment-api
spec:
  ssoGroup: Dev-bravo
  roles:
    releaseApprover: ["gangster"] # prod release-approver default (ADR-068 §7, #501)
  envelope:
    allowedTiers: ["standard"]
    allowedStages: ["dev", "test", "uat", "staging", "prod"]
    allowedLocations: ["*"]
    quotaCap:
      cpu: "8"
      memory: 16Gi
      pods: 40
    maxDedicatedIsolation: { cluster: 0, account: 0 }
    # Self-service cloud resources (ADR-073). Opted in to S3; up to 10 per Environment, pooled isolation.
    resources:
      allowedEngines: ["s3", "sqs", "sns", "dynamodb"]
      maxPerEnvironment: 10
      isolationFloor: shared
