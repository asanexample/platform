# Team bravo — first-class git-native governance object (ADR-063). See alpha.yaml for the model.
apiVersion: platform.refplat.org/v1alpha2
kind: Team
metadata:
  name: bravo
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: tenant-api
spec:
  ssoGroup: Dev-bravo
  envelope:
    allowedTiers: ["standard"]
    allowedEnvironments: ["dev", "test", "uat", "staging", "prod"]
    allowedLocations: ["*"]
    quotaCap:
      cpu: "8"
      memory: 16Gi
      pods: 40
    maxDedicatedZones: 0
