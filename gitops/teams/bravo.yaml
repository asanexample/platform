# Team bravo — first-class git-native governance object (ADR-063). See alpha.yaml for the model.
apiVersion: platform.refplat.org/v1beta1
kind: Team
metadata:
  name: bravo
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: tenant-api
spec:
  ssoGroup: Dev-bravo
  roles:
    releaseApprover: ["gangster"] # team-wide default prod release-approver set (ADR-068 §7, #501)
  envelope:
    allowedTiers: ["standard"]
    allowedStages: ["dev", "test", "uat", "staging", "prod"]
    allowedLocations: ["*"]
    quotaCap:
      cpu: "8"
      memory: 16Gi
      pods: 40
    maxDedicatedIsolation: { cluster: 0, account: 0 }
