# Throwaway team to exercise teams-gate. Intentionally violates the envelope deny-set.
apiVersion: platform.refplat.org/v1alpha2
kind: Team
metadata:
  name: zzgatetest
spec:
  ssoGroup: platform-admins
  envelope:
    allowedTiers: ["gold"]
    allowedEnvironments: ["dev"]
    quotaCap:
      cpu: "200"
      memory: 1Ti
      pods: 9999
    maxDedicatedZones: 5
