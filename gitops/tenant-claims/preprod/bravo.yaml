# Tenant claim for Team bravo, Tenant "demo", stage "dev" (v1alpha2). See alpha.yaml for the model.
apiVersion: platform.refplat.org/v1alpha2
kind: XTenant
metadata:
  name: bravo-demo-dev
spec:
  team: bravo
  name: demo
  environment: dev
  tier: standard
  # Generated host: demo-bravo-dev.preprod.aws.refplat.org (no preview wildcard — preview is false).
  apps:
    demo:
      repo: asanexample/app-bravo # owner/repo
      repoPath: k8s/preprod
      preview: false
      serviceAccount: app-bravo
  developerAccess:
    enabled: true
