# Tenant claim for team-alpha (preprod). Synced by ArgoCD (app: tenant-claims-preprod) and reconciled by the
# Crossplane Tenant Composition. This file is the source of truth for the tenant — edit/remove it via PR
# (CODEOWNERS-gated). See docs/architecture/crossplane-tenant-api.md and docs/runbooks/tenant-onboarding.md.
apiVersion: platform.refplat.org/v1alpha1
kind: XTenant
metadata:
  name: alpha
spec:
  team: alpha
  hostnames:
    - demo.preprod.aws.refplat.org
    # PR preview environments (app `demo`, preview: true). The ApplicationSet rewrites each preview's HTTPRoute
    # hostname to "<team>-<app>-pr-<number>.<preview_domain>"; this wildcard lets restrict-route-hostnames admit
    # them (Kyverno AnyNotIn matches `*`). Team-scoped, so it only covers team-alpha's own preview subdomains.
    - alpha-demo-pr-*.preprod.aws.refplat.org
  apps:
    demo:
      repoPath: k8s/preprod
      preview: true
  aws:
    serviceAccount: app-alpha
    policyStatements: []
