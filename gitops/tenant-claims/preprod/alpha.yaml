# Tenant claim for Team alpha, Tenant "demo", stage "dev" (v1alpha2). Synced by ArgoCD (app:
# tenant-claims-preprod) and reconciled by the Crossplane Tenant Composition v2. This file is the source of
# truth — edit/remove it via PR (CODEOWNERS-gated). One claim per (team, name, environment); the namespace is
# <team>-<name>-<env> (alpha-demo-dev). See docs/architecture/tenant-api-v2.md and docs/runbooks/tenant-onboarding.md.
apiVersion: platform.refplat.org/v1alpha2
kind: XTenant
metadata:
  name: alpha-demo-dev
spec:
  team: alpha
  name: demo
  environment: dev
  tier: standard
  # Route hostnames are DERIVED (ADR-060): the generated host demo-alpha-dev.preprod.aws.refplat.org +
  # the demo-alpha-dev-pr-* preview wildcard. argocd-apps injects the same host into the HTTPRoute. Declare a
  # `domains` alias only for an extra vanity host (ADR-061).
  apps:
    demo:
      repo: asanexample/app-alpha # owner/repo — the single source argocd-apps/policy/github-oidc derive from
      repoPath: k8s/preprod
      preview: true
      serviceAccount: app-alpha # named SA the app's pods run as (Pod Identity association binds it)
  developerAccess:
    enabled: true
