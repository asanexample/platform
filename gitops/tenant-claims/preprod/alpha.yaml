# Tenant claim for team-alpha (preprod). Synced by ArgoCD (app: tenant-claims-preprod) and reconciled by the
# Crossplane Tenant Composition. This file is the source of truth for the tenant — edit/remove it via PR
# (CODEOWNERS-gated). See docs/architecture/crossplane-tenant-api.md and docs/runbooks/tenant-onboarding.md.
apiVersion: platform.refplat.org/v1alpha1
kind: XTenant
metadata:
  name: alpha
spec:
  team: alpha
  # Route hostnames are DERIVED from (app, team, baseDomain) by the Composition (ADR-060): each app gets
  # <app>-<team>.<baseDomain> (here demo-alpha.preprod.aws.refplat.org) + the <app>-<team>-pr-* preview
  # wildcard. argocd-apps injects the same host into the HTTPRoute, so nothing is hardcoded. Only add an
  # explicit `hostnames:` list for an EXTRA vanity host beyond the derived defaults.
  apps:
    demo:
      repoPath: k8s/preprod
      preview: true
  aws:
    serviceAccount: app-alpha
    policyStatements: []
