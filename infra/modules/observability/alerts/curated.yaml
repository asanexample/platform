# Curated platform-specific alert rules (P4 Tier 2). Loaded into kube-prometheus-stack via
# additionalPrometheusRulesMap (yamldecode in main.tf). Every alert carries severity (routed by the
# Alertmanager severity tree) + a runbook_url. Exprs are grounded in metrics verified present in the
# live Prometheus (cert-manager / kyverno / argocd ServiceMonitors). Cilium / ESO / the LGTM stores
# are added once their metrics are scraped (a follow-up that enables metrics per component).
groups:
  # ---------------------------------------------------------------------------
  - name: cert-manager.rules
    rules:
      - alert: CertManagerDown
        expr: up{job="cert-manager"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: cert-manager controller is down
          description: "cert-manager (job cert-manager) has been unreachable for 10m — certificate issuance and renewal are stalled (Gateway TLS / Let's Encrypt)."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cert-manager"
      - alert: CertManagerCertExpiringCritical
        expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 604800
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in < 7d"
          description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 7 days and has not renewed."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cert-manager"
      - alert: CertManagerCertExpiringSoon
        expr: ((certmanager_certificate_expiration_timestamp_seconds - time()) < 1814400) and ((certmanager_certificate_expiration_timestamp_seconds - time()) >= 604800)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in < 21d"
          description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 21 days; renewal should occur automatically — investigate if it doesn't."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cert-manager"
      - alert: CertManagerCertNotReady
        expr: certmanager_certificate_ready_status{condition="True"} == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} not Ready"
          description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} has not been Ready for 1h (issuance/renewal failing)."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cert-manager"
      - alert: CertManagerSyncErrors
        expr: increase(certmanager_controller_sync_error_count[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "cert-manager sync errors ({{ $labels.controller }})"
          description: "cert-manager controller {{ $labels.controller }} is logging sync errors over the last 15m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cert-manager"
  # ---------------------------------------------------------------------------
  - name: kyverno.rules
    rules:
      - alert: KyvernoAdmissionControllerDown
        expr: up{job="kyverno-svc-metrics"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Kyverno admission controller is down
          description: "The Kyverno admission controller (job kyverno-svc-metrics) has been down for 5m — admission webhooks may be failing or blocking deploys cluster-wide."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#kyverno"
      - alert: KyvernoReportsControllerDown
        expr: up{job="kyverno-reports-controller-metrics"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Kyverno reports controller is down
          description: "The Kyverno reports controller has been down for 15m — policy reports will be stale."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#kyverno"
      - alert: KyvernoBackgroundControllerDown
        expr: up{job="kyverno-background-controller-metrics"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Kyverno background controller is down
          description: "The Kyverno background controller has been down for 15m — generate/mutate-existing rules won't reconcile."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#kyverno"
      - alert: KyvernoPolicyExecutionErrors
        expr: increase(kyverno_policy_results_total{rule_result="error"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Kyverno policy execution errors ({{ $labels.policy_name }})"
          description: "Kyverno policy {{ $labels.policy_name }} is producing rule-execution errors over the last 15m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#kyverno"
      - alert: KyvernoCircuitBreakerTripping
        expr: increase(kyverno_breaker_drops_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kyverno circuit breaker dropping ({{ $labels.circuit_name }})"
          description: "Kyverno's circuit breaker is dropping work — the controller is overloaded or degraded."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#kyverno"
  # ---------------------------------------------------------------------------
  - name: policy-reporter.rules
    rules:
      - alert: PolicyReporterDown
        expr: up{job="policy-reporter"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: policy-reporter is down
          description: "policy-reporter (P12, #93) has been down for 15m — PolicyReport/ClusterPolicyReport violation metrics and dashboards will be stale."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#policy-reporter"
      # policy_report_result / cluster_policy_report_result are GAUGES (current report state, re-emitted
      # each processing cycle) — a level check, not increase(), is the correct form. Enforce-mode Kyverno
      # blocks bad resources at admission, so a fail/error surfacing in a PolicyReport means either an
      # Audit-mode policy caught something or a background scan found drift; either way it's compliance
      # evidence worth paging on (ADR-013/037).
      - alert: PolicyReportNewViolation
        expr: sum(policy_report_result{status=~"fail|error"}) by (cluster, exported_namespace, policy, severity, source) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PolicyReport violation ({{ $labels.policy }} in {{ $labels.exported_namespace }})"
          description: "{{ $labels.cluster }}/{{ $labels.exported_namespace }}: policy {{ $labels.policy }} ({{ $labels.source }}, severity {{ $labels.severity }}) has had a fail/error PolicyReport result for 15m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#policy-reporter"
      - alert: ClusterPolicyReportNewViolation
        expr: sum(cluster_policy_report_result{status=~"fail|error"}) by (cluster, policy, severity, source) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ClusterPolicyReport violation ({{ $labels.policy }})"
          description: "{{ $labels.cluster }}: cluster-scoped policy {{ $labels.policy }} ({{ $labels.source }}, severity {{ $labels.severity }}) has had a fail/error PolicyReport result for 15m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#policy-reporter"
  # ---------------------------------------------------------------------------
  - name: true-cost.rules
    rules:
      - alert: TrueCostExporterDown
        expr: up{job="true-cost-exporter"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: true-cost-exporter is down
          description: "true-cost-exporter (#668) has been down for 15m — true-cloud-cost (CUR/Athena) metrics and dashboard panels will be stale."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#true-cost-exporter"
      - alert: TrueCostExporterStale
        expr: time() - platform_true_cost_exporter_last_success_timestamp_seconds > 32400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: true-cost-exporter data is stale
          description: "true-cost-exporter's last successful Athena refresh was over 9h ago (it refreshes every 6h) — likely a cross-account AssumeRole or Athena query failure. Check exporter logs."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#true-cost-exporter"
  # ---------------------------------------------------------------------------
  - name: argocd.rules
    rules:
      - alert: ArgoCDComponentDown
        expr: up{job=~"argocd-.*-metrics"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "ArgoCD component down ({{ $labels.job }})"
          description: "An ArgoCD component ({{ $labels.job }}) has been unreachable for 10m — GitOps reconciliation/UI may be impaired."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#argocd"
      - alert: ArgoCDAppDegraded
        expr: argocd_app_info{health_status="Degraded"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ArgoCD app {{ $labels.name }} Degraded"
          description: "ArgoCD application {{ $labels.name }} (project {{ $labels.project }}) has been Degraded for 15m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#argocd"
      - alert: ArgoCDAppOutOfSync
        expr: argocd_app_info{sync_status="OutOfSync"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ArgoCD app {{ $labels.name }} OutOfSync"
          description: "ArgoCD application {{ $labels.name }} has been OutOfSync for 15m — a manual change or a failing auto-sync."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#argocd"
      - alert: ArgoCDRepoServerGitErrors
        # CRITICAL (was warning): a repo the repo-server can't read blinds the WHOLE delivery plane for that
        # repo — manifests can't be generated, so apps silently stop deploying (a 6-day outage 2026-07-02 was
        # exactly this, but warning-severity ⇒ it never paged). See #1120/#1124.
        expr: increase(argocd_git_lsremote_fail_total[15m]) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "ArgoCD git ls-remote failures ({{ $labels.repo }})"
          description: "ArgoCD repo-server is failing git ls-remote against {{ $labels.repo }} — repo connectivity/credentials issue. Manifest generation for apps sourcing this repo is BROKEN; they will not deploy until fixed."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#argocd"
      - alert: ArgoCDAppSyncUnknown
        # The blind spot that hid the 2026-07-02 outage: an app stuck sync=Unknown (a ComparisonError — repo
        # unreadable / manifest gen failing) is NEITHER Synced NOR OutOfSync, so ArgoCDAppOutOfSync misses it,
        # and its live state can stay Healthy so ArgoCDAppDegraded misses it too. for=1h filters the brief
        # Unknown during a normal sync. See #1121/#1124.
        expr: argocd_app_info{sync_status="Unknown"} > 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "ArgoCD app {{ $labels.name }} sync status Unknown"
          description: "ArgoCD application {{ $labels.name }} (project {{ $labels.project }}) has been sync=Unknown for 1h — ArgoCD cannot compare against git (a ComparisonError: unreadable repo, failing manifest generation, or a plugin error), so it is NOT deploying new revisions even while the running pods look Healthy."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#argocd"
      - alert: ArgoCDReconciliationStalled
        # Complements ArgoCDAppSyncUnknown (per-app) with a CONTROLLER-wide staleness signal: if the
        # application-controller stops reconciling entirely (wedged / CPU-starved / a stuck work queue in a
        # way the component-down check misses), NO app is compared against git even though nothing is
        # "Unknown" yet. ArgoCD re-reconciles every app on a poll (~3m default), so a healthy controller
        # always has a nonzero reconcile rate — flat for 30m = GitOps has silently stopped (#1115/#1121).
        expr: sum(rate(argocd_app_reconcile_count[10m])) == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "ArgoCD has stopped reconciling applications"
          description: "The ArgoCD application-controller has performed zero app reconciliations for 30m (argocd_app_reconcile_count is flat) — GitOps delivery is silently stalled: git changes are no longer applied even if every app still shows its last-known status. Check the application-controller pod (OOM/CPU-starved/wedged work queue) and its logs."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#argocd"
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#argocd"
  # ---------------------------------------------------------------------------
  - name: loki.rules
    rules:
      - alert: LokiDown
        expr: up{job=~".*loki.*"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Loki is down
          description: "Loki (the log store) has been unreachable for 10m — log ingestion and queries are unavailable."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
      - alert: LokiRequestErrors
        expr: (sum(rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m])) / sum(rate(loki_request_duration_seconds_count[5m]))) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Loki 5xx error ratio > 5%
          description: "More than 5% of Loki requests have returned 5xx over the last 15m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
      - alert: LokiChunkFlushFailures
        expr: increase(loki_ingester_chunks_flush_failures_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Loki chunk flushes to object storage are failing
          description: "Loki ingester chunk flushes to S3 have failed over the last 15m — risk of log loss / WAL backpressure."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
      - alert: LokiPanics
        expr: increase(loki_panic_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Loki is panicking
          description: "Loki has logged panics over the last 10m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
      - alert: LokiTenantIngestStale
        expr: sum by (tenant) (rate(loki_distributor_lines_received_total[15m])) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tenant {{ $labels.tenant }} has shipped no logs in 15m"
          description: "Loki's distributor has received zero log lines for tenant {{ $labels.tenant }} over the last 15m — the tenant's Alloy shipper may be down, or the cluster/team it belongs to has gone dark. \"Who watches the watcher\": a dead shipper produces no errors and looks healthy under availability-only alerts. Known limitation: if the Loki distributor pod itself restarted after the tenant last shipped, the per-tenant series won't exist yet and this alert won't fire until at least one line lands post-restart."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
  # ---------------------------------------------------------------------------
  - name: tempo.rules
    rules:
      - alert: TempoComponentDown
        expr: up{job=~"observability/(distributor|ingester|querier|query-frontend|compactor)"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Tempo component down ({{ $labels.job }})"
          description: "A Tempo component ({{ $labels.job }}) has been unreachable for 10m — trace ingestion or queries may be impaired."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
      - alert: TempoIngesterFlushFailures
        expr: increase(tempo_ingester_failed_flushes_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Tempo ingester flushes to object storage are failing
          description: "Tempo ingester flushes to S3 have failed over the last 15m — risk of trace loss / WAL backpressure."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
      - alert: TempoBackendFlushFailures
        expr: increase(tempo_backend_scheduler_work_flushes_failed_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Tempo backend compaction flushes are failing
          description: "Tempo's backend scheduler has failed work flushes over the last 15m — compaction/backend write issues."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
      - alert: TempoTenantIngestStale
        expr: sum by (tenant) (rate(tempo_distributor_spans_received_total[15m])) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tenant {{ $labels.tenant }} has shipped no traces in 15m"
          description: "Tempo's distributor has received zero spans for tenant {{ $labels.tenant }} over the last 15m — the tenant's OTel collector/Beyla path may be down, or the workload has gone dark. Only fires for tenants that normally ship traces (currently platform and preprod) — a tenant with no trace-producing workload never has this series and won't alert, which is expected, not a bug."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
  # ---------------------------------------------------------------------------
  - name: external-secrets.rules
    rules:
      - alert: ExternalSecretNotReady
        # CRITICAL (was warning): a not-Ready ExternalSecret means a K8s Secret has stopped syncing from
        # the backend store — dependent workloads break on the next restart/rotation (auth, DB creds, tokens).
        # Silent-as-warning is how a credential outage hides. See #1120/#1124.
        expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} not Ready"
          description: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has been Ready=False for 15m — the Secrets Manager → K8s sync is failing (downstream secrets go stale)."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#external-secrets"
      - alert: ClusterSecretStoreNotReady
        # CRITICAL (was warning): the store is the source for EVERY ExternalSecret — if it's not Ready, ALL
        # secret syncing is broken cluster-wide, so this is broader than a single ExternalSecret. See #1120/#1124.
        expr: clustersecretstore_status_condition{condition="Ready",status="False"} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "ClusterSecretStore {{ $labels.name }} not Ready"
          description: "ClusterSecretStore {{ $labels.name }} has been Ready=False for 15m — everything that syncs secrets through it is affected."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#external-secrets"
  # ---------------------------------------------------------------------------
  - name: cilium.rules
    rules:
      - alert: CiliumAgentDown
        expr: up{job="observability/cilium-agent"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Cilium agent down ({{ $labels.pod }})"
          description: "A Cilium agent ({{ $labels.pod }}) has been unreachable for 10m — pods on that node lose networking/policy enforcement."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cilium"
      - alert: CiliumOperatorDown
        expr: sum(up{job="observability/cilium-operator"}) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Cilium operator is down
          description: "No Cilium operator has been up for 10m — IPAM, identity GC, and CRD reconciliation are stalled."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cilium"
      - alert: CiliumUnreachableNodes
        expr: cilium_unreachable_nodes > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cilium reports unreachable nodes ({{ $labels.pod }})"
          description: "A Cilium agent ({{ $labels.pod }}) reports unreachable peer nodes for 10m — node-to-node connectivity problem."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cilium"
      - alert: CiliumUnreachableHealthEndpoints
        expr: cilium_unreachable_health_endpoints > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cilium reports unreachable health endpoints ({{ $labels.pod }})"
          description: "A Cilium agent ({{ $labels.pod }}) reports unreachable health endpoints for 10m — pod-to-pod connectivity degradation."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cilium"
      - alert: HubbleDown
        expr: up{job="hubble-metrics"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Hubble metrics down ({{ $labels.pod }})"
          description: "Hubble metrics ({{ $labels.pod }}) have been unreachable for 15m — network flow observability is degraded (networking itself is unaffected)."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cilium"
      - alert: CiliumHighDropRate
        # Excludes "Policy denied" (intended by network policy). Threshold sits well above the steady-state
        # noise (~0.03/s "Unsupported L3 protocol"); >10/s sustained = a real datapath/connectivity problem.
        expr: sum(rate(cilium_drop_count_total{reason!="Policy denied"}[5m])) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: High Cilium packet drop rate (non-policy)
          description: "Cilium is dropping >10 packets/s for non-policy reasons over 15m — a datapath/connectivity problem (policy-denied drops are excluded as expected). Start with `cilium monitor --type drop`."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cilium"

  # Cloud-resource alerts (#102 P5b) — metrics from YACE (CloudWatch → Prometheus). Names are
  # aws_<namespace>_<metric>_<stat> (live-verified).
  - name: cloudwatch.rules
    rules:
      - alert: CloudNLBUnhealthyHosts
        expr: max by (dimension_LoadBalancer, dimension_TargetGroup) (aws_networkelb_un_healthy_host_count_maximum) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "NLB target group has unhealthy hosts ({{ $labels.dimension_TargetGroup }})"
          description: "An AWS NLB target group has reported unhealthy hosts for 15m — the gateway/load-balancer backend is degraded. Check target-group health and the backing pods/nodes."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cloud-resources"
      - alert: CloudNATGatewayPortAllocationErrors
        expr: sum by (dimension_NatGatewayId) (rate(aws_natgateway_error_port_allocation_sum[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "NAT gateway SNAT port-allocation errors ({{ $labels.dimension_NatGatewayId }})"
          description: "A NAT gateway is failing to allocate SNAT source ports for 15m — outbound connections from the VPC are being dropped (port exhaustion). Reduce concurrent connections to a single destination, or add NAT gateways."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cloud-resources"
      - alert: CloudTransitGatewayBlackholeDrops
        expr: sum by (dimension_TransitGateway) (rate(aws_transitgateway_packet_drop_count_blackhole_sum[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Transit Gateway is blackholing packets ({{ $labels.dimension_TransitGateway }})"
          description: "A Transit Gateway has dropped packets to a blackhole route for 15m — cross-account traffic (platform hub ↔ preprod spoke) is hitting a missing or misconfigured TGW route. Check the TGW route tables and VPC attachments."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cloud-resources"
  # ---------------------------------------------------------------------------
  # Agent-eval capture substrate (ADR-080 D6). Capture-health backstop: if the corpus silently stops
  # growing, the "ready-for-scale" premise quietly fails. Today only the TRIGGER layer is observable — if
  # Alertmanager can't deliver criticals to the triage agent's webhook, the agent receives nothing to triage
  # or capture. The fuller "fixtures captured == 0 while criticals fired" alert lands once the agent emits an
  # agent_eval_fixtures_captured_total counter on the ADR-076 metrics path (see docs/runbooks/agent-operations.md).
  # alertmanager_notifications_* is a kube-prometheus-stack default; confirm present in live Prometheus at
  # rollout (triage is currently the only integration="webhook" receiver).
  - name: agent-eval.rules
    rules:
      - alert: AgentTriageWebhookDeliveryFailing
        expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager can't deliver to the triage agent webhook"
          description: "Alertmanager webhook notifications have failed over the last 15m — the triage copilot is not receiving critical alerts, so it can neither triage nor forward-capture eval fixtures (the corpus silently stops growing). Check the triage-copilot-server Service/pod and the observability→agent NetworkPolicy."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/agent-operations.md#capture-health"

  - name: cloudnativepg.rules
    rules:
      - alert: CNPGInstanceDown
        expr: cnpg_collector_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CloudNativePG instance {{ $labels.namespace }}/{{ $labels.pod }} is down"
          description: "The CNPG instance {{ $labels.pod }} in {{ $labels.namespace }} has reported not-up for 5m. For a single-instance cluster (keycloak-db, backstage-db, triage-copilot-db) this is a database outage — Keycloak DB down blips SSO platform-wide."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cloudnativepg"
      - alert: CNPGWALArchivingFailing
        expr: cnpg_collector_pg_wal_archive_status{value="ready"} > 5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "CloudNativePG WAL archiving is failing for {{ $labels.namespace }}/{{ $labels.pod }}"
          description: "More than 5 WAL segments have been waiting to archive for 15m on {{ $labels.pod }} ({{ $labels.namespace }}) — Barman WAL archiving to S3 is failing or falling behind, so continuous backups / point-in-time recovery are broken and pg_wal will keep growing. Check the plugin-barman-cloud sidecar logs (barman-cloud-wal-archive) for the S3/IAM/SCP error. (The base-backup freshness metric is unusable with the Barman plugin — this is the primary backup-health signal.)"
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cloudnativepg"
      - alert: CNPGCollectorErrors
        expr: cnpg_collector_last_collection_error > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CloudNativePG metrics collector is erroring for {{ $labels.namespace }}/{{ $labels.pod }}"
          description: "The in-instance CNPG metrics collector on {{ $labels.pod }} ({{ $labels.namespace }}) has been failing its collection query for 15m — usually a sign the database is unhealthy or unreachable even if the pod looks up. Early warning ahead of a hard outage."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cloudnativepg"
  # ---------------------------------------------------------------------------
  # External reachability (alerting P1, #1122). The blackbox-exporter probes the public-facing endpoints
  # (grafana/argocd/backstage/keycloak) from inside the cluster via the Gateway. `probe_success` is the
  # synthetic "is it up from outside" signal — independent of in-cluster health — and
  # `probe_ssl_earliest_cert_expiry` is the PUBLIC TLS cert clients actually see (distinct from the
  # in-cluster cert-manager certs in cert-manager.rules above).
  - name: blackbox.rules
    rules:
      - alert: BlackboxProbeDown
        expr: probe_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "External endpoint {{ $labels.instance }} is unreachable"
          description: "The blackbox synthetic probe of {{ $labels.instance }} has failed for 5m — the endpoint is down, its TLS is broken, or it is returning an unexpected status. This is user-facing external reachability, independent of any in-cluster health signal."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#blackbox"
      - alert: BlackboxProbeSlow
        expr: probe_duration_seconds > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "External endpoint {{ $labels.instance }} is slow (> 5s)"
          description: "The blackbox probe of {{ $labels.instance }} has taken over 5s for 15m — external users are seeing degraded latency even though the probe still succeeds."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#blackbox"
      - alert: BlackboxSslCertExpiringCritical
        expr: (probe_ssl_earliest_cert_expiry - time()) < 604800 and probe_ssl_earliest_cert_expiry > 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Public TLS cert for {{ $labels.instance }} expires in < 7d"
          description: "The public-facing TLS certificate served by {{ $labels.instance }} expires in under 7 days. Unlike the in-cluster cert-manager certs, this is what external clients actually see — if Let's Encrypt renewal has stalled, users will get certificate errors."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#blackbox"
      - alert: BlackboxSslCertExpiringSoon
        expr: ((probe_ssl_earliest_cert_expiry - time()) < 1814400) and ((probe_ssl_earliest_cert_expiry - time()) >= 604800)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Public TLS cert for {{ $labels.instance }} expires in < 21d"
          description: "The public-facing TLS certificate served by {{ $labels.instance }} expires in under 21 days; automatic Let's Encrypt renewal should occur — investigate if it does not."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#blackbox"
  # ---------------------------------------------------------------------------
  # Cluster elasticity (alerting P1, #1121). Karpenter provisions nodes on demand (ADR-078); when it can't,
  # pods stay Pending and workloads can't scale — a control-plane failure that generic pod-crash checks miss.
  - name: karpenter.rules
    rules:
      - alert: KarpenterCloudProviderErrors
        # WARNING not critical: this counter also ticks on transient InsufficientCapacity that Karpenter
        # recovers from by trying another instance type; only a SUSTAINED error stream is actionable.
        expr: sum(rate(karpenter_cloudprovider_errors_total[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Karpenter is failing EC2 cloud-provider calls"
          description: "Karpenter has been erroring on EC2 API calls continuously for 15m (karpenter_cloudprovider_errors_total rising) — it may be unable to launch/terminate nodes, so pending pods won't get capacity. Check the karpenter controller logs for the AWS error (IAM/Pod-Identity, subnet/AZ capacity, SCP, or a launch-template problem)."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#karpenter"
      - alert: KarpenterPodsPendingUnscheduled
        expr: kube_pod_status_phase{phase="Pending"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck Pending for 15m"
          description: "{{ $labels.namespace }}/{{ $labels.pod }} has been Pending for 15m and can't be scheduled — usually Karpenter hasn't (or can't) provision matching capacity. Check `kubectl describe pod` for the unschedulable reason, the Karpenter logs, and any NodePool limits/taints. Sustained pending = the elasticity loop is broken."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#karpenter"
  # ---------------------------------------------------------------------------
  # Operator reconcile health (alerting P1, #1121). Any controller-runtime operator — Karpenter, ESO, the
  # ArgoCD ApplicationSet controller, the ADR-088 activation-operator — silently failing to reconcile is the
  # failure mode behind stale desired-state that a pod-up check never sees.
  - name: controllers.rules
    rules:
      - alert: ControllerReconcileErrors
        expr: sum by (controller) (rate(controller_runtime_reconcile_errors_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Operator controller {{ $labels.controller }} is failing reconciles"
          description: "The `{{ $labels.controller }}` controller has returned reconcile errors continuously for 15m (controller_runtime_reconcile_errors_total rising) — its desired state isn't being applied (e.g. an activation grant not processed, an ExternalSecret not synced, a NodeClaim not created). Check that operator's pod logs for the underlying error."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#controllers"
  # ---------------------------------------------------------------------------
  # Keycloak (alerting P1, #1121). The IdP for ArgoCD, Grafana, Backstage, and the platform agents — if it's
  # down, SSO across the whole platform is down. Metrics are now scraped (keycloak KC_METRICS_ENABLED +
  # ServiceMonitor, job=keycloak-http). Login-event metrics (failed-login rate) need KC's user-event-metrics
  # feature — a follow-up; the availability + HTTP-error signals below are what's grounded today.
  - name: keycloak.rules
    rules:
      - alert: KeycloakDown
        expr: up{job="keycloak-http"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Keycloak is down — platform SSO is unavailable"
          description: "The Keycloak IdP (job keycloak-http) has been unreachable for 5m — OIDC login for ArgoCD, Grafana, Backstage, and the platform agents is broken and new sessions can't authenticate. Check the single keycloak-0 pod and its CloudNativePG database (keycloak-db)."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#keycloak"
      - alert: KeycloakHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="keycloak-http",outcome="SERVER_ERROR"}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="keycloak-http"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak is returning a high 5xx rate"
          description: "Over 10% of Keycloak HTTP requests have been 5xx for 10m — auth requests are failing even though the pod is up. Common causes: the database is unreachable/slow (check keycloak-db + the CloudNativePG alerts), or Keycloak is resource-starved. Read the keycloak-0 logs."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#keycloak"
  # ---------------------------------------------------------------------------
  # Crossplane (alerting P1, #1121). The provisioner for every environment + self-service cloud resource. Its
  # core-controller metrics are scraped via the PodMonitor in the crossplane module (hub). Composition/provider
  # reconcile ERRORS are covered by the generic controllers.rules once scraped; this catches the core being down.
  - name: crossplane.rules
    rules:
      - alert: CrossplaneDown
        # The PodMonitor scrapes only the core controller (app=crossplane) in crossplane-system, so this is a
        # single up series — provisioning halted if it's 0.
        expr: up{namespace="crossplane-system"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Crossplane core controller is down — provisioning is halted"
          description: "The Crossplane core controller (crossplane-system) has been unreachable for 5m — XEnvironment claims, Composition renders, and self-service cloud resources are no longer reconciling, so new environments/resources can't be provisioned (existing ones keep running). Check the crossplane deployment pod + logs. (Composition/provider reconcile ERRORS surface separately via ControllerReconcileErrors.)"
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#crossplane"
  # ---------------------------------------------------------------------------
  # Mimir (#1123) — the durable metrics store AND the ruler that evaluates alerting. Loki + Tempo already had
  # groups; Mimir did not. The nginx `gateway` is excluded: it doesn't serve scrapeable /metrics (up==0 while
  # perfectly healthy — the API is proxied through it); the real microservices below do.
  - name: mimir.rules
    rules:
      - alert: MimirComponentDown
        expr: up{pod=~"mimir-.*", job!="observability/gateway"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Mimir component {{ $labels.job }} is down"
          description: "A Mimir microservice ({{ $labels.job }}, pod {{ $labels.pod }}) has been unreachable for 10m. Mimir is the durable long-range metrics store and the ruler that evaluates alert rules — an ingester/distributor outage risks metric loss and degrades alerting itself. Check the pod + logs (S3/IAM for store-gateway/compactor; memory for ingester)."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#mimir"
      - alert: MimirRequestErrors
        expr: |
          sum(rate(cortex_request_duration_seconds_count{status_code=~"5.."}[5m]))
            / clamp_min(sum(rate(cortex_request_duration_seconds_count[5m])), 1) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Mimir is returning a high 5xx rate"
          description: "Over 5% of Mimir requests have been 5xx for 15m — metric reads (Grafana + alerting) and/or writes (remote-write ingestion) are failing. Check the mimir component logs (ingester back-pressure, store-gateway/S3, or the distributor)."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#mimir"
      - alert: MimirRulerRulesSyncStale
        expr: time() - kube_cronjob_status_last_successful_time{cronjob=~".*ruler-rules-sync.*"} > 1800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Mimir ruler-rules-sync CronJob ({{ $labels.cronjob }}) hasn't succeeded in 30m"
          description: "The `mimirtool rules sync` CronJob (schedule */15m) reconciles the per-tenant ruler to match the curated rules + app-slos + spoke-freshness ConfigMap — every SLO/burn-rate alert and spoke-freshness check in this repo depends on it actually running. No successful run in 30m (2x the schedule) means new/changed rules aren't reaching the ruler and, longer-term, stale rules never get cleaned up. Check `kubectl -n observability get jobs -l app.kubernetes.io/component=ruler-rules-sync` and the failing pod's logs — the two usual causes are the ruler API not being ready yet (post-unpark) or a malformed rule file (a Terraform template producing invalid YAML)."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#mimir"
  # ---------------------------------------------------------------------------
  # Tailscale (#1123) — the PRIMARY private cluster-access path (ADR-010). Not scraped for its own metrics, so
  # these are kube-state-metrics availability signals. "Up but not advertising routes" needs Tailscale's own
  # metrics (a follow-up); these catch the pod being down — the thing that silently loses kubectl access.
  - name: tailscale.rules
    rules:
      - alert: TailscaleSubnetRouterDown
        expr: kube_pod_status_ready{namespace="tailscale-system", pod=~"ts-.*subnet-router.*", condition="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tailscale subnet router {{ $labels.pod }} not ready — private cluster access at risk"
          description: "A Tailscale subnet router ({{ $labels.pod }}) has been not-Ready for 5m. It advertises the VPC CIDR to the tailnet, so private kubectl/EKS access over Tailscale (the routine ops path, ADR-010) is degraded or lost — SSM Session Manager is the fallback. Check the pod in tailscale-system + its Connector/ProxyClass."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#tailscale"
      - alert: TailscaleOperatorDown
        expr: kube_deployment_status_replicas_available{namespace="tailscale-system", deployment="operator"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tailscale operator is down"
          description: "The Tailscale operator (tailscale-system) has had zero available replicas for 10m — it reconciles the subnet routers + tailnet device auth. Existing routes keep working, but changes/renewals stall. Check the operator deployment + its OAuth secret."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#tailscale"
  # ---------------------------------------------------------------------------
  # Platform-service breadth (#1123): control-plane components scraped but previously unalerted for their own
  # up/down. cortex-tenant (per-team metric re-tenanting), argo-rollouts (progressive delivery), Beyla (the
  # eBPF app-metric source the SLOs depend on), external-dns (DNS record sync — kube-state, not scraped).
  - name: platform-services.rules
    rules:
      - alert: CortexTenantDown
        expr: up{job="cortex-tenant"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "cortex-tenant is down — per-team metric re-tenanting stopped"
          description: "cortex-tenant (the P13 write-splitter that routes each series into its team's Mimir tenant) has been down for 10m. Per-team metric isolation degrades — new metrics stop being split by team. Check the pod in observability."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#platform-services"
      - alert: ArgoRolloutsControllerDown
        expr: up{job="argo-rollouts-metrics"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Argo Rollouts controller is down — progressive delivery halted"
          description: "The Argo Rollouts controller has been down for 10m. Canary/blue-green Rollouts stop progressing and new deploys via a Rollout can't advance (running pods are unaffected). Check the controller pod + logs."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#platform-services"
      - alert: BeylaDown
        expr: up{job="beyla"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Beyla eBPF instrumentation is down — app RED metrics missing"
          description: "Beyla ({{ $labels.pod }}) has been down for 15m. It auto-generates the RED (rate/errors/duration) metrics for workloads via eBPF — the SLOs and APM correlation depend on it, so those go stale. Check the beyla DaemonSet pod on the affected node."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#platform-services"
      - alert: ExternalDnsUnavailable
        expr: kube_deployment_status_replicas_available{namespace="external-dns", deployment="external-dns"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "external-dns is down — DNS records will drift"
          description: "external-dns has had zero available replicas for 15m. It syncs Route53/Cloudflare records for Gateway hostnames + cert-manager DNS-01 — while down, new/changed hostnames won't resolve and ACME DNS-01 renewals can stall. Check the deployment + its IAM/Pod-Identity."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#platform-services"
