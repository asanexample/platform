# Curated platform-specific alert rules (P4 Tier 2). Loaded into kube-prometheus-stack via
# additionalPrometheusRulesMap (yamldecode in main.tf). Every alert carries severity (routed by the
# Alertmanager severity tree) + a runbook_url. Exprs are grounded in metrics verified present in the
# live Prometheus (cert-manager / kyverno / argocd ServiceMonitors). Cilium / ESO / the LGTM stores
# are added once their metrics are scraped (a follow-up that enables metrics per component).
groups:
  # ---------------------------------------------------------------------------
  - name: cert-manager.rules
    rules:
      - alert: CertManagerDown
        expr: up{job="cert-manager"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: cert-manager controller is down
          description: "cert-manager (job cert-manager) has been unreachable for 10m — certificate issuance and renewal are stalled (Gateway TLS / Let's Encrypt)."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cert-manager"
      - alert: CertManagerCertExpiringCritical
        expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 604800
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in < 7d"
          description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 7 days and has not renewed."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cert-manager"
      - alert: CertManagerCertExpiringSoon
        expr: ((certmanager_certificate_expiration_timestamp_seconds - time()) < 1814400) and ((certmanager_certificate_expiration_timestamp_seconds - time()) >= 604800)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in < 21d"
          description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 21 days; renewal should occur automatically — investigate if it doesn't."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cert-manager"
      - alert: CertManagerCertNotReady
        expr: certmanager_certificate_ready_status{condition="True"} == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} not Ready"
          description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} has not been Ready for 1h (issuance/renewal failing)."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cert-manager"
      - alert: CertManagerSyncErrors
        expr: increase(certmanager_controller_sync_error_count[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "cert-manager sync errors ({{ $labels.controller }})"
          description: "cert-manager controller {{ $labels.controller }} is logging sync errors over the last 15m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cert-manager"
  # ---------------------------------------------------------------------------
  - name: kyverno.rules
    rules:
      - alert: KyvernoAdmissionControllerDown
        expr: up{job="kyverno-svc-metrics"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Kyverno admission controller is down
          description: "The Kyverno admission controller (job kyverno-svc-metrics) has been down for 5m — admission webhooks may be failing or blocking deploys cluster-wide."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#kyverno"
      - alert: KyvernoReportsControllerDown
        expr: up{job="kyverno-reports-controller-metrics"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Kyverno reports controller is down
          description: "The Kyverno reports controller has been down for 15m — policy reports will be stale."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#kyverno"
      - alert: KyvernoBackgroundControllerDown
        expr: up{job="kyverno-background-controller-metrics"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Kyverno background controller is down
          description: "The Kyverno background controller has been down for 15m — generate/mutate-existing rules won't reconcile."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#kyverno"
      - alert: KyvernoPolicyExecutionErrors
        expr: increase(kyverno_policy_results_total{rule_result="error"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Kyverno policy execution errors ({{ $labels.policy_name }})"
          description: "Kyverno policy {{ $labels.policy_name }} is producing rule-execution errors over the last 15m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#kyverno"
      - alert: KyvernoCircuitBreakerTripping
        expr: increase(kyverno_breaker_drops_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kyverno circuit breaker dropping ({{ $labels.circuit_name }})"
          description: "Kyverno's circuit breaker is dropping work — the controller is overloaded or degraded."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#kyverno"
  # ---------------------------------------------------------------------------
  - name: policy-reporter.rules
    rules:
      - alert: PolicyReporterDown
        expr: up{job="policy-reporter"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: policy-reporter is down
          description: "policy-reporter (P12, #93) has been down for 15m — PolicyReport/ClusterPolicyReport violation metrics and dashboards will be stale."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#policy-reporter"
      # policy_report_result / cluster_policy_report_result are GAUGES (current report state, re-emitted
      # each processing cycle) — a level check, not increase(), is the correct form. Enforce-mode Kyverno
      # blocks bad resources at admission, so a fail/error surfacing in a PolicyReport means either an
      # Audit-mode policy caught something or a background scan found drift; either way it's compliance
      # evidence worth paging on (ADR-013/037).
      - alert: PolicyReportNewViolation
        expr: sum(policy_report_result{status=~"fail|error"}) by (cluster, exported_namespace, policy, severity, source) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PolicyReport violation ({{ $labels.policy }} in {{ $labels.exported_namespace }})"
          description: "{{ $labels.cluster }}/{{ $labels.exported_namespace }}: policy {{ $labels.policy }} ({{ $labels.source }}, severity {{ $labels.severity }}) has had a fail/error PolicyReport result for 15m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#policy-reporter"
      - alert: ClusterPolicyReportNewViolation
        expr: sum(cluster_policy_report_result{status=~"fail|error"}) by (cluster, policy, severity, source) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ClusterPolicyReport violation ({{ $labels.policy }})"
          description: "{{ $labels.cluster }}: cluster-scoped policy {{ $labels.policy }} ({{ $labels.source }}, severity {{ $labels.severity }}) has had a fail/error PolicyReport result for 15m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#policy-reporter"
  # ---------------------------------------------------------------------------
  - name: true-cost.rules
    rules:
      - alert: TrueCostExporterDown
        expr: up{job="true-cost-exporter"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: true-cost-exporter is down
          description: "true-cost-exporter (#668) has been down for 15m — true-cloud-cost (CUR/Athena) metrics and dashboard panels will be stale."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#true-cost-exporter"
      - alert: TrueCostExporterStale
        expr: time() - platform_true_cost_exporter_last_success_timestamp_seconds > 32400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: true-cost-exporter data is stale
          description: "true-cost-exporter's last successful Athena refresh was over 9h ago (it refreshes every 6h) — likely a cross-account AssumeRole or Athena query failure. Check exporter logs."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#true-cost-exporter"
  # ---------------------------------------------------------------------------
  - name: argocd.rules
    rules:
      - alert: ArgoCDComponentDown
        expr: up{job=~"argocd-.*-metrics"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "ArgoCD component down ({{ $labels.job }})"
          description: "An ArgoCD component ({{ $labels.job }}) has been unreachable for 10m — GitOps reconciliation/UI may be impaired."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#argocd"
      - alert: ArgoCDAppDegraded
        expr: argocd_app_info{health_status="Degraded"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ArgoCD app {{ $labels.name }} Degraded"
          description: "ArgoCD application {{ $labels.name }} (project {{ $labels.project }}) has been Degraded for 15m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#argocd"
      - alert: ArgoCDAppOutOfSync
        expr: argocd_app_info{sync_status="OutOfSync"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ArgoCD app {{ $labels.name }} OutOfSync"
          description: "ArgoCD application {{ $labels.name }} has been OutOfSync for 15m — a manual change or a failing auto-sync."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#argocd"
      - alert: ArgoCDRepoServerGitErrors
        # CRITICAL (was warning): a repo the repo-server can't read blinds the WHOLE delivery plane for that
        # repo — manifests can't be generated, so apps silently stop deploying (a 6-day outage 2026-07-02 was
        # exactly this, but warning-severity ⇒ it never paged). See #1120/#1124.
        expr: increase(argocd_git_lsremote_fail_total[15m]) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "ArgoCD git ls-remote failures ({{ $labels.repo }})"
          description: "ArgoCD repo-server is failing git ls-remote against {{ $labels.repo }} — repo connectivity/credentials issue. Manifest generation for apps sourcing this repo is BROKEN; they will not deploy until fixed."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#argocd"
      - alert: ArgoCDAppSyncUnknown
        # The blind spot that hid the 2026-07-02 outage: an app stuck sync=Unknown (a ComparisonError — repo
        # unreadable / manifest gen failing) is NEITHER Synced NOR OutOfSync, so ArgoCDAppOutOfSync misses it,
        # and its live state can stay Healthy so ArgoCDAppDegraded misses it too. for=1h filters the brief
        # Unknown during a normal sync. See #1121/#1124.
        expr: argocd_app_info{sync_status="Unknown"} > 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "ArgoCD app {{ $labels.name }} sync status Unknown"
          description: "ArgoCD application {{ $labels.name }} (project {{ $labels.project }}) has been sync=Unknown for 1h — ArgoCD cannot compare against git (a ComparisonError: unreadable repo, failing manifest generation, or a plugin error), so it is NOT deploying new revisions even while the running pods look Healthy."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#argocd"
  # ---------------------------------------------------------------------------
  - name: loki.rules
    rules:
      - alert: LokiDown
        expr: up{job=~".*loki.*"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Loki is down
          description: "Loki (the log store) has been unreachable for 10m — log ingestion and queries are unavailable."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
      - alert: LokiRequestErrors
        expr: (sum(rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m])) / sum(rate(loki_request_duration_seconds_count[5m]))) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Loki 5xx error ratio > 5%
          description: "More than 5% of Loki requests have returned 5xx over the last 15m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
      - alert: LokiChunkFlushFailures
        expr: increase(loki_ingester_chunks_flush_failures_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Loki chunk flushes to object storage are failing
          description: "Loki ingester chunk flushes to S3 have failed over the last 15m — risk of log loss / WAL backpressure."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
      - alert: LokiPanics
        expr: increase(loki_panic_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Loki is panicking
          description: "Loki has logged panics over the last 10m."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
  # ---------------------------------------------------------------------------
  - name: tempo.rules
    rules:
      - alert: TempoComponentDown
        expr: up{job=~"observability/(distributor|ingester|querier|query-frontend|compactor)"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Tempo component down ({{ $labels.job }})"
          description: "A Tempo component ({{ $labels.job }}) has been unreachable for 10m — trace ingestion or queries may be impaired."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
      - alert: TempoIngesterFlushFailures
        expr: increase(tempo_ingester_failed_flushes_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Tempo ingester flushes to object storage are failing
          description: "Tempo ingester flushes to S3 have failed over the last 15m — risk of trace loss / WAL backpressure."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
      - alert: TempoBackendFlushFailures
        expr: increase(tempo_backend_scheduler_work_flushes_failed_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Tempo backend compaction flushes are failing
          description: "Tempo's backend scheduler has failed work flushes over the last 15m — compaction/backend write issues."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#loki--tempo-stores"
  # ---------------------------------------------------------------------------
  - name: external-secrets.rules
    rules:
      - alert: ExternalSecretNotReady
        # CRITICAL (was warning): a not-Ready ExternalSecret means a K8s Secret has stopped syncing from
        # the backend store — dependent workloads break on the next restart/rotation (auth, DB creds, tokens).
        # Silent-as-warning is how a credential outage hides. See #1120/#1124.
        expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} not Ready"
          description: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has been Ready=False for 15m — the Secrets Manager → K8s sync is failing (downstream secrets go stale)."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#external-secrets"
      - alert: ClusterSecretStoreNotReady
        # CRITICAL (was warning): the store is the source for EVERY ExternalSecret — if it's not Ready, ALL
        # secret syncing is broken cluster-wide, so this is broader than a single ExternalSecret. See #1120/#1124.
        expr: clustersecretstore_status_condition{condition="Ready",status="False"} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "ClusterSecretStore {{ $labels.name }} not Ready"
          description: "ClusterSecretStore {{ $labels.name }} has been Ready=False for 15m — everything that syncs secrets through it is affected."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#external-secrets"
  # ---------------------------------------------------------------------------
  - name: cilium.rules
    rules:
      - alert: CiliumAgentDown
        expr: up{job="observability/cilium-agent"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Cilium agent down ({{ $labels.pod }})"
          description: "A Cilium agent ({{ $labels.pod }}) has been unreachable for 10m — pods on that node lose networking/policy enforcement."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cilium"
      - alert: CiliumOperatorDown
        expr: sum(up{job="observability/cilium-operator"}) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Cilium operator is down
          description: "No Cilium operator has been up for 10m — IPAM, identity GC, and CRD reconciliation are stalled."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cilium"
      - alert: CiliumUnreachableNodes
        expr: cilium_unreachable_nodes > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cilium reports unreachable nodes ({{ $labels.pod }})"
          description: "A Cilium agent ({{ $labels.pod }}) reports unreachable peer nodes for 10m — node-to-node connectivity problem."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cilium"
      - alert: CiliumUnreachableHealthEndpoints
        expr: cilium_unreachable_health_endpoints > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cilium reports unreachable health endpoints ({{ $labels.pod }})"
          description: "A Cilium agent ({{ $labels.pod }}) reports unreachable health endpoints for 10m — pod-to-pod connectivity degradation."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cilium"
      - alert: HubbleDown
        expr: up{job="hubble-metrics"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Hubble metrics down ({{ $labels.pod }})"
          description: "Hubble metrics ({{ $labels.pod }}) have been unreachable for 15m — network flow observability is degraded (networking itself is unaffected)."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cilium"
      - alert: CiliumHighDropRate
        # Excludes "Policy denied" (intended by network policy). Threshold sits well above the steady-state
        # noise (~0.03/s "Unsupported L3 protocol"); >10/s sustained = a real datapath/connectivity problem.
        expr: sum(rate(cilium_drop_count_total{reason!="Policy denied"}[5m])) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: High Cilium packet drop rate (non-policy)
          description: "Cilium is dropping >10 packets/s for non-policy reasons over 15m — a datapath/connectivity problem (policy-denied drops are excluded as expected). Start with `cilium monitor --type drop`."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cilium"

  # Cloud-resource alerts (#102 P5b) — metrics from YACE (CloudWatch → Prometheus). Names are
  # aws_<namespace>_<metric>_<stat> (live-verified).
  - name: cloudwatch.rules
    rules:
      - alert: CloudNLBUnhealthyHosts
        expr: max by (dimension_LoadBalancer, dimension_TargetGroup) (aws_networkelb_un_healthy_host_count_maximum) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "NLB target group has unhealthy hosts ({{ $labels.dimension_TargetGroup }})"
          description: "An AWS NLB target group has reported unhealthy hosts for 15m — the gateway/load-balancer backend is degraded. Check target-group health and the backing pods/nodes."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cloud-resources"
      - alert: CloudNATGatewayPortAllocationErrors
        expr: sum by (dimension_NatGatewayId) (rate(aws_natgateway_error_port_allocation_sum[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "NAT gateway SNAT port-allocation errors ({{ $labels.dimension_NatGatewayId }})"
          description: "A NAT gateway is failing to allocate SNAT source ports for 15m — outbound connections from the VPC are being dropped (port exhaustion). Reduce concurrent connections to a single destination, or add NAT gateways."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cloud-resources"
      - alert: CloudTransitGatewayBlackholeDrops
        expr: sum by (dimension_TransitGateway) (rate(aws_transitgateway_packet_drop_count_blackhole_sum[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Transit Gateway is blackholing packets ({{ $labels.dimension_TransitGateway }})"
          description: "A Transit Gateway has dropped packets to a blackhole route for 15m — cross-account traffic (platform hub ↔ preprod spoke) is hitting a missing or misconfigured TGW route. Check the TGW route tables and VPC attachments."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/observability-alerts.md#cloud-resources"
  # ---------------------------------------------------------------------------
  # Agent-eval capture substrate (ADR-080 D6). Capture-health backstop: if the corpus silently stops
  # growing, the "ready-for-scale" premise quietly fails. Today only the TRIGGER layer is observable — if
  # Alertmanager can't deliver criticals to the triage agent's webhook, the agent receives nothing to triage
  # or capture. The fuller "fixtures captured == 0 while criticals fired" alert lands once the agent emits an
  # agent_eval_fixtures_captured_total counter on the ADR-076 metrics path (see docs/runbooks/agent-operations.md).
  # alertmanager_notifications_* is a kube-prometheus-stack default; confirm present in live Prometheus at
  # rollout (triage is currently the only integration="webhook" receiver).
  - name: agent-eval.rules
    rules:
      - alert: AgentTriageWebhookDeliveryFailing
        expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager can't deliver to the triage agent webhook"
          description: "Alertmanager webhook notifications have failed over the last 15m — the triage copilot is not receiving critical alerts, so it can neither triage nor forward-capture eval fixtures (the corpus silently stops growing). Check the triage-copilot-server Service/pod and the observability→agent NetworkPolicy."
          runbook_url: "https://github.com/asanexample/platform/blob/main/docs/runbooks/agent-operations.md#capture-health"
