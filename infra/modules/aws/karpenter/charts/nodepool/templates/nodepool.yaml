apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [{{ .Values.arch | quote }}]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            {{- range .Values.capacityTypes }}
            - {{ . | quote }}
            {{- end }}
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            {{- range .Values.instanceFamilies }}
            - {{ . | quote }}
            {{- end }}
        {{- if gt (int .Values.minInstanceMemoryMib) 0 }}
        # Floor on node size — the heavy per-node DaemonSet slab (Cilium/Beyla/Alloy/node-exporter) exhausts
        # too-small nodes and the kubelet goes NotReady. Require enough memory headroom.
        - key: karpenter.k8s.aws/instance-memory
          operator: Gt
          values: [{{ .Values.minInstanceMemoryMib | quote }}]
        {{- end }}
        {{- if gt (int .Values.minInstanceCpu) 0 }}
        # CPU floor — the same fixed per-node DaemonSet slab (~410m) is dead weight on every node, so tiny
        # 1-2 vCPU nodes waste 20-43% of their CPU on it and can't fit per-node DaemonSets once packed. Require
        # more vCPU so Karpenter picks fewer, bigger nodes that amortize the overhead (cheaper per usable vCPU).
        - key: karpenter.k8s.aws/instance-cpu
          operator: Gt
          values: [{{ .Values.minInstanceCpu | quote }}]
        {{- end }}
      # BYOCNI: block pods until Cilium is ready on the node; Cilium removes this taint (D5).
      startupTaints:
        - key: {{ .Values.startupTaintKey }}
          effect: NoSchedule
      {{- if .Values.terminationGracePeriod }}
      # Backstop bound (ADR-085): the maximum a node drain waits on blocking PodDisruptionBudgets (or
      # karpenter.sh/do-not-disrupt pods) before Karpenter forcibly drains. A workload PDB can never wedge
      # consolidation / drift / an EKS upgrade longer than this — long enough not to bite a normal drain,
      # short enough that a bad single-replica PDB can't stall node lifecycle indefinitely.
      terminationGracePeriod: {{ .Values.terminationGracePeriod }}
      {{- end }}
  disruption:
    # WhenEmpty (platform, stateful-safe — only reclaims empty nodes) or WhenEmptyOrUnderutilized (preprod).
    consolidationPolicy: {{ .Values.consolidationPolicy }}
    consolidateAfter: {{ .Values.consolidateAfter }}
  # Cost guardrail — Karpenter never provisions past these totals.
  limits:
    cpu: {{ .Values.cpuLimit | quote }}
    memory: {{ .Values.memoryLimit | quote }}
