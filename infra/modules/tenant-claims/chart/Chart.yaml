apiVersion: v2
name: tenant-claims
description: >-
  Renders one Crossplane XTenant claim per entry in .Values.tenants. This is how tenant definitions are
  delivered to the federated Tenant control plane (ADR-046/048) once a team is migrated off teams.hcl (BACK
  stack P3): a thin, git-tracked, declarative claim per team, applied by the tenant-claims Terragrunt unit
  (PlatformDeployer — a platform principal, so it passes the S1 restrict-tenant-control-plane backstop).
type: application
version: 0.1.0
appVersion: "1.0.0"
