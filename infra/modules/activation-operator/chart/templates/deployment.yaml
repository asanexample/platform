apiVersion: apps/v1
kind: Deployment
metadata:
  name: activation-operator
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: activation-operator
    app.kubernetes.io/managed-by: Helm
    control-plane: activation-operator
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: activation-operator
      control-plane: activation-operator
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        # Re-roll the pods whenever the chart (image/flags) changes.
        checksum/chart: {{ .Values.chartChecksum | quote }}
      labels:
        app.kubernetes.io/name: activation-operator
        control-plane: activation-operator
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: {{ .Values.image | quote }}
        command: [/manager]
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        # Controller-runtime reconcile metrics (#1424) — --metrics-secure=false serves plain HTTP, matching
        # every other scraped component in this repo (no bearer-token/RBAC auth plumbing needed for a
        # PodMonitor to read it). The default (secureMetrics=true) would otherwise require a ClusterRole
        # binding + bearer token this platform doesn't wire up anywhere else.
        - --metrics-bind-address=:8080
        - --metrics-secure=false
        - --aws-region={{ .Values.awsRegion }}
        - --sync-period={{ .Values.syncPeriod }}
        {{- if .Values.identityCenterRoleArn }}
        - --identity-center-role-arn={{ .Values.identityCenterRoleArn }}
        {{- end }}
        {{- if .Values.excludeAccountIds }}
        - --exclude-account-ids={{ .Values.excludeAccountIds }}
        {{- end }}
        env:
        - name: OTEL_SERVICE_NAME
          value: activation-operator
        {{- if .Values.otelEndpoint }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otelEndpoint | quote }}
        {{- end }}
        {{- if .Values.auditDbSecret }}
        # Durable governance audit (ADR-088 §3.6) — the directory Postgres DSN, projected from Secrets
        # Manager by the ExternalSecret. Unset = audit disabled (operator still mints/revokes).
        - name: AUDIT_DB_DSN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.auditDbSecret }}
              key: dsn
        {{- end }}
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
