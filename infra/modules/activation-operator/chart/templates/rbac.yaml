apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: activation-operator
    app.kubernetes.io/managed-by: Helm
---
# The operator's cluster permissions — exactly the generated manager-role (operators/activation/config/rbac):
# Activations (full, it owns them), Activation status/finalizers, Events, and READ-ONLY WorkforceRole/Person
# (the governance registry it reads for cap + eligibility). No write to the registries, no other resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: activation-operator-manager
  labels:
    app.kubernetes.io/name: activation-operator
    app.kubernetes.io/managed-by: Helm
rules:
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
- apiGroups: [platform.refplat.org]
  resources: [activations]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [platform.refplat.org]
  resources: [activations/finalizers]
  verbs: [update]
- apiGroups: [platform.refplat.org]
  resources: [activations/status]
  verbs: [get, patch, update]
- apiGroups: [platform.refplat.org]
  resources: [people, workforceroles]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: activation-operator-manager
  labels:
    app.kubernetes.io/name: activation-operator
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: activation-operator-manager
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Values.namespace }}
---
# Leader-election (namespaced) — single active reconciler in the (>=1 replica) Deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: activation-operator-leader-election
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: activation-operator
    app.kubernetes.io/managed-by: Helm
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: activation-operator-leader-election
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: activation-operator
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: activation-operator-leader-election
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Values.namespace }}
{{- if .Values.activatorGroup }}
---
# Sole-creator boundary (ADR-088): ONLY the Activate Power backend may create Activations — so no borrow can
# skip the passkey step-up. The backend reaches the cluster as `{{ .Values.activatorGroup }}` (its Backstage
# pod's EKS access entry, infra/modules/backstage). create + delete (revoke) + patch (extend: stamps the renew
# annotation after a fresh step-up — METADATA only; spec stays immutable via CEL) on Activations, plus read on
# the registries it checks for eligibility. The operator still owns the lifecycle/status.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: activation-creator
  labels:
    app.kubernetes.io/name: activation-operator
    app.kubernetes.io/managed-by: Helm
rules:
- apiGroups: [platform.refplat.org]
  resources: [activations]
  verbs: [create, get, list, watch, delete, patch]
- apiGroups: [platform.refplat.org]
  resources: [people, workforceroles]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: activation-creator
  labels:
    app.kubernetes.io/name: activation-operator
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: activation-creator
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ .Values.activatorGroup }}
{{- end }}
