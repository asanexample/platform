{{- if and .Values.auditDbSecret .Values.auditDbSecretId }}
# Projects the directory Postgres connection string from Secrets Manager into a k8s Secret the operator's
# Deployment reads as AUDIT_DB_DSN (ADR-088 §3.6). The SM secret stores it under `uri`; we expose it as `dsn`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.auditDbSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: activation-operator
    app.kubernetes.io/managed-by: Helm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.auditSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.auditDbSecret }}
    creationPolicy: Owner
  data:
  - secretKey: dsn
    remoteRef:
      key: {{ .Values.auditDbSecretId }}
      property: uri
{{- end }}
