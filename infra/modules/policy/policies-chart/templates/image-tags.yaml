apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Supply Chain, Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Images must use an explicit, immutable tag — never ':latest' and never an untagged reference.
      Phase 3 tightens this to a required digest via cosign mutateDigest.
spec:
  background: true
  failurePolicy: {{ .Values.failurePolicy }}
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- include "kpp.tenantNamespaceSelector" . | nindent 14 }}
      validate:
        failureAction: {{ .Values.validationFailureAction }}
        message: "An explicit image tag is required (untagged images are not allowed)."
        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "*:*"
          - list: request.object.spec.initContainers
            pattern:
              image: "*:*"
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- include "kpp.tenantNamespaceSelector" . | nindent 14 }}
      validate:
        failureAction: {{ .Values.validationFailureAction }}
        message: "Using the ':latest' tag is not allowed; pin an immutable version."
        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "!*:latest"
          - list: request.object.spec.initContainers
            pattern:
              image: "!*:latest"
