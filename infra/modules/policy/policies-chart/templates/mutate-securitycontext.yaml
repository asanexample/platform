{{- if .Values.enableMutateDefaults }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-securitycontext
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Default Hardened securityContext
    policies.kyverno.io/category: Security, Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Adds a safe default securityContext to tenant containers when one is not already set
      (allowPrivilegeEscalation=false, drop ALL capabilities, seccompProfile=RuntimeDefault). Uses
      add-if-absent so it never overrides an explicit choice. runAsNonRoot is intentionally left to
      the workload (forcing it crashes root images) — enforced for regulated tiers via
      require-pod-security-restricted. Paired with the disallow-privilege-escalation / require-seccomp
      validate backstops.
spec:
  # Mutations fail open: a best-effort default must never block admission (validation is separate).
  failurePolicy: Ignore
  rules:
    - name: add-default-securitycontext
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- include "kpp.tenantNamespaceSelector" . | nindent 14 }}
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "?*"
                securityContext:
                  +(allowPrivilegeEscalation): false
                  +(seccompProfile):
                    type: RuntimeDefault
                  +(capabilities):
                    drop:
                      - ALL
            initContainers:
              - (name): "?*"
                securityContext:
                  +(allowPrivilegeEscalation): false
                  +(seccompProfile):
                    type: RuntimeDefault
                  +(capabilities):
                    drop:
                      - ALL
{{- end }}
