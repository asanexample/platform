apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-irsa-annotation-cross-team
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Disallow Tenant IRSA Annotation
    policies.kyverno.io/category: Security, Multi-Tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ServiceAccount
    policies.kyverno.io/description: >-
      Tenants must not annotate a ServiceAccount with eks.amazonaws.com/role-arn. No per-team
      workload IRSA roles exist yet (#64); until they do, any IRSA annotation in a tenant namespace
      is a cross-team privilege-escalation vector and is denied. When #64 lands, the allow-list
      becomes the team's own role-ARN pattern.
spec:
  background: true
  failurePolicy: {{ .Values.failurePolicy }}
  rules:
    - name: deny-irsa-annotation
      match:
        any:
          - resources:
              kinds:
                - ServiceAccount
              {{- include "kpp.tenantNamespaceSelector" . | nindent 14 }}
      validate:
        failureAction: {{ .Values.validationFailureAction }}
        message: "Tenant ServiceAccounts may not carry an eks.amazonaws.com/role-arn annotation (IRSA is not yet available to tenants — see #64)."
        deny:
          conditions:
            any:
              - key: "{{`{{ request.object.metadata.annotations.\"eks.amazonaws.com/role-arn\" || '' }}`}}"
                operator: NotEquals
                value: ""
