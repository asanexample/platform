apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-irsa-annotation-cross-team
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Disallow Tenant IRSA Annotation
    policies.kyverno.io/category: Security, Multi-Tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ServiceAccount
    policies.kyverno.io/description: >-
      Tenant workloads get AWS access via platform-managed EKS Pod Identity (an association binding a
      specific namespace+ServiceAccount to the team's role — ADR-041), NOT via IRSA. The
      eks.amazonaws.com/role-arn annotation is therefore never needed in a tenant namespace, and a
      forged annotation is a cross-team privilege-escalation vector — so it stays denied (a backstop;
      Pod Identity does not use this annotation).
spec:
  background: true
  failurePolicy: {{ .Values.failurePolicy }}
  rules:
    - name: deny-irsa-annotation
      match:
        any:
          - resources:
              kinds:
                - ServiceAccount
              {{- include "kpp.tenantNamespaceSelector" . | nindent 14 }}
      validate:
        failureAction: {{ .Values.validationFailureAction }}
        message: "Tenant ServiceAccounts may not carry an eks.amazonaws.com/role-arn annotation — tenant AWS access is via platform-managed EKS Pod Identity, not IRSA (ADR-041)."
        deny:
          conditions:
            any:
              - key: "{{`{{ request.object.metadata.annotations.\"eks.amazonaws.com/role-arn\" || '' }}`}}"
                operator: NotEquals
                value: ""
