{{- if .Values.enableMutateDefaults }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-pod-defaults
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Default Hardened Pod securityContext + automount
    policies.kyverno.io/category: Security, Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Adds safe defaults to environment pods when not already set: a hardened container securityContext
      (allowPrivilegeEscalation=false, drop ALL capabilities, seccompProfile=RuntimeDefault) and
      automountServiceAccountToken=false. add-if-absent so it never overrides an explicit choice.
      runAsNonRoot is intentionally left to the workload (forcing it crashes root images) — enforced
      for regulated tiers via require-pod-security-restricted. Paired with the
      disallow-privilege-escalation / require-seccomp validate backstops. (securityContext and
      automount share one patch so the strategic-merge type resolves correctly under autogen.)
spec:
  # Mutations fail open: a best-effort default must never block admission (validation is separate).
  failurePolicy: Ignore
  rules:
    - name: add-pod-defaults
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- include "kpp.environmentNamespaceSelector" . | nindent 14 }}
      mutate:
        patchStrategicMerge:
          spec:
            +(automountServiceAccountToken): false
            containers:
              - (name): "?*"
                securityContext:
                  +(allowPrivilegeEscalation): false
                  +(seccompProfile):
                    type: RuntimeDefault
                  +(capabilities):
                    drop:
                      - ALL
            initContainers:
              - (name): "?*"
                securityContext:
                  +(allowPrivilegeEscalation): false
                  +(seccompProfile):
                    type: RuntimeDefault
                  +(capabilities):
                    drop:
                      - ALL
{{- end }}
