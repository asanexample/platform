{{- if .Values.allowedRegistries }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Restrict Image Registries (environment floor)
    policies.kyverno.io/category: Supply Chain, Multi-Tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Environment workloads may only run images from approved registries (the platform ECR). Closes the
      ADR-014 image-provenance gap and complements per-team ECR push isolation (#60).
spec:
  background: true
  failurePolicy: {{ .Values.failurePolicy }}
  rules:
    - name: validate-registry
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- include "kpp.environmentNamespaceSelector" . | nindent 14 }}
      {{- if .Values.platformTrustNamespaceLabel }}
      # Platform-trust exemption (ADR-081 amendment 2026-07-11): a platform-OWNED Team's Environment is exempt
      # from the platform-ECR-only floor so it may co-locate an infra image (e.g. CNPG Postgres). The marker is
      # set ONLY by the Environment Composition and ONLY for a platform-trust Team, so a tenant cannot acquire
      # it. Inert unless a namespace actually carries the label — no tenant namespace ever does.
      exclude:
        any:
          - resources:
              namespaceSelector:
                matchExpressions:
                  - key: {{ .Values.platformTrustNamespaceLabel }}
                    operator: Exists
      {{- end }}
      validate:
        failureAction: {{ .Values.validationFailureAction }}
        message: >-
          Image registry not allowed. Environment images must come from one of:
          {{ join ", " .Values.allowedRegistries }}.
        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "{{ include "kpp.registryPatterns" . }}"
          - list: request.object.spec.initContainers
            pattern:
              image: "{{ include "kpp.registryPatterns" . }}"
          - list: request.object.spec.ephemeralContainers
            pattern:
              image: "{{ include "kpp.registryPatterns" . }}"
{{- end }}
