{{- if .Values.allowedRegistries }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Restrict Image Registries (tenant floor)
    policies.kyverno.io/category: Supply Chain, Multi-Tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Tenant workloads may only run images from approved registries (the platform ECR). Closes the
      ADR-014 image-provenance gap and complements per-team ECR push isolation (#60).
spec:
  background: true
  failurePolicy: {{ .Values.failurePolicy }}
  rules:
    - name: validate-registry
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- include "kpp.tenantNamespaceSelector" . | nindent 14 }}
      validate:
        failureAction: {{ .Values.validationFailureAction }}
        message: >-
          Image registry not allowed. Tenant images must come from one of:
          {{ join ", " .Values.allowedRegistries }}.
        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "{{ include "kpp.registryPatterns" . }}"
          - list: request.object.spec.initContainers
            pattern:
              image: "{{ include "kpp.registryPatterns" . }}"
          - list: request.object.spec.ephemeralContainers
            pattern:
              image: "{{ include "kpp.registryPatterns" . }}"
{{- end }}
{{- range $team, $prefix := .Values.tenantRegistryMap }}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-images-team-{{ $team }}
  labels:
    {{- include "kpp.labels" $ | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Restrict Images — team-{{ $team }}
    policies.kyverno.io/category: Multi-Tenancy, Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Workloads in namespace team-{{ $team }} may only run images under {{ $prefix }} — a runtime
      complement to per-team ECR push isolation (#60), preventing one team from running another
      team's images.
spec:
  background: true
  failurePolicy: {{ $.Values.failurePolicy }}
  rules:
    - name: only-own-team-images
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - team-{{ $team }}
      validate:
        failureAction: {{ $.Values.validationFailureAction }}
        message: "team-{{ $team }} workloads may only run images under {{ $prefix }}."
        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "{{ $prefix }}/*"
          - list: request.object.spec.initContainers
            pattern:
              image: "{{ $prefix }}/*"
          - list: request.object.spec.ephemeralContainers
            pattern:
              image: "{{ $prefix }}/*"
{{- end }}
