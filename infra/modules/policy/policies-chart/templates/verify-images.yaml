{{- if .Values.enableImageVerification }}
{{- range $team, $idents := .Values.verifySubjects }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-images-team-{{ $team }}
  labels:
    {{- include "kpp.labels" $ | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Verify Image Signatures — team-{{ $team }}
    policies.kyverno.io/category: Supply Chain, Multi-Tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Admits only images in team-{{ $team }} that are cosign-signed (keyless) by app-{{ $team }}'s
      own GitHub Actions workflows. Per-team identity — a signature from another team's workflow does
      not satisfy this policy (supply-chain analog of per-team registry isolation). mutateDigest pins
      admitted images to their digest.
spec:
  # verifyImages honors the spec-level action; webhookTimeout covers signature fetch + Rekor lookup.
  # Uses its OWN action/failurePolicy so verification can be Audit while other policies are Enforce.
  validationFailureAction: {{ $.Values.verifyFailureAction }}
  webhookTimeoutSeconds: 30
  failurePolicy: {{ $.Values.verifyFailurePolicy }}
  background: false
  rules:
    - name: verify-signed
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - team-{{ $team }}
      verifyImages:
        - imageReferences:
            - "{{ index $.Values.tenantRegistryMap $team }}/*"
          # Kyverno forbids mutation in Audit mode — only pin to digest once we Enforce.
          mutateDigest: {{ eq $.Values.verifyFailureAction "Enforce" }}
          verifyDigest: true
          required: true
          attestors:
            # count:1 — admitting any ONE matching identity. Multiple identities (deploy+preview per
            # org, and old+new org during a signing-identity transition) are all listed as alternatives.
            - count: 1
              entries:
                {{- range $idents }}
                # Stable deploys — pinned to the main-branch deploy workflow identity.
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: "{{ .deploy_subject }}"
                    rekor:
                      url: "{{ $.Values.rekorUrl }}"
                # PR previews — the OIDC ref varies per PR, so match the preview workflow by regexp.
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subjectRegExp: "{{ .preview_subject_regexp }}"
                    rekor:
                      url: "{{ $.Values.rekorUrl }}"
                {{- end }}
                {{- $sharedRepo := index $.Values.sharedSignerCallerRepos $team }}
                {{- if $sharedRepo }}
                # Shared trusted-ci build-sign reusable workflow — same cert SUBJECT for every team; the
                # per-team gate is the githubWorkflowRepository extension (= the CALLER app repo, which
                # Fulcio sets from the calling repo's OIDC, so another team cannot forge it). Listed as an
                # additional count:1 alternative so a team can be on the shared signer, its own app-signed
                # identity (above), or both. squote: the anchored regex has backslash escapes.
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subjectRegExp: {{ $.Values.trustedCiBuildSubjectRegExp | squote }}
                    additionalExtensions:
                      githubWorkflowRepository: {{ $sharedRepo | quote }}
                    rekor:
                      url: "{{ $.Values.rekorUrl }}"
                {{- end }}
---
{{- end }}
{{- end }}
