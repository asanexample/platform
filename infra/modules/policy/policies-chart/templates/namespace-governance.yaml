apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-default-namespace
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Disallow Default Namespace
    policies.kyverno.io/category: Best Practices, Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod, Workloads
    policies.kyverno.io/description: >-
      Workloads must run in a tenant namespace (<team>-<name>-<env>), never the default namespace.
      Cluster-scoped; platform controllers are skipped via the principal allow-list (the shared Gateway
      lives in default and is platform-managed).
spec:
  # background: false — references request.userInfo.username (platform-principal skip), disallowed in
  # background scanning. Admission-only is correct for default-namespace creation.
  background: false
  failurePolicy: {{ .Values.failurePolicy }}
  rules:
    - name: no-workloads-in-default
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
                - ReplicaSet
                - Job
                - CronJob
              namespaces:
                - default
      {{- include "kpp.skipPlatformPrincipals" . | nindent 6 }}
      validate:
        failureAction: {{ .Values.validationFailureAction }}
        message: "Running workloads in the default namespace is not allowed; use your tenant namespace (<team>-<name>-<env>)."
        deny: {}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-tenant-namespace-naming
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Require Tenant Namespace Naming
    policies.kyverno.io/category: Operational Excellence, Multi-Tenancy
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Namespaces marked as tenants must follow the v2 <team>-<name>-<env> naming convention (Tenant API v2,
      ADR-049): the env suffix is the promotion stage, so a team's stages can co-locate without collision.
spec:
  background: true
  failurePolicy: {{ .Values.failurePolicy }}
  rules:
    - name: tenant-namespace-name
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchExpressions:
                  - key: {{ .Values.tenantNamespaceLabel }}
                    operator: Exists
      validate:
        failureAction: {{ .Values.validationFailureAction }}
        message: "Tenant namespaces must be named <team>-<name>-<env> (env one of dev|test|uat|staging|prod)."
        anyPattern:
          - metadata:
              name: "*-*-dev"
          - metadata:
              name: "*-*-test"
          - metadata:
              name: "*-*-uat"
          - metadata:
              name: "*-*-staging"
          - metadata:
              name: "*-*-prod"
