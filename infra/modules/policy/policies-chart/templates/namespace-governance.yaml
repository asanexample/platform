apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-default-namespace
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Disallow Default Namespace
    policies.kyverno.io/category: Best Practices, Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod, Workloads
    policies.kyverno.io/description: >-
      Workloads must run in an environment namespace (<team>-<product>-<stage>), never the default namespace.
      Cluster-scoped; platform controllers are skipped via the principal allow-list (the shared Gateway
      lives in default and is platform-managed).
spec:
  # background: false — references request.userInfo.username (platform-principal skip), disallowed in
  # background scanning. Admission-only is correct for default-namespace creation.
  background: false
  failurePolicy: {{ .Values.failurePolicy }}
  rules:
    - name: no-workloads-in-default
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
                - ReplicaSet
                - Job
                - CronJob
              namespaces:
                - default
      {{- include "kpp.skipPlatformPrincipals" . | nindent 6 }}
      validate:
        failureAction: {{ .Values.validationFailureAction }}
        message: "Running workloads in the default namespace is not allowed; use your environment namespace (<team>-<product>-<stage>)."
        deny: {}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-environment-namespace-naming
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Require Environment Namespace Naming
    policies.kyverno.io/category: Operational Excellence, Multi-Tenancy
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Namespaces marked as environments must follow the <team>-<product>-<stage> naming convention (ADR-067;
      per-customer is <team>-<product>-<customer>-<stage>): the suffix is the promotion stage, so a team's
      stages can co-locate without collision.
spec:
  background: true
  failurePolicy: {{ .Values.failurePolicy }}
  rules:
    - name: environment-namespace-name
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchExpressions:
                  - key: {{ .Values.environmentNamespaceLabel }}
                    operator: Exists
      # Platform-agent runtime namespaces (ADR-082, platform-agent-<name>) carry the team label — so the per-product
      # cosign verify-images policy applies — but are NOT tenant environments, so they don't follow the
      # <team>-<product>-<stage> naming. Exclude them from this tenant-naming guard (no-op on workload clusters,
      # which host no platform agents).
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  platform.refplat.org/runtime: platform-agent
      validate:
        failureAction: {{ .Values.validationFailureAction }}
        # v3 (ADR-067): Environment namespaces are <team>-<product>-<stage> or, per-customer,
        # <team>-<product>-<customer>-<stage> — so the name always ends with -<stage>.
        message: "Environment namespaces are <team>-<product>-<stage> (or <team>-<product>-<customer>-<stage>) and must end with a stage (dev|test|uat|staging|prod)."
        anyPattern:
          - metadata:
              name: "*-dev"
          - metadata:
              name: "*-test"
          - metadata:
              name: "*-uat"
          - metadata:
              name: "*-staging"
          - metadata:
              name: "*-prod"
