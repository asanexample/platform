{{- if .Values.enableCleanup }}
apiVersion: kyverno.io/v2
kind: ClusterCleanupPolicy
metadata:
  name: cleanup-finished-cronjob-jobs
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Cleanup Finished CronJob Jobs
    policies.kyverno.io/category: Cost, Operational Excellence
    policies.kyverno.io/description: >-
      Reaps finished Jobs spawned by CronJobs in tenant namespaces. Scoped to CronJob-owned Jobs so it
      never deletes a Git-declared/ArgoCD-managed Job (which selfHeal would recreate → re-run loop).
      Tenant namespaces only — never system/infra Jobs.
spec:
  match:
    any:
      - resources:
          kinds:
            - Job
          namespaceSelector:
            matchExpressions:
              - key: {{ .Values.tenantNamespaceLabel }}
                operator: Exists
  conditions:
    all:
      # Owned by a CronJob (not Git/ArgoCD-managed).
      - key: "{{`{{ length(target.metadata.ownerReferences[?kind=='CronJob']) }}`}}"
        operator: GreaterThanOrEquals
        value: 1
      # Finished (has a completion time).
      - key: "{{`{{ target.status.completionTime || '' }}`}}"
        operator: NotEquals
        value: ""
  schedule: "0 * * * *"
{{- end }}
