{{- if .Values.enableHttprouteGuard }}
{{- range $team, $patterns := .Values.tenantHostnamePatterns }}
{{- if $patterns }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-route-hostnames-team-{{ $team }}
  labels:
    {{- include "kpp.labels" $ | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Restrict Route Hostnames — team-{{ $team }}
    policies.kyverno.io/category: Multi-Tenancy, Networking
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: HTTPRoute
    policies.kyverno.io/description: >-
      Gateway API routes in team-{{ $team }} may only claim hostnames in this team's allow-list,
      preventing hostname squatting on the shared wildcard listener (ADR-029). Cross-team or platform
      hostnames are denied — the ingress analog of per-team image/registry isolation. Covers
      HTTPRoute/GRPCRoute/TLSRoute (all carry hostnames).
spec:
  background: true
  failurePolicy: {{ $.Values.failurePolicy }}
  rules:
    - name: require-hostnames
      match:
        any:
          - resources:
              kinds:
                - HTTPRoute
                - GRPCRoute
                - TLSRoute
              namespaces:
                - team-{{ $team }}
      validate:
        failureAction: {{ $.Values.validationFailureAction }}
        message: "Routes must declare at least one hostname (an empty list claims the listener wildcard)."
        pattern:
          spec:
            hostnames:
              - "?*"
    - name: allowed-hostnames
      match:
        any:
          - resources:
              kinds:
                - HTTPRoute
                - GRPCRoute
                - TLSRoute
              namespaces:
                - team-{{ $team }}
      validate:
        failureAction: {{ $.Values.validationFailureAction }}
        message: "team-{{ $team }} routes may only use hostnames: {{ join ", " $patterns }}."
        foreach:
          - list: request.object.spec.hostnames
            deny:
              conditions:
                all:
                  - key: "{{`{{ element }}`}}"
                    operator: AnyNotIn
                    value: {{ toJson $patterns }}
---
{{- end }}
{{- end }}
{{- end }}
