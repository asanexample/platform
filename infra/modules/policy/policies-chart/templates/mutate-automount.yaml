{{- if .Values.enableMutateDefaults }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-automount
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Default automountServiceAccountToken false
    policies.kyverno.io/category: Security, Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Sets automountServiceAccountToken=false on tenant pods when not specified (least privilege —
      most workloads don't talk to the API server). add-if-absent: a workload that needs the token
      sets it true explicitly. Satisfies restrict-automount-sa-token automatically.
spec:
  failurePolicy: Ignore
  rules:
    - name: default-automount-false
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- include "kpp.tenantNamespaceSelector" . | nindent 14 }}
      mutate:
        patchStrategicMerge:
          spec:
            +(automountServiceAccountToken): false
{{- end }}
