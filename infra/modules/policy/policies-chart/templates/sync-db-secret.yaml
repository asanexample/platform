{{- if .Values.enableDbSecretSync }}
{{- /*
  Cross-namespace DB credential sync (ADR-099 Flagship; ADR-081 platform-service delivery).

  A stateful platform Product runs its APP in an Environment namespace (delivered by the per-Product
  ApplicationSet) but its CNPG DATABASE in a dedicated platform-database namespace — a database is an
  operator-managed, API-watching workload that does not belong inside the tenant sandbox. Kubernetes
  `secretKeyRef` cannot cross namespaces, so the app Deployment cannot read the CNPG-generated
  `<cluster>-app` connection Secret directly. This policy clones that Secret from the DB namespace into
  the app's Environment namespace:
    - synchronize: true    → propagates CNPG password rotation and reconciles/GCs the copy if edited.
    - generateExisting: true → back-fills the copy for a database that already exists when this lands
                               (not only on the next secret write).

  RBAC is deliberately NAMESPACE-SCOPED (a Role/RoleBinding per source + target namespace, below) rather
  than an aggregated cluster-wide secrets grant to the background controller. The copy authority is
  confined to exactly the declared namespace pairs, so Kyverno never gains standing read on every Secret
  in the cluster — the cross-tenant-boundary action stays as narrow as the mechanism allows.
*/}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-platform-db-secret
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Sync platform DB credential into the app Environment namespace
    policies.kyverno.io/category: Platform Services
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      For a stateful platform Product whose app runs in an Environment namespace and whose CNPG database
      runs in a separate platform-database namespace, clones the CNPG-generated app credential Secret into
      the app namespace (secretKeyRef cannot cross namespaces). synchronize keeps it current on rotation;
      generateExisting back-fills the already-provisioned database. Namespace pairs are declared per binding.
spec:
  # generate runs in the background controller; it does not gate admission.
  background: true
  generateExisting: true
  rules:
  {{- range .Values.dbSecretSyncBindings }}
    - name: sync-{{ .name }}
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - {{ .secretName | quote }}
              namespaces:
                - {{ .sourceNamespace | quote }}
              # Defence-in-depth: the source must be a genuine platform-database namespace, so a mis-entered
              # binding can never clone a tenant (or any other) Secret out of an arbitrary namespace.
              namespaceSelector:
                matchLabels:
                  platform.refplat.org/runtime: platform-database
      generate:
        apiVersion: v1
        kind: Secret
        name: {{ .secretName | quote }}
        namespace: {{ .targetNamespace | quote }}
        synchronize: true
        clone:
          namespace: {{ .sourceNamespace | quote }}
          name: {{ .secretName | quote }}
  {{- end }}
{{- /*
  RBAC — the controllers must READ the source Secret and WRITE the clone. Both grants are CLUSTER-SCOPED and
  bound by explicit ClusterRoleBindings, for two INDEPENDENT reasons.

  READ (get/list/watch on Secrets) MUST be cluster-wide: with generateExisting, Kyverno's PolicyController
  enumerates trigger Secrets via a CLUSTER-SCOPED list (it does not push the rule's namespace filter into the
  list call), and the clone reads the source. A namespace-scoped Role cannot satisfy a cluster-scoped list.
  This is READ ONLY and not a real trust expansion — Kyverno's admission webhooks already observe every Secret.

  WRITE (create/update/patch/delete) also cannot be namespace-scoped here — but for an ORDERING reason, not a
  list-scope one. The target Environment namespace and the platform-database source namespace are created far
  DOWNSTREAM of this policy unit (by Crossplane / ArgoCD delivery); a namespace-scoped Role cannot be
  materialised eagerly against a namespace that does not yet exist, so a from-scratch bootstrap fails with
  "namespaces not found". WRITE is therefore a cluster-scoped ClusterRole — the same shape the generate-pdb
  policy uses for its own downstream-namespace resources — kept as tight as RBAC verbs allow: `create` cannot
  be name-scoped (the object does not exist yet), but Kyverno only ever creates the exact Secret its generate
  rule names, so that capability is bounded by the ClusterPolicy above rather than by RBAC; `update`/`patch`/
  `delete` ARE pinned by resourceNames to the declared cloned Secret(s), so Kyverno can reconcile/rotate/relabel
  those and modify no other Secret cluster-wide. Both controller SAs are bound (background performs the clone +
  back-fill; admission runs the pre-flight generate authz check + applies synchronize on the trigger). Explicit
  ClusterRoleBindings, not aggregation labels: the admission pre-flight authz check runs SYNCHRONOUSLY at policy
  admission, but aggregated ClusterRoles are reconciled ASYNCHRONOUSLY by kube-controller-manager — an
  aggregation label would race the policy admission.
*/}}
{{- $kyvernoNs := .Values.kyvernoNamespace | default "kyverno" }}
{{- $kyvernoControllers := list "kyverno-admission-controller" "kyverno-background-controller" }}
{{- $root := . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:sync-db-secret-read
  labels:
    {{- include "kpp.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
# Bound with an explicit ClusterRoleBinding rather than Kyverno's aggregate-to-*-controller labels: Kyverno's
# pre-flight generate authz check runs SYNCHRONOUSLY when the ClusterPolicy is admitted, but aggregated
# ClusterRoles are reconciled into the controller role ASYNCHRONOUSLY by kube-controller-manager — so an
# aggregation label races the policy admission. A direct binding is effective immediately.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno:sync-db-secret-read
  labels:
    {{- include "kpp.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno:sync-db-secret-read
subjects:
  {{- range $sa := $kyvernoControllers }}
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kyvernoNs }}
  {{- end }}
{{- /* Distinct cloned Secret names — pins the WRITE update/patch/delete grant by resourceNames. */}}
{{- $writeSecretNames := list }}
{{- range .Values.dbSecretSyncBindings }}
{{- $writeSecretNames = append $writeSecretNames .secretName }}
{{- end }}
{{- $writeSecretNames = $writeSecretNames | uniq }}
---
# Cluster-scoped WRITE. Not aggregated (see the RBAC note above — aggregation races the admission pre-flight
# authz check); bound directly to both controller SAs so it is effective the instant the policy is admitted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:sync-db-secret-write
  labels:
    {{- include "kpp.labels" $root | nindent 4 }}
rules:
  # create cannot be resourceName-scoped (the object does not exist yet). Kyverno only ever creates the exact
  # Secret its generate rule names, so the capability is bounded by the ClusterPolicy above, not by RBAC.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # reconcile/rotate the clone + stamp the synchronize tracking label on the source — pinned by name to the
  # declared cloned Secret(s), so Kyverno can modify no other Secret cluster-wide.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ range $i, $n := $writeSecretNames }}{{ if $i }}, {{ end }}{{ $n | quote }}{{ end }}]
    verbs: ["update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno:sync-db-secret-write
  labels:
    {{- include "kpp.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno:sync-db-secret-write
subjects:
  {{- range $sa := $kyvernoControllers }}
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kyvernoNs }}
  {{- end }}
{{- end }}
