{{- if .Values.enableDbSecretSync }}
{{- /*
  Cross-namespace DB credential sync (ADR-099 Flagship; ADR-081 platform-service delivery).

  A stateful platform Product runs its APP in an Environment namespace (delivered by the per-Product
  ApplicationSet) but its CNPG DATABASE in a dedicated platform-database namespace — a database is an
  operator-managed, API-watching workload that does not belong inside the tenant sandbox. Kubernetes
  `secretKeyRef` cannot cross namespaces, so the app Deployment cannot read the CNPG-generated
  `<cluster>-app` connection Secret directly. This policy clones that Secret from the DB namespace into
  the app's Environment namespace:
    - synchronize: true    → propagates CNPG password rotation and reconciles/GCs the copy if edited.
    - generateExisting: true → back-fills the copy for a database that already exists when this lands
                               (not only on the next secret write).

  RBAC is deliberately NAMESPACE-SCOPED (a Role/RoleBinding per source + target namespace, below) rather
  than an aggregated cluster-wide secrets grant to the background controller. The copy authority is
  confined to exactly the declared namespace pairs, so Kyverno never gains standing read on every Secret
  in the cluster — the cross-tenant-boundary action stays as narrow as the mechanism allows.
*/}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-platform-db-secret
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Sync platform DB credential into the app Environment namespace
    policies.kyverno.io/category: Platform Services
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      For a stateful platform Product whose app runs in an Environment namespace and whose CNPG database
      runs in a separate platform-database namespace, clones the CNPG-generated app credential Secret into
      the app namespace (secretKeyRef cannot cross namespaces). synchronize keeps it current on rotation;
      generateExisting back-fills the already-provisioned database. Namespace pairs are declared per binding.
spec:
  # generate runs in the background controller; it does not gate admission.
  background: true
  generateExisting: true
  rules:
  {{- range .Values.dbSecretSyncBindings }}
    - name: sync-{{ .name }}
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - {{ .secretName | quote }}
              namespaces:
                - {{ .sourceNamespace | quote }}
              # Defence-in-depth: the source must be a genuine platform-database namespace, so a mis-entered
              # binding can never clone a tenant (or any other) Secret out of an arbitrary namespace.
              namespaceSelector:
                matchLabels:
                  platform.refplat.org/runtime: platform-database
      generate:
        apiVersion: v1
        kind: Secret
        name: {{ .secretName | quote }}
        namespace: {{ .targetNamespace | quote }}
        synchronize: true
        clone:
          namespace: {{ .sourceNamespace | quote }}
          name: {{ .secretName | quote }}
  {{- end }}
{{- /*
  RBAC — split READ from WRITE so the dangerous capability stays confined.

  READ (get/list/watch on Secrets) MUST be cluster-wide: with generateExisting, Kyverno's PolicyController
  enumerates trigger Secrets via a CLUSTER-SCOPED list (it does not push the rule's namespace filter into the
  list call), and the clone reads the source. A namespace-scoped Role cannot satisfy a cluster-scoped list —
  so this is granted via a ClusterRole aggregated into the admission + background controllers. This is an
  acceptable grant and NOT a real trust expansion: Kyverno's admission webhooks already observe every Secret
  in the cluster, and it is READ ONLY.

  WRITE (create/update/patch/delete) is the capability that actually matters — the power to inject or
  overwrite a Secret in a namespace. It is deliberately NOT cluster-wide: each target namespace gets a
  namespace-scoped Role, so Kyverno can materialise the cloned copy ONLY where a binding declares it and
  nowhere else. Both controller SAs are bound (the background controller performs the clone + back-fill; the
  admission controller runs the pre-flight generate authz check + applies synchronize on the trigger).
*/}}
{{- $kyvernoNs := .Values.kyvernoNamespace | default "kyverno" }}
{{- $kyvernoControllers := list "kyverno-admission-controller" "kyverno-background-controller" }}
{{- $root := . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:sync-db-secret-read
  labels:
    {{- include "kpp.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
# Bound with an explicit ClusterRoleBinding rather than Kyverno's aggregate-to-*-controller labels: Kyverno's
# pre-flight generate authz check runs SYNCHRONOUSLY when the ClusterPolicy is admitted, but aggregated
# ClusterRoles are reconciled into the controller role ASYNCHRONOUSLY by kube-controller-manager — so an
# aggregation label races the policy admission. A direct binding is effective immediately.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno:sync-db-secret-read
  labels:
    {{- include "kpp.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno:sync-db-secret-read
subjects:
  {{- range $sa := $kyvernoControllers }}
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kyvernoNs }}
  {{- end }}
{{- range .Values.dbSecretSyncBindings }}
---
# Source-namespace WRITE, scoped to the ONE source Secret. Kyverno's clone stamps a tracking label onto the
# SOURCE Secret so synchronize can watch it and propagate CNPG password rotation to the copy; that needs
# update/patch on the source. resourceNames pins it to exactly the cloned Secret — Kyverno can relabel only
# flagship-db-app, no other Secret in the platform-database namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno:sync-db-secret-source-{{ .name }}
  namespace: {{ .sourceNamespace | quote }}
  labels:
    {{- include "kpp.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .secretName | quote }}]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno:sync-db-secret-source-{{ .name }}
  namespace: {{ .sourceNamespace | quote }}
  labels:
    {{- include "kpp.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno:sync-db-secret-source-{{ .name }}
subjects:
  {{- range $sa := $kyvernoControllers }}
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kyvernoNs }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno:sync-db-secret-write-{{ .name }}
  namespace: {{ .targetNamespace | quote }}
  labels:
    {{- include "kpp.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # WRITE only — cluster-wide READ is granted by kyverno:sync-db-secret-read above.
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno:sync-db-secret-write-{{ .name }}
  namespace: {{ .targetNamespace | quote }}
  labels:
    {{- include "kpp.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno:sync-db-secret-write-{{ .name }}
subjects:
  {{- range $sa := $kyvernoControllers }}
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kyvernoNs }}
  {{- end }}
{{- end }}
{{- end }}
