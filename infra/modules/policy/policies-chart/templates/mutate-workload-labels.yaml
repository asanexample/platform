{{- if .Values.enableMutateDefaults }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-workload-labels
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Default Workload Labels
    policies.kyverno.io/category: Operational Excellence, Cost
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Adds the `team` cost-allocation/identity label when absent (the environment key, derived from the
      `team-<key>[-<env>]` namespace name — robust to multi-namespace environments). Makes the team-label
      requirement self-satisfying so apps need no label boilerplate. add-if-absent: never overrides an
      app's labels. (app.kubernetes.io/name can't be derived under autogen — pod templates have no
      name — so it is left to the app; it is no longer required by require-workload-labels.)
spec:
  failurePolicy: Ignore
  rules:
    - name: add-default-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
              {{- include "kpp.environmentNamespaceSelector" . | nindent 14 }}
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              +(team): "{{`{{ split(request.namespace, '-')[1] }}`}}"
{{- end }}
