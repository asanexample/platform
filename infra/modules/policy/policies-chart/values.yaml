# Defaults are overridden by the Terraform module (terraform.tfvars-equivalent via helm_release
# values). They exist here so `helm template` works standalone (e.g. for kyverno CLI tests).

# Audit (record PolicyReport, admit) or Enforce (reject at admission).
validationFailureAction: Audit
# Generated-webhook failure policy: Ignore (fail-open, used during Audit) or Fail (fail-closed).
failurePolicy: Ignore
# Compliance tier: standard | hipaa | pci. Restricted-grade pod policies render only for hipaa/pci.
complianceTier: standard

# Cluster-wide (tenant-namespace) image registry allow-list, e.g. the platform ECR host.
allowedRegistries: []
# tenant key -> allowed image prefix for that tenant's team-<key> namespace.
tenantRegistryMap: {}

# Infra namespaces excluded from tenant-targeted and cluster-scoped policies.
excludeNamespaces:
  - kube-system
  - kube-node-lease
  - kube-public
  - kyverno
  - cert-manager
  - external-secrets
  - external-dns
  - argocd
  - tailscale

# Requesting-principal (userInfo.username) wildcards skipped by cluster-scoped policies so platform
# controllers can reconcile addons.
excludePrincipals:
  - "system:serviceaccount:argocd:*"
  - "system:serviceaccount:kube-system:*"
  - "system:nodes:*"
  - "system:kube-controller-manager"

# Namespace label marking tenant namespaces. Tenant-targeted policies match on its presence.
tenantNamespaceLabel: platform.refplat.org/tenant

# Labels every tenant workload must carry (team identity + cost allocation).
requiredWorkloadLabels:
  - app.kubernetes.io/name
  - team

# Deploy the mutate policies (safe-default securityContext / automount / labels) on tenant workloads.
enableMutateDefaults: true

# Deploy per-team verifyImages policies (cosign keyless). Requires signed images + Kyverno ECR IRSA.
enableImageVerification: false
# verifyImages action/failurePolicy — independent so verification rolls Audit-first under Enforce.
verifyFailureAction: Audit
verifyFailurePolicy: Ignore
# tenant -> { deploy_subject, preview_subject_regexp } cosign keyless identities (from teams.hcl).
verifySubjects: {}
rekorUrl: https://rekor.sigstore.dev

# Per-team Gateway-API route hostname guard (anti-squatting). tenant -> [allowed hostname patterns].
enableHttprouteGuard: true
tenantHostnamePatterns: {}
# Reap finished CronJob-spawned Jobs in tenant namespaces.
enableCleanup: true

# Raw ClusterPolicy YAML injected verbatim (ADR-014 escape hatch). name -> manifest string.
additionalPolicies: {}

# Common labels stamped on every ClusterPolicy.
commonLabels: {}
