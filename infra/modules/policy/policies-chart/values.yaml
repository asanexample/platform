# Defaults are overridden by the Terraform module (terraform.tfvars-equivalent via helm_release
# values). They exist here so `helm template` works standalone (e.g. for kyverno CLI tests).

# Audit (record PolicyReport, admit) or Enforce (reject at admission).
validationFailureAction: Audit
# Generated-webhook failure policy: Ignore (fail-open, used during Audit) or Fail (fail-closed).
failurePolicy: Ignore
# Compliance tier: standard | hipaa | pci. Restricted-grade pod policies render only for hipaa/pci.
complianceTier: standard

# Cluster-wide (environment-namespace) image registry allow-list, e.g. the platform ECR host.
allowedRegistries: []
# environment key -> allowed image prefix for that environment's team-<key> namespace.
tenantRegistryMap: {}

# Infra namespaces excluded from environment-targeted and cluster-scoped policies.
excludeNamespaces:
  - kube-system
  - kube-node-lease
  - kube-public
  - kyverno
  - cert-manager
  - external-secrets
  - external-dns
  - argocd
  - tailscale

# Requesting-principal (userInfo.username) wildcards skipped by cluster-scoped policies so platform
# controllers can reconcile addons.
excludePrincipals:
  - "system:serviceaccount:argocd:*"
  - "system:serviceaccount:kube-system:*"
  - "system:nodes:*"
  - "system:kube-controller-manager"

# Namespace label marking environment namespaces. Environment-targeted policies match on its presence.
environmentNamespaceLabel: platform.refplat.org/team

# Labels every environment workload must carry (team identity + cost allocation).
requiredWorkloadLabels:
  - app.kubernetes.io/name
  - team

# Deploy the mutate policies (safe-default securityContext / automount / labels) on environment workloads.
enableMutateDefaults: true

# Generate a default PodDisruptionBudget (maxUnavailable=1) per environment Deployment/StatefulSet (ADR-085).
# Also installs the ClusterRole that lets Kyverno's background controller create/sync the PDBs.
enablePdbGenerate: true

# Inject topologySpreadConstraints (zone + node) on environment Deployments/StatefulSets when absent, with a
# labelSelector derived from the workload's own selector (ADR-085). Soft (ScheduleAnyway); add-if-absent.
enableTopologySpread: true

# Require >=2 replicas on prod-stage environment workloads (ADR-085). Dedicated failureAction so it rolls
# Audit-first even where the cluster-wide validationFailureAction is Enforce; flip to Enforce after review.
enableReplicaFloor: true
replicaFloorFailureAction: Audit

# Also match the Argo Rollouts `Rollout` kind in the availability policies (ADR-056). Default false because a
# Kyverno rule naming a kind whose CRD is absent fails to create (#7839) — flip to true per cluster ONLY after
# the argo-rollouts unit (CRDs) is applied there. When all workloads are Rollouts, the PDB/topology/replica-floor
# guarantees follow them; pod-level policies already cover Rollout pods via ReplicaSet autogen.
enableRolloutKind: false

# Deploy per-team verifyImages policies (cosign keyless). Requires signed images + Kyverno ECR IRSA.
enableImageVerification: false
# verifyImages action/failurePolicy — independent so verification rolls Audit-first under Enforce.
verifyFailureAction: Audit
verifyFailurePolicy: Ignore
# environment -> [ { deploy_subject, preview_subject_regexp } ] cosign keyless identities (from teams.hcl).
# A LIST per environment: count:1 attestor admits any one. 2+ entries support a zero-downtime signing-
# identity transition (accept old+new org identities until images are re-signed, then drop the old).
verifySubjects: {}

# v3 (ADR-069 §6): per-PRODUCT signature trust. Map "<team>-<product>" -> { team, product, registryPrefix
# (<registry>/team-<team>/<product>), repo (the Product repo, gates githubWorkflowRepository), appSubjects? }.
# Empty = inert (the per-team verifySubjects above is the live path until the v3 cutover).
verifySubjectsProduct: {}
rekorUrl: https://rekor.sigstore.dev

# Isolated build provenance (SLSA Build L3, #131/ADR-042). For teams in attestCallerRepos the SLSA
# provenance attestation in verify-attestations must be signed by the trusted-ci reusable workflow
# (gated per-team by the cert's githubWorkflowRepository extension) instead of the app's own workflow;
# teams absent keep app-signed provenance. attestCallerRepos: environment -> "<org>/app-<team>" (only teams
# using isolated provenance; empty = every team keeps app-signed provenance).
trustedCiSubjectRegExp: '^https://github\.com/asanexample/trusted-ci/\.github/workflows/slsa-provenance\.yml@.+$'
attestCallerRepos: {}

# Shared build-sign reusable workflow (asanexample/trusted-ci/build-sign.yml — the thin-caller supply-chain
# abstraction). For teams in sharedSignerCallerRepos, verify-images AND the verify-attestations SBOM ALSO
# accept this shared identity (subject = trustedCiBuildSubjectRegExp), gated per-team by the cert's
# githubWorkflowRepository extension (= the app repo), in addition to the team's own app-signed identity.
# sharedSignerCallerRepos: environment -> "<org>/app-<team>" (empty = every team is app-signed only).
trustedCiBuildSubjectRegExp: '^https://github\.com/asanexample/trusted-ci/\.github/workflows/build-sign\.yml@.+$'
sharedSignerCallerRepos: {}

# Per-team Gateway-API route hostname guard (anti-squatting). environment -> [allowed hostname patterns].
enableHttprouteGuard: true
tenantHostnamePatterns: {}
# Reap finished CronJob-spawned Jobs in environment namespaces.
enableCleanup: true

# Raw ClusterPolicy YAML injected verbatim (ADR-014 escape hatch). name -> manifest string.
additionalPolicies: {}

# Common labels stamped on every ClusterPolicy.
commonLabels: {}
