apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-policies
# Policies are Helm-templated; run.sh renders them to rendered/policies.yaml first.
policies:
  - rendered/policies.yaml
resources:
  - resources/workloads.yaml
  - resources/serviceaccount.yaml
  - resources/service.yaml
  - resources/securitycontext.yaml
  - resources/httproutes.yaml
  - resources/replica-floor.yaml
variables: values.yaml
results:
  # --- compliant workload passes every environment Pod policy ---
  - policy: restrict-image-registries
    rule: validate-registry
    kind: Pod
    resources: [good-app]
    result: pass
  - policy: disallow-latest-tag
    rule: disallow-latest-tag
    kind: Pod
    resources: [good-app]
    result: pass
  - policy: require-requests-limits
    rule: validate-resources
    kind: Pod
    resources: [good-app]
    result: pass
  - policy: require-pod-probes
    rule: validate-probes
    kind: Pod
    resources: [good-app]
    result: pass
  - policy: restrict-automount-sa-token
    rule: validate-automount
    kind: Pod
    resources: [good-app]
    result: pass
  - policy: require-workload-labels
    rule: require-labels
    kind: Pod
    resources: [good-app]
    result: pass
  # --- violations are caught ---
  - policy: restrict-image-registries
    rule: validate-registry
    kind: Pod
    resources: [foreign-app]
    result: fail
  - policy: disallow-latest-tag
    rule: disallow-latest-tag
    kind: Pod
    resources: [latest-app]
    result: fail
  - policy: require-requests-limits
    rule: validate-resources
    kind: Pod
    resources: [greedy-app]
    result: fail
  - policy: disallow-irsa-annotation-cross-team
    rule: deny-irsa-annotation
    kind: ServiceAccount
    resources: [sneaky-sa]
    result: fail
  - policy: disallow-irsa-annotation-cross-team
    rule: deny-irsa-annotation
    kind: ServiceAccount
    resources: [app-alpha] # Pod Identity shape (named SA, no annotation) is admitted
    result: pass
  - policy: block-public-loadbalancer
    rule: deny-lb-nodeport
    kind: Service
    resources: [public-svc]
    result: fail
  # --- Phase 2 validate backstops ---
  - policy: disallow-privilege-escalation
    rule: deny-privilege-escalation
    kind: Pod
    resources: [privesc-app]
    result: fail
  - policy: require-seccomp
    rule: deny-unconfined-seccomp-containers
    kind: Pod
    resources: [unconfined-app]
    result: fail
  - policy: disallow-privilege-escalation
    rule: deny-privilege-escalation
    kind: Pod
    resources: [good-app]
    result: pass
  - policy: require-seccomp
    rule: deny-unconfined-seccomp-containers
    kind: Pod
    resources: [good-app]
    result: pass
  # --- Availability: prod replica floor (ADR-085) ---
  - policy: require-prod-replica-floor
    rule: validate-prod-replicas
    kind: Deployment
    resources: [prod-ha] # >= 2 replicas in a prod namespace
    result: pass
  - policy: require-prod-replica-floor
    rule: validate-prod-replicas
    kind: Deployment
    resources: [prod-single] # single replica in a prod namespace
    result: fail
  - policy: require-prod-replica-floor
    rule: validate-prod-replicas
    kind: Deployment
    resources: [dev-single] # not prod-stage -> policy does not match
    result: skip
  # ADR-056: the replica floor also covers Argo Rollouts (enableRolloutKind=true in the render).
  - policy: require-prod-replica-floor
    rule: validate-prod-replicas
    kind: Rollout
    resources: [rollout-prod-ha] # >= 2 replicas
    result: pass
  - policy: require-prod-replica-floor
    rule: validate-prod-replicas
    kind: Rollout
    resources: [rollout-prod-single] # single replica
    result: fail
  # NB the per-team restrict-images-team-* and restrict-route-hostnames-team-* policies moved to the Crossplane
  # Composition (product-scoped, per-Environment) at the v3 cutover (ADR-067) — they no longer render from this
  # chart, so their assertions were removed here. That coverage now lives in the Composition render test
  # (infra/modules/crossplane/.environment-api-tests/render.sh: restrict-images team-alpha/demo-* + restrict-route-hostnames).
