# Compliant tenant Deployment for team-alpha. Satisfies every Enforce validate policy:
# team-scoped ECR image + immutable tag, requests AND limits, liveness AND readiness probes.
# securityContext / automountServiceAccountToken / the `team` label are intentionally omitted — the
# mutate policies inject them (this proves the shift-left render matches the cluster's mutate behaviour).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: team-alpha
  labels:
    app.kubernetes.io/name: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
    spec:
      serviceAccountName: demo
      containers:
        - name: app
          image: 829808296602.dkr.ecr.us-east-1.amazonaws.com/team-alpha/demo:v1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
