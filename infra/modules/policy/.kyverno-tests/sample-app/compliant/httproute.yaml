# The app ships a PLACEHOLDER host — the platform injects the real derived host at deploy (argocd-apps,
# ADR-060/061) and the shift-left injects the same (<app>-<team>.<base>) before validating, so this passes
# the route hostname guard. Never hardcode the real host here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: team-alpha
  labels:
    app.kubernetes.io/name: demo
spec:
  parentRefs:
    - name: preprod-gateway
      namespace: default
  hostnames:
    - placeholder.invalid
  rules:
    - backendRefs:
        - name: demo
          port: 80
