# Hostname is in team-alpha's allow-list (teams.hcl hostnames) — passes the route hostname guard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: team-alpha
  labels:
    app.kubernetes.io/name: demo
spec:
  parentRefs:
    - name: preprod-gateway
      namespace: default
  hostnames:
    - demo.preprod.aws.refplat.org
  rules:
    - backendRefs:
        - name: demo
          port: 80
