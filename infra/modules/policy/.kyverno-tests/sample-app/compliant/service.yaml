# ClusterIP only — ingress is via the shared Gateway/HTTPRoute (LoadBalancer/NodePort are denied).
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: team-alpha
  labels:
    app.kubernetes.io/name: demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: demo
  ports:
    - port: 80
      targetPort: 8080
