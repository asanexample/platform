# Deliberately non-compliant — every line below trips a different Enforce policy. Used to prove the
# shift-left gate FAILS the PR before merge (the same violations admission would reject in-cluster).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: team-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
    spec:
      containers:
        - name: app
          # Violations: not the team's ECR registry; cross-team scope; and a mutable :latest tag.
          image: docker.io/library/nginx:latest
          # Violation: no resource requests/limits.
          # Violation: no liveness/readiness probes.
          ports:
            - containerPort: 80
