# Allowed hostname (in team-alpha's list) -> passes the hostname guard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: good-route
  namespace: team-alpha
spec:
  parentRefs:
    - name: preprod-gateway
      namespace: default
  hostnames:
    - demo.preprod.aws.refplat.org
  rules:
    - backendRefs:
        - name: app-alpha
          port: 80
---
# Squats a platform hostname (not in team-alpha's list) -> fails allowed-hostnames.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: squat-route
  namespace: team-alpha
spec:
  parentRefs:
    - name: preprod-gateway
      namespace: default
  hostnames:
    - argocd.preprod.aws.refplat.org
  rules:
    - backendRefs:
        - name: app-alpha
          port: 80
---
# No hostnames -> would claim the listener wildcard -> fails require-hostnames.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: empty-route
  namespace: team-alpha
spec:
  parentRefs:
    - name: preprod-gateway
      namespace: default
  rules:
    - backendRefs:
        - name: app-alpha
          port: 80
