# Environment ServiceAccount carrying an IRSA annotation — fails disallow-irsa-annotation-cross-team.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sneaky-sa
  namespace: team-alpha
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::620830101009:role/DeveloperAccess-bravo
---
# The intended Pod Identity shape: a named ServiceAccount with NO role-arn annotation. AWS access comes
# from a platform-managed Pod Identity association (ADR-041), not the annotation — so this is admitted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-alpha
  namespace: team-alpha
  labels:
    app.kubernetes.io/name: app-alpha
