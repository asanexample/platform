# A deliberately bare environment Deployment (no securityContext/automount/labels) — used by run.sh to
# smoke-test that the mutate policies inject their defaults via Kyverno autogen WITHOUT error
# (a bare Pod doesn't exercise the autogen path that real workloads hit).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bare-app
  namespace: team-alpha
spec:
  selector:
    matchLabels:
      app: bare-app
  template:
    metadata:
      labels:
        app: bare-app
    spec:
      containers:
        - name: app
          image: 829808296602.dkr.ecr.us-east-1.amazonaws.com/team-alpha/demo:1.0.0
