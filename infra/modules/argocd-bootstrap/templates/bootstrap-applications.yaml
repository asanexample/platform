%{ for app in applications ~}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${app.name}
  namespace: ${namespace}
  %{ if app.sync_wave != 0 ~}
  annotations:
    argocd.argoproj.io/sync-wave: "${app.sync_wave}"
  %{ endif ~}
spec:
  project: ${project}
  %{ if app.chart != "" ~}
  source:
    repoURL: ${app.repo_url}
    chart: ${app.chart}
    targetRevision: ${app.target_revision}
    %{ if length(app.helm_values) > 0 ~}
    helm:
      values: |
        %{ for key, val in app.helm_values ~}
        ${key}: ${val}
        %{ endfor ~}
    %{ endif ~}
  %{ else ~}
  source:
    repoURL: ${app.repo_url}
    targetRevision: ${app.target_revision}
    path: ${app.path}
  %{ endif ~}
  destination:
    server: ${server}
    namespace: ${app.namespace}
  syncPolicy:
    automated:
      prune: ${app.prune}
      selfHeal: ${app.self_heal}
    syncOptions:
      - CreateNamespace=true
%{ endfor ~} 