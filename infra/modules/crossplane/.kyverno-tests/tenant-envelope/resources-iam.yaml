# policystatements-no-escalation (ADR-062 §4, #282). All use Team alpha within its envelope (env preprod,
# tier standard, quota under cap) so ONLY the IAM rule can flag — isolating its verdict. Compliant statements
# admit; escalation/wildcard actions are flagged (incl. case-evasion IAM:* and subsumption sts:*).
apiVersion: platform.refplat.org/v1alpha2
kind: XTenant
metadata: { name: iamok }
spec:
  team: alpha
  name: a
  environment: preprod
  tier: standard
  residency: { allowedLocations: ["*"] }
  quota: { cpu: "4", memory: 8Gi, pods: 20 }
  apps:
    web:
      repo: asanexample/app-alpha
      serviceAccount: app-alpha
      permissions:
        aws:
          policyStatements:
            - sid: ReadBucket
              actions: ["s3:GetObject", "s3:ListBucket"]
              resources: ["arn:aws:s3:::team-alpha-*/*"]
---
# No permissions block at all — must admit (the foreach over an absent list is a no-op).
apiVersion: platform.refplat.org/v1alpha2
kind: XTenant
metadata: { name: iamnoperm }
spec:
  team: alpha
  name: a
  environment: preprod
  tier: standard
  residency: { allowedLocations: ["*"] }
  quota: { cpu: "4", memory: 8Gi, pods: 20 }
  apps:
    web: { repo: asanexample/app-alpha, serviceAccount: app-alpha }
---
# iam:* escalation — flagged.
apiVersion: platform.refplat.org/v1alpha2
kind: XTenant
metadata: { name: iambad }
spec:
  team: alpha
  name: a
  environment: preprod
  tier: standard
  residency: { allowedLocations: ["*"] }
  quota: { cpu: "4", memory: 8Gi, pods: 20 }
  apps:
    web:
      repo: asanexample/app-alpha
      serviceAccount: app-alpha
      permissions:
        aws:
          policyStatements:
            - actions: ["iam:CreateUser"]
              resources: ["*"]
---
# Case-evasion (AWS treats actions case-insensitively) — flagged.
apiVersion: platform.refplat.org/v1alpha2
kind: XTenant
metadata: { name: iamcase }
spec:
  team: alpha
  name: a
  environment: preprod
  tier: standard
  residency: { allowedLocations: ["*"] }
  quota: { cpu: "4", memory: 8Gi, pods: 20 }
  apps:
    web:
      repo: asanexample/app-alpha
      serviceAccount: app-alpha
      permissions:
        aws:
          policyStatements:
            - actions: ["IAM:PassRole"]
              resources: ["*"]
---
# sts:* subsumes AssumeRole — flagged (service-prefix match, not a fragile glob).
apiVersion: platform.refplat.org/v1alpha2
kind: XTenant
metadata: { name: iamsts }
spec:
  team: alpha
  name: a
  environment: preprod
  tier: standard
  residency: { allowedLocations: ["*"] }
  quota: { cpu: "4", memory: 8Gi, pods: 20 }
  apps:
    web:
      repo: asanexample/app-alpha
      serviceAccount: app-alpha
      permissions:
        aws:
          policyStatements:
            - actions: ["sts:*"]
              resources: ["*"]
---
# Bare admin wildcard — flagged (prefix '*' set-wildcard-matches a sensitive service).
apiVersion: platform.refplat.org/v1alpha2
kind: XTenant
metadata: { name: iamstar }
spec:
  team: alpha
  name: a
  environment: preprod
  tier: standard
  residency: { allowedLocations: ["*"] }
  quota: { cpu: "4", memory: 8Gi, pods: 20 }
  apps:
    web:
      repo: asanexample/app-alpha
      serviceAccount: app-alpha
      permissions:
        aws:
          policyStatements:
            - actions: ["*"]
              resources: ["*"]
---
# Cross-app evasion: app a is clean, app b hides an escalation — flagged (foreach flattens all apps).
apiVersion: platform.refplat.org/v1alpha2
kind: XTenant
metadata: { name: iammulti }
spec:
  team: alpha
  name: a
  environment: preprod
  tier: standard
  residency: { allowedLocations: ["*"] }
  quota: { cpu: "4", memory: 8Gi, pods: 20 }
  apps:
    a:
      repo: asanexample/app-alpha
      serviceAccount: app-alpha
      permissions: { aws: { policyStatements: [{ actions: ["s3:GetObject"], resources: ["*"] }] } }
    b:
      repo: asanexample/app-alpha
      serviceAccount: app-alpha-b
      permissions: { aws: { policyStatements: [{ actions: ["organizations:ListAccounts"], resources: ["*"] }] } }
