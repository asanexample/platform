# Team alpha envelope (tiers [standard], stages [dev,prod], loc [*], quota 8/16Gi/40) + Product alpha-demo
# (owned by alpha, pooled). Both mocked as the apiCall responses (ktp.envContext: team + product).
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
metadata: { name: values }
globalValues:
  team:
    metadata: { name: alpha }
    spec:
      envelope:
        allowedTiers: ["standard"]
        allowedStages: ["dev", "prod"]
        allowedLocations: ["*"]
        quotaCap: { cpu: "8", memory: "16Gi", pods: 40 }
      # ordinary tenant team — empty platform-trust allowlist (CRD-defaulted []), so any cluster-role request is denied
      platformTrust: { clusterRoles: [] }
  product:
    metadata: { name: alpha-demo }
    spec:
      team: alpha
      tenancy: pooled
