apiVersion: platform.refplat.org/v1beta1
kind: XAgent
metadata:
  name: triage-copilot
spec:
  team: platform
  product: triage-copilot
  placement: { cluster: platform }
  model: { provider: bedrock, id: us.anthropic.claude-sonnet-4-6 }
  obsRead: true
  awsPermissions:
    policyStatements:
      - sid: ReadAgentBucket
        actions: ["s3:GetObject", "s3:ListBucket"]
        resources: ["arn:aws:s3:::platform-agent-*"]
