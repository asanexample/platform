# Projected Team for team-alpha — the envelope that admits its translated tenant (tier standard, preprod).
apiVersion: platform.refplat.org/v1alpha2
kind: Team
metadata:
  name: alpha
spec:
  ssoGroup: Dev-alpha
  envelope:
    allowedTiers: [standard]
    allowedEnvironments: [preprod]
    quotaCap: { cpu: "8", memory: 16Gi, pods: 40 }
