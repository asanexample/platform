# team-bravo, translated from the live v1alpha1 claim (gitops/tenant-claims/preprod/bravo.yaml) to v1alpha2.
apiVersion: platform.refplat.org/v1alpha2
kind: XTenant
metadata:
  name: bravo-demo-dev
spec:
  team: bravo
  name: demo
  environment: dev
  tier: standard
  # No `domains` — the generated host demo-bravo.preprod.aws.refplat.org (<app>-<team>) is implicit.
  apps:
    demo:
      repo: asanexample/app-bravo # owner/repo
      repoPath: k8s/preprod
      preview: false
      serviceAccount: app-bravo
  developerAccess:
    enabled: true
