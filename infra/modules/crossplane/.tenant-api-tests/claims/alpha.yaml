# team-alpha, translated from the live v1alpha1 claim (gitops/tenant-claims/preprod/alpha.yaml) to v1alpha2.
# The v1 `team: alpha` + app `demo` becomes Team alpha → Tenant "demo" (preprod); per-app identity moves onto
# the app entry. Used to prove the v2 schema accepts today's real tenants.
apiVersion: platform.refplat.org/v1alpha2
kind: XTenant
metadata:
  name: alpha-demo-preprod
spec:
  team: alpha
  name: demo
  environment: preprod
  tier: standard
  # No `domains` — the generated host demo-alpha.preprod.aws.refplat.org (<app>-<team>) is implicit; declare
  # spec.domains only for an ADDITIONAL vanity alias (ADR-061). Matches the live v1alpha1 claim (no domains).
  apps:
    demo:
      repo: asanexample/app-alpha # owner/repo (the Step-2 consumer-derivation format)
      repoPath: k8s/preprod
      preview: true
      serviceAccount: app-alpha
  developerAccess:
    enabled: true
