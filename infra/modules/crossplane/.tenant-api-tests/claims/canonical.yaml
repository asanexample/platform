# Canonical v1alpha2 Tenant — exercises every field incl. the reserved dimensions + the dedicated/customer
# CEL rule. Mirrors the example in docs/architecture/tenant-api-v2.md.
apiVersion: platform.refplat.org/v1alpha2
kind: XTenant
metadata:
  name: payments-payments-api-prod
spec:
  team: payments
  name: payments-api
  environment: prod
  tier: pci
  tenancy:
    mode: dedicated
    customer: bigbank
  residency:
    allowedLocations: ["eu"]
  quota:
    cpu: "8"
    memory: 16Gi
    pods: 40
  # External custom alias (not under our wildcard) — exercises the tier-3 status.domains=Pending path (ADR-061).
  domains:
    - host: bigbank.payments.example.com
      canonical: true
      dns: external
  apps:
    api:
      repo: asanexample/payments-api
      repoPath: k8s/prod
      preview: false
      serviceAccount: payments-api
      permissions:
        aws:
          policyStatements:
            - sid: ReadCustomerBucket
              effect: Allow
              actions: ["s3:GetObject"]
              resources: ["arn:aws:s3:::asanexample-team-payments-*/*"]
  developerAccess:
    enabled: true
    group: payments-pci-oncall
  encryption:
    keyCustody: customer-managed
  lifecycle:
    phase: active
  dataServices:
    db:
      kind: relational
      engine: postgres
      class: prod
      serviceAccount: payments-api
