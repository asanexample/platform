# The projected WorkforceRole CR — the role catalog (identity strategy §2.2 / #887), the reach×power grid
# that says what each workforce role IS: its power, its risk tier, the AWS permission set it maps to, and its
# session-duration cap.
#
# A plain, cluster-scoped, data-only CRD — NOT a Crossplane composite: it provisions nothing. It is the
# in-cluster mirror of gitops/roles/*.yaml, written onto the cluster by the model-as-code sync (the `roles`
# ArgoCD Application; never by developers) so in-cluster controllers can read the catalog at runtime. The
# Terraform IC/Keycloak generators keep reading the SAME git files; this CRD is a parallel READ-ONLY projection
# (git is the source of truth — ArgoCD prune/selfHeal reconciles any manual edit away), exactly like the Team CR.
#
# First consumer: the ADR-088 temporary-power activation operator, which reads spec.identityCenter.sessionDuration
# (the borrow-duration CAP) and spec.identityCenter.permissionSet (the AWS target) — replacing its bootstrap
# --role-permission-sets flag. spec.mode (on-demand ⇒ borrowable) and spec.riskTier (⇒ step-up strength) inform
# activation policy without a separate CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workforceroles.platform.refplat.org
spec:
  group: platform.refplat.org
  scope: Cluster
  names:
    kind: WorkforceRole
    plural: workforceroles
    singular: workforcerole
    shortNames:
      - wfrole
    categories:
      - environment-api
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - reach
                - power
                - mode
                - riskTier
              properties:
                reach:
                  type: string
                  description: The breadth a grant of this role targets — a single team, the whole platform, or either.
                  enum: ["team", "platform", "any"]
                power:
                  type: string
                  description: What the role can do, weakest→strongest.
                  enum: ["look", "operate", "change", "manage-access"]
                mode:
                  type: string
                  description: standing = held all the time; on-demand = borrowed via activation (ADR-088).
                  enum: ["standing", "on-demand"]
                riskTier:
                  type: string
                  description: Insider-risk weight — drives step-up strength and review bar.
                  enum: ["standard", "elevated", "apex"]
                description:
                  type: string
                identityCenter:
                  type: object
                  description: AWS Identity Center projection — the permission set and the session-duration cap.
                  properties:
                    perTeam:
                      type: boolean
                    permissionSet:
                      type: string
                      description: AWS permission set name (e.g. AdministratorAccess); the activation target.
                    sessionDuration:
                      type: string
                      description: ISO-8601 duration (e.g. PT1H, PT4H) — the borrow-duration ceiling.
                    managedPolicies:
                      type: array
                      items: { type: string }
                    note:
                      type: string
                keycloak:
                  type: object
                  description: Keycloak (app-access) projection.
                  properties:
                    realmRole:
                      type: string
                    perTeamGroup:
                      type: boolean
                    group:
                      type: string
      additionalPrinterColumns:
        - name: Power
          type: string
          jsonPath: .spec.power
        - name: Reach
          type: string
          jsonPath: .spec.reach
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Risk
          type: string
          jsonPath: .spec.riskTier
        - name: Cap
          type: string
          jsonPath: .spec.identityCenter.sessionDuration
