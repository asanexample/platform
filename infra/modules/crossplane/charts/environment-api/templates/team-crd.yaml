# The projected Team CR (ADR-049, docs/architecture/tenant-api-v2.md — "Object 1, Projected Team CR").
#
# A plain, cluster-scoped, data-only CRD — NOT a Crossplane composite: it provisions nothing. It is the
# minimal, admission-relevant mirror of a Team's envelope, written onto each cluster by the model-as-code
# sync (delivery-plan A2; never by developers) so Kyverno can read it during XEnvironment admission to enforce
# "...and only within your Team's envelope" (the envelope plane, ADR-067). The canonical Team record (displayName,
# developerGroup, costCenter, contacts) lives in the registry/Backstage — only the envelope subset is
# projected here. Status is written by the report-first rollup controller (aggregate checks).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: teams.platform.refplat.org
spec:
  group: platform.refplat.org
  scope: Cluster
  names:
    kind: Team
    plural: teams
    singular: team
    categories:
      - environment-api
  versions:
    # v1beta1 — the envelope (ADR-067): allowedStages, maxDedicatedIsolation {cluster, account},
    # maxCrossTeamGrantsPerProduct (ADR-068). The sole version since the v3 cutover (v1alpha2 XTenant-era
    # Team removed). Kyverno's restrict-environment-envelope reads it at this version.
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - ssoGroup
                - envelope
              properties:
                ssoGroup:
                  type: string
                  description: The upstream IdP / Keycloak group this Team maps to (root of both authz planes).
                envelope:
                  type: object
                  description: The bound on every Product/Environment the Team may author.
                  required:
                    - allowedTiers
                    - allowedStages
                    - quotaCap
                  properties:
                    allowedTiers:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        enum: ["standard", "elevated", "pci", "hipaa"]
                    allowedStages:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        enum: ["dev", "test", "uat", "staging", "prod"]
                    allowedLocations:
                      type: array
                      items:
                        type: string
                      default: ["*"]
                    quotaCap:
                      type: object
                      properties:
                        cpu: { type: string }
                        memory: { type: string }
                        pods: { type: integer }
                    maxDedicatedIsolation:
                      type: object
                      description: How many Environments may dial to the expensive isolation rungs. 0 = pooled namespace/nodes only.
                      default: { cluster: 0, account: 0 }
                      properties:
                        cluster: { type: integer, default: 0, minimum: 0 }
                        account: { type: integer, default: 0, minimum: 0 }
                    maxCrossTeamGrantsPerProduct:
                      type: integer
                      description: Cap on active inbound AccessGrants per Product (ADR-068 §9 sprawl backstop).
                      default: 10
                      minimum: 0
                    resources:
                      type: object
                      description: >-
                        Self-service cloud-resource bound (ADR-073). DEFAULT-DENY — a Team with no resources
                        envelope (or an empty allowedEngines) may provision NOTHING; only listed engines, up to
                        maxPerEnvironment per Environment, at or above the isolationFloor.
                      default: { allowedEngines: [], maxPerEnvironment: 0, isolationFloor: shared }
                      properties:
                        allowedEngines:
                          type: array
                          description: Engines the Team may declare (e.g. s3, sqs, sns, dynamodb). Empty/absent = none allowed.
                          default: []
                          items:
                            type: string
                            enum: ["s3", "sqs", "sns", "dynamodb"]
                        maxPerEnvironment:
                          type: integer
                          description: Max self-service resources per Environment (count cap; cost backstop).
                          default: 0
                          minimum: 0
                        isolationFloor:
                          type: string
                          description: Lowest data-isolation rung the Team may request for a resource.
                          enum: ["shared", "dedicated"]
                          default: shared
                platformTrust:
                  type: object
                  description: >-
                    Platform-trust envelope (ADR-081) — capabilities reserved for platform-OWNED Teams that
                    tenants cannot request. Empty {} for ordinary teams. Changes are approval-gated like roles
                    (Teams Gate). Two grants: cluster-scoped read RBAC, and IAM actions outside the
                    policyStatements deny-set.
                  default: {}
                  properties:
                    clusterRoles:
                      type: array
                      default: [] # so the Kyverno subset-check reads [] (not null) for ordinary teams
                      description: >-
                        Names of pre-created, platform-labeled ClusterRoles the Composition binds (via a
                        ClusterRoleBinding) to this Team's environment SA group — for the cross-namespace reads
                        tenants don't get (e.g. an observability agent reading pods/Applications cluster-wide).
                      items: { type: string }
                    allowedIamActions:
                      type: array
                      description: >-
                        IAM actions a Service's permissions.aws.policyStatements may use despite the deny-set
                        (platform-only), e.g. bedrock:InvokeModel. Enforced by Kyverno restrict-environment-envelope.
                      items: { type: string }
                slack:
                  type: object
                  description: >-
                    The Team's Slack identity for incident routing (ADR-084 D6). Optional, non-PII config —
                    a Team without a channel falls back to the central incident channel. The owner-resolution
                    floor: the triage agent posts a Team's incidents into spec.slack.channel.
                  properties:
                    channel:
                      type: string
                      description: >-
                        Incident channel — a name (#team-platform) or id (C…). The agent's bot must be invited
                        to it; on not_in_channel it falls back to the central channel.
                    userGroup:
                      type: string
                      description: Slack user-group handle for whole-team @mention. Reserved for paid Slack; unused today.
                pagerduty:
                  type: object
                  description: >-
                    PagerDuty pointer for live on-call resolution (ADR-084 D7) — a pointer, never people.
                    Consumed in Phase 2. Empty {} when the Team has no PagerDuty.
                  default: {}
                  properties:
                    escalationPolicyId:
                      type: string
                      description: Escalation policy id (P…). The resolver queries /oncalls against it for the live on-call.
                oncall:
                  type: object
                  description: >-
                    Static accountable contacts (ADR-084 D7 fallback) — GitHub logins, used when PagerDuty is
                    unconfigured/unreachable. Informational for now.
                  default: {}
                  properties:
                    primary:
                      type: array
                      items: { type: string }
                      default: []
                    fallback:
                      type: array
                      items: { type: string }
                      default: []
            status:
              type: object
              properties:
                productCount: { type: integer }
                environmentCount: { type: integer }
                dedicatedIsolationInUse:
                  type: object
                  properties:
                    cluster: { type: integer }
                    account: { type: integer }
      additionalPrinterColumns:
        - name: SSO Group
          type: string
          jsonPath: .spec.ssoGroup
        - name: Stages
          type: string
          jsonPath: .spec.envelope.allowedStages
        - name: Environments
          type: integer
          jsonPath: .status.environmentCount
