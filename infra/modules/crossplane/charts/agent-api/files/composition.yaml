# Agent Composition (Crossplane v2, Pipeline mode) — ADR-082, the runtime side of ADR-074.
#
# Renders an XAgent into its runtime SLOT on the hub: namespace platform-agent-<name>, a named ServiceAccount,
# a least-privilege EKS Pod Identity (the model's Bedrock data-plane grant + deny-set-validated awsPermissions,
# permissions-boundary-capped), and — when obsRead — a ClusterRoleBinding of platform-trust-observability-reader
# to the agent's SA. The agent's WORKLOAD (Deployment/Service) is delivered separately by ArgoCD with the signed,
# promoted digest (ADR-071); this Composition does NOT render it.
#
# Shipped raw (.Files.Get) so Helm leaves the go-template delimiters intact. Render-tested with `crossplane render`.
# Sibling of the tenant environment Composition; mirrors its provider-kubernetes Object + provider-aws Role/
# PodIdentityAssociation/RolePolicy patterns, but agent-shaped and lean (no quota/netpol/developer-RBAC/ECR).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: agent
  labels:
    crossplane.io/xrd: xagents.platform.refplat.org
spec:
  compositeTypeRef:
    apiVersion: platform.refplat.org/v1beta1
    kind: XAgent
  mode: Pipeline
  pipeline:
    - step: load-config
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: platform-agent-config
    - step: render-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $name := .observed.composite.resource.metadata.name }}
            {{- $cfg := index .context "apiextensions.crossplane.io/environment" }}
            {{- /* Namespace platform-agent-<name>; truncate-and-hash past the 63-char DNS-1123 limit. */}}
            {{- $nsRaw := printf "platform-agent-%s" $name }}
            {{- $ns := $nsRaw }}
            {{- if gt (len $nsRaw) 63 }}{{- $ns = printf "%s-%s" (substr 0 56 $nsRaw) (substr 0 6 (sha256sum $nsRaw)) }}{{- end }}
            {{- /* The agent's ServiceAccount = the XAgent name (the app's Deployment references it). */}}
            {{- $sa := $name }}
            {{- if gt (len $sa) 63 }}{{- $sa = printf "%s-%s" (substr 0 56 $name) (substr 0 6 (sha256sum $name)) }}{{- end }}
            {{- /* Pod-Identity role Pod-platform-agent-<name>; truncate-and-hash past the 64-char IAM limit. */}}
            {{- $roleRaw := printf "Pod-platform-agent-%s" $name }}
            {{- $role := $roleRaw }}
            {{- if gt (len $roleRaw) 64 }}{{- $role = printf "%s-%s" (substr 0 57 $roleRaw) (substr 0 6 (sha256sum $roleRaw)) }}{{- end }}
            {{- /* Kill-switch (ADR-082 D7): suspended removes the Pod-Identity association — a hard stop (no
                   Bedrock). The workload (ArgoCD-owned) keeps running but is defanged; flip back to restore. */}}
            {{- $phase := (($spec.lifecycle | default dict).phase) | default "active" }}
            {{- $active := ne $phase "suspended" }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: namespace
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Namespace
                  metadata:
                    name: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      platform.refplat.org/runtime: platform-agent
                      platform.refplat.org/agent: {{ $name }}
                      platform.refplat.org/team: {{ $spec.team }}
                      platform.refplat.org/product: {{ $spec.product }}
                      pod-security.kubernetes.io/enforce: baseline
                      pod-security.kubernetes.io/warn: restricted
                      pod-security.kubernetes.io/audit: restricted
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: serviceaccount
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: {{ $sa }}
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      platform.refplat.org/agent: {{ $name }}
            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Role
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: pod-role
                crossplane.io/external-name: {{ $role }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                assumeRolePolicy: {{ (dict "Version" "2012-10-17" "Statement" (list (dict "Effect" "Allow" "Principal" (dict "Service" "pods.eks.amazonaws.com") "Action" (list "sts:AssumeRole" "sts:TagSession") "Condition" (dict "StringEquals" (dict "aws:SourceAccount" $cfg.workloadAccountId))))) | toJson | quote }}
                {{- if $cfg.permissionsBoundaryArn }}
                permissionsBoundary: {{ $cfg.permissionsBoundaryArn | quote }}
                {{- end }}
                tags:
                  Team: {{ $spec.team }}
                  Runtime: platform-agent
                  Agent: {{ $name }}
            {{- /* IAM for the agent's role: the model's Bedrock data-plane grant (invoke/converse only — never
                   management) + explicit awsPermissions (deny-set validated upstream). The cross-region us.*
                   inference profile invokes the underlying foundation-model in us-east-1/2 + us-west-2, so the
                   grant spans regions; the model-access agreement + the pinned model id gate which model. */}}
            {{- $stmts := list }}
            {{- $model := $spec.model | default dict }}
            {{- if and (eq ($model.provider | default "bedrock") "bedrock") $model.id }}
            {{- $stmts = append $stmts (dict "Sid" "ModelInvoke" "Effect" "Allow" "Action" (list "bedrock:InvokeModel" "bedrock:InvokeModelWithResponseStream" "bedrock:Converse" "bedrock:ConverseStream") "Resource" (list "arn:aws:bedrock:*::foundation-model/*" (printf "arn:aws:bedrock:*:%s:inference-profile/*" $cfg.workloadAccountId))) }}
            {{- end }}
            {{- range $s := ((($spec.awsPermissions | default dict).policyStatements) | default list) }}
            {{- $st := dict "Effect" ($s.effect | default "Allow") "Action" $s.actions "Resource" $s.resources }}
            {{- if $s.sid }}{{- $st = merge $st (dict "Sid" $s.sid) }}{{- end }}
            {{- $stmts = append $stmts $st }}
            {{- end }}
            {{- if $stmts }}
            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: RolePolicy
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: pod-rolepolicy
            spec:
              providerConfigRef:
                name: default
              forProvider:
                role: {{ $role }}
                policy: {{ (dict "Version" "2012-10-17" "Statement" $stmts) | toJson | quote }}
            {{- end }}
            {{- if $active }}
            ---
            apiVersion: eks.aws.upbound.io/v1beta1
            kind: PodIdentityAssociation
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: pod-identity
            spec:
              providerConfigRef:
                name: default
              forProvider:
                region: {{ $cfg.region }}
                clusterName: {{ $cfg.clusterName }}
                namespace: {{ $ns }}
                serviceAccount: {{ $sa }}
                roleArn: arn:aws:iam::{{ $cfg.workloadAccountId }}:role/{{ $role }}
            {{- end }}
            {{- /* obs-read (ADR-082 D5): bind the read-only platform-trust-observability-reader ClusterRole to the
                   agent's SA — cluster-wide read of pods/events/apps, NO Secrets. Tight: bound to the named SA,
                   not the whole namespace's SAs. */}}
            {{- if $spec.obsRead }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: clusterrolebinding-obsread
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRoleBinding
                  metadata:
                    name: {{ printf "platform-agent-%s-obsread" $name }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      platform.refplat.org/agent: {{ $name }}
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: ClusterRole
                    name: platform-trust-observability-reader
                  subjects:
                    - kind: ServiceAccount
                      name: {{ $sa }}
                      namespace: {{ $ns }}
            {{- end }}
            {{- /* NetworkPolicies (ADR-082 D8). INGRESS lock (k8s NetworkPolicy): default-deny ingress (kubelet
                   probes still work — Cilium exempts host) + allow ingress ONLY from observability (the Alertmanager
                   webhook) + kube-system on 8080. EGRESS bound (CiliumNetworkPolicy below): a k8s ipBlock egress does
                   NOT work on Cilium for the agent's destinations — in-cluster (otel-collector/mimir/loki) is
                   IDENTITY-matched and the Pod-Identity agent (169.254.170.23) is HOST traffic, neither covered by a
                   CIDR ipBlock — so egress is a CiliumNetworkPolicy: DNS + kube-apiserver + host(Pod-Identity) +
                   the observability ns + toFQDNs(Bedrock/Slack) only. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: netpol-default-deny-ingress
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: default-deny-ingress
                    namespace: {{ $ns }}
                  spec:
                    podSelector: {}
                    policyTypes: ["Ingress"]
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: netpol-allow-trigger-ingress
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: allow-trigger-ingress
                    namespace: {{ $ns }}
                  spec:
                    podSelector: {}
                    policyTypes: ["Ingress"]
                    ingress:
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: observability
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: kube-system
                        ports:
                          - port: 8080
                            protocol: TCP
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cnp-allow-egress
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: cilium.io/v2
                  kind: CiliumNetworkPolicy
                  metadata:
                    name: allow-egress
                    namespace: {{ $ns }}
                  spec:
                    # A k8s ipBlock egress can't express the agent's real destinations on Cilium (in-cluster is
                    # identity-matched, the Pod-Identity agent is host-local, and Bedrock/Slack are dynamic IPs) —
                    # so this is a CiliumNetworkPolicy. Default-deny egress, allowing exactly:
                    endpointSelector: {}
                    egress:
                      # DNS to kube-dns (also enables toFQDNs IP-learning via Cilium's L7 DNS proxy).
                      - toEndpoints:
                          - matchLabels:
                              k8s:io.kubernetes.pod.namespace: kube-system
                              k8s:k8s-app: kube-dns
                        toPorts:
                          - ports:
                              - port: "53"
                                protocol: ANY
                            rules:
                              dns:
                                - matchPattern: "*"
                      # k8s API — get_recent_changes (ReplicaSets/events) + ArgoCD Applications (the change source).
                      - toEntities: ["kube-apiserver"]
                      # EKS Pod-Identity agent (169.254.170.23:80, node-local) for Bedrock creds — mirrors the tenant
                      # cnp-allow-pod-identity-egress. (IMDS, also host-local, is guarded by node IMDSv2 hop-limit.)
                      - toEntities: ["host"]
                        toPorts:
                          - ports:
                              - port: "80"
                                protocol: TCP
                      # In-cluster obs — loki/mimir gateways (query_logs/query_metrics) + otel-collector (traces).
                      - toEndpoints:
                          - matchLabels:
                              k8s:io.kubernetes.pod.namespace: observability
                      # The agent's identity directory Postgres (ADR-084 Phase 1) — the platform-directory ns, on 5432.
                      - toEndpoints:
                          - matchLabels:
                              k8s:io.kubernetes.pod.namespace: platform-directory
                        toPorts:
                          - ports:
                              - port: "5432"
                                protocol: TCP
                      # Keycloak (in-cluster service keycloak-http) — the directory-sync reads federated identities
                      # from the realm (ADR-084 Phase 1). In-cluster, NOT via the external gateway FQDN (that path is
                      # unreliable from in-cluster — it timed out in testing).
                      - toEndpoints:
                          - matchLabels:
                              k8s:io.kubernetes.pod.namespace: keycloak
                      # External egress is bounded to Bedrock + Slack + GitHub ONLY — the actual hardening. *.slack.com
                      # covers the webhook (hooks.slack.com), the Socket Mode API (slack.com/apps.connections.open),
                      # and the Socket Mode WebSocket (wss-*.slack.com); api.github.com is the change-correlation read
                      # (get_change_detail). All egress-only.
                      - toFQDNs:
                          - matchPattern: "bedrock-runtime.*.amazonaws.com"
                          - matchName: "slack.com"
                          - matchPattern: "*.slack.com"
                          - matchName: "api.github.com"
                        toPorts:
                          - ports:
                              - port: "443"
                                protocol: TCP
    - step: ready
      functionRef:
        name: function-auto-ready
