apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-tenant-control-plane
  labels:
    {{- include "ktp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Restrict Tenant Control-Plane Resources
    policies.kyverno.io/category: Security, Multi-Tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: XTenant, ProviderConfig
    policies.kyverno.io/description: >-
      The Crossplane tenant control plane (ADR-046/048) — XTenant claims and provider ProviderConfigs —
      grants the privileged provisioning identity. It may be managed only by platform principals (GitOps /
      the deployer), never by tenants. XTenant is cluster-scoped (so tenants already lack RBAC to create it);
      this is defense-in-depth and makes the intent explicit. The composite controller + provider-kubernetes
      run as crossplane-system principals, which are in the platform allow-list, so the Composition itself is
      unaffected.
spec:
  # background: false is required — the rule references request.userInfo.username (platform-principal skip).
  background: false
  failurePolicy: {{ .Values.failurePolicy }}
  rules:
    - name: deny-non-platform-tenant-control-plane
      match:
        any:
          - resources:
              kinds:
                - platform.refplat.org/v1alpha1/XTenant
                - aws.upbound.io/v1beta1/ProviderConfig
                - kubernetes.crossplane.io/v1alpha1/ProviderConfig
      {{- include "ktp.skipPlatformPrincipals" . | nindent 6 }}
      validate:
        failureAction: {{ .Values.validationFailureAction }}
        message: "Tenant control-plane resources (XTenant / ProviderConfig) may only be managed by platform principals, not tenants."
        deny: {}
