apiVersion: v2
name: crossplane-runtime
description: >-
  Crossplane AWS provider runtime — DeploymentRuntimeConfig (pins the provider ServiceAccount for EKS Pod
  Identity), the Provider package CRs, and a post-install Job that blocks until the providers are Healthy
  (so the provider-installed ProviderConfig CRD exists before the config chart applies a ProviderConfig).
type: application
version: 0.1.5
appVersion: "2.5.0"
