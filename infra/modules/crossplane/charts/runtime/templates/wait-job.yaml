# Provider/Function package CRDs (e.g. the aws.upbound.io / kubernetes.crossplane.io ProviderConfig CRDs)
# are installed by the PACKAGES asynchronously, not by the core chart. So before the config chart can apply
# ProviderConfigs (and before Compositions reference Functions), packages must finish installing. This Job
# (a post-install/upgrade hook helm waits on) blocks until providers + functions are Healthy and the
# required ProviderConfig CRDs are Established — gating helm_release.crossplane_config.
#
# Single-purpose containers each invoke the image's kubectl entrypoint directly (no shell in the distroless
# image): initContainers wait for providers (and functions) Healthy; the main container waits for the CRDs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane-bootstrap-wait
  namespace: {{ .Values.namespace }}
---
# Explicit verbs/resources only — no wildcards (passes restrict-wildcard-rbac regardless of exclusions).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-bootstrap-wait
rules:
  - apiGroups: ["pkg.crossplane.io"]
    resources: ["providers", "functions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-bootstrap-wait
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-bootstrap-wait
subjects:
  - kind: ServiceAccount
    name: crossplane-bootstrap-wait
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: crossplane-wait-providers
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: crossplane-bootstrap-wait
      restartPolicy: Never
      securityContext:
        # The kubectl image defaults to root; pin a numeric non-root uid to satisfy runAsNonRoot.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # kubectl writes its discovery cache under $HOME; provide a writable tmpfs since the root fs is read-only.
        - name: home
          emptyDir: {}
      initContainers:
        - name: wait-providers-healthy
          image: {{ .Values.waitImage }}
          args: ["wait", "--for=condition=Healthy", "provider.pkg.crossplane.io", "--all", "--timeout=600s"]
          env: [{ name: HOME, value: /tmp }]
          volumeMounts: [{ name: home, mountPath: /tmp }]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
{{- if .Values.functions }}
        - name: wait-functions-healthy
          image: {{ .Values.waitImage }}
          args: ["wait", "--for=condition=Healthy", "function.pkg.crossplane.io", "--all", "--timeout=600s"]
          env: [{ name: HOME, value: /tmp }]
          volumeMounts: [{ name: home, mountPath: /tmp }]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
{{- end }}
      containers:
        - name: wait-providerconfig-crds
          image: {{ .Values.waitImage }}
          args:
            - wait
            - --for=condition=established
{{- range .Values.waitForCrds }}
            - crd/{{ . }}
{{- end }}
            - --timeout=180s
          env: [{ name: HOME, value: /tmp }]
          volumeMounts: [{ name: home, mountPath: /tmp }]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
