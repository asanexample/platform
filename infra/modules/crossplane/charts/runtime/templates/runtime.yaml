{{- $base := int .Values.webhookBasePort -}}
{{- range $i, $p := .Values.providers }}
{{- $w := add $base (mul $i 10) -}}
{{- $m := add $w 1 -}}
{{- $h := add $w 2 }}
# DeploymentRuntimeConfig pins the provider pods' ServiceAccount (so the Pod Identity association /
# InjectedIdentity RBAC resolves). hostNetwork providers also get a unique webhook/metrics/health port
# triplet so they never collide on a node (incl. with Kyverno's hostNetwork webhooks 9443/9444 / the node's
# 8080) — the EKS control plane can't reach overlay pod IPs for a provider's conversion/validation webhook.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ $p.name }}-runtime
spec:
  serviceAccountTemplate:
    metadata:
      name: {{ $p.serviceAccount }}
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
{{- if $p.hostNetwork }}
              # Env merges by name onto the package-generated container (Crossplane-injected TLS_*/POD_* env
              # is preserved); the Service's targetPort=webhook follows the named port below.
              env:
                - { name: WEBHOOK_PORT, value: "{{ $w }}" }
                - { name: METRICS_BIND_ADDRESS, value: ":{{ $m }}" }
                - { name: HEALTH_PROBE_BIND_ADDRESS, value: ":{{ $h }}" }
              ports:
                - { name: metrics, containerPort: {{ $m }} }
                - { name: webhook, containerPort: {{ $w }} }
{{- end }}
{{- if $p.hostNetwork }}
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
{{- end }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: {{ $p.name }}
spec:
  package: {{ $p.package }}
  runtimeConfigRef:
    name: {{ $p.name }}-runtime
{{- end }}
{{- range $f := .Values.functions }}
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: {{ $f.name }}
spec:
  package: {{ $f.package }}
{{- end }}
