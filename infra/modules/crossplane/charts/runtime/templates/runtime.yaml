{{- $base := int .Values.webhookBasePort -}}
{{- range $i, $p := .Values.providers }}
{{- $w := add $base (mul $i 10) -}}
{{- $m := add $w 1 -}}
{{- $h := add $w 2 }}
---
# NB: this leading `---` is load-bearing — without it each Provider doc (below) concatenates with the next
# iteration's DeploymentRuntimeConfig into one YAML document, and the duplicate apiVersion/kind keys make the
# DRC silently win, dropping every Provider but the last. With one provider (P2a) there was no adjacent pair
# to merge, so the bug only surfaced once multiple providers were installed.
# DeploymentRuntimeConfig pins the provider pods' ServiceAccount (so the Pod Identity association /
# InjectedIdentity RBAC resolves). hostNetwork providers also get a unique webhook/metrics/health port
# triplet so they never collide on a node (incl. with Kyverno's hostNetwork webhooks 9443/9444 / the node's
# 8080) — the EKS control plane can't reach overlay pod IPs for a provider's conversion/validation webhook.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ $p.name }}-runtime
spec:
  serviceAccountTemplate:
    metadata:
      name: {{ $p.serviceAccount }}
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
{{- if $p.hostNetwork }}
              # Env merges by name onto the package-generated container (Crossplane-injected TLS_*/POD_* env
              # is preserved); the Service's targetPort=webhook follows the named port below.
              env:
                - { name: WEBHOOK_PORT, value: "{{ $w }}" }
                - { name: METRICS_BIND_ADDRESS, value: ":{{ $m }}" }
                - { name: HEALTH_PROBE_BIND_ADDRESS, value: ":{{ $h }}" }
              ports:
                # #1428: provider-kubernetes ignores METRICS_BIND_ADDRESS too (no metrics flag/env var exists
                # in its cmd/provider — verified against source) and always serves on controller-runtime's
                # hardcoded default :8080, so its "metrics" port must be declared as 8080, not the computed
                # per-provider value, or the PodMonitor's named-port lookup resolves to a dead address.
                - { name: metrics, containerPort: {{ $p.metricsPortFixed8080 | ternary 8080 $m }} }
                - { name: webhook, containerPort: {{ $w }} }
{{- end }}
{{- if $p.hostNetwork }}
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
{{- end }}
{{- if $p.avoidKyvernoWebhookNode }}
          # provider-kubernetes doesn't honour EITHER port-relocation env var this template sets for it —
          # verified against its cmd/provider/main.go, which defines no metrics/webhook flag or env var at
          # all. It always binds controller-runtime's hardcoded defaults: the conversion webhook on :9443,
          # metrics on :8080 (#1428). Under hostNetwork those are node-level binds that collide with two
          # unrelated existing hostPort claimants — Kyverno's admission controller (also :9443) and CNPG's
          # operator (hostPort 8080) — crash-looping this provider ("listen tcp :9443/:8080: bind: address
          # already in use") if co-scheduled with either. Hard anti-affinity keeps it off both. (The AWS
          # providers have no conversion webhook and use the computed metrics port correctly, so they don't
          # need this.)
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/part-of: kyverno
                      app.kubernetes.io/component: admission-controller
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: cloudnative-pg
{{- end }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: {{ $p.name }}
spec:
  package: {{ $p.package }}
  runtimeConfigRef:
    name: {{ $p.name }}-runtime
{{- if $p.skipDependencyResolution }}
  # provider-family-aws is installed explicitly (above), so each member can skip dependency resolution —
  # this keeps the shared family on a single pinned revision instead of letting each member resolve it
  # independently and race on the Lock (crossplane-contrib/provider-aws#1749).
  skipDependencyResolution: true
{{- end }}
{{- end }}
{{- range $f := .Values.functions }}
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: {{ $f.name }}
spec:
  package: {{ $f.package }}
{{- end }}
