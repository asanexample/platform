# RBAC for the Backstage "Environment Status" card + the environment-ready notifier (#285, ADR-064 §2). They
# read live XEnvironment status (conditions / domains) + the Product/Team registry from this workload cluster
# via the cross-account Backstage READER role. That role's cluster access is the EKS-managed AmazonEKSViewPolicy
# access-policy association, which (a) doesn't cover custom resources and (b) is NOT extended by aggregating into
# the built-in `view` ClusterRole — EKS access policies are a fixed AWS-managed authorizer, separate from K8s
# RBAC aggregation. So the Backstage access entry additionally maps the role into the `backstage-readers`
# Kubernetes group (eks unit), and this ClusterRole + binding grant that group read on the Environment API ON TOP
# of the view policy. Read-only; ships with this chart so the grant exists wherever the environment control plane does.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-read-environment-api
  labels:
    {{- include "ktp.labels" . | nindent 4 }}
rules:
  - apiGroups: ["platform.refplat.org"]
    resources: ["xenvironments", "products", "teams"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-read-environment-api
  labels:
    {{- include "ktp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-read-environment-api
subjects:
  # The Kubernetes group the preprod Backstage access entry maps the reader role into (eks unit
  # access_entries.backstage.kubernetes_groups). The role also carries AmazonEKSViewPolicy for standard
  # resources; this binding adds the Environment API on top.
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: backstage-readers
