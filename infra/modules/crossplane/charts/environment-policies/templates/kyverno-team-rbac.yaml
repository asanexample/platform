# RBAC for the envelope policy's apiCall lookups. restrict-environment-envelope (ADR-067 #387) fetches the
# projected Team AND Product CRs via Kyverno apiCalls (ktp.envContext: GET /teams/<team> + /products/<team>-<product>),
# which execute as the Kyverno controllers' ServiceAccounts. Without this grant the call is Forbidden and silently
# resolves to the context default ({}), so team-must-exist would deny EVERY Environment ("no projected Team CR")
# and — critically — the Product-reading rules (team-matches-product, customer-required/forbidden) would SILENTLY
# SKIP (productExistsPrecondition never matches) — invisible under Audit, a real gap under Enforce. So BOTH teams
# AND products must be readable (bit the v2 rebuild's first environment sync; the missing `products` grant was a v3
# cutover gap surfaced by the .kyverno-tests behavioral suite).
#
# servicegrants (ADR-101): restrict-environment-dependencies' ktp.serviceGrantsContext fetches ServiceGrant
# objects the same way. Missing this grant does NOT silently resolve like teams/products above — the apiCall
# error instead breaks JMESPath variable substitution in the deny condition, which Kyverno surfaces as a hard
# ComparisonError on the whole XEnvironment resource (confirmed live: this blocked ArgoCD's `environments` app
# from syncing AT ALL the moment the first real spec.dependencies entry — alpha-shop-dev's — landed, not just a
# silently-wrong policy decision). Same aggregated ClusterRoles fix it, so it's added here rather than as a
# separate object.
#
# Kyverno aggregates ClusterRoles by label: aggregate-to-admission-controller (webhook-time apiCalls) and
# aggregate-to-reports-controller (background: true re-evaluation). Ships with this chart so the grant exists
# wherever the envelope policy exists.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-read-platform-teams
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
    {{- include "ktp.labels" . | nindent 4 }}
rules:
  - apiGroups: ["platform.refplat.org"]
    resources: ["teams", "products", "servicegrants"]
    verbs: ["get", "list", "watch"]
