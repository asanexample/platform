# Defaults are overridden by the Terraform module (helm_release values). They exist here so `helm template`
# works standalone (the .kyverno-tests harness). These mirror what the policy module's policies-chart used to
# pass for these two policies before they moved here (preprod is Enforce).

# restrict-environment-control-plane action: Audit (record PolicyReport, admit) or Enforce (reject at admission).
validationFailureAction: Enforce
# restrict-environment-envelope action (ADR-049 A2b) — independent so it rolls Audit-first while the control-plane
# policy is Enforce; flips to Enforce at the rebuild cutover (delivery-plan A6).
envelopeFailureAction: Audit
# v3 (ADR-067 #387): render restrict-environment-envelope (the XEnvironment envelope). Inert until the cutover.
enableEnvironmentEnvelope: false
# Generated-webhook failure policy: Ignore (fail-open) or Fail (fail-closed). Fail under Enforce.
failurePolicy: Fail

# TD2-04 (epic #809): skip the envelope ADMISSION webhook for Crossplane's own reconcile writes to the
# XEnvironment XR (status / spec normalization). Crossplane continuously re-UPDATEs each XR; without this, every
# no-op reconcile fires all ~12 envelope rules — each doing Team+Product context lookups — pinning the admission
# controller at ~1 core (observed on preprod). A webhook-level CEL matchCondition is independent of
# `background: true`, so the Audit-first PolicyReports still cover the stored spec, and the envelope is still
# enforced at the AUTHORING boundary (the ArgoCD apply of gitops/environments/**). Empty string disables the skip.
envelopeSkipReconcilePrincipal: "system:serviceaccount:crossplane-system:crossplane"

# Requesting-principal (userInfo.username) wildcards skipped by restrict-environment-control-plane so platform
# controllers can author XTenant/ProviderConfig. crossplane-system is REQUIRED — the Composition's
# provider-kubernetes + the composite controller create ProviderConfigs as crossplane-system principals.
# `system:serviceaccount:argocd:*` is ArgoCD's IN-cluster identity (same-cluster GitOps).
excludePrincipals:
  - "system:serviceaccount:argocd:*"
  - "system:serviceaccount:kube-system:*"
  - "system:serviceaccount:crossplane-system:*"
  - "system:nodes:*"
  - "system:kube-controller-manager"

# Additional skip principals, appended to excludePrincipals. Env-specific, so passed by the unit rather than
# hardcoded here. Use for ArgoCD's REMOTE-cluster identity: when ArgoCD (on the platform cluster) delivers
# XTenant claims to a workload cluster it authenticates via the cross-account `ArgoCD` IAM role (EKS access
# entry), so its username is the assumed-role ARN — e.g. "arn:aws:sts::<acct>:assumed-role/ArgoCD/*" — NOT the
# in-cluster SA above. Scoped to the cluster's own account (no account wildcard).
extraExcludePrincipals: []

# Platform-global deny-set for self-service IAM (ADR-062 §4, #282). An app's claim may author
# spec.apps.<app>.permissions.aws.policyStatements; this is the set of AWS services whose actions are
# REJECTED outright (the policystatements-no-escalation rule denies any action whose lowercased service
# prefix is in this list — and, because a bare `*`/`*:*` action has the prefix `*` which set-wildcard-matches
# any entry here, those broad wildcards are caught too). Mirrors + is intentionally ⊇ the AWS permissions
# boundary (iam/organizations/account + all of sts; the boundary denies sts:AssumeRole*, we deny the whole
# service). Being stricter than the boundary never grants more. NOT resource-scoped (e.g. s3:* on * still
# passes — least-privilege resource prefixes are a documented follow-up, not this).
iamSensitiveServices:
  - iam
  - sts
  - organizations
  - account

# Labels stamped on every ClusterPolicy.
commonLabels: {}
