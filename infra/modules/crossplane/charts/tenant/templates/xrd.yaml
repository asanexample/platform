# The Tenant API. Crossplane v2 XRD, Cluster-scoped: a Tenant provisions a namespace + cluster-scoped
# policies (it is not "in" a namespace), and Cluster scope composes resources across namespaces. Being
# cluster-scoped also means creating an XTenant requires cluster RBAC — tenants cannot self-provision
# (security gate S1); claims are delivered by a platform-controlled GitOps path.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xtenants.platform.refplat.org
spec:
  scope: Cluster
  group: platform.refplat.org
  names:
    kind: XTenant
    plural: xtenants
  versions:
    # ---------------------------------------------------------------------------
    # v1alpha2 — the Tenant API (ADR-049, docs/architecture/tenant-api-v2.md). The storage + referenceable
    # version: Composition v2 (tenant-v2) binds to it. v1alpha1 was dropped at the rebuild cutover (A6) — no
    # stored v1alpha1 objects survive a from-scratch build. Structural + self-contained validation only;
    # cross-object envelope checks (tier ∈ Team.allowedTiers, quota ≤ Team.quotaCap, residency ⊆
    # Team.allowedLocations, environment ∈ Team.allowedEnvironments) are enforced by Kyverno against the
    # projected Team CR (restrict-tenant-envelope), not here.
    # ---------------------------------------------------------------------------
    - name: v1alpha2
      served: true
      referenceable: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - team
                - name
                - environment
              properties:
                team:
                  type: string
                  description: Owning Team key → envelope + SSO group. Must reference an existing Team.
                name:
                  type: string
                  description: Tenant name within the Team (e.g. payments-api). Namespace is "<team>-<name>".
                environment:
                  type: string
                  enum: ["dev", "test", "uat", "staging", "prod"]
                  description: >-
                    The promotion stage this Tenant is realized in (a Tenant is authored per (team, name,
                    environment); the namespace is "<team>-<name>-<environment>"). Must be in the owning Team's
                    allowedEnvironments (Kyverno). The hosting account/cluster (e.g. the preprod account holds the
                    non-prod stages) is a placement concern, not this field.
                tier:
                  type: string
                  enum: ["standard", "elevated", "pci", "hipaa"]
                  default: standard
                  description: Reference to a platform hardening profile (isolation + recovery + availability).
                tenancy:
                  type: object
                  description: pooled (default) or a dedicated home for one customer.
                  default: { mode: pooled }
                  properties:
                    mode:
                      type: string
                      enum: ["pooled", "dedicated"]
                      default: pooled
                    customer:
                      type: string
                      description: Required when mode is dedicated (→ a Customer).
                  x-kubernetes-validations:
                    - rule: "self.mode != 'dedicated' || has(self.customer)"
                      message: "tenancy.customer is required when tenancy.mode is 'dedicated'"
                residency:
                  type: object
                  description: HARD, attested placement constraint.
                  default: { allowedLocations: ["*"] }
                  properties:
                    allowedLocations:
                      type: array
                      description: Jurisdiction ("eu") or exact "cloud:region"; must be ⊆ Team.allowedLocations (Kyverno).
                      items:
                        type: string
                      default: ["*"]
                quota:
                  type: object
                  description: Per-tenant request; validated ≤ Team.quotaCap by Kyverno.
                  default: {}
                  properties:
                    cpu:
                      type: string
                      default: "4"
                    memory:
                      type: string
                      default: "8Gi"
                    pods:
                      type: integer
                      default: 20
                    services:
                      type: integer
                      default: 20
                    loadbalancers:
                      type: integer
                      default: 0
                    pvcs:
                      type: integer
                      default: 10
                    storage:
                      type: string
                      default: "50Gi"
                domains:
                  type: array
                  description: >-
                    Tier-1/2 route domains for this tenant (ADR-061, the authoritative hostname field — replaces
                    the earlier `hostnames` string list). The generated canonical host (<app>-<team>.<baseDomain>)
                    is implicit and never declared here — list only ADDITIONAL aliases (a cleaner vanity label
                    under our domain). The Composition unions these with the generated host into the
                    restrict-route-hostnames allow-list, and argocd-apps injects the same union into the app's
                    HTTPRoute. External custom domains + the status.domains verification state machine are Phase 2.
                  items:
                    type: object
                    properties:
                      host:
                        type: string
                        description: The fully-qualified route hostname (e.g. shop.preprod.aws.refplat.org).
                      canonical:
                        type: boolean
                        description: When true, the user-canonical URL (drives 301/SEO in a later phase; inert in Phase 1).
                        default: false
                      dns:
                        type: string
                        enum: ["managed", "external"]
                        description: DNS provider mode — managed (platform-owned zone) or external (customer-managed). Inert in Phase 1; wired in Phase 2.
                        default: managed
                    required:
                      - host
                  default: []
                apps:
                  type: object
                  description: Per-app delivery + identity + permissions, unified.
                  default: {}
                  additionalProperties:
                    type: object
                    required:
                      - repo
                    properties:
                      repo:
                        type: string
                        description: Git repo with the app's K8s manifests (ArgoCD source + ECR repo team-<team>/<app>).
                      repoPath:
                        type: string
                        description: Manifest dir; defaults to k8s/<environment>, derived by placement when omitted.
                      preview:
                        type: boolean
                        default: false
                      serviceAccount:
                        type: string
                        description: Named SA the app runs as; a cloud-neutral identity is minted + bound. No IRSA annotation.
                      permissions:
                        type: object
                        description: Cloud-KEYED grants attached to serviceAccount (the identity binding stays neutral).
                        properties:
                          aws:
                            type: object
                            properties:
                              policyStatements:
                                type: array
                                description: IAM statements for the app's role, capped by the deny-escalation boundary.
                                default: []
                                items:
                                  type: object
                                  required:
                                    - actions
                                    - resources
                                  properties:
                                    sid:
                                      type: string
                                    effect:
                                      type: string
                                      enum: ["Allow", "Deny"]
                                      default: Allow
                                    actions:
                                      type: array
                                      items:
                                        type: string
                                    resources:
                                      type: array
                                      items:
                                        type: string
                developerAccess:
                  type: object
                  description: Names WHO (the posture is derived from environment × tier, ADR-040).
                  default: { enabled: true }
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    group:
                      type: string
                      description: Override the Team developerGroup — REQUIRED for regulated prod (enforced by Kyverno).
                encryption:
                  type: object
                  description: "Reserved (deferred): key custody (BYOK/HYOK). Inert until the KMS paved-road ships."
                  properties:
                    keyCustody:
                      type: string
                      enum: ["platform-managed", "customer-managed", "customer-hosted"]
                      default: platform-managed
                lifecycle:
                  type: object
                  description: Tenant lifecycle; the exit counterpart to onboarding.
                  default: { phase: active }
                  properties:
                    phase:
                      type: string
                      enum: ["active", "suspended", "decommissioning"]
                      default: active
                      description: decommissioning triggers ordered teardown → destruction/retention → exit attestation.
                dataServices:
                  type: object
                  description: "Reserved (deferred): cloud-neutral stateful deps; inherits residency + tier recovery. Inert until the data paved-road (#106/#107)."
                  default: {}
                  additionalProperties:
                    type: object
                    required:
                      - kind
                    properties:
                      kind:
                        type: string
                        enum: ["relational", "cache", "objectstore", "stream"]
                        description: Cloud-neutral category (never a product).
                      engine:
                        type: string
                        description: Interface hint (postgres/mysql/redis/kafka) — the API, not the implementation.
                      class:
                        type: string
                        description: Platform-defined size/durability class.
                      serviceAccount:
                        type: string
                      backup:
                        type: object
                        description: Optional override that may only STRENGTHEN the tier recovery default.
                        properties:
                          retention:
                            type: string
                          rpo:
                            type: string
            status:
              type: object
              properties:
                placement:
                  type: object
                  description: Concrete coordinates resolved by placement (never authored).
                  properties:
                    cloud:
                      type: string
                    region:
                      type: string
                    account:
                      type: string
                    cluster:
                      type: string
                    zone:
                      type: string
                    namespace:
                      type: string
                domains:
                  type: array
                  description: >-
                    Per-domain ingress state (ADR-061). The Composition writes one entry per generated canonical
                    host + each spec.domains alias. Kyverno admits a route host only while its entry is Active.
                    Phase 2a populates host/state/mode/reason (+ message); dnsTarget/lastTransitionTime are driven
                    by the Phase 2b external-domain provisioning.
                  items:
                    type: object
                    properties:
                      host:
                        type: string
                      state:
                        type: string
                        enum: ["Pending", "DelegationRequired", "VerificationRequired", "Verifying", "Issuing", "Active", "Error", "Deleting"]
                      mode:
                        type: string
                        enum: ["platform-managed", "customer-managed"]
                      dnsTarget:
                        type: array
                        description: Nameservers (DelegationRequired) or CNAME target (VerificationRequired) the customer must point at.
                        items:
                          type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                lifecycle:
                  type: object
                  properties:
                    phase:
                      type: string
                    retentionUntil:
                      type: string
                    exitAttestation:
                      type: string
