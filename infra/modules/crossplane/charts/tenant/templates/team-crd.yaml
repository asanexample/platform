# The projected Team CR (ADR-049, docs/architecture/tenant-api-v2.md — "Object 1, Projected Team CR").
#
# A plain, cluster-scoped, data-only CRD — NOT a Crossplane composite: it provisions nothing. It is the
# minimal, admission-relevant mirror of a Team's envelope, written onto each cluster by the model-as-code
# sync (delivery-plan A2; never by developers) so Kyverno can read it during XTenant admission to enforce
# "...and only within your Team's envelope" (the envelope plane). The canonical Team record (displayName,
# developerGroup, costCenter, contacts) lives in the registry/Backstage — only the envelope subset is
# projected here. Status is written by the report-first rollup controller (aggregate checks).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: teams.platform.refplat.org
spec:
  group: platform.refplat.org
  scope: Cluster
  names:
    kind: Team
    plural: teams
    singular: team
    categories:
      - tenant-api
  versions:
    # v1alpha2 — DEPRECATED at the v3 cutover (ADR-067). v1alpha3 is now the stored + served version; v1alpha2
    # is retained (served:false) only so a CRD upgrade over any lingering v1alpha2 object doesn't hard-fail.
    # A from-scratch rebuild has no stored v1alpha2 Teams, so this version block can be dropped entirely there.
    - name: v1alpha2
      served: false
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - ssoGroup
                - envelope
              properties:
                ssoGroup:
                  type: string
                  description: The Identity Center / Keycloak group this Team maps to (root of both authz planes).
                envelope:
                  type: object
                  description: The bound on every Tenant the Team may author.
                  required:
                    - allowedTiers
                    - allowedEnvironments
                    - quotaCap
                  properties:
                    allowedTiers:
                      type: array
                      description: Hardening tiers this Team may request. A Tenant tier outside this set is denied.
                      minItems: 1
                      items:
                        type: string
                        enum: ["standard", "elevated", "pci", "hipaa"]
                    allowedEnvironments:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        enum: ["dev", "test", "uat", "staging", "prod"]
                    allowedLocations:
                      type: array
                      description: Jurisdictions/locations the Team's Tenants may sit in; a Tenant residency must be ⊆ this. "*" = anywhere operated.
                      items:
                        type: string
                      default: ["*"]
                    quotaCap:
                      type: object
                      description: Per-tenant ceiling AND aggregate cap (the sum check is report-first).
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                        pods:
                          type: integer
                    maxDedicatedZones:
                      type: integer
                      description: How many dedicated (per-customer) zones the Team may occupy. 0 = pooled only.
                      default: 0
                      minimum: 0
            status:
              type: object
              description: Written by the rollup controller (aggregate envelope checks; report-first).
              properties:
                tenantCount:
                  type: integer
                aggregateQuota:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    pods:
                      type: integer
                dedicatedZonesInUse:
                  type: integer
      additionalPrinterColumns:
        - name: SSO Group
          type: string
          jsonPath: .spec.ssoGroup
        - name: Tiers
          type: string
          jsonPath: .spec.envelope.allowedTiers
        - name: Tenants
          type: integer
          jsonPath: .status.tenantCount
    # -------------------------------------------------------------------------------------------------------
    # v1alpha3 — the v3 envelope (ADR-067): allowedEnvironments → allowedStages, maxDedicatedZones →
    # maxDedicatedIsolation {cluster, account}, + maxCrossTeamGrantsPerProduct (ADR-068). Served-only (storage
    # stays v1alpha2 until the cutover); added ADDITIVELY so v2 gitops/teams + the teams-gate keep working while
    # the v3 surface is render-tested. conversion None (no stored objects to convert; deploy is rebuild-gated).
    # -------------------------------------------------------------------------------------------------------
    - name: v1alpha3
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - ssoGroup
                - envelope
              properties:
                ssoGroup:
                  type: string
                  description: The upstream IdP / Keycloak group this Team maps to (root of both authz planes).
                envelope:
                  type: object
                  description: The bound on every Product/Environment the Team may author.
                  required:
                    - allowedTiers
                    - allowedStages
                    - quotaCap
                  properties:
                    allowedTiers:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        enum: ["standard", "elevated", "pci", "hipaa"]
                    allowedStages:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        enum: ["dev", "test", "uat", "staging", "prod"]
                    allowedLocations:
                      type: array
                      items:
                        type: string
                      default: ["*"]
                    quotaCap:
                      type: object
                      properties:
                        cpu: { type: string }
                        memory: { type: string }
                        pods: { type: integer }
                    maxDedicatedIsolation:
                      type: object
                      description: How many Environments may dial to the expensive isolation rungs. 0 = pooled namespace/nodes only.
                      default: { cluster: 0, account: 0 }
                      properties:
                        cluster: { type: integer, default: 0, minimum: 0 }
                        account: { type: integer, default: 0, minimum: 0 }
                    maxCrossTeamGrantsPerProduct:
                      type: integer
                      description: Cap on active inbound AccessGrants per Product (ADR-068 §9 sprawl backstop).
                      default: 10
                      minimum: 0
            status:
              type: object
              properties:
                productCount: { type: integer }
                environmentCount: { type: integer }
                dedicatedIsolationInUse:
                  type: object
                  properties:
                    cluster: { type: integer }
                    account: { type: integer }
      additionalPrinterColumns:
        - name: SSO Group
          type: string
          jsonPath: .spec.ssoGroup
        - name: Stages
          type: string
          jsonPath: .spec.envelope.allowedStages
        - name: Environments
          type: integer
          jsonPath: .status.environmentCount
