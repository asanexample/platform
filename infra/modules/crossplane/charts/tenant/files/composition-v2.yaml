# Tenant Composition v2 (Crossplane v2, Pipeline mode) — ADR-049 / delivery-plan A3.
#
# Renders a v1alpha2 XTenant into its tenant footprint. THIS IS THE A3a CUT: the Kubernetes footprint only
# (namespace <team>-<name>, quota, limits, NetworkPolicies, CiliumNetworkPolicies, developer RoleBinding).
# The AWS per-app identity (A3b) and cross-account ECR (A3c) are appended in follow-ups.
#
# NOT YET WIRED: v1alpha2 is served-only (v1alpha1 stays referenceable until the rebuild cutover, A6), so a
# Composition can't bind to it on a live cluster yet. This file is render-tested offline (crossplane render)
# by .tenant-api-tests; it becomes the active Composition at the cutover. Shipped raw (.Files.Get) so Helm
# leaves the go-template delimiters intact.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenant-v2
  labels:
    crossplane.io/xrd: xtenants.platform.refplat.org
spec:
  compositeTypeRef:
    apiVersion: platform.refplat.org/v1alpha2
    kind: XTenant
  mode: Pipeline
  pipeline:
    - step: load-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: tenant-cluster-config
    - step: render-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $xrName := .observed.composite.resource.metadata.name }}
            {{- $team := $spec.team }}
            {{- $name := $spec.name }}
            {{- $environment := $spec.environment }}
            {{- $ns := printf "%s-%s-%s" $team $name $environment }}
            {{- $tier := $spec.tier | default "standard" }}
            {{- $q := $spec.quota | default dict }}
            {{- /* Lifecycle (ADR-062 #283): suspended/decommissioning = a REVERSIBLE grace state. We zero the
                   ResourceQuota (pods + cpu/memory) so no new/rescheduled pod can run — workloads drain on the
                   next reconcile — while the namespace, policies, IAM, and ECR are all retained. Flipping the
                   phase back to active restores the quota. Nothing is destroyed until the claim is removed. */}}
            {{- $phase := (($spec.lifecycle | default dict).phase) | default "active" }}
            {{- $suspended := or (eq $phase "suspended") (eq $phase "decommissioning") }}
            {{- $qCpu := $q.cpu }}{{- $qMem := $q.memory }}{{- $qPods := $q.pods }}
            {{- if $suspended }}{{- $qCpu = "0" }}{{- $qMem = "0" }}{{- $qPods = "0" }}{{- end }}
            {{- $gw := "default" }}
            {{- $cfg := index .context "apiextensions.crossplane.io/environment" }}
            {{- $ecrCfg := $cfg.providerConfigEcr | default "default" }}
            {{- $pullAccts := list }}
            {{- if and $cfg $cfg.pullAccountIds }}{{- $pullAccts = $cfg.pullAccountIds | fromJson }}{{- end }}
            {{- $ecrPrincipals := list }}
            {{- range $a := $pullAccts }}{{- $ecrPrincipals = append $ecrPrincipals (printf "arn:aws:iam::%s:root" $a) }}{{- end }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: namespace
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Namespace
                  metadata:
                    name: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      platform.refplat.org/tenant: {{ $team }}
                      platform.refplat.org/tenant-name: {{ $name }}
                      platform.refplat.org/environment: {{ $environment }}
                      platform.refplat.org/tier: {{ $tier }}
                      platform.refplat.org/mode: namespace
                      pod-security.kubernetes.io/enforce: baseline
                      pod-security.kubernetes.io/warn: restricted
                      pod-security.kubernetes.io/audit: restricted
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: resourcequota
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ResourceQuota
                  metadata:
                    name: tenant-quota
                    namespace: {{ $ns }}
                  spec:
                    hard:
                      requests.cpu: "{{ $qCpu }}"
                      requests.memory: "{{ $qMem }}"
                      limits.cpu: "{{ $qCpu }}"
                      limits.memory: "{{ $qMem }}"
                      pods: "{{ $qPods }}"
                      services: "{{ $q.services }}"
                      services.loadbalancers: "{{ $q.loadbalancers }}"
                      persistentvolumeclaims: "{{ $q.pvcs }}"
                      requests.storage: "{{ $q.storage }}"
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: limitrange
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: LimitRange
                  metadata:
                    name: tenant-limits
                    namespace: {{ $ns }}
                  spec:
                    limits:
                      - type: Container
                        default:
                          cpu: 500m
                          memory: 512Mi
                        defaultRequest:
                          cpu: 100m
                          memory: 128Mi
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: netpol-default-deny-ingress
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: default-deny-ingress
                    namespace: {{ $ns }}
                  spec:
                    podSelector: {}
                    policyTypes: ["Ingress"]
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: netpol-allow-gateway-ingress
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: allow-gateway-ingress
                    namespace: {{ $ns }}
                  spec:
                    podSelector: {}
                    policyTypes: ["Ingress"]
                    ingress:
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: {{ $gw }}
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: kube-system
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: netpol-allow-dns-egress
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: allow-dns-egress
                    namespace: {{ $ns }}
                  spec:
                    podSelector: {}
                    policyTypes: ["Egress"]
                    egress:
                      - ports:
                          - port: 53
                            protocol: UDP
                          - port: 53
                            protocol: TCP
                      - to:
                          - ipBlock:
                              cidr: 0.0.0.0/0
                              except: ["169.254.169.254/32"]
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cnp-allow-gateway-envoy
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: cilium.io/v2
                  kind: CiliumNetworkPolicy
                  metadata:
                    name: allow-gateway-envoy
                    namespace: {{ $ns }}
                  spec:
                    endpointSelector: {}
                    ingress:
                      - fromEntities: ["ingress", "remote-node", "host"]
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cnp-allow-pod-identity-egress
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: cilium.io/v2
                  kind: CiliumNetworkPolicy
                  metadata:
                    name: allow-pod-identity-egress
                    namespace: {{ $ns }}
                  spec:
                    endpointSelector: {}
                    egress:
                      - toEntities: ["host"]
                        toPorts:
                          - ports:
                              - port: "80"
                                protocol: TCP
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: rolebinding-developers
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: tenant-developers
                    namespace: {{ $ns }}
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: ClusterRole
                    name: tenant-developer
                  subjects:
                    - kind: Group
                      name: {{ $ns }}:developers
                      apiGroup: rbac.authorization.k8s.io
            {{- /* Per-app delivery surface. ECR (A3c) is team-scoped — team-<team>/<app> — so an app's image
                   is built once and promoted across the team's tenants/environments (not rebuilt per tenant);
                   app names are unique within a team. Per-app AWS identity (A3b) follows. */}}
            {{- range $app, $appcfg := $spec.apps }}
            {{- if $cfg.ecrRegistry }}
            ---
            apiVersion: ecr.aws.upbound.io/v1beta1
            kind: Repository
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ecr-repo-{{ $app }}
                crossplane.io/external-name: team-{{ $team }}/{{ $app }}
            spec:
              # Orphan on delete (ADR-062 #283): the ECR repo is team-scoped (team-<team>/<app>) and SHARED
              # across the team's tenants/stages, so removing one tenant claim must NOT destroy images another
              # tenant still uses (and there's no accidental image-loss path on deprovision). Cleanup is a
              # deliberate manual purge / the cluster-teardown ECR orphan sweep — never a tenant delete.
              deletionPolicy: Orphan
              providerConfigRef:
                name: {{ $ecrCfg }}
              forProvider:
                region: {{ $cfg.region }}
                # Parity with the ecr module: tags immutable, but cosign sha256-* signature/attestation tags
                # are exempted so they can be (re)written.
                imageTagMutability: IMMUTABLE_WITH_EXCLUSION
                imageTagMutabilityExclusionFilter:
                  - filter: "sha256-*"
                    filterType: WILDCARD
                imageScanningConfiguration:
                  - scanOnPush: true
                forceDelete: true
                tags:
                  Team: {{ $team }}
            {{- if $ecrPrincipals }}
            ---
            apiVersion: ecr.aws.upbound.io/v1beta1
            kind: RepositoryPolicy
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ecr-repopolicy-{{ $app }}
            spec:
              deletionPolicy: Orphan # follows the repo (shared, retained on deprovision — ADR-062 #283)
              providerConfigRef:
                name: {{ $ecrCfg }}
              forProvider:
                region: {{ $cfg.region }}
                repository: team-{{ $team }}/{{ $app }}
                policy: {{ (dict "Version" "2012-10-17" "Statement" (list (dict "Sid" "CrossAccountPull" "Effect" "Allow" "Principal" (dict "AWS" $ecrPrincipals) "Action" (list "ecr:BatchGetImage" "ecr:GetDownloadUrlForLayer" "ecr:BatchCheckLayerAvailability")))) | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- if $appcfg.serviceAccount }}
            {{- $role := printf "Pod-%s-%s" $ns $app }}
            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Role
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: pod-role-{{ $app }}
                crossplane.io/external-name: {{ $role }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                assumeRolePolicy: {{ (dict "Version" "2012-10-17" "Statement" (list (dict "Effect" "Allow" "Principal" (dict "Service" "pods.eks.amazonaws.com") "Action" (list "sts:AssumeRole" "sts:TagSession") "Condition" (dict "StringEquals" (dict "aws:SourceAccount" $cfg.workloadAccountId))))) | toJson | quote }}
                {{- if $cfg.permissionsBoundaryArn }}
                permissionsBoundary: {{ $cfg.permissionsBoundaryArn | quote }}
                {{- end }}
                tags:
                  Team: {{ $team }}
                  Tenant: {{ $name }}
                  App: {{ $app }}
            ---
            apiVersion: eks.aws.upbound.io/v1beta1
            kind: PodIdentityAssociation
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: pod-identity-{{ $app }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                region: {{ $cfg.region }}
                clusterName: {{ $cfg.clusterName }}
                namespace: {{ $ns }}
                serviceAccount: {{ $appcfg.serviceAccount }}
                roleArn: arn:aws:iam::{{ $cfg.workloadAccountId }}:role/{{ $role }}
            {{- $awsPerms := (($appcfg.permissions | default dict).aws | default dict) }}
            {{- if $awsPerms.policyStatements }}
            {{- $stmts := list }}
            {{- range $s := $awsPerms.policyStatements }}
            {{- $st := dict "Effect" ($s.effect | default "Allow") "Action" $s.actions "Resource" $s.resources }}
            {{- if $s.sid }}{{- $st = merge $st (dict "Sid" $s.sid) }}{{- end }}
            {{- $stmts = append $stmts $st }}
            {{- end }}
            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: RolePolicy
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: pod-rolepolicy-{{ $app }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                role: {{ $role }}
                policy: {{ (dict "Version" "2012-10-17" "Statement" $stmts) | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* Per-team image-registry guard (ADR-014). Workloads in this tenant namespace may run only
                   images from the team's ECR scope. SUBTLETY: the ECR repo is team-scoped (team-<team>/<app>,
                   env-agnostic — built once, promoted across stages), so the allowed prefix is team-<team>,
                   NOT the namespace ($ns = <team>-<name>-<env>). Named per-namespace so a team's stages/tenants
                   don't collide on one cluster. */}}
            {{- if $cfg.ecrRegistry }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kyverno-restrict-images
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: kyverno.io/v1
                  kind: ClusterPolicy
                  metadata:
                    name: restrict-images-{{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      platform.refplat.org/tenant: {{ $team }}
                  spec:
                    background: true
                    rules:
                      - name: only-own-team-images
                        match:
                          any:
                            - resources:
                                kinds: ["Pod"]
                                namespaces: ["{{ $ns }}"]
                        validate:
                          failureAction: Enforce
                          message: "team-{{ $team }} workloads may only run images under {{ $cfg.ecrRegistry }}/team-{{ $team }}/."
                          foreach:
                            - list: "request.object.spec.containers"
                              pattern:
                                image: "{{ $cfg.ecrRegistry }}/team-{{ $team }}/*"
                            - list: "request.object.spec.initContainers"
                              pattern:
                                image: "{{ $cfg.ecrRegistry }}/team-{{ $team }}/*"
                            - list: "request.object.spec.ephemeralContainers"
                              pattern:
                                image: "{{ $cfg.ecrRegistry }}/team-{{ $team }}/*"
            {{- end }}
            {{- /* ADR-060/061 (Phase 2a): build the restrict-route-hostnames allow-list AND the XR
                   status.domains state. The generated host <app>-<team>-<env>.<baseDomain> (+ the -pr-* preview
                   wildcard) is the system anchor — ALWAYS Active + always admitted (no-regression rule).
                   Declared $spec.domains aliases are gated by tier: tier-1/2 (under our wildcard, host ends
                   with .<baseDomain>) are platform-owned → Active on creation; tier-3 external hosts have no
                   backing infra yet → Pending (provisioned in Phase 2b), so NOT admitted. Kyverno admits a
                   host only while Active — verification is the security boundary (ADR-061 §5). The host carries
                   <env> so a tenant's stages (dev/test/uat/…) don't collide on one cluster; the policy is named
                   per-namespace (restrict-route-hostnames-<ns>) for the same reason. */}}
            {{- $base := $cfg.baseDomain }}
            {{- $allowed := list }}
            {{- $statusByHost := dict }}
            {{- if $base }}
            {{- range $app, $appcfg := $spec.apps }}
            {{- $gen := printf "%s-%s-%s.%s" $app $team $environment $base }}
            {{- $allowed = append $allowed $gen }}
            {{- $allowed = append $allowed (printf "%s-%s-%s-pr-*.%s" $app $team $environment $base) }}
            {{- $statusByHost = set $statusByHost $gen (dict "host" $gen "state" "Active" "mode" "platform-managed" "reason" "GeneratedHost") }}
            {{- end }}
            {{- end }}
            {{- range $d := $spec.domains | default list }}
            {{- $host := $d.host }}
            {{- if and $base (hasSuffix (printf ".%s" $base) $host) }}
            {{- $allowed = append $allowed $host }}
            {{- if not (hasKey $statusByHost $host) }}{{- $statusByHost = set $statusByHost $host (dict "host" $host "state" "Active" "mode" "platform-managed" "reason" "PlatformDomain") }}{{- end }}
            {{- else }}
            {{- if not (hasKey $statusByHost $host) }}{{- $statusByHost = set $statusByHost $host (dict "host" $host "state" "Pending" "mode" "platform-managed" "reason" "AwaitingProvisioning" "message" "External custom domains are provisioned in Phase 2b (ADR-061).") }}{{- end }}
            {{- end }}
            {{- end }}
            {{- $allowed = $allowed | uniq }}
            {{- $statusDomains := list }}
            {{- range $h := (keys $statusByHost | sortAlpha) }}{{- $statusDomains = append $statusDomains (index $statusByHost $h) }}{{- end }}
            {{- if $statusDomains }}
            ---
            apiVersion: platform.refplat.org/v1alpha2
            kind: XTenant
            metadata:
              name: {{ $xrName }}
            status:
              domains:
              {{- range $sd := $statusDomains }}
                - host: {{ $sd.host }}
                  state: {{ $sd.state }}
                  mode: {{ $sd.mode }}
                  reason: {{ $sd.reason }}
                  {{- if $sd.message }}
                  message: {{ $sd.message | quote }}
                  {{- end }}
              {{- end }}
            {{- end }}
            {{- if $allowed }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kyverno-restrict-hostnames
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: kyverno.io/v1
                  kind: ClusterPolicy
                  metadata:
                    name: restrict-route-hostnames-{{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      platform.refplat.org/tenant: {{ $team }}
                  spec:
                    background: true
                    rules:
                      - name: allowed-hostnames
                        match:
                          any:
                            - resources:
                                kinds: ["HTTPRoute", "GRPCRoute", "TLSRoute"]
                                namespaces: ["{{ $ns }}"]
                        validate:
                          failureAction: Enforce
                          message: "team-{{ $team }} routes may only use: {{ $allowed | join ", " }}."
                          foreach:
                            - list: "request.object.spec.hostnames"
                              deny:
                                conditions:
                                  all:
                                    - key: "{{`{{ element }}`}}"
                                      operator: AnyNotIn
                                      value: {{ $allowed | toJson }}
            {{- end }}
    - step: ready
      functionRef:
        name: function-auto-ready
