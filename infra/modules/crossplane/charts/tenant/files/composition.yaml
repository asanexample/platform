# Tenant Composition (Crossplane v2, Pipeline mode). Renders a tenant's Kubernetes resources as
# provider-kubernetes Objects via function-go-templating, then marks the XR ready via function-auto-ready.
# Parity target: infra/modules/tenant/main.tf (namespace, quota, limits, NetworkPolicies, CNPs, RoleBinding).
# NOTE: this file is shipped raw (.Files.Get) so Helm does not process the inline go-template delimiters.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenant
  labels:
    crossplane.io/xrd: xtenants.platform.refplat.org
spec:
  compositeTypeRef:
    apiVersion: platform.refplat.org/v1alpha1
    kind: XTenant
  mode: Pipeline
  pipeline:
    # Load cluster constants (ECR registry, account IDs, cluster name, pull accounts, boundary ARN) into the
    # pipeline context so the template can read them without them leaking into the tenant claim spec.
    - step: load-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: tenant-cluster-config
    - step: render-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $team := $spec.team }}
            {{- $ns := printf "team-%s" $team }}
            {{- $q := $spec.resourceQuota }}
            {{- $gw := $spec.gatewayNamespace | default "default" }}
            {{- $env := index .context "apiextensions.crossplane.io/environment" }}
            {{- $aws := $spec.aws | default dict }}
            {{- $devAccess := $spec.developerAccess | default (dict "enabled" true) }}
            {{- $ecrCfg := $env.providerConfigEcr | default "default" }}
            {{- $pullAccts := list }}
            {{- if and $env $env.pullAccountIds }}{{- $pullAccts = $env.pullAccountIds | fromJson }}{{- end }}
            {{- $ecrPrincipals := list }}
            {{- range $a := $pullAccts }}{{- $ecrPrincipals = append $ecrPrincipals (printf "arn:aws:iam::%s:root" $a) }}{{- end }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: namespace
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Namespace
                  metadata:
                    name: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      platform.refplat.org/tenant: {{ $team }}
                      platform.refplat.org/mode: namespace
                      pod-security.kubernetes.io/enforce: baseline
                      pod-security.kubernetes.io/warn: restricted
                      pod-security.kubernetes.io/audit: restricted
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: resourcequota
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ResourceQuota
                  metadata:
                    name: tenant-quota
                    namespace: {{ $ns }}
                  spec:
                    hard:
                      requests.cpu: "{{ $q.cpu }}"
                      requests.memory: "{{ $q.memory }}"
                      limits.cpu: "{{ $q.cpu }}"
                      limits.memory: "{{ $q.memory }}"
                      pods: "{{ $q.pods }}"
                      services: "{{ $q.services }}"
                      services.loadbalancers: "{{ $q.loadbalancers }}"
                      persistentvolumeclaims: "{{ $q.pvcs }}"
                      requests.storage: "{{ $q.storage }}"
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: limitrange
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: LimitRange
                  metadata:
                    name: tenant-limits
                    namespace: {{ $ns }}
                  spec:
                    limits:
                      - type: Container
                        default:
                          cpu: 500m
                          memory: 512Mi
                        defaultRequest:
                          cpu: 100m
                          memory: 128Mi
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: netpol-default-deny-ingress
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: default-deny-ingress
                    namespace: {{ $ns }}
                  spec:
                    podSelector: {}
                    policyTypes: ["Ingress"]
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: netpol-allow-gateway-ingress
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: allow-gateway-ingress
                    namespace: {{ $ns }}
                  spec:
                    podSelector: {}
                    policyTypes: ["Ingress"]
                    ingress:
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: {{ $gw }}
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: kube-system
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: netpol-allow-dns-egress
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: allow-dns-egress
                    namespace: {{ $ns }}
                  spec:
                    podSelector: {}
                    policyTypes: ["Egress"]
                    egress:
                      - ports:
                          - port: 53
                            protocol: UDP
                          - port: 53
                            protocol: TCP
                      - to:
                          - ipBlock:
                              cidr: 0.0.0.0/0
                              except: ["169.254.169.254/32"]
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cnp-allow-gateway-envoy
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: cilium.io/v2
                  kind: CiliumNetworkPolicy
                  metadata:
                    name: allow-gateway-envoy
                    namespace: {{ $ns }}
                  spec:
                    endpointSelector: {}
                    ingress:
                      - fromEntities: ["ingress", "remote-node", "host"]
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cnp-allow-pod-identity-egress
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: cilium.io/v2
                  kind: CiliumNetworkPolicy
                  metadata:
                    name: allow-pod-identity-egress
                    namespace: {{ $ns }}
                  spec:
                    endpointSelector: {}
                    egress:
                      - toEntities: ["host"]
                        toPorts:
                          - ports:
                              - port: "80"
                                protocol: TCP
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: rolebinding-developers
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: tenant-developers
                    namespace: {{ $ns }}
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: ClusterRole
                    name: tenant-developer
                  subjects:
                    - kind: Group
                      name: {{ $ns }}:developers
                      apiGroup: rbac.authorization.k8s.io
            {{- if $env.ecrRegistry }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kyverno-restrict-images
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: kyverno.io/v1
                  kind: ClusterPolicy
                  metadata:
                    name: restrict-images-team-{{ $team }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      platform.refplat.org/tenant: {{ $team }}
                  spec:
                    background: true
                    rules:
                      - name: only-own-team-images
                        match:
                          any:
                            - resources:
                                kinds: ["Pod"]
                                namespaces: ["{{ $ns }}"]
                        validate:
                          failureAction: Enforce
                          message: "team-{{ $team }} workloads may only run images under {{ $env.ecrRegistry }}/{{ $ns }}/."
                          foreach:
                            - list: "request.object.spec.containers"
                              pattern:
                                image: "{{ $env.ecrRegistry }}/{{ $ns }}/*"
                            - list: "request.object.spec.initContainers"
                              pattern:
                                image: "{{ $env.ecrRegistry }}/{{ $ns }}/*"
                            - list: "request.object.spec.ephemeralContainers"
                              pattern:
                                image: "{{ $env.ecrRegistry }}/{{ $ns }}/*"
            {{- end }}
            {{- /* ADR-060/061: derive allowed route hostnames per app — <app>-<team>.<baseDomain> + the
                   <app>-<team>-pr-* preview wildcard — from the (app, team, baseDomain) convention, then
                   UNION the tier-1/2 aliases declared in $spec.domains (the claim is the sole source). */}}
            {{- $allowed := list }}
            {{- range $d := $spec.domains | default list }}{{- $allowed = append $allowed $d.host }}{{- end }}
            {{- if $env.baseDomain }}
            {{- range $app, $appcfg := $spec.apps }}
            {{- $allowed = append $allowed (printf "%s-%s.%s" $app $team $env.baseDomain) }}
            {{- $allowed = append $allowed (printf "%s-%s-pr-*.%s" $app $team $env.baseDomain) }}
            {{- end }}
            {{- end }}
            {{- $allowed = $allowed | uniq }}
            {{- if $allowed }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kyverno-restrict-hostnames
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: kyverno.io/v1
                  kind: ClusterPolicy
                  metadata:
                    name: restrict-route-hostnames-team-{{ $team }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      platform.refplat.org/tenant: {{ $team }}
                  spec:
                    background: true
                    rules:
                      - name: allowed-hostnames
                        match:
                          any:
                            - resources:
                                kinds: ["HTTPRoute", "GRPCRoute", "TLSRoute"]
                                namespaces: ["{{ $ns }}"]
                        validate:
                          failureAction: Enforce
                          message: "team-{{ $team }} routes may only use: {{ $allowed | join ", " }}."
                          foreach:
                            - list: "request.object.spec.hostnames"
                              deny:
                                conditions:
                                  all:
                                    - key: "{{`{{ element }}`}}"
                                      operator: AnyNotIn
                                      value: {{ $allowed | toJson }}
            {{- end }}
            {{- if $aws.serviceAccount }}
            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Role
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: pod-team-role
                crossplane.io/external-name: Pod-team-{{ $team }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                assumeRolePolicy: {{ (dict "Version" "2012-10-17" "Statement" (list (dict "Effect" "Allow" "Principal" (dict "Service" "pods.eks.amazonaws.com") "Action" (list "sts:AssumeRole" "sts:TagSession") "Condition" (dict "StringEquals" (dict "aws:SourceAccount" $env.workloadAccountId))))) | toJson | quote }}
                {{- if $env.permissionsBoundaryArn }}
                permissionsBoundary: {{ $env.permissionsBoundaryArn | quote }}
                {{- end }}
                tags:
                  Team: {{ $team }}
            ---
            apiVersion: eks.aws.upbound.io/v1beta1
            kind: PodIdentityAssociation
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: pod-identity-association
            spec:
              providerConfigRef:
                name: default
              forProvider:
                region: {{ $env.region }}
                clusterName: {{ $env.clusterName }}
                namespace: {{ $ns }}
                serviceAccount: {{ $aws.serviceAccount }}
                roleArn: arn:aws:iam::{{ $env.workloadAccountId }}:role/Pod-team-{{ $team }}
            {{- end }}
            {{- if $aws.policyStatements }}
            {{- $stmts := list }}
            {{- range $s := $aws.policyStatements }}
            {{- $st := dict "Effect" ($s.effect | default "Allow") "Action" $s.actions "Resource" $s.resources }}
            {{- if $s.sid }}{{- $st = merge $st (dict "Sid" $s.sid) }}{{- end }}
            {{- $stmts = append $stmts $st }}
            {{- end }}
            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: RolePolicy
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: pod-team-rolepolicy
            spec:
              providerConfigRef:
                name: default
              forProvider:
                role: Pod-team-{{ $team }}
                policy: {{ (dict "Version" "2012-10-17" "Statement" $stmts) | toJson | quote }}
            {{- end }}
            {{- if $devAccess.enabled }}
            {{- /* Per-team developer cluster access (P2c, ADR-039/040): a DeveloperAccess-<team> IAM role
                   trusted by the team's SSO permission set (Dev-<team>) in the management + workload accounts,
                   mapped via an EKS access entry to the team-<team>:developers group (the RoleBinding above
                   grants the actual namespace-scoped authz). */}}
            {{- $devPrincipals := list (printf "arn:aws:iam::%s:root" $env.workloadAccountId) }}
            {{- $devSsoArns := list (printf "arn:aws:iam::%s:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_Dev-%s_*" $env.workloadAccountId $team) }}
            {{- if $env.managementAccountId }}
            {{- $devPrincipals = append $devPrincipals (printf "arn:aws:iam::%s:root" $env.managementAccountId) }}
            {{- $devSsoArns = append $devSsoArns (printf "arn:aws:iam::%s:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_Dev-%s_*" $env.managementAccountId $team) }}
            {{- end }}
            {{- $devTrust := dict "Version" "2012-10-17" "Statement" (list (dict "Effect" "Allow" "Principal" (dict "AWS" $devPrincipals) "Action" "sts:AssumeRole" "Condition" (dict "ArnLike" (dict "aws:PrincipalArn" $devSsoArns)))) }}
            {{- $devPolicy := dict "Version" "2012-10-17" "Statement" (list (dict "Sid" "EKSAccess" "Effect" "Allow" "Action" (list "eks:DescribeCluster" "eks:ListClusters") "Resource" "*") (dict "Sid" "Identity" "Effect" "Allow" "Action" (list "sts:GetCallerIdentity") "Resource" "*")) }}
            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Role
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: developer-access-role
                crossplane.io/external-name: DeveloperAccess-{{ $team }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                assumeRolePolicy: {{ $devTrust | toJson | quote }}
                {{- if $env.permissionsBoundaryArn }}
                permissionsBoundary: {{ $env.permissionsBoundaryArn | quote }}
                {{- end }}
                tags:
                  Team: {{ $team }}
            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: RolePolicy
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: developer-access-rolepolicy
            spec:
              providerConfigRef:
                name: default
              forProvider:
                role: DeveloperAccess-{{ $team }}
                policy: {{ $devPolicy | toJson | quote }}
            ---
            apiVersion: eks.aws.upbound.io/v1beta1
            kind: AccessEntry
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: developer-access-entry
            spec:
              providerConfigRef:
                name: default
              forProvider:
                region: {{ $env.region }}
                clusterName: {{ $env.clusterName }}
                principalArn: arn:aws:iam::{{ $env.workloadAccountId }}:role/DeveloperAccess-{{ $team }}
                type: STANDARD
                kubernetesGroups:
                  - team-{{ $team }}:developers
                tags:
                  Team: {{ $team }}
            {{- end }}
            {{- range $app, $appcfg := $spec.apps }}
            ---
            apiVersion: ecr.aws.upbound.io/v1beta1
            kind: Repository
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ecr-repo-{{ $app }}
                crossplane.io/external-name: {{ $ns }}/{{ $app }}
            spec:
              providerConfigRef:
                name: {{ $ecrCfg }}
              forProvider:
                region: {{ $env.region }}
                # Parity with the ecr module: image tags stay immutable, but cosign's sha256-* signature/
                # attestation tags are exempted so they can be updated (multiple attestations per digest).
                imageTagMutability: IMMUTABLE_WITH_EXCLUSION
                imageTagMutabilityExclusionFilter:
                  - filter: "sha256-*"
                    filterType: WILDCARD
                imageScanningConfiguration:
                  - scanOnPush: true
                forceDelete: true
                tags:
                  Team: {{ $team }}
            ---
            apiVersion: ecr.aws.upbound.io/v1beta1
            kind: RepositoryPolicy
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ecr-repopolicy-{{ $app }}
            spec:
              providerConfigRef:
                name: {{ $ecrCfg }}
              forProvider:
                region: {{ $env.region }}
                repository: {{ $ns }}/{{ $app }}
                policy: {{ (dict "Version" "2012-10-17" "Statement" (list (dict "Sid" "CrossAccountPull" "Effect" "Allow" "Principal" (dict "AWS" $ecrPrincipals) "Action" (list "ecr:BatchGetImage" "ecr:GetDownloadUrlForLayer" "ecr:BatchCheckLayerAvailability")))) | toJson | quote }}
            {{- end }}
    - step: ready
      functionRef:
        name: function-auto-ready
