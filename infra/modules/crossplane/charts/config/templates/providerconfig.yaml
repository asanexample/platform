{{- if .Values.enableAws }}
# EKS Pod Identity credentials (ADR-041/047): no SA annotation, no OIDC. The provider pods assume the
# provisioning IAM role via the Pod Identity association created in Terraform. Cluster-scoped (v2 API).
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: {{ .Values.providerConfigName }}
spec:
  credentials:
    source: PodIdentity
---
# Same Pod Identity creds for the Crossplane v2 *namespaced* provider family (aws.m.upbound.io). The
# tenant resource plane (per-env S3/SQS/SNS/DynamoDB MRs) is composed as namespaced MRs that live in the
# environment namespace (ADR-073) so the catalog/Backstage K8s plugin can read their live status; namespaced
# MRs resolve credentials from a config in the .m. family, not the legacy ProviderConfig above. Cluster-scoped
# (one object, mirrors the legacy ProviderConfig) — referenced as `providerConfigRef.kind: ClusterProviderConfig`.
apiVersion: aws.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: {{ .Values.providerConfigName }}
spec:
  credentials:
    source: PodIdentity
{{- if .Values.ecrProvisionerRoleArn }}
---
# Cross-account ECR: Pod Identity base creds (the preprod provisioning role) chained into the platform
# account via the scoped crossplane-ecr-provisioner role. Used by provider-aws-ecr to create environment repos.
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: platform-ecr
spec:
  credentials:
    source: PodIdentity
  assumeRoleChain:
    - roleARN: {{ .Values.ecrProvisionerRoleArn }}
{{- end }}
{{- end }}
