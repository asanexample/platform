{{- if .Values.enableKubernetes }}
# provider-kubernetes authenticates in-cluster (InjectedIdentity = the provider pod's ServiceAccount).
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: {{ .Values.providerConfigName }}
spec:
  credentials:
    source: InjectedIdentity
---
# Scoped RBAC for the provider-kubernetes ServiceAccount — exactly the resource types the Environment Composition
# creates, NOT cluster-admin. Explicit verbs/resources only: no wildcards (passes restrict-wildcard-rbac),
# and it never binds cluster-admin (passes restrict-binding-clusteradmin). Least-privilege per ADR-048.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-environment-provisioner
rules:
  # Environment namespace + governance objects.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Developer RoleBindings into the environment namespace (bound to the shared environment-developer ClusterRole).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Creating a RoleBinding to environment-developer is an RBAC privilege grant; Kubernetes' escalation check
  # requires the creator to hold the granted perms OR have "bind" on the referenced role. Grant "bind"
  # scoped to exactly environment-developer (resourceNames) — least privilege, no need to mirror edit's perms.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["environment-developer"]
    verbs: ["bind"]
  # Per-team Kyverno policies (P2b) — cluster-scoped ClusterPolicies.
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Per-Service resource-output ConfigMaps (ADR-073): the Composition writes <svc>-resources into the
  # Environment namespace (bucket names, etc.) via a provider-kubernetes Object; the workload consumes it via
  # envFrom. Namespaced, non-secret outputs only (credentialed engines use a Secret/ESO path, not this).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Platform-trust ClusterRoleBindings (ADR-081): a platform-OWNED Team's Environment can request that a blessed,
  # read-only platform-trust ClusterRole be bound to its ServiceAccounts for cross-namespace reads (e.g. an
  # observability/triage agent). The Composition creates a cluster-scoped ClusterRoleBinding via provider-kubernetes,
  # so the provider must manage clusterrolebindings AND — per the RBAC escalation check — hold "bind" on the
  # platform-trust roles. The "bind" is scoped by resourceNames to exactly the platform-provided roles, never
  # arbitrary (mirrors the environment-developer grant above). NOTE: add any new platform-trust ClusterRole to BOTH
  # this resourceNames list and environment-api/templates/platform-trust-cluster-roles.yaml.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["platform-trust-observability-reader"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-environment-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-environment-provisioner
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: {{ .Values.namespace }}
{{- end }}
