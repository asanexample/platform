apiVersion: v2
name: crossplane-teams
description: >-
  The Team registry projection (ADR-049, docs/architecture/tenant-api-v2.md). Renders the canonical Team
  records supplied in values into the minimal projected Team CRs (the admission-relevant envelope subset) that
  Kyverno's restrict-tenant-envelope policy reads during XTenant admission. Installed after the tenant chart
  (which defines the Team CRD); federated per-cluster (ADR-048).
type: application
version: 0.1.0
appVersion: "1.0.0"
