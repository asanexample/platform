{{- /*
Project each canonical Team record into a minimal Team CR — envelope subset only. Canonical-only fields
(displayName/developerGroup/costCenter/contacts) are deliberately dropped; the CRD's structural schema would
reject them anyway. toJson keeps arrays/maps valid (JSON is valid YAML).
*/ -}}
{{- range $name, $t := .Values.teams }}
{{- if not $t.ssoGroup }}{{ fail (printf "team %q: spec.ssoGroup is required" $name) }}{{ end }}
{{- if not $t.envelope }}{{ fail (printf "team %q: spec.envelope is required" $name) }}{{ end }}
---
apiVersion: platform.refplat.org/v1alpha2
kind: Team
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/managed-by: terraform
    app.kubernetes.io/part-of: tenant-api
    {{- range $k, $v := $.Values.commonLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  ssoGroup: {{ $t.ssoGroup | quote }}
  envelope:
    allowedTiers: {{ $t.envelope.allowedTiers | toJson }}
    allowedEnvironments: {{ $t.envelope.allowedEnvironments | toJson }}
    {{- with $t.envelope.allowedLocations }}
    allowedLocations: {{ . | toJson }}
    {{- end }}
    {{- with $t.envelope.quotaCap }}
    quotaCap: {{ . | toJson }}
    {{- end }}
    maxDedicatedZones: {{ $t.envelope.maxDedicatedZones | default 0 }}
{{- end }}
