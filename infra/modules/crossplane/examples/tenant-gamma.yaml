# P2a parity test (issue #173) — a throwaway test team provisioned ONLY via a Tenant claim (absent from
# teams.hcl, so no double-provisioning). Cluster-scoped XTenant; created by a platform actor (GitOps),
# never by a tenant. Compare the resulting team-gamma namespace + resources to a teams.hcl team (alpha).
#
#   kubectl apply -f tenant-gamma.yaml
#   kubectl get xtenant gamma -o wide                       # SYNCED=True READY=True
#   kubectl get ns team-gamma -o yaml                       # PSA + tenant labels
#   kubectl get resourcequota,limitrange,networkpolicy,ciliumnetworkpolicy,rolebinding -n team-gamma
#   # diff each against team-alpha to document parity
#   kubectl delete -f tenant-gamma.yaml                     # cascades; namespace + resources removed
apiVersion: platform.refplat.org/v1alpha1
kind: XTenant
metadata:
  name: gamma
spec:
  team: gamma
  gatewayNamespace: default
  # spec.domains aliases (ADR-061). This throwaway test team declares no apps, so no host is auto-derived;
  # the alias is what its routes may claim for the parity check.
  domains:
    - host: demo-gamma.preprod.aws.refplat.org
  resourceQuota:
    cpu: "4"
    memory: 8Gi
    pods: 20
  complianceTier: standard
