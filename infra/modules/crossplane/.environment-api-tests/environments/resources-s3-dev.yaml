# Self-service cloud resources (ADR-073, Phase A): a dev declares an S3 objectstore on a service. The
# Composition must render the safe-by-construction Bucket + sub-MRs, DERIVE scoped IAM onto the service's
# Pod-Identity role, and publish the bucket name into the <svc>-resources ConfigMap.
apiVersion: platform.refplat.org/v1beta1
kind: XEnvironment
metadata: { name: shop-dev }
spec:
  team: alpha
  product: shop
  stage: dev
  services:
    web:
      repoPath: services/web
      serviceAccount: shop-web
      resources:
        uploads: { kind: objectstore, engine: s3, access: readwrite }
        assets: { kind: objectstore, engine: s3, access: read }
