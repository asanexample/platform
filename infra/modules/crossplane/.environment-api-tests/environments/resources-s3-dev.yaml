# Self-service cloud resources (ADR-073, Phase A): a dev declares S3 objectstores AND an SQS queue on a service.
# The Composition must render the safe-by-construction MRs per engine, DERIVE scoped IAM onto the service's
# Pod-Identity role, and publish the names/URLs into the <svc>-resources ConfigMap.
apiVersion: platform.refplat.org/v1beta1
kind: XEnvironment
metadata: { name: shop-dev }
spec:
  team: alpha
  product: shop
  stage: dev
  services:
    web:
      repoPath: services/web
      serviceAccount: shop-web
      resources:
        uploads: { kind: objectstore, engine: s3, access: readwrite }
        assets: { kind: objectstore, engine: s3, access: read }
        jobs: { kind: stream, engine: sqs, access: readwrite }
        notify: { kind: stream, engine: sns, access: readwrite }
        sessions: { kind: keyvalue, engine: dynamodb, access: readwrite }
