# Team ${{ values.name }} — first-class git-native governance object (ADR-063).
# The envelope is the bound on every Environment this team may author; Kyverno reads the projected Team CR during
# XTenant admission (restrict-environment-envelope). Platform-authored (admin-only); developers author Environments, not
# this. Source of truth for the team's identity (ssoGroup) + envelope.
apiVersion: platform.refplat.org/v1alpha2
kind: Team
metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: environment-api
spec:
  ssoGroup: ${{ values.ssoGroup }}
  envelope:
    allowedTiers: ${{ values.allowedTiers | dump }}
    allowedEnvironments: ${{ values.allowedEnvironments | dump }}
    allowedLocations: ["*"]
    quotaCap:
      cpu: "${{ values.cpu }}"
      memory: ${{ values.memory }}
      pods: ${{ values.pods }}
    maxDedicatedZones: 0
