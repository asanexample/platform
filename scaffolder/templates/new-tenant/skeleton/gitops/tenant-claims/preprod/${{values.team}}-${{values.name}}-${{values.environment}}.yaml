# Tenant claim for Team ${{ values.team }}, Tenant "${{ values.name }}", stage "${{ values.environment }}"
# (v1alpha2). Authored by the Backstage New Tenant template (ADR-062 self-service); synced by ArgoCD
# (tenant-claims-preprod) and reconciled by the Crossplane Tenant Composition v2. This file is the source
# of truth — change or remove it via PR. One claim per (team, name, environment); the namespace is
# <team>-<name>-<env>. See docs/architecture/tenant-api-v2.md and docs/runbooks/tenant-onboarding.md.
apiVersion: platform.refplat.org/v1alpha2
kind: XTenant
metadata:
  name: ${{ values.team }}-${{ values.name }}-${{ values.environment }}
  annotations:
    platform.refplat.org/requested-by: ${{ values.requestedBy }}
spec:
  team: ${{ values.team }}
  name: ${{ values.name }}
  environment: ${{ values.environment }}
  apps:
    ${{ values.appName }}:
      repo: ${{ values.repo }} # owner/repo — the single source argocd-apps/policy/github-oidc derive from
      preview: ${{ values.preview }}
      serviceAccount: ${{ values.serviceAccount if values.serviceAccount else 'app-' + values.team }}
  {%- if values.cpu or values.memory or values.pods %}
  quota:
    {%- if values.cpu %}
    cpu: "${{ values.cpu }}"
    {%- endif %}
    {%- if values.memory %}
    memory: ${{ values.memory }}
    {%- endif %}
    {%- if values.pods %}
    pods: ${{ values.pods }}
    {%- endif %}
  {%- endif %}
  developerAccess:
    enabled: true
