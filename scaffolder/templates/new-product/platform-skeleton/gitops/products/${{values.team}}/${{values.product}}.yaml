# Product "${{ values.product }}" owned by Team ${{ values.team }} (ADR-067 / ADR-069). The git-native registry
# entry — delivery (argocd-apps, github-oidc, policy) derives repo/domains from here; it is also projected as a
# Product CR for admission (image-scope team-${{ values.team }}/${{ values.product }}-*, tenancy, owned domains).
# One repo per product. Authored by the Backstage New Product template (ADR-062 self-service).
apiVersion: platform.refplat.org/v1alpha3
kind: Product
metadata:
  name: ${{ values.team }}-${{ values.product }}
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: tenant-api
spec:
  team: ${{ values.team }}
  repo: asanexample/app-${{ values.team }}-${{ values.product }}
  tenancy: pooled
  defaultIsolation: { compute: dedicated-namespace }
  domains: []
