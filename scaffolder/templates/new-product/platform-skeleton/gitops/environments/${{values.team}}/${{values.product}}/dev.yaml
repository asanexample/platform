# Environment (${{ values.team }} × ${{ values.product }} × dev) — the first stage, authored by the Backstage
# New Product template (ADR-067 v1alpha3). Namespace ${{ values.team }}-${{ values.product }}-dev. Synced by
# ArgoCD (the `environments` registry-sync app) and reconciled by the Crossplane Environment Composition (v3).
# The image is omitted until the new repo's first CI build pins a signed digest into k8s/overlays/dev.
apiVersion: platform.refplat.org/v1alpha3
kind: XEnvironment
metadata:
  # CLUSTER-scoped XR → team-prefixed, globally unique (ADR-067).
  name: ${{ values.team }}-${{ values.product }}-dev
  annotations:
    platform.refplat.org/requested-by: ${{ values.requestedBy }}
spec:
  team: ${{ values.team }} # validated == Product.team at the gate + admission
  product: ${{ values.product }}
  stage: dev
  tier: standard
  services:
    ${{ values.service }}:
      serviceAccount: app-${{ values.team }} # Pod Identity binds this named SA; the app repo's serviceaccount.yaml creates it
      # image omitted — declared but NOT yet deployed (the first-deploy state). The per-Product ApplicationSet
      # skips this (Environment × Service) pair until the first CI build promotes a digest into k8s/overlays/dev.
