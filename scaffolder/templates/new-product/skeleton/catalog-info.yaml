apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.team }}-${{ values.product }}-${{ values.service }}
  description: ${{ values.team }}'s ${{ values.product }} ${{ values.service }} service
  annotations:
    github.com/project-slug: asanexample/app-${{ values.team }}-${{ values.product }}
    # The per-Product ArgoCD Application for the dev stage (the per-Product ApplicationSet names it
    # <team>-<product>-<stage>).
    argocd/app-name: ${{ values.team }}-${{ values.product }}-dev
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=app-${{ values.team }}-${{ values.product }}
    backstage.io/kubernetes-namespace: ${{ values.team }}-${{ values.product }}-dev
spec:
  type: service
  # Component (the Service code) of the Product System (ADR-067: Product=System, Service=Component).
  lifecycle: experimental
  owner: ${{ values.team }}
  system: ${{ values.team }}-${{ values.product }}
