{%- if values.language in ['java', 'ruby'] -%}
{%- set cpuReq = '250m' -%}{%- set memReq = '320Mi' -%}{%- set cpuLim = '1' -%}{%- set memLim = '768Mi' -%}{%- set startFail = 36 -%}
{%- elif values.language in ['nodejs', 'python'] -%}
{%- set cpuReq = '100m' -%}{%- set memReq = '128Mi' -%}{%- set cpuLim = '500m' -%}{%- set memLim = '256Mi' -%}{%- set startFail = 18 -%}
{%- else -%}
{%- set cpuReq = '50m' -%}{%- set memReq = '64Mi' -%}{%- set cpuLim = '250m' -%}{%- set memLim = '128Mi' -%}{%- set startFail = 12 -%}
{%- endif -%}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-${{ values.team }}-${{ values.product }}
  labels:
    app: app-${{ values.team }}-${{ values.product }}
    app.kubernetes.io/name: app-${{ values.team }}-${{ values.product }}
    team: ${{ values.team }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-${{ values.team }}-${{ values.product }}
  template:
    metadata:
      labels:
        app: app-${{ values.team }}-${{ values.product }}
        app.kubernetes.io/name: app-${{ values.team }}-${{ values.product }}
        team: ${{ values.team }}
    spec:
      # Named SA — Pod Identity binds AWS creds here IF the Environment declares any (ADR-041). This starter
      # needs no AWS, but keeps the named SA so the wiring is ready (and never the `default` SA).
      serviceAccountName: app-${{ values.team }}
      # App does not talk to the Kubernetes API — drop the SA token (least privilege). Required by the
      # platform Kyverno policy restrict-automount-sa-token (also auto-injected by mutate when absent).
      automountServiceAccountToken: false
      # Graceful drain (ADR-085): the container preStop sleep keeps the pod serving for a beat after it goes
      # Terminating so endpoint de-programming wins the race with SIGTERM; this budget must exceed that sleep
      # plus the app's in-flight drain. The platform mutate injects the same default when absent — set here so
      # the zero-downtime shape is explicit. Your app must still drain in-flight work on SIGTERM.
      terminationGracePeriodSeconds: 30
      # Explicit hardened pod securityContext (defense-in-depth — the platform mutate would inject the
      # container-level bits, but a best-practice starter sets them outright). The image runs as a non-root
      # user (Dockerfile USER), so runAsNonRoot is satisfiable.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes and AZs so a single node/AZ loss (or a Karpenter consolidation) can't take
      # all replicas at once (ADR-085). ScheduleAnyway (soft) — a hard constraint would strand pods Pending on a
      # small or scaling-from-zero cluster. matchLabelKeys adds pod-template-hash so each rollout revision spreads
      # independently. This lives in the skeleton (not the platform mutate) because the labelSelector must match
      # this workload's own pods, which a generic mutate can't know.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: app-${{ values.team }}-${{ values.product }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: app-${{ values.team }}-${{ values.product }}
      containers:
        - name: app-${{ values.team }}-${{ values.product }}
          # Product-scoped ECR image (v3: team-<team>/<product>-<service>). The :placeholder tag is the
          # pre-first-deploy seed; each overlay's `images:` pins the signed digest CI promotes per stage
          # (promote-by-PR, #377). restrict-images admits team-${{ values.team }}/${{ values.product }}-* (the product's repos).
          image: 829808296602.dkr.ecr.us-east-1.amazonaws.com/team-${{ values.team }}/${{ values.product }}-${{ values.service }}:placeholder
          ports:
            - containerPort: 8080
          # Self-service resource outputs (ADR-073): the Environment Composition publishes a
          # ${{ values.service }}-resources ConfigMap (e.g. UPLOADS_BUCKET) when this Service declares
          # `resources:` in its Environment claim. optional: true → a no-op until then, so the starter runs as-is.
          envFrom:
            - configMapRef:
                name: ${{ values.service }}-resources
                optional: true
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            # Immutable container filesystem — writes go to the emptyDir /tmp below. Regulated-tier ready.
            # Rails writes to /rails/{tmp,log} at runtime, so the Ruby starter ships RW-root (tighten it with
            # emptyDir mounts at those paths if you need RO-root for a regulated tier).
            readOnlyRootFilesystem: {% if values.language == 'ruby' %}false{% else %}true{% endif %}
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: ${{ cpuReq }}
              memory: ${{ memReq }}
            limits:
              cpu: ${{ cpuLim }}
              memory: ${{ memLim }}
          # startupProbe gates liveness/readiness during boot, so a slow start (JVM/Rails warmup) never trips
          # the liveness probe (failureThreshold is language-tiered: ${{ startFail }} × 5s grace).
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: ${{ startFail }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          # Native SleepAction (k8s 1.35, no shell needed) — hold for a beat after SIGTERM so the Gateway/Cilium
          # stops routing here before the process exits (ADR-085). The platform mutate injects this when absent.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Writable scratch for a read-only root filesystem (the app/runtime's temp dir).
        - name: tmp
          emptyDir: {}
