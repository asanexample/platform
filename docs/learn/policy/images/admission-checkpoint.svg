<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1150" width="760" height="1150" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#1f8a5b"]{fill:#40d996}[stroke="#1f8a5b"]{stroke:#40d996}[fill="#b0790f"]{fill:#f2ad29}[stroke="#b0790f"]{stroke:#f2ad29}[fill="#c0392b"]{fill:#e07266}[stroke="#c0392b"]{stroke:#e07266}[fill="#eaf1fb"]{fill:#172f51}[stroke="#eaf1fb"]{stroke:#172f51}[fill="#c4d8f4"]{fill:#1d3a62}[stroke="#c4d8f4"]{stroke:#1d3a62}[fill="#2c66c4"]{fill:#6b98e1}[stroke="#2c66c4"]{stroke:#6b98e1}[fill="#8a8a91"]{fill:#898990}[stroke="#8a8a91"]{stroke:#898990}[fill="#fbfbf9"]{fill:#181816}[stroke="#fbfbf9"]{stroke:#181816}[fill="#d9d9d2"]{fill:#2c2c27}[stroke="#d9d9d2"]{stroke:#2c2c27}[fill="#efefe9"]{fill:#20201c}[stroke="#efefe9"]{stroke:#20201c}[fill="#e7f4ec"]{fill:#224b32}[stroke="#e7f4ec"]{stroke:#224b32}[fill="#bfe0cc"]{fill:#2d5e41}[stroke="#bfe0cc"]{stroke:#2d5e41}[fill="#33333a"]{fill:#dedee2}[stroke="#33333a"]{stroke:#dedee2}[fill="#f9f0da"]{fill:#584619}[stroke="#f9f0da"]{stroke:#584619}[fill="#e8d4a0"]{fill:#e5cc8a}[stroke="#e8d4a0"]{stroke:#e5cc8a}[fill="#9a6a0a"]{fill:#f6b022}[stroke="#9a6a0a"]{stroke:#f6b022}[fill="#fae9e6"]{fill:#532118}[stroke="#fae9e6"]{stroke:#532118}[fill="#ecc3bc"]{fill:#68291e}[stroke="#ecc3bc"]{stroke:#68291e}[fill="#b83a2c"]{fill:#dd6f63}[stroke="#b83a2c"]{stroke:#dd6f63}[fill="#a63527"]{fill:#da5e4f}[stroke="#a63527"]{stroke:#da5e4f}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#eef6f1"]{fill:#244530}[stroke="#eef6f1"]{stroke:#244530}}</style>



<rect class="bg" x="0" y="0" width="760" height="1150" fill="#f6f6f3"></rect>


<text class="muted mono" x="40" y="52" font-size="12" fill="#6c6c73" letter-spacing="1.9px">POLICY &amp; ADMISSION · THE CHECKPOINT</text>
<text class="text" x="40" y="90" font-size="27" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">One door. Three jobs. Every resource.</text>
<text class="muted" x="40" y="118" font-size="15" fill="#6c6c73">Nothing enters the cluster without crossing <tspan class="text" fill="#1c1c22" font-style="italic">admission</tspan>. The platform sits a policy</text>
<text class="muted" x="40" y="138" font-size="15" fill="#6c6c73">engine — Kyverno — on that checkpoint and hands it the rules as code. It does</text>
<text class="muted" x="40" y="158" font-size="15" fill="#6c6c73">three jobs, in this order.</text>


<rect class="ac-green" x="40" y="182" width="11" height="11" rx="3" fill="#1f8a5b"></rect>
<text class="muted mono" x="58" y="192" font-size="11.5" fill="#6c6c73">automatic — fix · create · admit</text>
<rect class="ac-amber" x="300" y="182" width="11" height="11" rx="3" fill="#b0790f"></rect>
<text class="muted mono" x="318" y="192" font-size="11.5" fill="#6c6c73">the gate — admit or reject</text>
<rect class="ac-rose" x="540" y="182" width="11" height="11" rx="3" fill="#c0392b"></rect>
<text class="muted mono" x="558" y="192" font-size="11.5" fill="#6c6c73">rejected — turned away</text>


<rect class="bg-blue bd-blue" x="40" y="212" width="680" height="66" rx="12" fill="#eaf1fb" stroke="#c4d8f4" stroke-width="1"></rect>
<rect class="ac-blue" x="44" y="222" width="4" height="46" rx="2" fill="#2c66c4"></rect>
<text class="t-blue mono" x="64" y="238" font-size="10" fill="#2c66c4" letter-spacing="0.6px">YOU · KUBECTL APPLY</text>
<text class="t-blue mono" x="64" y="257" font-size="13" fill="#2c66c4" font-weight="500">a Deployment</text>
<text class="text" x="196" y="250" font-size="14" fill="#1c1c22">The manifest you wrote — <tspan class="t-blue mono" fill="#2c66c4">nginx:latest</tspan>, no limits, no probes.</text>


<line class="arrow" x1="380" y1="288" x2="380" y2="300" stroke="#8a8a91" stroke-width="2"></line>
<path class="arrow" d="M374 300 L386 300 L380 308 Z" fill="#8a8a91"></path>


<rect class="door door-bd" x="40" y="316" width="680" height="596" rx="16" fill="#fbfbf9" stroke="#d9d9d2" stroke-width="1.5"></rect>
<path class="head head-bd" d="M40 332 A16 16 0 0 1 56 316 L704 316 A16 16 0 0 1 720 332 L720 374 L40 374 Z" fill="#efefe9" stroke="#d9d9d2" stroke-width="1"></path>
<line class="head-bd" x1="40" y1="374" x2="720" y2="374" stroke="#d9d9d2" stroke-width="1"></line>
<text class="muted mono" x="58" y="340" font-size="10" fill="#6c6c73" letter-spacing="0.8px">ADMISSION · KUBE-APISERVER</text>
<text class="text" x="58" y="361" font-size="15" fill="#1c1c22" font-weight="600">The checkpoint every resource crosses</text>
<text class="muted mono" x="702" y="338" font-size="10.5" fill="#6c6c73" text-anchor="end">rules = ClusterPolicy YAML</text>
<text class="muted mono" x="702" y="355" font-size="10.5" fill="#6c6c73" text-anchor="end">same for every team · fail-closed</text>


<rect class="bg-green bd-green" x="58" y="392" width="644" height="78" rx="12" fill="#e7f4ec" stroke="#bfe0cc" stroke-width="1"></rect>
<rect class="ac-green" x="62" y="402" width="4" height="58" rx="2" fill="#1f8a5b"></rect>
<text class="t-green mono" x="80" y="418" font-size="13" fill="#1f8a5b">①</text>
<text class="t-green mono" x="98" y="418" font-size="13" fill="#1f8a5b" font-weight="500" letter-spacing="0.4px">MUTATE</text>
<text class="text" x="156" y="418" font-size="15" fill="#1c1c22" font-weight="600">Fix the small stuff</text>
<text class="t-green mono" x="686" y="418" font-size="10.5" fill="#1f8a5b" text-anchor="end">runs first</text>
<text class="text" x="80" y="440" font-size="13" fill="#33333a">Rewrites your resource on the way in — injects the hardened <tspan class="t-green mono" fill="#1f8a5b">securityContext</tspan>, the <tspan class="t-green mono" fill="#1f8a5b">team</tspan> label,</text>
<text class="text" x="80" y="458" font-size="13" fill="#33333a"><tspan class="t-green mono" fill="#1f8a5b">automountServiceAccountToken: false</tspan>, topology spread. The defaults you never typed.</text>


<line class="arrow" x1="380" y1="478" x2="380" y2="490" stroke="#8a8a91" stroke-width="2"></line>
<path class="arrow" d="M374 490 L386 490 L380 498 Z" fill="#8a8a91"></path>


<rect class="bg-amber bd-amber" x="58" y="506" width="644" height="256" rx="12" fill="#f9f0da" stroke="#e8d4a0" stroke-width="1"></rect>
<rect class="ac-amber" x="62" y="516" width="4" height="236" rx="2" fill="#b0790f"></rect>
<text class="t-amber mono" x="80" y="532" font-size="13" fill="#9a6a0a">②</text>
<text class="t-amber mono" x="98" y="532" font-size="13" fill="#9a6a0a" font-weight="500" letter-spacing="0.4px">VALIDATE</text>
<text class="text" x="166" y="532" font-size="15" fill="#1c1c22" font-weight="600">Admit or reject</text>
<text class="t-amber mono" x="686" y="532" font-size="10.5" fill="#9a6a0a" text-anchor="end">the gate</text>


<rect class="bg-rose bd-rose" x="78" y="548" width="376" height="198" rx="10" fill="#fae9e6" stroke="#ecc3bc" stroke-width="1"></rect>
<text class="t-rose" x="92" y="572" font-size="14" fill="#b83a2c">✗</text>
<text class="t-rose" x="108" y="572" font-size="13.5" fill="#b83a2c" font-weight="600">Turned away — 5 policies fired</text>
<circle class="ac-green" cx="97" cy="596" r="3.5" fill="#1f8a5b"></circle>
<text class="t-rose mono" x="108" y="600" font-size="12" fill="#a63527">disallow-latest-tag</text>
<circle class="ac-green" cx="97" cy="618" r="3.5" fill="#1f8a5b"></circle>
<text class="t-rose mono" x="108" y="622" font-size="12" fill="#a63527">require-pod-probes</text>
<circle class="ac-green" cx="97" cy="640" r="3.5" fill="#1f8a5b"></circle>
<text class="t-rose mono" x="108" y="644" font-size="12" fill="#a63527">require-requests-limits</text>
<circle class="ac-green" cx="97" cy="662" r="3.5" fill="#1f8a5b"></circle>
<text class="t-rose mono" x="108" y="666" font-size="12" fill="#a63527">restrict-image-registries</text>
<circle class="ac-blue" cx="97" cy="684" r="3.5" fill="#2c66c4"></circle>
<text class="t-rose mono" x="108" y="688" font-size="12" fill="#a63527">restrict-images-<tspan class="t-blue" fill="#2c66c4">alpha-shop</tspan></text>
<text class="muted mono" x="108" y="712" font-size="10" fill="#6c6c73"><tspan class="t-green" fill="#1f8a5b">●</tspan> 4 baseline   <tspan class="t-blue" fill="#2c66c4">●</tspan> 1 per-product</text>
<line class="divln" x1="92" y1="722" x2="440" y2="722" stroke="#ecc3bc" stroke-width="1"></line>
<text class="muted" x="92" y="738" font-size="11.5" fill="#6c6c73">Rejected at the door — before anything runs. <tspan class="t-rose mono" fill="#a63527">svc-fail</tspan>: fail-closed.</text>


<rect class="bg-green bd-green" x="466" y="548" width="216" height="198" rx="10" fill="#e7f4ec" stroke="#bfe0cc" stroke-width="1"></rect>
<text class="t-green" x="480" y="572" font-size="14" fill="#1f8a5b">✓</text>
<text class="t-green" x="496" y="572" font-size="13.5" fill="#1f8a5b" font-weight="600">Compliant</text>
<text class="text" x="480" y="596" font-size="12.5" fill="#33333a">Admitted and <tspan class="t-green mono" fill="#1f8a5b">stored in</tspan></text>
<text class="text" x="480" y="614" font-size="12.5" fill="#33333a"><tspan class="t-green mono" fill="#1f8a5b">etcd</tspan>. The object now exists.</text>
<line class="divln" x1="480" y1="648" x2="668" y2="648" stroke="#bfe0cc" stroke-width="1"></line>
<text class="muted" x="480" y="668" font-size="11.5" fill="#6c6c73">Only now does <tspan class="t-green mono" fill="#1f8a5b">generate</tspan></text>
<text class="muted" x="480" y="686" font-size="11.5" fill="#6c6c73">run — on the stored object. ↓</text>


<line class="softln" x1="58" y1="784" x2="230" y2="784" stroke="#d9d9d2" stroke-width="1" stroke-dasharray="3 3"></line>
<text class="dim mono" x="380" y="788" font-size="10" fill="#9a9aa1" text-anchor="middle" letter-spacing="0.8px">POST-ADMISSION · OBJECT ALREADY STORED</text>
<line class="softln" x1="530" y1="784" x2="702" y2="784" stroke="#d9d9d2" stroke-width="1" stroke-dasharray="3 3"></line>


<rect class="bg-green bd-green" x="58" y="806" width="644" height="82" rx="12" fill="#e7f4ec" stroke="#bfe0cc" stroke-width="1"></rect>
<rect class="ac-green" x="62" y="816" width="4" height="62" rx="2" fill="#1f8a5b"></rect>
<text class="t-green mono" x="80" y="832" font-size="13" fill="#1f8a5b">③</text>
<text class="t-green mono" x="98" y="832" font-size="13" fill="#1f8a5b" font-weight="500" letter-spacing="0.4px">GENERATE</text>
<text class="text" x="172" y="832" font-size="15" fill="#1c1c22" font-weight="600">Create what you&#39;d forget</text>
<text class="t-green mono" x="686" y="832" font-size="10.5" fill="#1f8a5b" text-anchor="end">runs after</text>
<text class="text" x="80" y="854" font-size="13" fill="#33333a">A <tspan font-style="italic">separate</tspan> resource appears alongside yours — <tspan class="t-green mono" fill="#1f8a5b">generate-workload-pdb</tspan> synthesizes a</text>
<text class="text" x="80" y="872" font-size="13" fill="#33333a"><tspan font-weight="600">PodDisruptionBudget</tspan> so a node drain can&#39;t take all your replicas — kept in sync, never forgotten.</text>


<line class="arrow" x1="380" y1="922" x2="380" y2="934" stroke="#8a8a91" stroke-width="2"></line>
<path class="arrow" d="M374 934 L386 934 L380 942 Z" fill="#8a8a91"></path>


<rect class="bg-green bd-green" x="40" y="952" width="330" height="70" rx="12" fill="#e7f4ec" stroke="#bfe0cc" stroke-width="1"></rect>
<text class="t-green mono" x="58" y="976" font-size="10" fill="#1f8a5b" letter-spacing="0.6px">RUNNING</text>
<text class="text" x="58" y="996" font-size="14" fill="#1c1c22" font-weight="600">Your hardened workload</text>
<text class="muted" x="58" y="1012" font-size="12" fill="#6c6c73">compliant + mutated, as declared</text>

<rect class="bg-green bd-green" x="390" y="952" width="330" height="70" rx="12" fill="#eef6f1" stroke="#bfe0cc" stroke-width="1" stroke-dasharray="4 3"></rect>
<text class="t-green mono" x="408" y="976" font-size="10" fill="#1f8a5b" letter-spacing="0.6px">GENERATED FOR YOU</text>
<text class="text" x="408" y="996" font-size="14" fill="#1c1c22" font-weight="600">PodDisruptionBudget</text>
<text class="muted" x="408" y="1012" font-size="12" fill="#6c6c73">maxUnavailable: 1 · selector copied</text>


<text class="muted" x="40" y="1058" font-size="14" fill="#6c6c73">Reject what it must, <tspan class="t-green" fill="#1f8a5b" font-weight="500">fix</tspan> what it can, <tspan class="t-green" fill="#1f8a5b" font-weight="500">create</tspan> what you&#39;d forget — all at admission, all as</text>
<text class="muted" x="40" y="1078" font-size="14" fill="#6c6c73">code. A rule that lives in code and runs at the door can&#39;t be forgotten, skipped in a rushed</text>
<text class="muted" x="40" y="1098" font-size="14" fill="#6c6c73">review, or applied inconsistently across fifty teams. Guardrails, not guidelines.</text>
</svg>