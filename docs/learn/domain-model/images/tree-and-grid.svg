<text x="58" y="530" font-size="13.5" fill="light-dark(#1c1c22,#e9e9ee)">The connector: a <tspan fill="light-dark(#1f7a49,#7fd6a6)" font-weight="600">Service runs inside each Environment</tspan> — shop&#39;s storefront runs in</text>
<text x="58" y="550" font-size="13.5" fill="light-dark(#1c1c22,#e9e9ee)">alpha-shop-dev and alpha-shop-prod. Identity <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">team-alpha/shop-storefront</tspan> stays; place changes.</text>
