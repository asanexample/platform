<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 584" width="760" height="584" style="color-scheme:light dark" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="760" height="584" fill="light-dark(#f6f6f3,#1c1e26)"></rect>
<text x="40" y="54" font-size="12" fill="light-dark(#6c6c73,#a6a6ad)" letter-spacing="1.6px" font-family="ui-monospace,Menlo,Consolas,monospace">THE ONE IDEA</text>
<text x="40" y="92" font-size="27" fill="light-dark(#1c1c22,#e9e9ee)" font-weight="600" letter-spacing="-0.3px">Ownership is a tree, deployment is a grid</text>
<text x="40" y="118" font-size="15" fill="light-dark(#6c6c73,#a6a6ad)">Two shapes, and the whole model is their interplay. Who owns a thing and where it runs are</text>
<text x="40" y="138" font-size="15" fill="light-dark(#6c6c73,#a6a6ad)">different questions.</text>

<rect x="40" y="176" width="288" height="318" rx="14" fill="light-dark(#efefec,#23252e)" stroke="light-dark(#e4e4df,#3a3d47)" stroke-width="1"></rect>
<text x="58" y="200" font-size="11" fill="light-dark(#6c6c73,#a6a6ad)" letter-spacing="0.06em" font-family="ui-monospace,Menlo,Consolas,monospace">OWNERSHIP — a tree</text>
<text x="58" y="216" font-size="11.5" fill="light-dark(#9a9aa1,#8a8a92)">one owner each, traced up</text>

<rect x="58" y="231" width="35" height="15" rx="4" fill="none" stroke="light-dark(#e0be7e,#8a6a2a)" stroke-width="1"></rect>
<text x="75.5" y="242" font-size="9" fill="light-dark(#8a6410,#e6c46a)" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">TEAM</text>
