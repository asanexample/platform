<text x="362" y="420" font-size="11.5" fill="light-dark(#6c6c73,#a6a6ad)">A product promotes up its row.</text>
<text x="362" y="436" font-size="11.5" fill="light-dark(#6c6c73,#a6a6ad)"><tspan fill="light-dark(#1f7a49,#7fd6a6)" font-family="ui-monospace,Menlo,Consolas,monospace">alpha-shop-dev</tspan> is one such cell.</text>
<text x="362" y="468" font-size="11.5" fill="light-dark(#9a9aa1,#8a8a92)">shop runs every stage; dispatch dev+test;</text>
<text x="362" y="484" font-size="11.5" fill="light-dark(#9a9aa1,#8a8a92)">checkout is registered, not yet deployed.</text>

<rect x="40" y="508" width="680" height="60" rx="10" fill="light-dark(#e7f4ec,#1e2a22)" stroke="light-dark(#a3ccb4,#3f8a63)" stroke-width="1"></rect>
