<line x1="58" y1="430" x2="310" y2="430" stroke="light-dark(#e4e4df,#3a3d47)" stroke-width="1"></line>
<text x="58" y="452" font-size="11.5" fill="light-dark(#6c6c73,#a6a6ad)">Two teams. A team owns Products;</text>
<text x="58" y="468" font-size="11.5" fill="light-dark(#6c6c73,#a6a6ad)">each Product owns Services.</text>
<text x="58" y="484" font-size="10.5" fill="light-dark(#9a9aa1,#8a8a92)">alpha → shop + checkout · bravo → dispatch</text>

<rect x="344" y="176" width="376" height="318" rx="14" fill="light-dark(#efefec,#23252e)" stroke="light-dark(#e4e4df,#3a3d47)" stroke-width="1"></rect>
<text x="362" y="200" font-size="11" fill="light-dark(#6c6c73,#a6a6ad)" letter-spacing="0.06em" font-family="ui-monospace,Menlo,Consolas,monospace">DEPLOYMENT — a grid</text>
<text x="362" y="216" font-size="11.5" fill="light-dark(#9a9aa1,#8a8a92)">product × stage · each filled cell is an Environment</text>

<text x="458" y="246" font-size="11" fill="light-dark(#1c1c22,#e9e9ee)" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">dev</text>
