<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 534" width="760" height="534" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#f7efdc"]{fill:#584519}[stroke="#f7efdc"]{stroke:#584519}[fill="#e0be7e"]{fill:#e6c68a}[stroke="#e0be7e"]{stroke:#e6c68a}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}[fill="#f0e4c8"]{fill:#624d1d}[stroke="#f0e4c8"]{stroke:#624d1d}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#f7e8e3"]{fill:#552819}[stroke="#f7e8e3"]{stroke:#552819}[fill="#dca595"]{fill:#dda392}[stroke="#dca595"]{stroke:#dda392}[fill="#b4402b"]{fill:#dc725e}[stroke="#b4402b"]{stroke:#dc725e}[fill="#e6f2ea"]{fill:#264932}[stroke="#e6f2ea"]{stroke:#264932}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#177a44"]{fill:#3adf85}[stroke="#177a44"]{stroke:#3adf85}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}}</style><rect class="f_bg" x="0" y="0" width="760" height="534" fill="#f6f6f3"></rect><text class="mono f_muted" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.6px"><tspan x="40">SAFE SELF-SERVICE · THE ENVELOPE</tspan></text><text class="f_text" x="40" y="92" font-size="28" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px"><tspan x="40">The Team is an envelope</tspan></text><text class="f_muted" x="40" y="118" font-size="15" fill="#6c6c73"><tspan x="40">Bounds are declared once, on the Team. Every environment request is checked against</tspan><tspan x="40" dy="20">them at admission — so a team creates environments freely, nothing out of bounds gets in.</tspan></text><rect x="40" y="160" width="680" height="94" rx="14" class="f_ambBg s_ambBd" fill="#f7efdc" stroke="#e0be7e" stroke-width="1"></rect><text class="mono f_amber" x="58" y="186" font-size="13" fill="#8a6410" font-weight="600"><tspan x="58">team acme · envelope</tspan></text><text class="f_muted" x="220" y="186" font-size="12" fill="#6c6c73"><tspan x="220">the bounds every Product &amp; Environment must stay inside</tspan></text><rect x="58" y="202" width="178" height="26" rx="7" class="f_ambChip s_ambBd" fill="#f0e4c8" stroke="#e0be7e" stroke-width="1"></rect><text class="mono f_amber" x="69" y="219" font-size="12" fill="#8a6410"><tspan x="69">allowedTiers: [standard]</tspan></text><rect x="244" y="202" width="184.5" height="26" rx="7" class="f_ambChip s_ambBd" fill="#f0e4c8" stroke="#e0be7e" stroke-width="1"></rect><text class="mono f_amber" x="255" y="219" font-size="12" fill="#8a6410"><tspan x="255">allowedStages: [dev…prod]</tspan></text><rect x="436.5" y="202" width="256" height="26" rx="7" class="f_ambChip s_ambBd" fill="#f0e4c8" stroke="#e0be7e" stroke-width="1"></rect><text class="mono f_amber" x="447.5" y="219" font-size="12" fill="#8a6410"><tspan x="447.5">quotaCap: cpu 8 · mem 16Gi · pods 40</tspan></text><rect x="58" y="234" width="126" height="26" rx="7" class="f_ambChip s_ambBd" fill="#f0e4c8" stroke="#e0be7e" stroke-width="1"></rect><text class="mono f_amber" x="69" y="251" font-size="12" fill="#8a6410"><tspan x="69">budget: $2000/mo</tspan></text><line class="s_narrow" x1="150" y1="262" x2="150" y2="277" stroke="#9a9aa1" stroke-width="2"></line><path class="f_narrow" fill="#9a9aa1" d="M150 285 L144 277 L156 277 Z"></path><text class="mono f_muted" x="168" y="279" font-size="11" fill="#6c6c73">enforced at admission — <tspan class="f_text" fill="#1c1c22">Kyverno</tspan>, the bouncer at the cluster door</text><rect x="40" y="296" width="680" height="42" rx="11" class="f_redBg s_redBd" fill="#f7e8e3" stroke="#dca595" stroke-width="1"></rect><rect x="40" y="304" width="3" height="26" rx="1.5" class="f_redStrong" fill="#b4402b"></rect><text class="mono f_redStrong" x="58" y="322" font-size="12" fill="#b4402b" font-weight="600"><tspan x="58">✗ REJECT</tspan></text><text class="mono f_text" x="150" y="322" font-size="13" fill="#1c1c22"><tspan x="150">shop at the pci tier</tspan></text><text class="f_red" x="702" y="322" font-size="12" fill="#b4402b" text-anchor="end"><tspan x="702">pci ∉ allowedTiers [standard]</tspan></text><rect x="40" y="347" width="680" height="42" rx="11" class="f_redBg s_redBd" fill="#f7e8e3" stroke="#dca595" stroke-width="1"></rect><rect x="40" y="355" width="3" height="26" rx="1.5" class="f_redStrong" fill="#b4402b"></rect><text class="mono f_redStrong" x="58" y="373" font-size="12" fill="#b4402b" font-weight="600"><tspan x="58">✗ REJECT</tspan></text><text class="mono f_text" x="150" y="373" font-size="13" fill="#1c1c22"><tspan x="150">acme-shop-dev asking for 12 CPUs</tspan></text><text class="f_red" x="702" y="373" font-size="12" fill="#b4402b" text-anchor="end"><tspan x="702">12 &gt; quotaCap cpu 8</tspan></text><rect x="40" y="398" width="680" height="42" rx="11" class="f_redBg s_redBd" fill="#f7e8e3" stroke="#dca595" stroke-width="1"></rect><rect x="40" y="406" width="3" height="26" rx="1.5" class="f_redStrong" fill="#b4402b"></rect><text class="mono f_redStrong" x="58" y="424" font-size="12" fill="#b4402b" font-weight="600"><tspan x="58">✗ REJECT</tspan></text><text class="mono f_text" x="150" y="424" font-size="13" fill="#1c1c22"><tspan x="150">shop in a stage called canary</tspan></text><text class="f_red" x="702" y="424" font-size="12" fill="#b4402b" text-anchor="end"><tspan x="702">canary ∉ allowedStages</tspan></text><rect x="40" y="449" width="680" height="42" rx="11" class="f_greenBg s_greenBd" fill="#e6f2ea" stroke="#a3ccb4" stroke-width="1"></rect><rect x="40" y="457" width="3" height="26" rx="1.5" class="f_greenStrong" fill="#177a44"></rect><text class="mono f_greenStrong" x="58" y="475" font-size="12" fill="#177a44" font-weight="600"><tspan x="58">✓ ACCEPT</tspan></text><text class="mono f_text" x="150" y="475" font-size="13" fill="#1c1c22"><tspan x="150">acme-shop-dev · standard tier, 4 CPUs</tspan></text><text class="f_green" x="702" y="475" font-size="12" fill="#1f7a49" text-anchor="end"><tspan x="702">both inside the envelope</tspan></text><text class="f_muted" x="40" y="504" font-size="13.5" fill="#6c6c73"><tspan x="40">Every rejection is the same move: the bounds live on the Team, the bouncer checks each request</tspan><tspan x="40" dy="19">against them at admission. <tspan class="f_text" fill="#1c1c22">That&#39;s the whole trick to safe self-service.</tspan></tspan></text></svg>