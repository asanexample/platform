<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 910" width="760" height="910" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><defs><clipPath id="abar0"><rect x="39.0" y="175.1" width="12.1" height="134.0"/></clipPath><clipPath id="abar1"><rect x="39.0" y="463.1" width="12.1" height="136.0"/></clipPath><clipPath id="abar2"><rect x="39.0" y="643.0" width="12.1" height="128.0"/></clipPath></defs><defs><clipPath id="abar0"></clipPath><clipPath id="abar1"></clipPath><clipPath id="abar2"></clipPath></defs><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#ffffff"]{fill:#141414}[stroke="#ffffff"]{stroke:#141414}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#c9c9c2"]{fill:#34342e}[stroke="#c9c9c2"]{stroke:#34342e}[fill="#fbf2df"]{fill:#554219}[stroke="#fbf2df"]{stroke:#554219}[fill="#e0be7e"]{fill:#e6c68a}[stroke="#e0be7e"]{stroke:#e6c68a}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}}</style><style>@media(prefers-color-scheme:dark){.f_bg{fill:#15161c}.f_blueBg{fill:#172a50}.f_greenBg{fill:#16331f}.s_blueBd{stroke:#40639e}.s_greenBd{stroke:#2f6a45}.f_text{fill:#e6e6ea}.f_muted{fill:#9a9aa3}.f_dim{fill:#74747d}.f_blue{fill:#7fa0ee}.f_green{fill:#4fd08a}.f_amber{fill:#e0b050}}</style><rect x="0" y="0" width="760" height="894" rx="0" class="f_bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mono f_muted" fill="#6c6c73" letter-spacing="1.6px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SELF-SERVICE CLOUD RESOURCES · ADR-073</text><text x="40" y="90" font-size="26" class="f_text" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Intent above the claim, safety below it</text><text x="40" y="122" font-size="15" class="f_muted" fill="#6c6c73">You declare <tspan class="f_text" fill="#1c1c22">what</tspan> you want as abstract intent. The claim is the governed boundary;</text><text x="40" y="142" font-size="15" class="f_muted" fill="#6c6c73">below it, one safe pipeline derives the how. You never write IAM or see an access key.</text><rect x="40" y="176" width="680" height="132" rx="13" class="f_blueBg s_blueBd" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><rect x="41.3" y="177.3" width="677.5" height="129.5" rx="11.8" fill="none" stroke="#2f5fd0" stroke-width="2.5" clip-path="url(#abar0)"></rect><text x="58" y="202" font-size="11" class="mono f_blue" fill="#2f5fd0" letter-spacing="0.5px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ABOVE THE CLAIM · YOU DECLARE</text><text x="702" y="202" font-size="12" class="mono f_muted" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="end">what, not how</text><rect x="58" y="214" width="208" height="46" rx="9" class="f_card" fill="#ffffff" stroke="#b9cbee" stroke-width="1"></rect><text x="70" y="233" font-size="11" class="mono f_blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">kind</text><text x="70" y="251" font-size="12.5" class="f_text" fill="#1c1c22" font-weight="500">objectstore · stream</text><rect x="276" y="214" width="208" height="46" rx="9" class="f_card" fill="#ffffff" stroke="#b9cbee" stroke-width="1"></rect><text x="288" y="233" font-size="11" class="mono f_blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">engine</text><text x="288" y="251" font-size="12.5" class="f_text" fill="#1c1c22" font-weight="500">s3 · sqs · sns · dynamodb</text><rect x="494" y="214" width="208" height="46" rx="9" class="f_card" fill="#ffffff" stroke="#b9cbee" stroke-width="1"></rect><text x="506" y="233" font-size="11" class="mono f_blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">access</text><text x="506" y="251" font-size="12.5" class="f_text" fill="#1c1c22" font-weight="500">read · readwrite</text><text x="58" y="284" font-size="12.5" class="f_muted" fill="#6c6c73">Any front door produces the same claim — a pull request, a Backstage form, a future</text><text x="58" y="300" font-size="12.5" class="f_muted" fill="#6c6c73">natural-language agent. No ARNs, no IAM, no encryption settings.</text><text x="380" y="330" font-size="11" class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">produces</text><text x="380" y="348" font-size="15" class="f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><rect x="40" y="354" width="680" height="64" rx="13" class="f_panelBg s_border" fill="#efefec" stroke="#c9c9c2" stroke-width="1.5"></rect><text x="58" y="381" font-size="11" class="mono f_muted" fill="#6c6c73" letter-spacing="0.5px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">THE CLAIM</text><text x="58" y="401" font-size="15" class="f_text" fill="#1c1c22" font-weight="600">the governed boundary</text><line x1="244" y1="370" x2="244" y2="402" stroke="#c9c9c2" stroke-width="1" class="s_border"></line><text x="262" y="383" font-size="13" class="f_muted" fill="#6c6c73">Everything above is free to change; everything below is fixed.</text><text x="262" y="401" font-size="13" class="f_muted" fill="#6c6c73">The order ticket both sides trust.</text><text x="380" y="440" font-size="11" class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">validated against</text><text x="380" y="458" font-size="15" class="f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><rect x="40" y="464" width="680" height="134" rx="13" class="f_amberBg s_amberBd" fill="#fbf2df" stroke="#e0be7e" stroke-width="1"></rect><rect x="41.3" y="465.3" width="677.5" height="131.5" rx="11.8" fill="none" stroke="#8a6410" stroke-width="2.5" clip-path="url(#abar1)"></rect><text x="58" y="490" font-size="11" class="mono f_amber" fill="#8a6410" letter-spacing="0.5px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">THE MIDDLE · TEAM ENVELOPE</text><text x="702" y="490" font-size="12" class="mono f_muted" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="end">default-deny</text><rect x="58" y="502" width="380" height="70" rx="9" class="f_card" fill="#ffffff" stroke="#e0be7e" stroke-width="1"></rect><text x="71" y="524" font-size="12.5" class="f_muted" fill="#6c6c73">The ceiling your team lead set — <tspan class="mono f_amber" fill="#8a6410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">allowedEngines</tspan>,</text><text x="71" y="542" font-size="12.5" class="f_muted" fill="#6c6c73"><tspan class="mono f_amber" fill="#8a6410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">maxPerEnvironment</tspan>, isolation floor. An engine you</text><text x="71" y="558" font-size="12.5" class="f_muted" fill="#6c6c73">didn’t opt into can’t be asked for.</text><rect x="450" y="502" width="252" height="28" rx="8" class="f_card" fill="#ffffff" stroke="#e0be7e" stroke-width="1"></rect><circle cx="468" cy="516" r="8" class="f_amber" fill="#8a6410"></circle><text x="468" y="520" font-size="10" class="f_bg" fill="#f6f6f3" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">1</text><text x="484" y="520" font-size="12.5" class="f_text" fill="#1c1c22" font-weight="500">gitops gate · on the PR</text><rect x="450" y="536" width="252" height="28" rx="8" class="f_card" fill="#ffffff" stroke="#e0be7e" stroke-width="1"></rect><circle cx="468" cy="550" r="8" class="f_amber" fill="#8a6410"></circle><text x="468" y="554" font-size="10" class="f_bg" fill="#f6f6f3" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">2</text><text x="484" y="554" font-size="12.5" class="f_text" fill="#1c1c22" font-weight="500">Kyverno · at admission</text><text x="58" y="584" font-size="12" class="f_muted" fill="#6c6c73">Enforced twice, independently — a disallowed engine or an 11th resource is rejected before any AWS resource exists.</text><text x="380" y="620" font-size="11" class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">realized as</text><text x="380" y="638" font-size="15" class="f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><rect x="40" y="644" width="680" height="126" rx="13" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><rect x="41.3" y="645.3" width="677.5" height="123.5" rx="11.8" fill="none" stroke="#1f7a49" stroke-width="2.5" clip-path="url(#abar2)"></rect><text x="58" y="670" font-size="11" class="mono f_green" fill="#1f7a49" letter-spacing="0.5px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">BELOW THE CLAIM · THE PLATFORM DERIVES</text><text x="702" y="670" font-size="12" class="mono f_muted" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="end">non-overridable</text><rect x="58" y="682" width="317" height="74" rx="9" class="f_card" fill="#ffffff" stroke="#a3ccb4" stroke-width="1"></rect><text x="71" y="703" font-size="13.5" class="f_text" fill="#1c1c22" font-weight="600">Hardened by default</text><text x="71" y="722" font-size="12" class="f_muted" fill="#6c6c73">TLS-only, public access blocked, encrypted,</text><text x="71" y="737" font-size="12" class="f_muted" fill="#6c6c73">versioned, region-pinned. You can’t turn it off.</text><rect x="385" y="682" width="317" height="74" rx="9" class="f_card" fill="#ffffff" stroke="#a3ccb4" stroke-width="1"></rect><text x="398" y="703" font-size="13.5" class="f_text" fill="#1c1c22" font-weight="600">Least-privilege IAM, derived</text><text x="398" y="722" font-size="12" class="f_muted" fill="#6c6c73">Scoped to <tspan class="f_text" fill="#1c1c22">this</tspan> resource’s ARN, exact verbs,</text><text x="398" y="737" font-size="12" class="f_muted" fill="#6c6c73">injected into your Pod-Identity role. No <tspan class="mono" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">s3:*</tspan>.</text><rect x="40" y="786" width="680" height="104" rx="12" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><text x="58" y="796" font-size="10.5" class="mono f_muted" fill="#6c6c73" letter-spacing="0.4px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">THE PICTURE</text><text x="58" y="834" font-size="13.5" class="f_muted" fill="#6c6c73">A restaurant order ticket: you write <tspan class="f_blue" fill="#2f5fd0">“medium-rare, no onions”</tspan> — you don’t enter the kitchen or</text><text x="58" y="854" font-size="13.5" class="f_muted" fill="#6c6c73">own the knives. The kitchen hands you exactly the right cutlery.</text><text x="58" y="874" font-size="13.5" class="f_muted" fill="#6c6c73">The lazy path and the least-privilege path are one.</text></svg>