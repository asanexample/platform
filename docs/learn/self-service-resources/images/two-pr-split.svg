em-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif" font-weight="600" letter-spacing="-0.3px">Land it in two pull requests, not one</text><text y="122" font-size="15"><tspan x="40.0" class="f_muted" fill="#6c6c73" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">The teams gate evaluates against the trusted base — </tspan><tspan x="406.3" class="mono f_text" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">main</tspan><tspan x="442.4" class="f_muted" fill="#6c6c73" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">, not your branch. So a single PR</tspan></text><text x="40" y="142" font-size="15" class="f_muted" fill="#6c6c73" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">that both allows an engine and uses it can never pass its own gate.</text><rect x="40" y="176" width="680" height="112" rx="13" class="f_redBg s_redBd" fill="#fbeeea" stroke="#e6b9ab" stroke-width="1"></rect><rect x="41.3" y="177.3" width="677.5" height="109.5" rx="11.8" fill="none" stroke="#b4462f" stroke-width="2.5" clip-path="url(#abar0)"></rect><text x="58" y="202" font-size="11" class="mono f_red" fill="#b4462f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">THE TRAP · ONE PR THAT DOES BOTH</text><text x="702" y="202" font-size="12" class="mono f_red" fill="#b4462f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="end">rejected</text><rect x="58" y="216" width="290" height="56" rx="9" class="f_card" fill="#ffffff" stroke="#e6b9ab" stroke-width="1"></rect><text y="238" font-size="12.5"><tspan x="70.0" class="f_text" fill="#1c1c22" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">One PR adds </tspan><tspan x="149.1" class="mono f_red" fill="#b4462f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">allowedEngines:[kinesis]</tspan></text><text x="70" y="256" font-size="12.5" class="f_text" fill="#1c1c22" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">and a claim that uses it.</text><text x="380" y="250" font-size="20" class="mono f_red" fill="#b4462f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">✕</text><rect x="400" y="216" width="290" height="56" rx="9" class="f_card" fill="#ffffff" stroke="#e6b9ab" stroke-width="1"></rect><text y="238" font-size="12.5"><tspan x="412.0" class="f_text" fill="#1c1c22" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">Gate reads </tspan><tspan x="479.3" class="mono f_red" fill="#b4462f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">main</tspan><tspan x="509.4" class="f_text" fill="#1c1c22" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">, where the engine</tspan></text><text x="412" y="256" font-size="12.5" class="f_text" fill="#1c1c22" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">isn&#39;t allowed yet — so it blocks the PR.</text><text x="380" y="310" font-size="11" class="mono f_muted" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">so, split it</text><text x="380" y="330" font-size="16" class="f_dim" fill="#9a9aa1" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">↓</text><rect x="40" y="342" width="680" height="92" rx="13" class="f_amberBg s_amberBd" fill="#fbf2df" stroke="#e0be7e" stroke-width="1"></rect><rect x="41.3" y="343.3" width="677.5" height="89.5" rx="11.8" fill="none" stroke="#8a6410" stroke-width="2.5" clip-path="url(#abar1)"></rect><rect x="58" y="356" width="44" height="20" rx="5" class="f_amber" fill="#8a6410"></rect><text x="80" y="370.5" font-size="11" class="mono" fill="#ffffff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="500" text-anchor="middle">PR #1</text><text x="114" y="371" font-size="11" class="mono f_amber" fill="#8a6410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">ALLOWANCE · STEPS 2–3</text><rect x="58" y="386" width="290" height="38" rx="8" class="f_card" fill="#ffffff" stroke="#e0be7e" stroke-width="1"></rect><text x="70" y="403" font-size="12" class="mono f_amber" fill="#8a6410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">team-crd.yaml</text><text y="418" font-size="12"><tspan x="70.0" class="f_text" fill="#1c1c22" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">add to </tspan><tspan x="109.5" class="mono f_text" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">allowedEngines</tspan></text><rect x="400" y="386" width="290" height="38" rx="8" class="f_card" fill="#ffffff" stroke="#e0be7e" stroke-width="1"></rect><text x="412" y="403" font-size="12" class="mono f_amber" fill="#8a6410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">gate.sh</text><text y="418" font-size="12"><tspan x="412.0" class="f_text" fill="#1c1c22" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">add to </tspan><tspan x="451.5" class="mono f_text" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">VALID_ENGINES</tspan></text><text x="380" y="454" font-size="16" class="f_dim" fill="#9a9aa1" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">↓</text><rect x="217.1429443359375" y="464" width="325.714111328125" height="24" rx="12" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="380" y="480" font-size="11.5" class="mono f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">merged to main — now main allows the engine</text><text x="380" y="508" font-size="16" class="f_dim" fill="#9a9aa1" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">↓</text><rect x="40" y="518" width="680" height="92" rx="13" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><rect x="41.3" y="519.3" width="677.5" height="89.5" rx="11.8" fill="none" stroke="#1f7a49" stroke-width="2.5" clip-path="url(#abar2)"></rect><rect x="58" y="532" width="44" height="20" rx="5" class="f_green" fill="#1f7a49"></rect><text x="80" y="546.5" font-size="11" class="mono" fill="#ffffff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="500" text-anchor="middle">PR #2</text><text x="114" y="547" font-size="11" class="mono f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">REALIZATION · STEP 1 + A TEAM OPTS IN</text><rect x="58" y="562" width="290" height="36" rx="8" class="f_card" fill="#ffffff" stroke="#a3ccb4" stroke-width="1"></rect><text y="578" font-size="12.5"><tspan x="70.0" class="f_text" fill="#1c1c22" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">The engine block in </tspan><tspan x="187.7" class="mono f_text" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">composition.yaml</tspan></text><text x="70" y="593" font-size="12.5" class="f_text" fill="#1c1c22" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">+ a real team declaring the engine.</text><text x="380" y="592" font-size="20" class="mono f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">✓</text><rect x="400" y="562" width="290" height="36" rx="8" class="f_card" fill="#ffffff" stroke="#a3ccb4" stroke-width="1"></rect><text y="578" font-size="12.5"><tspan x="412.0" class="f_text" fill="#1c1c22" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">Gate reads </tspan><tspan x="479.3" class="mono f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">main</tspan><tspan x="509.4" class="f_text" fill="#1c1c22" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"> — now allows</tspan></text><text x="412" y="593" font-size="12.5" class="f_text" fill="#1c1c22" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">it — so the PR passes.</text><text y="636" font-size="13.5"><tspan x="40.0" class="f_muted" fill="#6c6c73" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">The allowance must exist on </tspan><tspan x="220.0" class="mono f_text" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">main</tspan><tspan x="252.6" class="f_muted" fill="#6c6c73" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"> before anything may use it.</tspan></text></svg>