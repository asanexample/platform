<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" width="760" height="668" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#c9c9c2"]{fill:#34342e}[stroke="#c9c9c2"]{stroke:#34342e}[fill="#ffffff"]{fill:#141414}[stroke="#ffffff"]{stroke:#141414}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}}</style><style>@media(prefers-color-scheme:dark){.f_bg{fill:#15161c}.f_blueBg{fill:#172a50}.f_greenBg{fill:#16331f}.s_blueBd{stroke:#40639e}.s_greenBd{stroke:#2f6a45}.f_text{fill:#e6e6ea}.f_muted{fill:#9a9aa3}.f_dim{fill:#74747d}.f_blue{fill:#7fa0ee}.f_green{fill:#4fd08a}}</style><defs><clipPath id="abar0"><rect x="39.0" y="175.0" width="11.0" height="66.0"></rect></clipPath></defs><rect x="0" y="0" width="760" height="668" rx="0" class="f_bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mono f_muted" fill="#6c6c73" letter-spacing="1.6px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SELF-SERVICE CLOUD RESOURCES</text><text x="40" y="90" font-size="26" class="f_text" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">One line of intent, three things derived</text><text x="40" y="122" font-size="15" class="f_muted" fill="#6c6c73">The resource is only half of it — the reach is the other half. From a single line in your claim, the</text><text x="40" y="142" font-size="15" class="f_muted" fill="#6c6c73">Composition derives a hardened resource, the exact IAM to reach it, and the wiring to find it.</text><rect x="40" y="176" width="680" height="64" rx="12" class="f_blueBg s_blueBd" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><rect x="41.3" y="177.3" width="677.5" height="61.5" rx="10.8" fill="none" stroke="#2f5fd0" stroke-width="2.5" clip-path="url(#abar0)"></rect><text x="58" y="200" font-size="11" class="mono f_blue" fill="#2f5fd0" letter-spacing="0.5px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">YOUR CLAIM · ONE LINE</text><text x="58" y="224" font-size="14" class="mono" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan class="f_blue" fill="#2f5fd0">blob:</tspan> <tspan class="f_text" fill="#1c1c22">{ kind: objectstore, engine: s3, access: readwrite }</tspan></text><text x="380" y="262" font-size="15" class="f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><rect x="40" y="276" width="680" height="52" rx="12" class="f_panelBg s_border" fill="#efefec" stroke="#c9c9c2" stroke-width="1.5"></rect><rect x="58" y="291" width="120" height="22" rx="5" class="f_card" fill="#ffffff" stroke="#c9c9c2" stroke-width="1"></rect><text x="118" y="306" font-size="9.5" class="mono f_muted" fill="#6c6c73" letter-spacing="0.3px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">GOVERNED BOUNDARY</text><text x="192" y="307" font-size="15" class="f_text" fill="#1c1c22" font-weight="600">Environment Composition</text><text x="426" y="307" font-size="12.5" class="f_muted" fill="#6c6c73">validates, then realizes — the one safe way</text><text x="149.33333333333331" y="350" font-size="15" class="f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><text x="379.99999999999994" y="350" font-size="15" class="f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><text x="610.6666666666666" y="350" font-size="15" class="f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><rect x="40" y="362" width="218.66666666666666" height="118" rx="12" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="54" y="386" font-size="10" class="mono f_green" fill="#1f7a49" letter-spacing="0.4px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">THE RESOURCE</text><text x="54" y="407" font-size="14" class="f_text" fill="#1c1c22" font-weight="600">Hardened S3 bucket</text><text x="54" y="428" font-size="11.5" class="f_muted" fill="#6c6c73">TLS-only</text><text x="54" y="444" font-size="11.5" class="f_muted" fill="#6c6c73">no public access</text><text x="54" y="460" font-size="11.5" class="f_muted" fill="#6c6c73">encrypted · versioned</text><rect x="270.66666666666663" y="362" width="218.66666666666666" height="118" rx="12" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="284.66666666666663" y="386" font-size="10" class="mono f_green" fill="#1f7a49" letter-spacing="0.4px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">DERIVED IAM</text><text x="284.66666666666663" y="407" font-size="14" class="f_text" fill="#1c1c22" font-weight="600">Least-privilege policy</text><text x="284.66666666666663" y="428" font-size="11.5" class="f_muted" fill="#6c6c73">Get/List + Put/Delete on this</text><text x="284.66666666666663" y="444" font-size="11.5" class="f_muted" fill="#6c6c73">bucket ARN only → injected</text><text x="284.66666666666663" y="460" font-size="11.5" class="f_muted" fill="#6c6c73">into the pod’s Pod-Identity role.</text><rect x="501.3333333333333" y="362" width="218.66666666666666" height="118" rx="12" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="515.3333333333333" y="386" font-size="10" class="mono f_green" fill="#1f7a49" letter-spacing="0.4px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">THE WIRING</text><text x="515.3333333333333" y="407" font-size="14" class="f_text" fill="#1c1c22" font-weight="600">resources ConfigMap</text><text x="515.3333333333333" y="428" font-size="10.5" class="mono f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">BLOB_BUCKET=</text><text x="515.3333333333333" y="444" font-size="10.5" class="mono f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">refplat-bravo-dispatch</text><text x="515.3333333333333" y="460" font-size="10.5" class="mono f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">-dev-blob-7d258453</text><text x="149.33333333333331" y="502" font-size="15" class="f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><text x="379.99999999999994" y="502" font-size="15" class="f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><text x="610.6666666666666" y="502" font-size="15" class="f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><rect x="40" y="514" width="680" height="64" rx="12" class="f_card" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><text x="58" y="541" font-size="11" class="mono f_muted" fill="#6c6c73" letter-spacing="0.5px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">YOUR POD</text><text x="58" y="561" font-size="15" class="f_text" fill="#1c1c22" font-weight="600">reads it, reaches it</text><line x1="234" y1="530" x2="234" y2="562" stroke="#e4e4df" stroke-width="1" class="s_border"></line><text x="252" y="543" font-size="13" class="f_muted" fill="#6c6c73">Reads <tspan class="mono f_blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">$BLOB_BUCKET</tspan> and calls S3 with its Pod-Identity</text><text x="252" y="561" font-size="13" class="f_muted" fill="#6c6c73">creds — reaching its bucket and nothing else.</text><text x="40" y="608" font-size="13.5" class="f_muted" fill="#6c6c73">One line of intent became a <tspan class="f_green" fill="#1f7a49" font-weight="500">hardened resource</tspan>, an <tspan class="f_green" fill="#1f7a49" font-weight="500">IAM policy scoped to exactly it</tspan>, and the</text><text x="40" y="628" font-size="13.5" class="f_muted" fill="#6c6c73"><tspan class="f_green" fill="#1f7a49" font-weight="500">wiring to find it</tspan> — all derived, none hand-written.</text></svg>