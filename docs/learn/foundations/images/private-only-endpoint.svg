<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 670" width="760" height="670" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#fbf2df"]{fill:#554219}[stroke="#fbf2df"]{stroke:#554219}[fill="#e0be7e"]{fill:#e6c68a}[stroke="#e0be7e"]{stroke:#e6c68a}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#c9a765"]{fill:#dcc394}[stroke="#c9a765"]{stroke:#dcc394}[fill="#ffffff"]{fill:#141414}[stroke="#ffffff"]{stroke:#141414}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#fbeeea"]{fill:#512517}[stroke="#fbeeea"]{stroke:#512517}[fill="#e6b9ab"]{fill:#e0a28f}[stroke="#e6b9ab"]{stroke:#e0a28f}[fill="#b4462f"]{fill:#da7965}[stroke="#b4462f"]{stroke:#da7965}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}}</style><style>@media(prefers-color-scheme:dark){.f_bg{fill:#15161c}.f_greenBg{fill:#16331f}.s_greenBd{stroke:#2f6a45}.f_text{fill:#e6e6ea}.f_muted{fill:#9a9aa3}.f_dim{fill:#74747d}.f_blue{fill:#7fa0ee}.f_green{fill:#4fd08a}.f_amber{fill:#e0b050}}</style><rect x="0" y="0" width="760" height="654" rx="0" class="f_bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mono f_muted" fill="#6c6c73" letter-spacing="1.6px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">CONTROL PLANE</text><text x="40" y="90" font-size="26" class="f_text" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">No door on the street to pick</text><text x="40" y="122" font-size="15" class="f_muted" fill="#6c6c73">The EKS API endpoint is private-only. A stolen <tspan class="mono" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">kubectl</tspan> token is useless from a coffee</text><text x="40" y="142" font-size="15" class="f_muted" fill="#6c6c73">shop — there’s no route from the public internet to the API server at all.</text><rect x="40" y="176" width="333" height="354" rx="14" class="f_amberBg s_amberBd" fill="#fbf2df" stroke="#e0be7e" stroke-width="1"></rect><text x="58" y="202" font-size="11" class="mono f_amber" fill="#8a6410" letter-spacing="0.4px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">PUBLIC + IP ALLOWLIST</text><text x="58" y="224" font-size="17" class="f_text" fill="#1c1c22" font-weight="600">One gate</text><text x="58" y="244" font-size="12.5" class="f_muted" fill="#6c6c73">The network is open to the world; the</text><text x="58" y="260" font-size="12.5" class="f_muted" fill="#6c6c73">allowlist just narrows <tspan class="f_text" fill="#1c1c22">which</tspan> world.</text><text x="58" y="288" font-size="11" class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">internet</text><line x1="126" y1="284" x2="355" y2="284" stroke="#c9a765" stroke-width="2" stroke-dasharray="5 4" class="s_amberBd"></line><rect x="126" y="310" width="229" height="46" rx="9" class="f_card" fill="#ffffff" stroke="#e0be7e" stroke-width="1"></rect><text x="139" y="328" font-size="10" class="mono f_amber" fill="#8a6410" letter-spacing="0.4px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GATE 1</text><text x="139" y="347" font-size="13" class="f_text" fill="#1c1c22" font-weight="500">Valid IAM credentials</text><text x="240.5" y="374" font-size="14" class="f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><rect x="126" y="386" width="229" height="42" rx="9" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><text x="139" y="412" font-size="13" class="f_text" fill="#1c1c22" font-weight="500">API server</text><rect x="387" y="176" width="333" height="354" rx="14" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="405" y="202" font-size="11" class="mono f_green" fill="#1f7a49" letter-spacing="0.4px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">PRIVATE-ONLY · THE HOUSE POLICY</text><text x="405" y="224" font-size="17" class="f_text" fill="#1c1c22" font-weight="600">Double gate</text><text x="405" y="244" font-size="12.5" class="f_muted" fill="#6c6c73">You need credentials and a network path</text><text x="405" y="260" font-size="12.5" class="f_muted" fill="#6c6c73">that lands inside the VPC.</text><text x="405" y="298" font-size="11" class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">internet</text><rect x="473" y="276" width="229" height="38" rx="9" class="f_redBg s_redBd" fill="#fbeeea" stroke="#e6b9ab" stroke-width="1"></rect><circle cx="491" cy="295" r="7" class="f_red" fill="#b4462f"></circle><text x="491" y="298.5" font-size="9" class="f_bg" fill="#f6f6f3" font-weight="600" text-anchor="middle">✕</text><text x="505" y="299" font-size="11.5" class="f_red" fill="#b4462f">no route — DNS resolves to nothing</text><text x="405" y="351" font-size="11" class="mono f_blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Tailscale</text><rect x="473" y="324" width="229" height="46" rx="9" class="f_card" fill="#ffffff" stroke="#a3ccb4" stroke-width="1"></rect><text x="486" y="342" font-size="10" class="mono f_green" fill="#1f7a49" letter-spacing="0.4px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GATE 1 · NETWORK PATH</text><text x="486" y="361" font-size="13" class="f_text" fill="#1c1c22" font-weight="500">Land inside the VPC</text><text x="587.5" y="388" font-size="14" class="f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><rect x="473" y="398" width="229" height="46" rx="9" class="f_card" fill="#ffffff" stroke="#a3ccb4" stroke-width="1"></rect><text x="486" y="416" font-size="10" class="mono f_green" fill="#1f7a49" letter-spacing="0.4px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GATE 2 · SIGV4</text><text x="486" y="435" font-size="13" class="f_text" fill="#1c1c22" font-weight="500">Valid IAM credentials</text><text x="587.5" y="462" font-size="14" class="f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><rect x="473" y="472" width="229" height="42" rx="9" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><text x="486" y="498" font-size="13" class="f_text" fill="#1c1c22" font-weight="500">API server</text><rect x="40" y="548" width="680" height="82" rx="12" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><text x="58" y="574" font-size="10.5" class="mono f_green" fill="#1f7a49" letter-spacing="0.4px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FAIL-SAFE</text><text x="58" y="596" font-size="13.5" class="f_muted" fill="#6c6c73">The default is <tspan class="f_text" fill="#1c1c22">closed</tspan> — <tspan class="mono f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">endpoint_public_access = false</tspan>. A dropped config line can’t</text><text x="58" y="616" font-size="13.5" class="f_muted" fill="#6c6c73">silently expose the API. Isolation stops being a policy you enforce and becomes a fact of the topology.</text></svg>