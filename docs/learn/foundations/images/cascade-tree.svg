<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 588" width="760" height="588" xml:space="preserve" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#f4f6f9"]{fill:#17181a}[stroke="#f4f6f9"]{stroke:#17181a}[fill="#d3d8e0"]{fill:#353e4c}[stroke="#d3d8e0"]{stroke:#353e4c}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#eef7f1"]{fill:#21472e}[stroke="#eef7f1"]{stroke:#21472e}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#8a8a90"]{fill:#89898f}[stroke="#8a8a90"]{stroke:#89898f}[fill="#fbf3e6"]{fill:#523c18}[stroke="#fbf3e6"]{stroke:#523c18}[fill="#d8b877"]{fill:#e1c68e}[stroke="#d8b877"]{stroke:#e1c68e}[fill="#9a6a12"]{fill:#eca82d}[stroke="#9a6a12"]{stroke:#eca82d}[fill="#8a7340"]{fill:#bca369}[stroke="#8a7340"]{stroke:#bca369}[fill="#b08a3e"]{fill:#d2b478}[stroke="#b08a3e"]{stroke:#d2b478}[fill="#f6ead4"]{fill:#5b441b}[stroke="#f6ead4"]{stroke:#5b441b}[fill="#dcc191"]{fill:#dec291}[stroke="#dcc191"]{stroke:#dec291}}</style><rect x="0" y="0" width="760" height="588" rx="0" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">THE CASCADE — EACH FACT IN ONE LAYER</text><text x="40" y="92" font-size="27" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">The layers, as an inheritance tree</text><text x="40" y="118" font-size="15" fill="#6c6c73">Each arrow is one inheritance step, broad scope down to narrow. _base.hcl is the reader</text><text x="40" y="138" font-size="15" fill="#6c6c73">that merges every layer for the leaf unit.</text><rect x="76" y="166" width="320" height="48" rx="10" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><text x="236" y="187" font-size="13" fill="#2f5fd0" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">root.hcl</text><text x="236" y="204" font-size="12" fill="#6c6c73" text-anchor="middle">remote state and providers</text><line x1="236" y1="214" x2="236" y2="232" stroke="#9a9aa1" stroke-width="1.6"></line><path d="M236 236 L231 229 L241 229 Z" fill="#9a9aa1"></path><rect x="76" y="236" width="320" height="48" rx="10" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><text x="236" y="257" font-size="13" fill="#2f5fd0" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">common.hcl</text><text x="236" y="274" font-size="12" fill="#6c6c73" text-anchor="middle">cloud defaults · SOPS secrets · tags</text><line x1="236" y1="284" x2="236" y2="302" stroke="#9a9aa1" stroke-width="1.6"></line><path d="M236 306 L231 299 L241 299 Z" fill="#9a9aa1"></path><rect x="76" y="306" width="320" height="48" rx="10" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><text x="236" y="327" font-size="13" fill="#2f5fd0" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">env.hcl</text><text x="236" y="344" font-size="12" fill="#6c6c73" text-anchor="middle">account id · env tags</text><line x1="236" y1="354" x2="236" y2="372" stroke="#9a9aa1" stroke-width="1.6"></line><path d="M236 376 L231 369 L241 369 Z" fill="#9a9aa1"></path><rect x="76" y="376" width="320" height="48" rx="10" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><text x="236" y="397" font-size="13" fill="#2f5fd0" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">region.hcl + network.hcl</text><text x="236" y="414" font-size="12" fill="#6c6c73" text-anchor="middle">region · CIDRs</text><line x1="236" y1="424" x2="236" y2="442" stroke="#9a9aa1" stroke-width="1.6"></line><path d="M236 446 L231 439 L241 439 Z" fill="#9a9aa1"></path><rect x="76" y="446" width="320" height="48" rx="10" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><text x="236" y="467" font-size="13" fill="#2f5fd0" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">workload.hcl</text><text x="236" y="484" font-size="12" fill="#6c6c73" text-anchor="middle">workload name · compliance tier</text><line x1="236" y1="494" x2="236" y2="512" stroke="#9a9aa1" stroke-width="1.6"></line><path d="M236 516 L231 509 L241 509 Z" fill="#9a9aa1"></path><rect x="76" y="516" width="320" height="48" rx="10" fill="#eef7f1" stroke="#a3ccb4" stroke-width="1"></rect><text x="236" y="537" font-size="13" fill="#1f7a49" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">terragrunt.hcl</text><text x="236" y="554" font-size="12" fill="#6c6c73" text-anchor="middle">module · inputs · dependencies</text><text x="50" y="360" font-size="10" fill="#8a8a90" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.6px" transform="rotate(-90 50 360)">BROADEST   →   NARROWEST</text><rect x="440" y="384" width="280" height="60" rx="10" fill="#fbf3e6" stroke="#d8b877" stroke-width="1"></rect><text x="580" y="406" font-size="13" fill="#9a6a12" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">_base.hcl</text><text x="580" y="424" font-size="11.5" fill="#8a7340" text-anchor="middle">loads every layer · exposes locals</text><line x1="580" y1="444" x2="580" y2="540" stroke="#b08a3e" stroke-width="1.6" stroke-dasharray="4 3"></line><line x1="580" y1="540" x2="400" y2="540" stroke="#b08a3e" stroke-width="1.6" stroke-dasharray="4 3"></line><path d="M396 540 L403 535 L403 545 Z" 