<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#fbeae3"]{fill:#542a18}[stroke="#fbeae3"]{stroke:#542a18}[fill="#e0b3a0"]{fill:#dea892}[stroke="#e0b3a0"]{stroke:#dea892}[fill="#b5482a"]{fill:#dd795e}[stroke="#b5482a"]{stroke:#dd795e}[fill="#f4f6f9"]{fill:#17181a}[stroke="#f4f6f9"]{stroke:#17181a}[fill="#d7dbe2"]{fill:#353c49}[stroke="#d7dbe2"]{stroke:#353c49}[fill="#c06a4a"]{fill:#daa18c}[stroke="#c06a4a"]{stroke:#daa18c}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#efeeeb"]{fill:#1f1e1c}[stroke="#efeeeb"]{stroke:#1f1e1c}[fill="#dcdbd6"]{fill:#2a2925}[stroke="#dcdbd6"]{stroke:#2a2925}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}}</style><rect x="0" y="0" width="760" height="556" rx="0" class="bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">THE BOOTSTRAP CIRCULARITY</text><text x="40" y="90" font-size="26" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">The bucket and the key must exist before</text><text x="40" y="119" font-size="26" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">anything can read them</text><text x="40" y="147" font-size="15" class="mut" fill="#6c6c73">Every unit’s config load writes state to the S3 bucket and decrypts secrets with the KMS</text><text x="40" y="167" font-size="15" class="mut" fill="#6c6c73">key. So how do you create the bucket and the key — when creating them would itself</text><text x="40" y="187" font-size="15" class="mut" fill="#6c6c73">need the bucket and the key?</text><rect x="40" y="210" width="680" height="120" rx="13" class="deadBg deadBd" fill="#fbeae3" stroke="#e0b3a0" stroke-width="1"></rect><text x="58" y="234" font-size="10" class="red" fill="#b5482a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">⟲  THE DEADLOCK</text><rect x="56" y="246" width="268" height="66" rx="11" class="card cardBd" fill="#f4f6f9" stroke="#d7dbe2" stroke-width="1"></rect><text x="72" y="272" font-size="12.5" class="tx" fill="#1c1c22" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">any unit’s config load</text><text x="72" y="290" font-size="12" class="mut" fill="#6c6c73">must write state + decrypt secrets</text><rect x="436" y="246" width="268" height="66" rx="11" class="card cardBd" fill="#f4f6f9" stroke="#d7dbe2" stroke-width="1"></rect><text x="452" y="272" font-size="12.5" class="tx" fill="#1c1c22" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">S3 state bucket + KMS key</text><text x="452" y="290" font-size="12" class="mut" fill="#6c6c73">themselves created by a unit</text><line x1="330" y1="268" x2="424" y2="268" class="rl" stroke="#c06a4a" stroke-width="2"></line><path d="M426 268 L419 263 L419 273 Z" class="rlF" fill="#c06a4a"></path><text x="377" y="262" font-size="9.5" class="red" fill="#b5482a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">needs</text><path d="M328 292 L335 287 L335 297 Z" class="rlF" fill="#c06a4a"></path><line x1="330" y1="292" x2="424" y2="292" class="rl" stroke="#c06a4a" stroke-width="2"></line><text x="377" y="306" font-size="9.5" class="red" fill="#b5482a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">created by a unit</text><text x="40" y="356" font-size="10.5" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">TWO ESCAPE HATCHES BREAK THE CYCLE</text><rect x="40" y="368" width="330" height="94" rx="12" class="grBg grBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="56" y="394" font-size="12.5" class="grn" fill="#1f7a49" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">local state</text><text x="56" y="416" font-size="12.5" class="tx" fill="#1c1c22">The state-bootstrap unit overrides the</text><text x="56" y="433" font-size="12.5" class="tx" fill="#1c1c22">S3 backend with a local one — can’t</text><text x="56" y="450" font-size="12.5" class="tx" fill="#1c1c22">store state in the bucket it’s creating.</text><rect x="390" y="368" width="330" height="94" rx="12" class="grBg grBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="406" y="394" font-size="12.5" class="grn" fill="#1f7a49" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">TG_SOPS_BOOTSTRAP=1</text><text x="406" y="416" font-size="12.5" class="tx" fill="#1c1c22">Flips _secrets to a plaintext, gitignored</text><text x="406" y="433" font-size="12.5" class="tx" fill="#1c1c22">secrets.hcl — KMS is never called, so</text><text x="406" y="450" font-size="12.5" class="tx" fill="#1c1c22">you can run before the key exists.</text><rect x="40" y="478" width="680" height="76" rx="12" class="panel panelBd" fill="#efeeeb" stroke="#dcdbd6" stroke-width="1"></rect><text x="60" y="500" font-size="10.5" class="blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">AFTER BOOTSTRAP</text><text x="60" y="520" font-size="13" class="tx" fill="#1c1c22">The bucket and key become standing prerequisites — foundations poured before the walls.</text><text x="60" y="536" font-size="13" class="mut" fill="#6c6c73">Destroy them and you’ve locked yourself out of everything above.</text></svg>