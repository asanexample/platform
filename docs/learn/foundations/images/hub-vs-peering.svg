<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" width="760" height="556" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#fbeee7"]{fill:#522c18}[stroke="#fbeee7"]{stroke:#522c18}[fill="#e0b8a4"]{fill:#dcab93}[stroke="#e0b8a4"]{stroke:#dcab93}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#b5482a"]{fill:#dd795e}[stroke="#b5482a"]{stroke:#dd795e}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#cf8f72"]{fill:#dcaa93}[stroke="#cf8f72"]{stroke:#dcaa93}[fill="#f2ddd4"]{fill:#5c2f1c}[stroke="#f2ddd4"]{stroke:#5c2f1c}[fill="#d08a6a"]{fill:#dfa991}[stroke="#d08a6a"]{stroke:#dfa991}[fill="#7fbf9a"]{fill:#9fd1b4}[stroke="#7fbf9a"]{stroke:#9fd1b4}[fill="#d7ecdf"]{fill:#275238}[stroke="#d7ecdf"]{stroke:#275238}[fill="#7fc79c"]{fill:#9ad5b2}[stroke="#7fc79c"]{stroke:#9ad5b2}[fill="#4e9e73"]{fill:#83c4a1}[stroke="#4e9e73"]{stroke:#83c4a1}[fill="#0e2a1b"]{fill:#50c888}[stroke="#0e2a1b"]{stroke:#50c888}[fill="#efeeeb"]{fill:#1f1e1c}[stroke="#efeeeb"]{stroke:#1f1e1c}[fill="#dcdbd6"]{fill:#2a2925}[stroke="#dcdbd6"]{stroke:#2a2925}[fill="#8a8a90"]{fill:#89898f}[stroke="#8a8a90"]{stroke:#89898f}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}}</style><rect x="0" y="0" width="760" height="556" rx="0" class="bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">THE TRANSIT GATEWAY · §4</text><text x="40" y="92" font-size="27" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">One corridor, not a maze of tunnels</text><text x="40" y="118" font-size="15" class="mut" fill="#6c6c73">Non-overlapping VPCs can be joined. One Transit Gateway in the platform account, shared to</text><text x="40" y="138" font-size="15" class="mut" fill="#6c6c73">the spokes, beats peering every pair — peering is non-transitive and grows N²; a hub, linearly.</text><rect x="40" y="166" width="330" height="270" rx="13" class="mazeBg mazeBd" fill="#fbeee7" stroke="#e0b8a4" stroke-width="1.4" stroke-dasharray="5 4"></rect><rect x="390" y="166" width="330" height="270" rx="13" class="hubBg hubBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="58" y="192" font-size="10.5" class="red" fill="#b5482a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">VPC PEERING · THE MAZE</text><text x="408" y="192" font-size="10.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">TRANSIT GATEWAY · THE CORRIDOR</text><line x1="130" y1="214" x2="280" y2="214" class="rl" stroke="#cf8f72" stroke-width="2"></line><line x1="130" y1="214" x2="130" y2="290" class="rl" stroke="#cf8f72" stroke-width="2"></line><line x1="130" y1="214" x2="280" y2="290" class="rl" stroke="#cf8f72" stroke-width="2"></line><line x1="280" y1="214" x2="130" y2="290" class="rl" stroke="#cf8f72" stroke-width="2"></line><line x1="280" y1="214" x2="280" y2="290" class="rl" stroke="#cf8f72" stroke-width="2"></line><line x1="130" y1="290" x2="280" y2="290" class="rl" stroke="#cf8f72" stroke-width="2"></line><circle cx="130" cy="214" r="13" class="meshN" fill="#f2ddd4" stroke="#d08a6a" stroke-width="1.5"></circle><circle cx="280" cy="214" r="13" class="meshN" fill="#f2ddd4" stroke="#d08a6a" stroke-width="1.5"></circle><circle cx="130" cy="290" r="13" class="meshN" fill="#f2ddd4" stroke="#d08a6a" stroke-width="1.5"></circle><circle cx="280" cy="290" r="13" class="meshN" fill="#f2ddd4" stroke="#d08a6a" stroke-width="1.5"></circle><line x1="555" y1="252" x2="478" y2="214" class="gl" stroke="#7fbf9a" stroke-width="2"></line><line x1="555" y1="252" x2="632" y2="214" class="gl" stroke="#7fbf9a" stroke-width="2"></line><line x1="555" y1="252" x2="478" y2="290" class="gl" stroke="#7fbf9a" stroke-width="2"></line><line x1="555" y1="252" x2="632" y2="290" class="gl" stroke="#7fbf9a" stroke-width="2"></line><circle cx="478" cy="214" r="12" class="starN" fill="#d7ecdf" stroke="#7fbf9a" stroke-width="1.5"></circle><circle cx="632" cy="214" r="12" class="starN" fill="#d7ecdf" stroke="#7fbf9a" stroke-width="1.5"></circle><circle cx="478" cy="290" r="12" class="starN" fill="#d7ecdf" stroke="#7fbf9a" stroke-width="1.5"></circle><circle cx="632" cy="290" r="12" class="starN" fill="#d7ecdf" stroke="#7fbf9a" stroke-width="1.5"></circle><circle cx="555" cy="252" r="17" class="starHub" fill="#7fc79c" stroke="#4e9e73" stroke-width="2"></circle><text x="555" y="256" font-size="10" class="tx" fill="#0e2a1b" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">TGW</text><text x="205" y="326" font-size="13" class="red" fill="#b5482a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">N = 4  →  6 tunnels</text><text x="555" y="326" font-size="13" class="grn" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">attach once → reach all</text><text x="58" y="352" font-size="12.5"><tspan class="tx" fill="#1c1c22" font-weight="600">Non-transitive </tspan><tspan class="mut" fill="#6c6c73">— A↔B and B↔C</tspan></text><text x="58" y="368" font-size="12.5" class="mut" fill="#6c6c73">never gives you A↔C.</text><text x="58" y="392" font-size="12.5"><tspan class="tx" fill="#1c1c22" font-weight="600">N×(N−1)/2 </tspan><tspan class="mut" fill="#6c6c73">— every pair, wired</tspan></text><text x="58" y="408" font-size="12.5" class="mut" fill="#6c6c73">on both sides, by hand.</text><text x="408" y="352" font-size="12.5"><tspan class="tx" fill="#1c1c22" font-weight="600">Transitive </tspan><tspan class="mut" fill="#6c6c73">— one attachment</tspan></text><text x="408" y="368" font-size="12.5" class="mut" fill="#6c6c73">reaches every spoke.</text><text x="408" y="392" font-size="12.5"><tspan class="tx" fill="#1c1c22" font-weight="600">Linear </tspan><tspan class="mut" fill="#6c6c73">— a new spoke is one</tspan></text><text x="408" y="408" font-size="12.5" class="mut" fill="#6c6c73">RAM share on the hub.</text><rect x="40" y="450" width="680" height="38" rx="10" class="panel panelBd" fill="#efeeeb" stroke="#dcdbd6" stroke-width="1"></rect><text x="58" y="473" font-size="10.5" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">LIVE</text><text x="100" y="473" font-size="12.5"><tspan class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">platform</tspan><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"> hub · TGW </tspan><tspan class="mut" fill="#8a8a90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">tgw-0e42…459f</tspan><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"> · 2 attachments: </tspan><tspan class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">platform</tspan><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"> + </tspan><tspan class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">preprod</tspan></text><text x="40" y="516" font-size="13"><tspan class="blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="500">THE TRADE · </tspan><tspan class="mut" fill="#6c6c73">a roundabout is a single shared junction — shared hourly cost and shared</tspan></text><text x="40" y="534" font-size="13" class="mut" fill="#6c6c73">blast radius. Peering has no central dependency. Linear beats quadratic well before many spokes.</text></svg>