<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 534" width="760" height="534" xml:space="preserve" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#fbeae3"]{fill:#542a18}[stroke="#fbeae3"]{stroke:#542a18}[fill="#e0b3a0"]{fill:#dea892}[stroke="#e0b3a0"]{stroke:#dea892}[fill="#b5482a"]{fill:#dd795e}[stroke="#b5482a"]{stroke:#dd795e}[fill="#e6e6e9"]{fill:#1e1e22}[stroke="#e6e6e9"]{stroke:#1e1e22}[fill="#d16a4a"]{fill:#e4a08b}[stroke="#d16a4a"]{stroke:#e4a08b}[fill="#a05236"]{fill:#ce8064}[stroke="#a05236"]{stroke:#ce8064}[fill="#5a6070"]{fill:#828899}[stroke="#5a6070"]{stroke:#828899}[fill="#9aa0ad"]{fill:#818898}[stroke="#9aa0ad"]{stroke:#818898}[fill="#7a7f8c"]{fill:#848995}[stroke="#7a7f8c"]{stroke:#848995}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#5a9e78"]{fill:#91c2a7}[stroke="#5a9e78"]{stroke:#91c2a7}[fill="#eef7f1"]{fill:#21472e}[stroke="#eef7f1"]{stroke:#21472e}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#4ea778"]{fill:#87c9a7}[stroke="#4ea778"]{stroke:#87c9a7}[fill="#d7ecdf"]{fill:#275238}[stroke="#d7ecdf"]{stroke:#275238}[fill="#bcdcc9"]{fill:#a0cfb3}[stroke="#bcdcc9"]{stroke:#a0cfb3}}</style><rect x="0" y="0" width="760" height="526" rx="0" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">THE DESCHEDULER · PART C</text><text x="40" y="92" font-size="27" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">The gap the scheduler and Karpenter both leave</text><text x="40" y="118" font-size="15" fill="#6c6c73">The scheduler places a pod once and never moves it; Karpenter adds and removes nodes but</text><text x="40" y="138" font-size="15" fill="#6c6c73">won’t relocate a running one — so after an unpark, single-replica pods pile onto the first node up.</text><rect x="40" y="160" width="680" height="116" rx="13" fill="#fbeae3" stroke="#e0b3a0" stroke-width="1"></rect><text x="56" y="184" font-size="10.5" fill="#b5482a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">BEFORE · 2026-07-02, POST-UNPARK</text><text x="56" y="208" font-size="12" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">node A</text><text x="376" y="208" font-size="11.5" fill="#b5482a" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">59 pods · ~99% CPU</text><rect x="56" y="216" width="320" height="16" rx="5" fill="#e6e6e9"></rect><rect x="56" y="216" width="317" height="16" rx="5" fill="#d16a4a"></rect><text x="56" y="246" font-size="11.5" fill="#a05236">kubelet → NodeStatusUnknown; pods crash-loop,</text><text x="56" y="262" font-size="11.5" fill="#a05236">even Karpenter’s own controller.</text><text x="400" y="208" font-size="12" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">node B</text><text x="704" y="208" font-size="11.5" fill="#5a6070" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">14 pods · ~40% CPU</text><rect x="400" y="216" width="304" height="16" rx="5" fill="#e6e6e9"></rect><rect x="400" y="216" width="122" height="16" rx="5" fill="#9aa0ad"></rect><text x="400" y="246" font-size="11.5" fill="#7a7f8c">Idle headroom — a point under the 40%</text><text x="400" y="262" font-size="11.5" fill="#7a7f8c">destination threshold.</text><text x="380" y="298" font-size="11" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">descheduler · LowNodeUtilization · CronJob every 10–15 min</text><path d="M380 314 L374 306 L386 306 Z" fill="#5a9e78"></path><rect x="40" y="322" width="680" height="74" rx="13" fill="#eef7f1" stroke="#a3ccb4" stroke-width="1"></rect><text x="56" y="346" font-size="10.5" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">AFTER · evict from hot → reschedule onto cool</text><text x="56" y="368" font-size="12" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">node A</text><text x="376" y="368" font-size="11.5" fill="#1f7a49" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">~69% CPU</text><rect x="56" y="376" width="320" height="16" rx="5" fill="#e6e6e9"></rect><rect x="56" y="376" width="221" height="16" rx="5" fill="#4ea778"></rect><text x="400" y="368" font-size="12" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">node B</text><text x="704" y="368" font-size="11.5" fill="#1f7a49" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">~69% CPU</text><rect x="400" y="376" width="304" height="16" rx="5" fill="#e6e6e9"></rect><rect x="400" y="376" width="210" height="16" rx="5" fill="#4ea778"></rect><text x="40" y="420" font-size="10.5" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">THE SAFETY ENVELOPE · DefaultEvictor</text><rect x="40" y="430" width="297" height="22" rx="6" fill="#d7ecdf" stroke="#bcdcc9" stroke-width="1"></rect><text x="49" y="445" font-size="11" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">nodeFit — evict only if it can reschedule now</text><rect x="344" y="430" width="197.8" height="22" rx="6" fill="#d7ecdf" stroke="#bcdcc9" stroke-width="1"></rect><text x="353" y="445" font-size="11" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">respects PodDisruptionBudgets</text><rect x="40" y="458" width="328" height="22" rx="6" fill="#d7ecdf" stroke="#bcdcc9" stroke-width="1"></rect><text x="49" y="473" font-size="11" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">never evicts system-critical (Karpenter · CoreDNS)</text><rect x="375" y="458" width="216.4" height="22" rx="6" fill="#d7ecdf" stroke="#bcdcc9" stroke-width="1"></rect><text x="384" y="473" font-size="11" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">skips DaemonSets &amp; local-storage</text><text x="40" y="498" font-size="13" fill="#6c6c73">Three mechanisms: topology-spread spreads one workload’s replicas, Karpenter adds/removes</text><text x="40" y="516" font-size="13" fill="#6c6c73">nodes, and the descheduler moves existing pods between existing nodes — the gap in between.</text></svg>