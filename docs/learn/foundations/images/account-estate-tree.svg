ounts, one hard wall, a ceiling above</text><text x="40" y="118" font-size="15" fill="#6c6c73">The Org root branches into two OUs. SCPs form a ceiling over the member accounts — never the</text><text x="40" y="138" font-size="15" fill="#6c6c73">management account, which is SCP-exempt and holds only governance and the state backend.</text><rect x="250" y="166" width="180" height="44" rx="10" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><text x="340" y="189" font-size="13" fill="#1c1c22" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">AWS Org root</text><rect x="556" y="166" width="164" height="44" rx="10" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1.4" stroke-dasharray="4 3"></rect><text x="638" y="185" font-size="12.5" fill="#1c1c22" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">management</text><text x="638" y="201" font-size="10.5" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SCP-exempt · state</text><line x1="430" y1="188" x2="556" y2="188" stroke="#c3c6cd" stroke-width="1.6"></line><line x1="340" y1="210" x2="340" y2="238" stroke="#9a9aa1" stroke-width="1.6"></line><path d="M340 242 L335 235 L345 235 Z" fill="#9a9aa1"></path><rect x="60" y="244" width="470" height="30" rx="8" fill="#fbf3e6" stroke="#d8b877" stroke-width="1"></rect><text x="295" y="263" font-size="11.5" fill="#9a6a12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ORG SCPs · PERMISSION CEILING (over member accounts)</text><line x1="180" y1="274" x2="180" y2="296" stroke="#9a9aa1" stroke-width="1.6"></line><path d="M180 300 L175 293 L185 293 Z" fill="#9a9aa1"></path><line x1="430" y1="274" x2="430" y2="296" stroke="#9a9aa1" stroke-width="1.6"></line><path d="M430 300 L425 293 L435 293 Z" fill="#9a9aa1"></path><rect x="60" y="302" width="300" height="120" rx="12" fill="#e