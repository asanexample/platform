fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">One hub, one corridor, private all the way in</text><text x="40" y="118" font-size="15" fill="#6c6c73">The platform account is the hub: every spoke VPC attaches to one Transit Gateway and</text><text x="40" y="138" font-size="15" fill="#6c6c73">reaches the rest. A private cluster answers only to names a small DNS module republishes.</text><rect x="40" y="156" width="536" height="196" rx="13" fill="#ececef" stroke="#d4d6dc" stroke-width="1"></rect><text x="56" y="180" font-size="11" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">Platform account · hub</text><rect x="40" y="414" width="536" height="104" rx="13" fill="#ececef" stroke="#d4d6dc" stroke-width="1"></rect><text x="56" y="438" font-size="11" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">PreProd account · spoke</text><rect x="90" y="198" width="180" height="58" rx="10" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text x="180" y="224" font-size="13" fill="#2f5fd0" text-anchor="middle" font-weight="600">Platform VPC</text><text x="180" y="242" font-size="11" fill="#5a76a8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">10.100.0.0/16</text><rect x="90" y="282" width="180" height="58" rx="10" fill="#fbf3e6" stroke="#d8b877" stroke-width="1"></rect><text x="180" y="308" font-size="13" fill="#9a6a12" text-anchor="middle" font-weight="600">Transit Gateway</text><text x="180" y="326" font-size="11" fill="#9a8656" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">hub</text><rect x="396" y="240" width="168" height="58" rx="10" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><text x="480" y="266" font-size="13" fill="#1c1c22" text-anchor="middle" font-weight="600">cross-VPC DNS</text><text x="480" y="284" font-size="11" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">private hosted zone</text><rect x="596" y="240" width="124" height="58" rx="10" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><text x="658" y="266" font-size="13" fill="#1c1c22" text-anchor="middle" font-weight="600">operator</text><text x="658" y="284" font-size="11" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">kubectl</text><rect x="90" y="450" width="180" height="54" rx="10" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text x="180" y="474" font-size="13" fill="#2f5fd0" text-anchor="middle" font-weight="600">PreProd VPC</text><text x="180" y="492" font-size="11" fill="#5a76a8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">10.101.0.0/16</text><rect x="396" y="450" width="168" height="54" rx="10" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="480" y="474" font-size="13" fill="#1f7a49" text-anchor="middle" font-weight="600">preprod EKS API</text><text x="480" y="492" font-size="11" fill="#5b8a70" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">private only</text><line x1="180" y1="256" x2="180" y2="278" stroke="#9a9aa1" stroke-width="1.6"></line><path d="M180 282 L175 275 L185 275 Z" fill="#9a9aa1"></path><rect x="265.3" y="256" width="129.39999999999998" height="22" rx="6" fill="#eceef1" stroke="#d7dade" stroke-width="1"></rect><text x="330" y="271" font-size="10.5" fill="#3a3a42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">transit /28 per AZ</text><line x1="150" y1="340" x2="150" y2="446" stroke="#9a9aa1" stroke-width="1.6"></line><path d="M150 450 L145 443 L155 443 Z" fill="#9a9aa1"></path><line x1="210" y1="450" x2="210" y2="344" stroke="#9a9aa1" stroke-width="1.6"></line><path d="M210 340 L205 347 L215 347 Z" fill="#9a9aa1"></path><rect x="115.30000000000001" y="361" width="129.39999999999998" height="22" rx="6" fill="#eceef1" stroke="#d7dade" stroke-width="1"></rect><text x="180" y="376" font-size="10.5" fill="#3a3a42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">routes hub → spoke</text><rect x="109" y="387" width="142" height="22" rx="6" fill="#eceef1" stroke="#d7dade" stroke-width="1"></rect><text x="180" y="402" font-size="10.5" fill="#3a3a42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">attach via RAM share</text><line x1="480" y1="298" x2="480" y2="446" stroke="#9a9aa1" stroke-width="1.6"></line><path d="M480 450 L475 443 L485 443 Z" fill="#9a9aa1"></path><rect x="383.8" y="373" width="192.4" height="22" rx="6" fill="#eceef1" stroke="#d7dade" stroke-width="1"></rect><text x="480" y="388" font-size="10.5" fill="#3a3a42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">resolves API name to ENI IPs</text><line x1="658" y1="298" x2="658" y2="470" stroke="#9a9aa1" stroke-width="1.6" stroke-dasharray="3 3"></line><line x1="658" y1="470" x2="570" y2="470" stroke="#9a9aa1" stroke-width="1.6" stroke-dasharray="3 3"></line><path d="M566 470 L573 465 L573 475 Z" fill="#9a9aa1"></path><rect x="590.6" y="381" width="134.79999999999998" height="22" rx="6" fill="#eceef1" stroke="#d7dade" stroke-width="1"></rect><text x="658" y="396" font-size="9" fill="#3a3a42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Tailscale private path</text></svg>