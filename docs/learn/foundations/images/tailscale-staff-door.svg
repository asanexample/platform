<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" xml:space="preserve" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#f4f6f9"]{fill:#17181a}[stroke="#f4f6f9"]{stroke:#17181a}[fill="#d3d8e0"]{fill:#353e4c}[stroke="#d3d8e0"]{stroke:#353e4c}[fill="#5a9e78"]{fill:#91c2a7}[stroke="#5a9e78"]{stroke:#91c2a7}[fill="#eef7f1"]{fill:#21472e}[stroke="#eef7f1"]{stroke:#21472e}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#5b8a70"]{fill:#8cb59e}[stroke="#5b8a70"]{stroke:#8cb59e}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#5a76a8"]{fill:#95a8c9}[stroke="#5a76a8"]{stroke:#95a8c9}[fill="#fbf3e6"]{fill:#523c18}[stroke="#fbf3e6"]{stroke:#523c18}[fill="#d8b877"]{fill:#e1c68e}[stroke="#d8b877"]{stroke:#e1c68e}[fill="#9a6a12"]{fill:#eca82d}[stroke="#9a6a12"]{stroke:#eca82d}[fill="#8a7340"]{fill:#bca369}[stroke="#8a7340"]{stroke:#bca369}[fill="#f1f1ef"]{fill:#1e1e1a}[stroke="#f1f1ef"]{stroke:#1e1e1a}[fill="#d9d9dd"]{fill:#242429}[stroke="#d9d9dd"]{stroke:#242429}[fill="#3a3a42"]{fill:#dedee2}[stroke="#3a3a42"]{stroke:#dedee2}}</style><rect x="0" y="0" width="760" height="440" rx="0" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">THE STAFF DOOR · PART D</text><text x="40" y="92" font-size="27" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Reaching a cluster with no public endpoint</text><text x="40" y="118" font-size="15" fill="#6c6c73">The EKS API is private-only. You reach it through the campus’s internal corridors — a subnet</text><text x="40" y="138" font-size="15" fill="#6c6c73">router advertises the VPC to your tailnet, and split-DNS resolves the API’s name inside the VPC.</text><rect x="40" y="160" width="160" height="66" rx="11" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><text x="54" y="188" font-size="13" fill="#1c1c22" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">operator · kubectl</text><text x="54" y="207" font-size="12" fill="#6c6c73">on the tailnet</text><text x="235" y="186" font-size="9.5" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">tailnet</text><line x1="205" y1="196" x2="264" y2="196" stroke="#5a9e78" stroke-width="1.8"></line><path d="M266 196 L259 191 L259 201 Z" fill="#5a9e78"></path><rect x="270" y="160" width="240" height="66" rx="11" fill="#eef7f1" stroke="#a3ccb4" stroke-width="1"></rect><text x="284" y="188" font-size="13" fill="#1f7a49" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">subnet router</text><text x="284" y="207" font-size="12" fill="#5b8a70">in-cluster · 10.100.0.0/16</text><text x="545" y="186" font-size="9.5" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">in-VPC</text><line x1="515" y1="196" x2="574" y2="196" stroke="#5a9e78" stroke-width="1.8"></line><path d="M576 196 L569 191 L569 201 Z" fill="#5a9e78"></path><rect x="580" y="160" width="140" height="66" rx="11" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text x="594" y="188" font-size="13" fill="#2f5fd0" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">EKS API</text><text x="594" y="207" font-size="12" fill="#5a76a8">private-only</text><rect x="40" y="240" width="334" height="66" rx="11" fill="#fbf3e6" stroke="#d8b877" stroke-width="1"></rect><text x="54" y="262" font-size="10" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">SPLIT DNS · a route isn’t a name</text><text x="54" y="282" font-size="12" fill="#8a7340">The API name resolves to 10.100.0.2 — the in-VPC</text><text x="54" y="298" font-size="12" fill="#8a7340">resolver at CIDR + 2 — so it answers with private IPs.</text><rect x="386" y="240" width="334" height="66" rx="11" fill="#fbf3e6" stroke="#d8b877" stroke-width="1"></rect><text x="400" y="262" font-size="10" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">USERSPACE MODE · two drivers, one wheel</text><text x="400" y="282" font-size="12" fill="#8a7340">TS_USERSPACE=true keeps WireGuard off the kernel</text><text x="400" y="298" font-size="12" fill="#8a7340">routing table Cilium’s eBPF owns.</text><rect x="40" y="320" width="680" height="52" rx="11" fill="#f1f1ef" stroke="#d9d9dd" stroke-width="1.4" stroke-dasharray="4 3"></rect><text x="56" y="342" font-size="10.5" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">FALLBACK · when the cluster itself is down</text><text x="56" y="361" font-size="12" fill="#3a3a42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SSM Session Manager → EC2 bastion → EKS API</text><text x="430" y="361" font-size="12.5" fill="#6c6c73">— independent of EKS; opens when the building is dark.</text><text x="40" y="398" font-size="13" fill="#6c6c73">Bootstrap trap: the resolver is only reachable through the router that configures it — so the</text><text x="40" y="416" font-size="13" fill="#6c6c73">split-DNS records depend on the Connector, or a fresh kubectl times out.</text></svg>