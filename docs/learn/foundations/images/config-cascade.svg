<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 564" width="760" height="564" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#eef0f3"]{fill:#1a1b1d}[stroke="#eef0f3"]{stroke:#1a1b1d}[fill="#d7dbe2"]{fill:#353c49}[stroke="#d7dbe2"]{stroke:#353c49}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#5b5b64"]{fill:#8e8e98}[stroke="#5b5b64"]{stroke:#8e8e98}[fill="#e8ebf0"]{fill:#1c1d20}[stroke="#e8ebf0"]{stroke:#1c1d20}[fill="#d0d5dd"]{fill:#38404d}[stroke="#d0d5dd"]{stroke:#38404d}[fill="#e1e6ec"]{fill:#1f2023}[stroke="#e1e6ec"]{stroke:#1f2023}[fill="#c9cfd9"]{fill:#394251}[stroke="#c9cfd9"]{stroke:#394251}[fill="#dae0e8"]{fill:#2f3b4b}[stroke="#dae0e8"]{stroke:#2f3b4b}[fill="#c2c9d5"]{fill:#aab4c5}[stroke="#c2c9d5"]{stroke:#aab4c5}[fill="#d3dae4"]{fill:#303d4f}[stroke="#d3dae4"]{stroke:#303d4f}[fill="#bbc3d1"]{fill:#a9b4c6}[stroke="#bbc3d1"]{stroke:#a9b4c6}[fill="#e0f0e7"]{fill:#254d37}[stroke="#e0f0e7"]{stroke:#254d37}[fill="#8fc7a8"]{fill:#9fd1b5}[stroke="#8fc7a8"]{stroke:#9fd1b5}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#2f8a5a"]{fill:#51c889}[stroke="#2f8a5a"]{stroke:#51c889}[fill="#c9e6d5"]{fill:#2a5a3d}[stroke="#c9e6d5"]{stroke:#2a5a3d}[fill="#efeeeb"]{fill:#1f1e1c}[stroke="#efeeeb"]{stroke:#1f1e1c}[fill="#dcdbd6"]{fill:#2a2925}[stroke="#dcdbd6"]{stroke:#2a2925}[fill="#9a6a12"]{fill:#eca82d}[stroke="#9a6a12"]{stroke:#eca82d}}</style><rect x="0" y="0" width="760" height="566" rx="0" class="bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">EVERYTHING AS CODE</text><text x="40" y="92" font-size="27" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Config cascades by scope — narrowest wins</text><text x="40" y="118" font-size="15" class="mut" fill="#6c6c73">Every fact lives in exactly one layer. A file walks up the tree, merges each layer broad-to-</text><text x="40" y="138" font-size="15" class="mut" fill="#6c6c73">narrow, and the leaf wins ties — the directory nesting is the specificity, like CSS.</text><text x="52" y="330" font-size="9.5" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px" text-anchor="middle" transform="rotate(-90 52 330)">MORE SPECIFIC  →  WINS</text><rect x="72" y="182" width="648" height="36" rx="9" class="n0 nb0" fill="#eef0f3" stroke="#d7dbe2" stroke-width="1"></rect><text x="87" y="205" font-size="13"><tspan class="blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="500">root.hcl</tspan><tspan class="mut" fill="#5b5b64"> — remote state, providers</tspan></text><text x="706" y="205" font-size="10.5" class="mut" fill="#6c6c73" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">the whole estate</text><rect x="98" y="226" width="622" height="36" rx="9" class="n1 nb1" fill="#e8ebf0" stroke="#d0d5dd" stroke-width="1"></rect><text x="113" y="249" font-size="13"><tspan class="blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="500">common.hcl</tspan><tspan class="mut" fill="#5b5b64"> — cloud-wide defaults, SOPS secrets</tspan></text><text x="706" y="249" font-size="10.5" class="mut" fill="#6c6c73" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">all of AWS</text><rect x="124" y="270" width="596" height="36" rx="9" class="n2 nb2" fill="#e1e6ec" stroke="#c9cfd9" stroke-width="1"></rect><text x="139" y="293" font-size="13"><tspan class="blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="500">env.hcl</tspan><tspan class="mut" fill="#5b5b64"> — which account, env tags</tspan></text><text x="706" y="293" font-size="10.5" class="mut" fill="#6c6c73" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">one account</text><rect x="150" y="314" width="570" height="36" rx="9" class="n3 nb3" fill="#dae0e8" stroke="#c2c9d5" stroke-width="1"></rect><text x="165" y="337" font-size="13"><tspan class="blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="500">region · network.hcl</tspan><tspan class="mut" fill="#5b5b64"> — region, CIDRs</tspan></text><text x="706" y="337" font-size="10.5" class="mut" fill="#6c6c73" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">one region</text><rect x="176" y="358" width="544" height="36" rx="9" class="n4 nb4" fill="#d3dae4" stroke="#bbc3d1" stroke-width="1"></rect><text x="191" y="381" font-size="13"><tspan class="blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="500">workload.hcl</tspan><tspan class="mut" fill="#5b5b64"> — workload name, tier</tspan></text><text x="706" y="381" font-size="10.5" class="mut" fill="#6c6c73" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">one workload</text><rect x="202" y="402" width="518" height="36" rx="9" class="cLeaf cLeafBd" fill="#e0f0e7" stroke="#8fc7a8" stroke-width="1"></rect><text x="217" y="425" font-size="13"><tspan class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">terragrunt.hcl</tspan><tspan class="grn" fill="#2f8a5a"> — the module + inputs</tspan></text><rect x="635.55" y="412" width="70.44999999999999" height="17" rx="8" class="grChip" fill="#c9e6d5"></rect><text x="670.775" y="424" font-size="10" class="grn" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">wins ties</text><rect x="40" y="460" width="680" height="64" rx="12" class="panel panelBd" fill="#efeeeb" stroke="#dcdbd6" stroke-width="1"></rect><text x="60" y="487" font-size="10.5" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">SAFETY:</text><text x="60" y="505" font-size="13" xml:space="preserve"><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">_base.hcl</tspan><tspan class="tx" fill="#1c1c22">&#160;walks up, merges narrowest-wins, then asserts your directory matches the</tspan></text><text x="60" y="523" font-size="13" class="tx" fill="#1c1c22">account it declares — apply the wrong config and it refuses to run. Copy-paste disaster, impossible.</text></svg>