<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 808" width="760" height="808" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><defs><clipPath id="abar0"><rect x="85.0" y="197.0" width="11.0" height="76.0"/></clipPath><clipPath id="abar1"><rect x="85.0" y="283.0" width="11.0" height="114.0"/></clipPath><clipPath id="abar2"><rect x="85.0" y="407.0" width="11.0" height="76.0"/></clipPath><clipPath id="abar3"><rect x="85.0" y="493.0" width="11.0" height="80.0"/></clipPath></defs><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#b4462f"]{fill:#da7965}[stroke="#b4462f"]{stroke:#da7965}[fill="#3fa06a"]{fill:#71ca98}[stroke="#3fa06a"]{stroke:#71ca98}[fill="#ffffff"]{fill:#141414}[stroke="#ffffff"]{stroke:#141414}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#fbf2df"]{fill:#554219}[stroke="#fbf2df"]{stroke:#554219}[fill="#e0be7e"]{fill:#e6c68a}[stroke="#e0be7e"]{stroke:#e6c68a}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#fbeeea"]{fill:#512517}[stroke="#fbeeea"]{stroke:#512517}[fill="#e6b9ab"]{fill:#e0a28f}[stroke="#e6b9ab"]{stroke:#e0a28f}}</style><style>@media(prefers-color-scheme:dark){.f_bg{fill:#15161c}.f_greenBg{fill:#16331f}.s_greenBd{stroke:#2f6a45}.f_text{fill:#e6e6ea}.f_muted{fill:#9a9aa3}.f_dim{fill:#74747d}.f_blue{fill:#7fa0ee}.f_green{fill:#4fd08a}.f_amber{fill:#e0b050}}</style><rect x="0" y="0" width="760" height="808" rx="0" class="f_bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mono f_muted" fill="#6c6c73" letter-spacing="1.6px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">BRING-YOUR-OWN-CNI · ADR-009</text><text x="40" y="90" font-size="26" class="f_text" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">A cluster born with no nervous system</text><text x="40" y="122" font-size="15" class="f_muted" fill="#6c6c73">EKS is told to install no CNI and no kube-proxy. Until Cilium lands, no pod gets an</text><text x="40" y="142" font-size="15" class="f_muted" fill="#6c6c73">IP — the build splits into four ordered units, each needing the one before it.</text><text x="40" y="180" font-size="12.5" class="f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">↓</text><text x="56" y="180" font-size="12.5" class="f_muted" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">apply order — each needs the last</text><text x="376" y="180" font-size="12.5" class="f_red" fill="#b4462f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">↑</text><text x="392" y="180" font-size="12.5" class="f_muted" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">destroy in reverse — or outage</text><rect x="58" y="200" width="3" height="370" rx="1.5" class="f_green" fill="#3fa06a"></rect><text x="59.5" y="588" font-size="14" class="f_green" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">↓</text><rect x="86" y="198" width="634" height="74" rx="12" class="f_card" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="87.3" y="199.3" width="631.5" height="71.5" rx="10.8" fill="none" stroke="#2f5fd0" stroke-width="2.5" clip-path="url(#abar0)"></rect><text x="104" y="225" font-size="12" class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">01</text><text x="104" y="246" font-size="16" class="mono f_blue" fill="#2f5fd0" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">eks</text><text x="228" y="225" font-size="14.5" class="f_text" fill="#1c1c22" font-weight="500">The cluster, OIDC provider, KMS key, access entries</text><text x="228" y="246" font-size="12.5" class="f_muted" fill="#6c6c73"><tspan class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="0.5px">WAITS ON </tspan>nothing — but it ships <tspan class="f_text" fill="#1c1c22" font-weight="500">no CNI</tspan></text><rect x="86" y="284" width="634" height="112" rx="12" class="f_card" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="87.3" y="285.3" width="631.5" height="109.5" rx="10.8" fill="none" stroke="#1f7a49" stroke-width="2.5" clip-path="url(#abar1)"></rect><text x="104" y="311" font-size="12" class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">02</text><text x="104" y="332" font-size="16" class="mono f_green" fill="#1f7a49" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">cilium</text><rect x="104" y="344" width="116" height="20" rx="5" class="f_amberBg s_amberBd" fill="#fbf2df" stroke="#e0be7e" stroke-width="1"></rect><text x="112" y="358" font-size="10" class="mono f_amber" fill="#8a6410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">helm_wait = false</text><text x="228" y="311" font-size="14.5" class="f_text" fill="#1c1c22" font-weight="500">The Cilium Helm release + Gateway API CRDs</text><text x="228" y="332" font-size="12.5" class="f_muted" fill="#6c6c73"><tspan class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="0.5px">WAITS ON </tspan>the API server, to install into</text><line x1="228" y1="344" x2="702" y2="344" stroke="#e4e4df" stroke-width="1" class="s_border"></line><text x="228" y="363" font-size="12" class="f_muted" fill="#6c6c73">Its agent is a DaemonSet — but there are no nodes yet.</text><text x="228" y="380" font-size="12" class="f_muted" fill="#6c6c73">Helm mustn’t block on Ready pods, so it installs and moves on.</text><rect x="86" y="408" width="634" height="74" rx="12" class="f_card" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="87.3" y="409.3" width="631.5" height="71.5" rx="10.8" fill="none" stroke="#1f7a49" stroke-width="2.5" clip-path="url(#abar2)"></rect><text x="104" y="435" font-size="12" class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">03</text><text x="104" y="456" font-size="16" class="mono f_green" fill="#1f7a49" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">node-groups</text><text x="228" y="435" font-size="14.5" class="f_text" fill="#1c1c22" font-weight="500">Managed node groups, node IAM role</text><text x="228" y="456" font-size="12.5" class="f_muted" fill="#6c6c73"><tspan class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="0.5px">WAITS ON </tspan>Cilium — nodes with no CNI can’t configure pod networking</text><rect x="86" y="494" width="634" height="78" rx="12" class="f_card" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="87.3" y="495.3" width="631.5" height="75.5" rx="10.8" fill="none" stroke="#1f7a49" stroke-width="2.5" clip-path="url(#abar3)"></rect><text x="104" y="521" font-size="12" class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">04</text><text x="104" y="542" font-size="16" class="mono f_green" fill="#1f7a49" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">eks-addons</text><text x="228" y="521" font-size="14.5" class="f_text" fill="#1c1c22" font-weight="500">CoreDNS, EBS CSI driver, the gp3 StorageClass</text><text x="228" y="542" font-size="12.5" class="f_muted" fill="#6c6c73"><tspan class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="0.5px">WAITS ON </tspan>a CNI <tspan class="f_text" fill="#1c1c22" font-weight="500">and</tspan> a node — these are pods, they need somewhere to land</text><rect x="86" y="588" width="634" height="78" rx="12" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="104" y="614" font-size="10.5" class="mono f_green" fill="#1f7a49" letter-spacing="0.4px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">WHY LAST</text><text x="178" y="613" font-size="13.5" class="f_text" fill="#1c1c22" font-weight="500">CoreDNS is the cluster’s DNS server — but it’s a Deployment. A pod needs</text><text x="178" y="633" font-size="13.5" class="f_muted" fill="#6c6c73">an IP, an IP needs Cilium, so DNS can’t be a cluster-creation add-on. Install it</text><text x="178" y="651" font-size="13.5" class="f_muted" fill="#6c6c73">earlier and its pods sit <tspan class="mono f_amber" fill="#8a6410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Pending</tspan> forever with no IP to schedule onto.</text><rect x="86" y="678" width="634" height="90" rx="12" class="f_redBg s_redBd" fill="#fbeeea" stroke="#e6b9ab" stroke-width="1"></rect><text x="104" y="704" font-size="10.5" class="mono f_red" fill="#b4462f" letter-spacing="0.4px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">THE LOADED GUN</text><text x="226" y="703" font-size="13.5" class="f_text" fill="#1c1c22" font-weight="500">The four units make it impossible to build in the wrong order — but do</text><text x="226" y="723" font-size="13.5" class="f_muted" fill="#6c6c73">nothing for destroy order. Destroy in reverse <tspan class="mono f_red" fill="#b4462f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">eks-addons → node-groups →</tspan></text><text x="226" y="741" font-size="13.5" class="f_muted" fill="#6c6c73"><tspan class="mono f_red" fill="#b4462f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">cilium → eks</tspan>. Destroying <tspan class="mono f_red" fill="#b4462f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">cilium</tspan> alone rips the CNI out from under every</text><text x="226" y="759" font-size="13.5" class="f_muted" fill="#6c6c73">running node — pods lose all networking, cluster-wide, instantly.</text></svg>