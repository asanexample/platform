<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 504" width="760" height="504" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#eef2fb"]{fill:#17284f}[stroke="#eef2fb"]{stroke:#17284f}[fill="#c3d3f0"]{fill:#1d3664}[stroke="#c3d3f0"]{stroke:#1d3664}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#3a6fd0"]{fill:#82a4e4}[stroke="#3a6fd0"]{stroke:#82a4e4}[fill="#e6edf9"]{fill:#182e53}[stroke="#e6edf9"]{stroke:#182e53}[fill="#b3c7ec"]{fill:#1f3a6c}[stroke="#b3c7ec"]{stroke:#1f3a6c}[fill="#dde7f7"]{fill:#193157}[stroke="#dde7f7"]{stroke:#193157}[fill="#a3bbe8"]{fill:#8baae5}[stroke="#a3bbe8"]{stroke:#8baae5}[fill="#4a74c8"]{fill:#8ea9df}[stroke="#4a74c8"]{stroke:#8ea9df}[fill="#ffffff"]{fill:#141414}[stroke="#ffffff"]{stroke:#141414}[fill="#2f93b0"]{fill:#62bed9}[stroke="#2f93b0"]{stroke:#62bed9}[fill="#8168c8"]{fill:#a795db}[stroke="#8168c8"]{stroke:#a795db}[fill="#3f9e73"]{fill:#70c9a1}[stroke="#3f9e73"]{stroke:#70c9a1}[fill="#d79a3e"]{fill:#e9c286}[stroke="#d79a3e"]{stroke:#e9c286}[fill="#b85a9a"]{fill:#d599c2}[stroke="#b85a9a"]{stroke:#d599c2}[fill="#8a8a90"]{fill:#89898f}[stroke="#8a8a90"]{stroke:#89898f}[fill="#fbeae3"]{fill:#542a18}[stroke="#fbeae3"]{stroke:#542a18}[fill="#e0b3a0"]{fill:#dea892}[stroke="#e0b3a0"]{stroke:#dea892}[fill="#b5482a"]{fill:#dd795e}[stroke="#b5482a"]{stroke:#dd795e}}</style><rect x="0" y="0" width="760" height="494" rx="0" class="bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">THE CIDR STRATEGY · §3</text><text x="40" y="92" font-size="27" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Addresses are math, not a spreadsheet</text><text x="40" y="118" font-size="15" class="mut" fill="#6c6c73">Three nested levels of address space, generated by cidrsubnet — so 18 subnets fall out of</text><text x="40" y="138" font-size="15" class="mut" fill="#6c6c73">one number, non-overlapping. Change the VPC CIDR in one file and every subnet moves.</text><rect x="40" y="164" width="680" height="190" rx="13" class="fr0 frb0" fill="#eef2fb" stroke="#c3d3f0" stroke-width="1"></rect><text x="56" y="186" font-size="12.5" class="blue" fill="#2f5fd0" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Cloud  /14</text><text x="704" y="186" font-size="12" text-anchor="end"><tspan class="blue" fill="#3a6fd0">10.100.0.0/14  </tspan><tspan class="mut" fill="#6c6c73">· AWS (Azure · GCP reserved)</tspan></text><rect x="54" y="196" width="652" height="148" rx="11" class="fr1 frb1" fill="#e6edf9" stroke="#b3c7ec" stroke-width="1"></rect><text x="70" y="218" font-size="12.5" class="blue" fill="#2f5fd0" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Environment  /16</text><text x="692" y="218" font-size="12" text-anchor="end"><tspan class="blue" fill="#3a6fd0">platform .100 · preprod .101 · prod .102  </tspan><tspan class="mut" fill="#6c6c73">· never overlap</tspan></text><rect x="68" y="228" width="624" height="106" rx="10" class="fr2 frb2" fill="#dde7f7" stroke="#a3bbe8" stroke-width="1"></rect><text x="84" y="250" font-size="12.5" class="blue" fill="#2f5fd0" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">one AZ  /24</text><text x="676" y="250" font-size="12" class="blue" fill="#3a6fd0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">cidrsubnet(vpc, 8, az) → 10.100.0.0/24</text><text x="84" y="266" font-size="11" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">carved again by (newbits, netnum) into six tiers — packed, no waste:</text><rect x="84" y="276" width="145.5" height="46" rx="4" class="t1" fill="#4a74c8"></rect><text x="156.75" y="304" font-size="11" class="tx" fill="#ffffff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">/26</text><rect x="231.5" y="276" width="145.5" height="46" rx="4" class="t2" fill="#2f93b0"></rect><text x="304.25" y="304" font-size="11" class="tx" fill="#ffffff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">/26</text><rect x="379" y="276" width="145.5" height="46" rx="4" class="t3" fill="#8168c8"></rect><text x="451.75" y="304" font-size="11" class="tx" fill="#ffffff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">/26</text><rect x="526.5" y="276" width="72.75" height="46" rx="4" class="t4" fill="#3f9e73"></rect><text x="562.875" y="304" font-size="11" class="tx" fill="#ffffff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">/27</text><rect x="601.25" y="276" width="36.375" height="46" rx="4" class="t5" fill="#d79a3e"></rect><rect x="639.625" y="276" width="36.375" height="46" rx="4" class="t6" fill="#b85a9a"></rect><rect x="40" y="367" width="10" height="10" rx="3" class="t1" fill="#4a74c8"></rect><text x="56" y="376" font-size="11"><tspan class="t1" fill="#4a74c8">kubernetes </tspan><tspan class="mut" fill="#8a8a90">.0/26</tspan></text><rect x="268" y="367" width="10" height="10" rx="3" class="t2" fill="#2f93b0"></rect><text x="284" y="376" font-size="11"><tspan class="t2" fill="#2f93b0">endpoints </tspan><tspan class="mut" fill="#8a8a90">.64/26</tspan></text><rect x="496" y="367" width="10" height="10" rx="3" class="t3" fill="#8168c8"></rect><text x="512" y="376" font-size="11"><tspan class="t3" fill="#8168c8">firewall </tspan><tspan class="mut" fill="#8a8a90">.128/26</tspan></text><rect x="40" y="387" width="10" height="10" rx="3" class="t4" fill="#3f9e73"></rect><text x="56" y="396" font-size="11"><tspan class="t4" fill="#3f9e73">services </tspan><tspan class="mut" fill="#8a8a90">.192/27</tspan></text><rect x="268" y="387" width="10" height="10" rx="3" class="t5" fill="#d79a3e"></rect><text x="284" y="396" font-size="11"><tspan class="t5" fill="#d79a3e">public </tspan><tspan class="mut" fill="#8a8a90">.224/28</tspan></text><rect x="496" y="387" width="10" height="10" rx="3" class="t6" fill="#b85a9a"></rect><text x="512" y="396" font-size="11"><tspan class="t6" fill="#b85a9a">transit </tspan><tspan class="mut" fill="#8a8a90">.240/28</tspan></text><rect x="40" y="418" width="680" height="74" rx="12" class="rjBg rjBd" fill="#fbeae3" stroke="#e0b3a0" stroke-width="1"></rect><text x="60" y="441" font-size="10.5" class="red" fill="#b5482a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">NON-OVERLAP IS NOT OPTIONAL</text><text x="60" y="459" font-size="13" class="tx" fill="#1c1c22">You can’t route between two ranges that collide — the Transit Gateway is impossible on</text><text x="60" y="477" font-size="13" class="tx" fill="#1c1c22">overlap. That’s the whole reason the addresses are planned, not picked.</text></svg>