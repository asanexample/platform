<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#ffffff"]{fill:#141414}[stroke="#ffffff"]{stroke:#141414}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#fbeeea"]{fill:#512517}[stroke="#fbeeea"]{stroke:#512517}[fill="#e6b9ab"]{fill:#e0a28f}[stroke="#e6b9ab"]{stroke:#e0a28f}[fill="#b4462f"]{fill:#da7965}[stroke="#b4462f"]{stroke:#da7965}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}}</style><style>@media(prefers-color-scheme:dark){.f_bg{fill:#15161c}.f_blueBg{fill:#172a50}.f_greenBg{fill:#16331f}.s_blueBd{stroke:#40639e}.s_greenBd{stroke:#2f6a45}.f_text{fill:#e6e6ea}.f_muted{fill:#9a9aa3}.f_dim{fill:#74747d}.f_blue{fill:#7fa0ee}.f_green{fill:#4fd08a}.f_amber{fill:#e0b050}}</style><rect x="0" y="0" width="760" height="640" rx="0" class="f_bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mono f_muted" fill="#6c6c73" letter-spacing="1.6px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">NETWORK POLICY · ADR-008</text><text x="40" y="90" font-size="26" class="f_text" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Cilium checks the badge, not the address</text><text x="40" y="122" font-size="15" class="f_muted" fill="#6c6c73">Gateway traffic reaches your pod wearing a <tspan class="f_text" fill="#1c1c22">reserved identity</tspan> — <tspan class="mono" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">ingress</tspan>, number 8 —</text><text x="40" y="142" font-size="15" class="f_muted" fill="#6c6c73">not the node’s IP. Cilium enforces policy by identity, so a CIDR rule matches nothing.</text><rect x="40" y="176" width="120" height="96" rx="12" class="f_card" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><text x="56" y="206" font-size="10" class="mono f_dim" fill="#9a9aa1" letter-spacing="0.6px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">REQUEST</text><text x="56" y="228" font-size="13.5" class="f_text" fill="#1c1c22" font-weight="500">Inbound</text><text x="56" y="246" font-size="13.5" class="f_text" fill="#1c1c22" font-weight="500">HTTPS</text><text x="173" y="229" font-size="16" class="f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">→</text><rect x="186" y="176" width="392" height="96" rx="12" class="f_card" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><text x="202" y="204" font-size="10" class="mono f_dim" fill="#9a9aa1" letter-spacing="0.6px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">CILIUM-ENVOY · hostNetwork</text><text x="202" y="226" font-size="13.5" class="f_text" fill="#1c1c22" font-weight="500">Gateway API proxy forwards it</text><text x="202" y="246" font-size="12" class="f_muted" fill="#6c6c73">Cilium stamps the packet with a reserved identity</text><text x="202" y="262" font-size="12" class="f_muted" fill="#6c6c73">before it reaches the backend.</text><text x="581" y="229" font-size="16" class="f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">→</text><rect x="592" y="176" width="128" height="96" rx="12" class="f_blueBg s_blueBd" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text x="656" y="203" font-size="9.5" class="mono f_blue" fill="#2f5fd0" letter-spacing="0.3px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">RESERVED IDENTITY</text><text x="656" y="238" font-size="30" class="mono f_blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="500" text-anchor="middle"><tspan font-size="11" font-weight="400">no. </tspan>8</text><text x="656" y="258" font-size="11.5" class="mono f_blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">name “ingress”</text><text x="40" y="300" font-size="12.5" class="f_muted" fill="#6c6c73">Every Cilium identity has a number and a name;</text><text x="40" y="318" font-size="12.5" class="f_muted" fill="#6c6c73"><tspan class="f_blue" fill="#2f5fd0">no. 8, named “ingress”</tspan> is the reserved one for gateway</text><text x="40" y="336" font-size="12.5" class="f_muted" fill="#6c6c73">traffic. That tag — not the source IP — is what policy matches.</text><text x="474" y="316" font-size="12" class="mono f_dim" fill="#9a9aa1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="end">↓ arrives at</text><rect x="482" y="299" width="238" height="26" rx="8" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><text x="494" y="316" font-size="12.5" class="f_text" fill="#1c1c22" font-weight="500">your backend pod · policy here</text><rect x="40" y="350" width="333" height="156" rx="13" class="f_redBg s_redBd" fill="#fbeeea" stroke="#e6b9ab" stroke-width="1"></rect><circle cx="66" cy="377" r="9" class="f_red" fill="#b4462f"></circle><text x="66" y="381" font-size="11" class="f_bg" fill="#f6f6f3" font-weight="600" text-anchor="middle">✕</text><text x="82" y="381" font-size="12" class="mono f_red" fill="#b4462f" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">by CIDR — silently drops</text><rect x="56" y="394" width="301" height="62" rx="8" class="f_card" fill="#ffffff" stroke="#e6b9ab" stroke-width="1"></rect><text x="68" y="412" font-size="12" class="mono f_muted" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ingress:</text><text x="68" y="430" font-size="12" class="mono f_muted" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  - fromCIDR:</text><text x="68" y="448" font-size="12" class="mono f_muted" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">    - <tspan class="f_red" fill="#b4462f">10.0.0.0/8</tspan></text><text x="56" y="476" font-size="12.5" class="f_muted" fill="#6c6c73">The source IP already has identity 8 in</text><text x="56" y="492" font-size="12.5" class="f_muted" fill="#6c6c73">Cilium’s ipcache — identity match wins.</text><rect x="387" y="350" width="333" height="156" rx="13" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><circle cx="413" cy="377" r="9" class="f_green" fill="#1f7a49"></circle><text x="413" y="381" font-size="11" class="f_bg" fill="#f6f6f3" font-weight="600" text-anchor="middle">✓</text><text x="429" y="381" font-size="12" class="mono f_green" fill="#1f7a49" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">by identity — matches</text><rect x="403" y="394" width="301" height="62" rx="8" class="f_card" fill="#ffffff" stroke="#a3ccb4" stroke-width="1"></rect><text x="415" y="412" font-size="12" class="mono f_muted" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ingress:</text><text x="415" y="430" font-size="12" class="mono f_muted" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  - fromEntities:</text><text x="415" y="448" font-size="12" class="mono f_muted" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">    - <tspan class="f_green" fill="#1f7a49">ingress</tspan></text><text x="403" y="476" font-size="12.5" class="f_muted" fill="#6c6c73">Allow the identity the badge carries, and</text><text x="403" y="492" font-size="12.5" class="f_muted" fill="#6c6c73">the gateway’s traffic is admitted.</text><rect x="40" y="520" width="680" height="96" rx="12" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><text x="58" y="546" font-size="10.5" class="mono f_amber" fill="#8a6410" letter-spacing="0.4px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">THE SYMPTOM</text><text x="58" y="568" font-size="12" class="f_muted" fill="#6c6c73">The connection is dropped while <tspan class="f_text" fill="#1c1c22">DNS and TLS look perfectly healthy</tspan> — you get <tspan class="mono f_amber" fill="#8a6410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">upstream connect error</tspan>.</text><text x="58" y="590" font-size="12" class="f_muted" fill="#6c6c73">Think of identity 8 as a badge reception clips on every visitor; the door reader checks badges, not addresses.</text></svg>