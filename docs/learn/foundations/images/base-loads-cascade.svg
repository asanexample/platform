<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 634" width="760" height="634" xml:space="preserve" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#f4f6f9"]{fill:#17181a}[stroke="#f4f6f9"]{stroke:#17181a}[fill="#d3d8e0"]{fill:#353e4c}[stroke="#d3d8e0"]{stroke:#353e4c}[fill="#dbe6fa"]{fill:#192f57}[stroke="#dbe6fa"]{stroke:#192f57}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#eceef1"]{fill:#1b1c1e}[stroke="#eceef1"]{stroke:#1b1c1e}[fill="#d3d6dc"]{fill:#26272b}[stroke="#d3d6dc"]{stroke:#26272b}[fill="#3a3a42"]{fill:#dedee2}[stroke="#3a3a42"]{stroke:#dedee2}[fill="#b9bcc4"]{fill:#313338}[stroke="#b9bcc4"]{stroke:#313338}[fill="#eef7f1"]{fill:#21472e}[stroke="#eef7f1"]{stroke:#21472e}[fill="#bcdcc9"]{fill:#a0cfb3}[stroke="#bcdcc9"]{stroke:#a0cfb3}[fill="#d3ecdd"]{fill:#255639}[stroke="#d3ecdd"]{stroke:#255639}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#4f8a68"]{fill:#7eb796}[stroke="#4f8a68"]{stroke:#7eb796}[fill="#d7ecdf"]{fill:#275238}[stroke="#d7ecdf"]{stroke:#275238}[fill="#a9d3bd"]{fill:#9fd0b6}[stroke="#a9d3bd"]{stroke:#9fd0b6}[fill="#8a8a90"]{fill:#89898f}[stroke="#8a8a90"]{stroke:#89898f}[fill="#c9e6d5"]{fill:#2a5a3d}[stroke="#c9e6d5"]{stroke:#2a5a3d}[fill="#8fc7a8"]{fill:#9fd1b5}[stroke="#8fc7a8"]{stroke:#9fd1b5}[fill="#4a4a52"]{fill:#dfdfe2}[stroke="#4a4a52"]{stroke:#dfdfe2}[fill="#a9cbb8"]{fill:#a5cab5}[stroke="#a9cbb8"]{stroke:#a5cab5}[fill="#f7e3c9"]{fill:#5f421c}[stroke="#f7e3c9"]{stroke:#5f421c}[fill="#9a6a12"]{fill:#eca82d}[stroke="#9a6a12"]{stroke:#eca82d}}</style><rect x="0" y="0" width="760" height="634" rx="0" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">HOW _BASE LOADS THE CASCADE</text><text x="40" y="90" font-size="26" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Climb, merge, expose — the whole cascade</text><text x="40" y="119" font-size="26" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">in two includes</text><text x="40" y="148" font-size="15" fill="#6c6c73">A leaf unit doesn’t read six files. _base.hcl climbs the tree to find each layer, merges</text><text x="40" y="168" font-size="15" fill="#6c6c73">them broad-to-narrow, and hands the unit one assembled bag of values.</text><rect x="204" y="192" width="516" height="130" rx="12" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><rect x="40" y="231" width="53.599999999999994" height="18" rx="5" fill="#dbe6fa"></rect><text x="66.8" y="244" font-size="10" fill="#2f5fd0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">STEP 1</text><text x="103.6" y="246" font-size="15" fill="#1c1c22" font-weight="600">Climb</text><text x="40" y="270" font-size="11" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">find_in_parent…</text><text x="220" y="214" font-size="13.5" fill="#6c6c73">From the unit’s directory, climb up until each layer file</text><text x="220" y="232" font-size="13.5" fill="#6c6c73">turns up — so a platform unit resolves the platform env, a</text><text x="220" y="250" font-size="13.5" fill="#6c6c73">preprod unit resolves preprod’s. Where the unit sits decides.</text><rect x="220" y="262" width="62.199999999999996" height="20" rx="5" fill="#eceef1" stroke="#d3d6dc" stroke-width="1"></rect><text x="251.1" y="276" font-size="11" fill="#3a3a42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">env.hcl</text><rect x="288.2" y="262" width="82" height="20" rx="5" fill="#eceef1" stroke="#d3d6dc" stroke-width="1"></rect><text x="329.2" y="276" font-size="11" fill="#3a3a42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">region.hcl</text><rect x="376.2" y="262" width="88.6" height="20" rx="5" fill="#eceef1" stroke="#d3d6dc" stroke-width="1"></rect><text x="420.5" y="276" font-size="11" fill="#3a3a42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">network.hcl</text><rect x="470.79999999999995" y="262" width="95.19999999999999" height="20" rx="5" fill="#eceef1" stroke="#d3d6dc" stroke-width="1"></rect><text x="518.4" y="276" font-size="11" fill="#3a3a42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">workload.hcl</text><rect x="220" y="288" width="82" height="20" rx="5" fill="#eceef1" stroke="#d3d6dc" stroke-width="1"></rect><text x="261" y="302" font-size="11" fill="#3a3a42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">common.hcl</text><rect x="308" y="288" width="101.8" height="20" rx="5" fill="#eceef1" stroke="#d3d6dc" stroke-width="1"></rect><text x="358.9" y="302" font-size="11" fill="#3a3a42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">_versions.hcl</text><line x1="100" y1="322" x2="100" y2="338" stroke="#b9bcc4" stroke-width="1.6"></line><rect x="204" y="340" width="516" height="120" rx="12" fill="#eef7f1" stroke="#bcdcc9" stroke-width="1"></rect><rect x="40" y="374" width="53.599999999999994" height="18" rx="5" fill="#d3ecdd"></rect><text x="66.8" y="387" font-size="10" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">STEP 2</text><text x="103.6" y="389" font-size="15" fill="#1c1c22" font-weight="600">Merge</text><text x="40" y="413" font-size="11" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">last-key-wins</text><text x="220" y="370" font-size="11.5" fill="#4f8a68" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">merge(</text><rect x="266" y="356" width="53.8" height="20" rx="5" fill="#d7ecdf" stroke="#a9d3bd" stroke-width="1"></rect><text x="292.9" y="370" font-size="10.5" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">common</text><text x="328.8" y="370" font-size="12" fill="#8a8a90" text-anchor="middle">→</text><rect x="337.8" y="356" width="34.9" height="20" rx="5" fill="#d7ecdf" stroke="#a9d3bd" stroke-width="1"></rect><text x="355.25" y="370" font-size="10.5" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">env</text><text x="381.7" y="370" font-size="12" fill="#8a8a90" text-anchor="middle">→</text><rect x="390.7" y="356" width="53.8" height="20" rx="5" fill="#d7ecdf" stroke="#a9d3bd" stroke-width="1"></rect><text x="417.59999999999997" y="370" font-size="10.5" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">region</text><text x="453.5" y="370" font-size="12" fill="#8a8a90" text-anchor="middle">→</text><rect x="462.5" y="356" width="60.1" height="20" rx="5" fill="#d7ecdf" stroke="#a9d3bd" stroke-width="1"></rect><text x="492.55" y="370" font-size="10.5" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">network</text><text x="531.6" y="370" font-size="12" fill="#8a8a90" text-anchor="middle">→</text><rect x="540.6" y="356" width="66.4" height="20" rx="5" fill="#c9e6d5" stroke="#8fc7a8" stroke-width="1"></rect><text x="573.8000000000001" y="370" font-size="10.5" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">workload</text><text x="619" y="370" font-size="11.5" fill="#4f8a68" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">)</text><text x="220" y="394" font-size="10" fill="#4f8a68" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">◀ BROADEST</text><text x="704" y="394" font-size="10" fill="#4f8a68" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">NARROWEST ▶</text><text x="220" y="414" font-size="13.5" fill="#4a4a52">Arguments run broad → narrow and the last key wins — so</text><text x="220" y="432" font-size="13.5" fill="#4a4a52">env.hcl overrides a common.hcl default; a workload’s Team</text><text x="220" y="450" font-size="13.5" fill="#4a4a52">tag overrides the platform default.</text><line x1="100" y1="460" x2="100" y2="476" stroke="#a9cbb8" stroke-width="1.6"></line><rect x="204" y="478" width="516" height="126" rx="12" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><rect x="40" y="515" width="53.599999999999994" height="18" rx="5" fill="#f7e3c9"></rect><text x="66.8" y="528" font-size="10" fill="#9a6a12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">STEP 3</text><text x="103.6" y="530" font-size="15" fill="#1c1c22" font-weight="600">Expose</text><text x="40" y="554" font-size="11" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">expose = true</text><text x="220" y="502" font-size="13.5" fill="#6c6c73">The unit includes _base and reads the assembled values</text><text x="220" y="520" font-size="13.5" fill="#6c6c73">off include.base.locals.* — declaring intent and inheriting</text><text x="220" y="538" font-size="13.5" fill="#6c6c73">every environmental fact.</text><rect x="220" y="550" width="484" height="40" rx="7" fill="#eceef1" stroke="#d3d6dc" stroke-width="1"></rect><text x="232" y="568" font-size="11.5" fill="#3a3a42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">source = include.base.locals.module_source.iam_roles</text><text x="232" y="585" font-size="11.5" fill="#3a3a42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">tags   = include.base.locals.tags</text></svg>