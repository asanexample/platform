<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 566" width="760" height="566" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#fbf3e6"]{fill:#523c18}[stroke="#fbf3e6"]{stroke:#523c18}[fill="#d8b877"]{fill:#e1c68e}[stroke="#d8b877"]{stroke:#e1c68e}[fill="#9a6a12"]{fill:#eca82d}[stroke="#9a6a12"]{stroke:#eca82d}[fill="#f3e6d0"]{fill:#5e451b}[stroke="#f3e6d0"]{stroke:#5e451b}[fill="#5a9e78"]{fill:#91c2a7}[stroke="#5a9e78"]{stroke:#91c2a7}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#d7ecdf"]{fill:#275238}[stroke="#d7ecdf"]{stroke:#275238}}</style><rect x="0" y="0" width="760" height="566" rx="0" class="bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">WHY THE ACCOUNT IS THE WALL</text><text x="40" y="92" font-size="27" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Two kinds of boundary. Only one can’t be fat-fingered.</text><text x="40" y="118" font-size="15" class="mut" fill="#6c6c73">Namespaces, IAM, Kyverno enforce boundaries inside one trust domain, in software you</text><text x="40" y="138" font-size="15" class="mut" fill="#6c6c73">configure — one slip crosses them. An AWS account is enforced by AWS itself.</text><rect x="40" y="170" width="290" height="340" rx="13" class="amBg amBd" fill="#fbf3e6" stroke="#d8b877" stroke-width="1.4" stroke-dasharray="5 4"></rect><text x="56" y="196" font-size="10.5" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">SOFT · INSIDE ONE TRUST DOMAIN</text><text x="56" y="220" font-size="17" class="tx" fill="#1c1c22" font-weight="600">Locked rooms in one house</text><text x="56" y="242" font-size="12.5" class="mut" fill="#6c6c73">The homeowner holds every key —</text><text x="56" y="258" font-size="12.5" class="mut" fill="#6c6c73">enforced by software you configure.</text><rect x="56" y="274" width="258" height="24" rx="7" class="amChip" fill="#f3e6d0"></rect><text x="68" y="290" font-size="11.5" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Kubernetes namespace</text><rect x="56" y="304" width="258" height="24" rx="7" class="amChip" fill="#f3e6d0"></rect><text x="68" y="320" font-size="11.5" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">IAM policy</text><rect x="56" y="334" width="258" height="24" rx="7" class="amChip" fill="#f3e6d0"></rect><text x="68" y="350" font-size="11.5" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Kyverno admission</text><line x1="56" y1="376" x2="314" y2="376" class="divA" stroke="#d8b877" stroke-width="2"></line><text x="56" y="396" font-size="10.5" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">HOW IT FAILS</text><text x="56" y="416" font-size="12.5" class="tx" fill="#1c1c22">One cluster-admin slip, one wildcard</text><text x="56" y="432" font-size="12.5" class="tx" fill="#1c1c22">that matched too much, crosses every</text><text x="56" y="448" font-size="12.5" class="tx" fill="#1c1c22">namespace at once.</text><text x="380" y="266" font-size="8" class="mut" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">the only way across</text><path d="M342 290 L349 285 L349 295 Z" class="lineGF" fill="#5a9e78"></path><line x1="342" y1="290" x2="418" y2="290" class="lineG" stroke="#5a9e78" stroke-width="2"></line><path d="M418 290 L411 285 L411 295 Z" class="lineGF" fill="#5a9e78"></path><text x="380" y="316" font-size="11.5" class="grn" fill="#1f7a49" text-anchor="middle" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">cross-account</text><text x="380" y="331" font-size="11.5" class="grn" fill="#1f7a49" text-anchor="middle" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">role</text><text x="380" y="348" font-size="8" class="mut" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">logged every time</text><rect x="430" y="170" width="290" height="340" rx="13" class="grBg grBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="446" y="196" font-size="10.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">HARD · THE AWS ACCOUNT</text><text x="446" y="220" font-size="17" class="tx" fill="#1c1c22" font-weight="600">Separate buildings, plots</text><text x="446" y="242" font-size="12.5" class="mut" fill="#6c6c73">Even the superintendent can’t enter</text><text x="446" y="258" font-size="12.5" class="mut" fill="#6c6c73">next door — enforced by AWS itself.</text><rect x="446" y="274" width="258" height="24" rx="7" class="grChip" fill="#d7ecdf"></rect><text x="458" y="290" font-size="11.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">a separate security principal</text><rect x="446" y="304" width="258" height="24" rx="7" class="grChip" fill="#d7ecdf"></rect><text x="458" y="320" font-size="11.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">a separate billing principal</text><rect x="446" y="334" width="258" height="24" rx="7" class="grChip" fill="#d7ecdf"></rect><text x="458" y="350" font-size="11.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">every ARN names its account</text><line x1="446" y1="376" x2="704" y2="376" class="divG" stroke="#a3ccb4" stroke-width="2"></line><text x="446" y="396" font-size="10.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">WHY IT HOLDS</text><text x="446" y="416" font-size="12.5" class="tx" fill="#1c1c22">A preprod credential can’t reach prod</text><text x="446" y="432" font-size="12.5" class="tx" fill="#1c1c22">— not “shouldn’t,” can’t. Blast radius</text><text x="446" y="448" font-size="12.5" class="tx" fill="#1c1c22">capped by construction.</text><text x="40" y="550" font-size="13.5" class="mut" fill="#6c6c73">The security model calls the account boundary the strongest wall it has — which is why</text><text x="40" y="568" font-size="13.5" class="mut" fill="#6c6c73">environments that must never bleed into each other get separate accounts, not namespaces.</text></svg>