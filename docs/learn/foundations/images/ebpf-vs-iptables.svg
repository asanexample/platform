<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 566" width="760" height="566" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><defs><clipPath id="abar0"><rect x="183.0" y="197.0" width="10.0" height="86.0"/></clipPath><clipPath id="abar1"><rect x="457.0" y="197.0" width="10.0" height="86.0"/></clipPath><clipPath id="abar2"><rect x="183.0" y="293.0" width="10.0" height="86.0"/></clipPath><clipPath id="abar3"><rect x="457.0" y="293.0" width="10.0" height="86.0"/></clipPath><clipPath id="abar4"><rect x="183.0" y="389.0" width="10.0" height="96.0"/></clipPath><clipPath id="abar5"><rect x="457.0" y="389.0" width="10.0" height="96.0"/></clipPath></defs><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#fbf2df"]{fill:#554219}[stroke="#fbf2df"]{stroke:#554219}[fill="#e0be7e"]{fill:#e6c68a}[stroke="#e0be7e"]{stroke:#e6c68a}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}}</style><style>@media(prefers-color-scheme:dark){.f_bg{fill:#15161c}.f_greenBg{fill:#16331f}.s_greenBd{stroke:#2f6a45}.f_text{fill:#e6e6ea}.f_muted{fill:#9a9aa3}.f_dim{fill:#74747d}.f_green{fill:#4fd08a}.f_amber{fill:#e0b050}}</style><rect x="0" y="0" width="760" height="556" rx="0" class="f_bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mono f_muted" fill="#6c6c73" letter-spacing="1.6px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">THE DATAPATH · KUBE-PROXY REPLACED</text><text x="40" y="90" font-size="26" class="f_text" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Why eBPF beats the iptables it replaced</text><text x="40" y="122" font-size="15" class="f_muted" fill="#6c6c73">Cilium does the exact job kube-proxy did — turn a Service address into a</text><text x="40" y="142" font-size="15" class="f_muted" fill="#6c6c73">backend pod — but on a different substrate. Three dimensions decide it.</text><text x="186" y="188" font-size="12" class="mono f_amber" fill="#8a6410" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">iptables <tspan class="f_muted" fill="#6c6c73" font-weight="400">· replaced</tspan></text><text x="460" y="188" font-size="12" class="mono f_green" fill="#1f7a49" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">eBPF <tspan class="f_muted" fill="#6c6c73" font-weight="400">· Cilium</tspan></text><text x="40" y="235" font-size="10" class="mono f_dim" fill="#9a9aa1" letter-spacing="0.6px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">01</text><text x="40" y="253" font-size="14" class="f_text" fill="#1c1c22" font-weight="600">Lookup</text><rect x="184" y="198" width="262" height="84" rx="11" class="f_amberBg s_amberBd" fill="#fbf2df" stroke="#e0be7e" stroke-width="1"></rect><rect x="185.3" y="199.3" width="259.5" height="81.5" rx="9.8" fill="none" stroke="#8a6410" stroke-width="2.5" clip-path="url(#abar0)"></rect><text x="201" y="225" font-size="14" class="mono f_amber" fill="#8a6410" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">O(n) chain-walk</text><text x="201" y="244" font-size="12.5" class="f_text" fill="#1c1c22">Walk the rule chain top-to-bottom,</text><text x="201" y="261" font-size="12.5" class="f_text" fill="#1c1c22">every packet. Tens of thousands of</text><text x="201" y="278" font-size="12.5" class="f_text" fill="#1c1c22">rules at scale.</text><rect x="458" y="198" width="262" height="84" rx="11" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><rect x="459.3" y="199.3" width="259.5" height="81.5" rx="9.8" fill="none" stroke="#1f7a49" stroke-width="2.5" clip-path="url(#abar1)"></rect><text x="475" y="225" font-size="14" class="mono f_green" fill="#1f7a49" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">O(1) map read</text><text x="475" y="244" font-size="12.5" class="f_text" fill="#1c1c22">One hash-map read. Constant time</text><text x="475" y="261" font-size="12.5" class="f_text" fill="#1c1c22">no matter how many Services exist.</text><text x="40" y="331" font-size="10" class="mono f_dim" fill="#9a9aa1" letter-spacing="0.6px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">02</text><text x="40" y="349" font-size="14" class="f_text" fill="#1c1c22" font-weight="600">Update</text><rect x="184" y="294" width="262" height="84" rx="11" class="f_amberBg s_amberBd" fill="#fbf2df" stroke="#e0be7e" stroke-width="1"></rect><rect x="185.3" y="295.3" width="259.5" height="81.5" rx="9.8" fill="none" stroke="#8a6410" stroke-width="2.5" clip-path="url(#abar2)"></rect><text x="201" y="321" font-size="14" class="mono f_amber" fill="#8a6410" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">full rewrite</text><text x="201" y="340" font-size="12.5" class="f_text" fill="#1c1c22">One pod added or removed reprograms</text><text x="201" y="357" font-size="12.5" class="f_text" fill="#1c1c22">the whole ruleset — the datapath</text><text x="201" y="374" font-size="12.5" class="f_text" fill="#1c1c22">can stall.</text><rect x="458" y="294" width="262" height="84" rx="11" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><rect x="459.3" y="295.3" width="259.5" height="81.5" rx="9.8" fill="none" stroke="#1f7a49" stroke-width="2.5" clip-path="url(#abar3)"></rect><text x="475" y="321" font-size="14" class="mono f_green" fill="#1f7a49" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">in place</text><text x="475" y="340" font-size="12.5" class="f_text" fill="#1c1c22">Change one map entry. Nothing</text><text x="475" y="357" font-size="12.5" class="f_text" fill="#1c1c22">else is touched.</text><text x="40" y="427" font-size="10" class="mono f_dim" fill="#9a9aa1" letter-spacing="0.6px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">03</text><text x="40" y="445" font-size="14" class="f_text" fill="#1c1c22" font-weight="600">Where it runs</text><rect x="184" y="390" width="262" height="94" rx="11" class="f_amberBg s_amberBd" fill="#fbf2df" stroke="#e0be7e" stroke-width="1"></rect><rect x="185.3" y="391.3" width="259.5" height="91.5" rx="9.8" fill="none" stroke="#8a6410" stroke-width="2.5" clip-path="url(#abar4)"></rect><text x="201" y="417" font-size="14" class="mono f_amber" fill="#8a6410" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">netfilter tables</text><text x="201" y="436" font-size="12.5" class="f_text" fill="#1c1c22">In-kernel, but a static rule</text><text x="201" y="453" font-size="12.5" class="f_text" fill="#1c1c22">engine you can only reprogram</text><text x="201" y="470" font-size="12.5" class="f_text" fill="#1c1c22">wholesale.</text><rect x="458" y="390" width="262" height="94" rx="11" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><rect x="459.3" y="391.3" width="259.5" height="91.5" rx="9.8" fill="none" stroke="#1f7a49" stroke-width="2.5" clip-path="url(#abar5)"></rect><text x="475" y="417" font-size="14" class="mono f_green" fill="#1f7a49" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">kernel hook</text><text x="475" y="436" font-size="12.5" class="f_text" fill="#1c1c22">Verified programs at the packet</text><text x="475" y="453" font-size="12.5" class="f_text" fill="#1c1c22">hook — no context switch to</text><text x="475" y="470" font-size="12.5" class="f_text" fill="#1c1c22">userspace.</text><text x="40" y="508" font-size="13.5" class="f_muted" fill="#6c6c73">A paper directory you read cover-to-cover, versus a contacts app that</text><text x="40" y="527" font-size="13.5" class="f_muted" fill="#6c6c73">indexes by name: <tspan class="f_amber" fill="#8a6410" font-weight="500">grows and reprints</tspan> versus <tspan class="f_green" fill="#1f7a49" font-weight="500">one tap, forever</tspan>.</text></svg>