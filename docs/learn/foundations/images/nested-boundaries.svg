<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 612" width="760" height="612" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#5a9e78"]{fill:#91c2a7}[stroke="#5a9e78"]{stroke:#91c2a7}[fill="#e8a23e"]{fill:#f3c27d}[stroke="#e8a23e"]{stroke:#f3c27d}[fill="#eef0f3"]{fill:#1a1b1d}[stroke="#eef0f3"]{stroke:#1a1b1d}[fill="#d7dbe2"]{fill:#353c49}[stroke="#d7dbe2"]{stroke:#353c49}[fill="#5b5b64"]{fill:#8e8e98}[stroke="#5b5b64"]{stroke:#8e8e98}[fill="#e4e5e9"]{fill:#1f1f23}[stroke="#e4e5e9"]{stroke:#1f1f23}[fill="#e8ebf0"]{fill:#1c1d20}[stroke="#e8ebf0"]{stroke:#1c1d20}[fill="#d0d5dd"]{fill:#38404d}[stroke="#d0d5dd"]{stroke:#38404d}[fill="#f7e3c9"]{fill:#5f421c}[stroke="#f7e3c9"]{stroke:#5f421c}[fill="#9a6a12"]{fill:#eca82d}[stroke="#9a6a12"]{stroke:#eca82d}[fill="#d3ecdd"]{fill:#255639}[stroke="#d3ecdd"]{stroke:#255639}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#e1e6ec"]{fill:#1f2023}[stroke="#e1e6ec"]{stroke:#1f2023}[fill="#c9cfd9"]{fill:#394251}[stroke="#c9cfd9"]{stroke:#394251}[fill="#dae0e8"]{fill:#2f3b4b}[stroke="#dae0e8"]{stroke:#2f3b4b}[fill="#c2c9d5"]{fill:#aab4c5}[stroke="#c2c9d5"]{stroke:#aab4c5}[fill="#d3dae4"]{fill:#303d4f}[stroke="#d3dae4"]{stroke:#303d4f}[fill="#bbc3d1"]{fill:#a9b4c6}[stroke="#bbc3d1"]{stroke:#a9b4c6}[fill="#dbeee2"]{fill:#265036}[stroke="#dbeee2"]{stroke:#265036}[fill="#a9d3bd"]{fill:#9fd0b6}[stroke="#a9d3bd"]{stroke:#9fd0b6}[fill="#2f8a5a"]{fill:#51c889}[stroke="#2f8a5a"]{stroke:#51c889}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}}</style><rect x="0" y="0" width="760" height="612" rx="0" class="bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">THE ONE IDEA · FOUNDATIONS</text><text x="40" y="92" font-size="27" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Nested boundaries, private by default, all as code</text><text x="40" y="118" font-size="15" class="mut" fill="#6c6c73">The foundation is a stack of boundaries, each carved from the one above — Organization</text><text x="40" y="138" font-size="15" class="mut" fill="#6c6c73">down to a single pod. Every layer defaults to closed; a way in is a deliberate, logged act.</text><rect x="40" y="168" width="12" height="12" rx="3" class="n2" fill="#f6f6f3" stroke="#5a9e78" stroke-width="1"></rect><text x="58" y="178" font-size="11.5" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">closed by default</text><rect x="190" y="168" width="12" height="12" rx="3" class="chAmb" fill="#e8a23e"></rect><text x="208" y="178" font-size="11.5" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">a door — the only way in</text><rect x="40" y="206" width="680" height="344" rx="13" class="n0 nb0" fill="#eef0f3" stroke="#d7dbe2" stroke-width="1"></rect><text x="56" y="233" font-size="13.5"><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">Organization</tspan><tspan class="mut" fill="#5b5b64"> — the AWS Org root</tspan></text><rect x="621.45" y="219" width="84.55" height="18" rx="9" class="chNeu" fill="#e4e5e9"></rect><text x="663.725" y="232" font-size="10" class="tx" fill="#1c1c22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SCP ceiling</text><rect x="62" y="252" width="636" height="284" rx="12" class="n1 nb1" fill="#e8ebf0" stroke="#d0d5dd" stroke-width="1"></rect><text x="78" y="279" font-size="13.5"><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">account</tspan><tspan class="mut" fill="#5b5b64"> — a separate AWS principal</tspan></text><rect x="532.9" y="265" width="151.1" height="18" rx="9" class="chAmb" fill="#f7e3c9"></rect><text x="608.4499999999999" y="278" font-size="10" class="amb" fill="#9a6a12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">door · cross-acct role</text><rect x="453.45" y="265" width="72.44999999999999" height="18" rx="9" class="chGrn" fill="#d3ecdd"></rect><text x="489.67499999999995" y="278" font-size="10" class="grn" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">HARD WALL</text><rect x="84" y="298" width="592" height="224" rx="11" class="n2 nb2" fill="#e1e6ec" stroke="#c9cfd9" stroke-width="1"></rect><text x="100" y="325" font-size="13.5"><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">network</tspan><tspan class="mut" fill="#5b5b64"> — VPC · private subnets, NAT-out only</tspan></text><rect x="510.9" y="311" width="151.1" height="18" rx="9" class="chAmb" fill="#f7e3c9"></rect><text x="586.4499999999999" y="324" font-size="10" class="amb" fill="#9a6a12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">door · Transit Gateway</text><rect x="106" y="344" width="548" height="164" rx="10" class="n3 nb3" fill="#dae0e8" stroke="#c2c9d5" stroke-width="1"></rect><text x="122" y="371" font-size="13.5"><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">cluster</tspan><tspan class="mut" fill="#5b5b64"> — EKS · private API endpoint only</tspan></text><rect x="525.2" y="357" width="114.8" height="18" rx="9" class="chAmb" fill="#f7e3c9"></rect><text x="582.6" y="370" font-size="10" class="amb" fill="#9a6a12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">door · Tailscale</text><rect x="128" y="390" width="504" height="104" rx="9" class="n4 nb4" fill="#d3dae4" stroke="#bbc3d1" stroke-width="1"></rect><text x="144" y="417" font-size="13.5"><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">node</tspan><tspan class="mut" fill="#5b5b64"> — Karpenter · right-sized, just-in-time</tspan></text><rect x="150" y="436" width="460" height="44" rx="9" class="n5 nb5" fill="#dbeee2" stroke="#a9d3bd" stroke-width="1"></rect><text x="166" y="463" font-size="13.5"><tspan class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">pod</tspan><tspan class="grn" fill="#2f8a5a"> — your workload · Cilium ID, scoped creds</tspan></text><text x="40" y="576" font-size="13.5" class="blue" fill="#2f5fd0" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">DECLARED AS CODE, TOP TO BOTTOM</text><text x="40" y="596" font-size="13.5" class="mut" fill="#6c6c73">Level it and rebuild from the blueprints — a live spec the platform makes reality match.</text></svg>