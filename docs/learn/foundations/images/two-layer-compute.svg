<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 536" width="760" height="536" xml:space="preserve" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#fbf3e6"]{fill:#523c18}[stroke="#fbf3e6"]{stroke:#523c18}[fill="#d8b877"]{fill:#e1c68e}[stroke="#d8b877"]{stroke:#e1c68e}[fill="#9a6a12"]{fill:#eca82d}[stroke="#9a6a12"]{stroke:#eca82d}[fill="#b08a3e"]{fill:#d2b478}[stroke="#b08a3e"]{stroke:#d2b478}[fill="#9a7a3e"]{fill:#c7a86d}[stroke="#9a7a3e"]{stroke:#c7a86d}[fill="#f6ead4"]{fill:#5b441b}[stroke="#f6ead4"]{stroke:#5b441b}[fill="#dcc191"]{fill:#dec291}[stroke="#dcc191"]{stroke:#dec291}[fill="#8a7340"]{fill:#bca369}[stroke="#8a7340"]{stroke:#bca369}[fill="#faf1e0"]{fill:#554019}[stroke="#faf1e0"]{stroke:#554019}[fill="#e0cba0"]{fill:#dec592}[stroke="#e0cba0"]{stroke:#dec592}[fill="#9a8250"]{fill:#c1ae84}[stroke="#9a8250"]{stroke:#c1ae84}[fill="#8fbfa2"]{fill:#a3ccb3}[stroke="#8fbfa2"]{stroke:#a3ccb3}[fill="#eef7f1"]{fill:#21472e}[stroke="#eef7f1"]{stroke:#21472e}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#4f9e73"]{fill:#85c4a2}[stroke="#4f9e73"]{stroke:#85c4a2}[fill="#3f8a63"]{fill:#68bd91}[stroke="#3f8a63"]{stroke:#68bd91}[fill="#c9e6d5"]{fill:#2a5a3d}[stroke="#c9e6d5"]{stroke:#2a5a3d}[fill="#8fc7a8"]{fill:#9fd1b5}[stroke="#8fc7a8"]{stroke:#9fd1b5}[fill="#d7ecdf"]{fill:#275238}[stroke="#d7ecdf"]{stroke:#275238}[fill="#bcdcc9"]{fill:#a0cfb3}[stroke="#bcdcc9"]{stroke:#a0cfb3}[fill="#efeeeb"]{fill:#1f1e1c}[stroke="#efeeeb"]{stroke:#1f1e1c}[fill="#dcdbd6"]{fill:#2a2925}[stroke="#dcdbd6"]{stroke:#2a2925}[fill="#4a4a52"]{fill:#dfdfe2}[stroke="#4a4a52"]{stroke:#dfdfe2}}</style><rect x="0" y="0" width="760" height="536" rx="0" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">THE COMPUTE FLOOR · PARTS A–B</text><text x="40" y="92" font-size="27" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">A fixed floor, and elastic capacity on top</text><text x="40" y="118" font-size="15" fill="#6c6c73">Two layers of compute. A small always-on system group is the floor; Karpenter rents</text><text x="40" y="138" font-size="15" fill="#6c6c73">right-sized nodes just-in-time above it and returns them when idle.</text><rect x="40" y="160" width="680" height="128" rx="13" fill="#fbf3e6" stroke="#d8b877" stroke-width="1.4" stroke-dasharray="5 4"></rect><text x="56" y="184" font-size="13" fill="#9a6a12" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Karpenter</text><text x="133" y="184" font-size="10.5" fill="#b08a3e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">ELASTIC · RENTED BY THE HOUR</text><text x="704" y="184" font-size="11" fill="#9a7a3e" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">↑ scale on Pending   ·   ↓ consolidate when empty</text><rect x="56" y="196" width="322" height="52" rx="9" fill="#f6ead4" stroke="#dcc191" stroke-width="1"></rect><text x="70" y="216" font-size="12" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">r6g.medium</text><text x="70" y="234" font-size="11.5" fill="#8a7340">right-sized to the pending pods</text><rect x="386" y="196" width="320" height="52" rx="9" fill="#faf1e0" stroke="#e0cba0" stroke-width="1.4" stroke-dasharray="4 3"></rect><text x="546" y="226" font-size="11.5" fill="#9a8250" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">+ more, only while needed</text><text x="56" y="270" font-size="12.5" fill="#8a7340">Reads what Pending pods need, launches the cheapest instance that fits, bin-packs, and drops empty ones.</text><line x1="40" y1="306" x2="300" y2="306" stroke="#8fbfa2" stroke-width="1.8"></line><text x="380" y="310" font-size="10.5" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">THE FLOOR — always exists first</text><line x1="460" y1="306" x2="720" y2="306" stroke="#8fbfa2" stroke-width="1.8"></line><rect x="40" y="322" width="680" height="112" rx="13" fill="#eef7f1" stroke="#a3ccb4" stroke-width="1"></rect><text x="56" y="346" font-size="13" fill="#1f7a49" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">system node group</text><text x="196" y="346" font-size="10.5" fill="#4f9e73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">ALWAYS-ON GENERATOR</text><text x="704" y="346" font-size="11" fill="#3f8a63" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2× t4g.xlarge · min 2 / max 3</text><rect x="56" y="360" width="118.8" height="22" rx="6" fill="#c9e6d5" stroke="#8fc7a8" stroke-width="1"></rect><text x="65" y="375" font-size="11" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Karpenter itself</text><rect x="181.8" y="360" width="62.1" height="22" rx="6" fill="#d7ecdf" stroke="#bcdcc9" stroke-width="1"></rect><text x="190.8" y="375" font-size="11" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">CoreDNS</text><rect x="250.9" y="360" width="112.5" height="22" rx="6" fill="#d7ecdf" stroke="#bcdcc9" stroke-width="1"></rect><text x="259.9" y="375" font-size="11" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Cilium operator</text><rect x="370.4" y="360" width="207" height="22" rx="6" fill="#d7ecdf" stroke="#bcdcc9" stroke-width="1"></rect><text x="379.4" y="375" font-size="11" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ArgoCD · Crossplane · Keycloak</text><rect x="56" y="388" width="99.89999999999999" height="22" rx="6" fill="#d7ecdf" stroke="#bcdcc9" stroke-width="1"></rect><text x="65" y="403" font-size="11" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">TSDB backends</text><rect x="162.89999999999998" y="388" width="156.6" height="22" rx="6" fill="#d7ecdf" stroke="#bcdcc9" stroke-width="1"></rect><text x="171.89999999999998" y="403" font-size="11" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">node-pinned DaemonSets</text><rect x="40" y="450" width="680" height="64" rx="12" fill="#efeeeb" stroke="#dcdbd6" stroke-width="1"></rect><text x="60" y="474" font-size="10.5" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">WHY THE FLOOR CAN’T BE KARPENTER</text><text x="60" y="492" font-size="13" fill="#1c1c22">Karpenter is a pod, and a pod needs a node. A cold cluster with only Karpenter nodes has</text><text x="60" y="509" font-size="13" fill="#4a4a52">nothing running to bring one back — it can’t start the node it runs on.</text></svg>