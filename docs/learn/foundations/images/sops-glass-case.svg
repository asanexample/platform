<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 536" width="760" height="536" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#f4f6f9"]{fill:#17181a}[stroke="#f4f6f9"]{stroke:#17181a}[fill="#d3d8e0"]{fill:#353e4c}[stroke="#d3d8e0"]{stroke:#353e4c}[fill="#eceef1"]{fill:#1b1c1e}[stroke="#eceef1"]{stroke:#1b1c1e}[fill="#d3d6dc"]{fill:#26272b}[stroke="#d3d6dc"]{stroke:#26272b}[fill="#9a6a12"]{fill:#eca82d}[stroke="#9a6a12"]{stroke:#eca82d}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#fbf3e6"]{fill:#523c18}[stroke="#fbf3e6"]{stroke:#523c18}[fill="#d8b877"]{fill:#e1c68e}[stroke="#d8b877"]{stroke:#e1c68e}[fill="#f3e6d0"]{fill:#5e451b}[stroke="#f3e6d0"]{stroke:#5e451b}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#b5482a"]{fill:#dd795e}[stroke="#b5482a"]{stroke:#dd795e}[fill="#f0eff1"]{fill:#1c1a1e}[stroke="#f0eff1"]{stroke:#1c1a1e}[fill="#dcdbd6"]{fill:#2a2925}[stroke="#dcdbd6"]{stroke:#2a2925}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}}</style><rect x="0" y="0" width="760" height="556" rx="0" class="bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">SECRETS IN THE OPEN</text><text x="40" y="92" font-size="27" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">A locked glass case in the public square</text><text x="40" y="118" font-size="15" class="mut" fill="#6c6c73">The repo is public, yet the account IDs, emails and SSO URLs are committed right in git —</text><text x="40" y="138" font-size="15" class="mut" fill="#6c6c73">encrypted with SOPS against a KMS key. Anyone can see the case; only the right badge</text><text x="40" y="158" font-size="15" class="mut" fill="#6c6c73">opens it, and every open is logged.</text><rect x="40" y="186" width="174" height="214" rx="12" class="card cardBd" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><text x="56" y="208" font-size="10" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">PUBLIC REPO ·</text><text x="56" y="221" font-size="10" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">ANYONE CAN CLONE</text><text x="56" y="242" font-size="12.5" class="tx" fill="#1c1c22" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">secrets.enc.yaml</text><rect x="56" y="252" width="142" height="70" rx="7" class="codeBg codeBd" fill="#eceef1" stroke="#d3d6dc" stroke-width="1"></rect><text x="66" y="268" font-size="9.5" class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">platform:</text><text x="66" y="282" font-size="9.5" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ENC[AES256_GCM,</text><text x="66" y="295" font-size="9.5" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">data:8buQRHB7…,</text><text x="66" y="308" font-size="9.5" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">iv:gAu8…,type:str]</text><text x="56" y="342" font-size="11.5" class="mut" fill="#6c6c73">Ciphertext in plain</text><text x="56" y="358" font-size="11.5" class="mut" fill="#6c6c73">sight — key-less, useless.</text><text x="255" y="285" font-size="9.5" class="mut" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">sops_decrypt</text><text x="255" y="296" font-size="9.5" class="mut" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">_file</text><line x1="222" y1="311" x2="286" y2="311" class="line" stroke="#9a9aa1" stroke-width="2"></line><path d="M288 311 L281 306 L281 316 Z" class="lineF" fill="#9a9aa1"></path><rect x="293" y="186" width="174" height="214" rx="12" class="amBg amBd" fill="#fbf3e6" stroke="#d8b877" stroke-width="1"></rect><text x="309" y="208" font-size="10" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">KMS · THE LOCK</text><text x="309" y="228" font-size="12.5" class="amb" fill="#9a6a12" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">alias/platform-sops</text><text x="309" y="250" font-size="12" class="mut" fill="#6c6c73">Decrypts with your</text><text x="309" y="265" font-size="12" class="mut" fill="#6c6c73">ambient AWS identity —</text><text x="309" y="280" font-size="12" class="mut" fill="#6c6c73">before any assume-role.</text><rect x="309" y="292" width="142" height="22" rx="6" class="amChip" fill="#f3e6d0"></rect><text x="320" y="307" font-size="10.5" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">only trusted principals</text><rect x="309" y="320" width="142" height="22" rx="6" class="amChip" fill="#f3e6d0"></rect><text x="320" y="335" font-size="10.5" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">◉ decrypt → CloudTrail</text><text x="508" y="296" font-size="9.5" class="mut" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">in memory</text><line x1="475" y1="311" x2="539" y2="311" class="line" stroke="#9a9aa1" stroke-width="2"></line><path d="M541 311 L534 306 L534 316 Z" class="lineF" fill="#9a9aa1"></path><rect x="546" y="186" width="174" height="214" rx="12" class="grBg grBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="562" y="208" font-size="10" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">PLAINTEXT ·</text><text x="562" y="221" font-size="10" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">CONFIG-EVAL ONLY</text><text x="562" y="242" font-size="12" class="grn" fill="#1f7a49" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">account_ids[…]</text><text x="562" y="264" font-size="12" class="mut" fill="#6c6c73">Merged into the</text><text x="562" y="279" font-size="12" class="mut" fill="#6c6c73">cascade, consumed at</text><text x="562" y="294" font-size="12" class="mut" fill="#6c6c73">eval — then gone.</text><text x="562" y="382" font-size="10.5" class="red" fill="#b5482a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">✗ never written to disk</text><rect x="40" y="416" width="220" height="54" rx="10" class="card2 card2Bd" fill="#f0eff1" stroke="#dcdbd6" stroke-width="1"></rect><text x="54" y="438" font-size="13" class="tx" fill="#1c1c22" font-weight="600">One source of truth</text><text x="54" y="456" font-size="11.5" class="mut" fill="#6c6c73">In git — no second copy to drift.</text><rect x="270" y="416" width="220" height="54" rx="10" class="card2 card2Bd" fill="#f0eff1" stroke="#dcdbd6" stroke-width="1"></rect><text x="284" y="438" font-size="13" class="tx" fill="#1c1c22" font-weight="600">No plaintext on disk</text><text x="284" y="456" font-size="11.5" class="mut" fill="#6c6c73">Decrypts to memory, never a file.</text><rect x="500" y="416" width="220" height="54" rx="10" class="card2 card2Bd" fill="#f0eff1" stroke="#dcdbd6" stroke-width="1"></rect><text x="514" y="438" font-size="13" class="tx" fill="#1c1c22" font-weight="600">IAM-gated + audited</text><text x="514" y="456" font-size="11.5" class="mut" fill="#6c6c73">Revoke = a KMS policy edit.</text><text x="40" y="498" font-size="13"><tspan class="blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="500">IDENTITY-CONFIG, NOT A VAULT · </tspan><tspan class="mut" fill="#6c6c73">account numbers, emails, SSO endpoints —</tspan></text><text x="40" y="516" font-size="13" class="mut" fill="#6c6c73">sensitive only in a public repo. Real runtime credentials live in Secrets Manager.</text></svg>