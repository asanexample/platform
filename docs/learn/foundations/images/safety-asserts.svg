<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" width="760" height="668" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><defs><clipPath id="abar0"><rect x="39.0" y="261.0" width="11.0" height="100.0"/></clipPath><clipPath id="abar1"><rect x="39.0" y="383.0" width="11.0" height="100.0"/></clipPath></defs><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#f0eff1"]{fill:#1c1a1e}[stroke="#f0eff1"]{stroke:#1c1a1e}[fill="#d9d9dd"]{fill:#242429}[stroke="#d9d9dd"]{stroke:#242429}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#f4f6f9"]{fill:#17181a}[stroke="#f4f6f9"]{stroke:#17181a}[fill="#d3d8e0"]{fill:#353e4c}[stroke="#d3d8e0"]{stroke:#353e4c}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#dbe6fa"]{fill:#192f57}[stroke="#dbe6fa"]{stroke:#192f57}[fill="#eceef1"]{fill:#1b1c1e}[stroke="#eceef1"]{stroke:#1b1c1e}[fill="#d3d6dc"]{fill:#26272b}[stroke="#d3d6dc"]{stroke:#26272b}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#5a9e78"]{fill:#91c2a7}[stroke="#5a9e78"]{stroke:#91c2a7}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#2f8a5a"]{fill:#51c889}[stroke="#2f8a5a"]{stroke:#51c889}[fill="#fbeae3"]{fill:#542a18}[stroke="#fbeae3"]{stroke:#542a18}[fill="#e0b3a0"]{fill:#dea892}[stroke="#e0b3a0"]{stroke:#dea892}[fill="#b5482a"]{fill:#dd795e}[stroke="#b5482a"]{stroke:#dd795e}}</style><rect x="0" y="0" width="760" height="668" rx="0" class="bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">REFUSAL BY CONSTRUCTION</text><text x="40" y="90" font-size="27" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Two asserts stand between you and</text><text x="40" y="120" font-size="27" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">the wrong account</text><text x="40" y="148" font-size="15" class="mut" fill="#6c6c73">Loading config by directory position is powerful — and dangerous. Copy a unit into the</text><text x="40" y="168" font-size="15" class="mut" fill="#6c6c73">wrong folder or fat-finger an account ID and you’d apply the wrong config to the wrong</text><text x="40" y="188" font-size="15" class="mut" fill="#6c6c73">account. So _base.hcl runs two checks on every plan.</text><rect x="40" y="210" width="196" height="28" rx="9" class="card cardBd" fill="#f0eff1" stroke="#d9d9dd" stroke-width="1"></rect><text x="54" y="228" font-size="12.5" class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">terragrunt plan begins</text><line x1="58" y1="238" x2="58" y2="252" class="line" stroke="#9a9aa1" stroke-width="2"></line><text x="70" y="251" font-size="11" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">_base.hcl loads the cascade</text><rect x="40" y="262" width="680" height="98" rx="12" class="card cardBd" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><rect x="41.3" y="263.3" width="677.5" height="95.5" rx="10.8" fill="none" stroke="#2f5fd0" stroke-width="2.5" clip-path="url(#abar0)"></rect><rect x="56" y="274" width="66" height="18" rx="5" class="blChip" fill="#dbe6fa"></rect><text x="89" y="286" font-size="10" class="blue" fill="#2f5fd0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">ASSERT 1</text><text x="132" y="288" font-size="15" class="tx" fill="#1c1c22" font-weight="600">directory  ↔  env</text><text x="56" y="310" font-size="13.5" class="mut" fill="#6c6c73">The folder you’re standing in must equal the env that env.hcl declares.</text><rect x="56" y="320" width="608" height="28" rx="7" class="codeBg codeBd" fill="#eceef1" stroke="#d3d6dc" stroke-width="1"></rect><text x="68" y="338" font-size="11.5"><tspan class="tx" fill="#1c1c22">path[0] = </tspan><tspan class="grn" fill="#1f7a49">platform</tspan><tspan class="tx" fill="#1c1c22">   ==   env.hcl.env = </tspan><tspan class="grn" fill="#1f7a49">platform</tspan></text><line x1="58" y1="360" x2="58" y2="374" class="gl" stroke="#5a9e78" stroke-width="2"></line><text x="70" y="373" font-size="10.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">✓ pass</text><rect x="40" y="384" width="680" height="98" rx="12" class="card cardBd" fill="#f4f6f9" stroke="#d3d8e0" stroke-width="1"></rect><rect x="41.3" y="385.3" width="677.5" height="95.5" rx="10.8" fill="none" stroke="#2f5fd0" stroke-width="2.5" clip-path="url(#abar1)"></rect><rect x="56" y="396" width="66" height="18" rx="5" class="blChip" fill="#dbe6fa"></rect><text x="89" y="408" font-size="10" class="blue" fill="#2f5fd0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">ASSERT 2</text><text x="132" y="410" font-size="15" class="tx" fill="#1c1c22" font-weight="600">account  ↔  map</text><text x="56" y="432" font-size="13.5" class="mut" fill="#6c6c73">The account the map expects for that env must equal the account_id it resolved.</text><rect x="56" y="442" width="608" height="28" rx="7" class="codeBg codeBd" fill="#eceef1" stroke="#d3d6dc" stroke-width="1"></rect><text x="68" y="460" font-size="11.5"><tspan class="tx" fill="#1c1c22">map[platform] = </tspan><tspan class="grn" fill="#1f7a49">12••••34</tspan><tspan class="tx" fill="#1c1c22">   ==   resolved account_id = </tspan><tspan class="grn" fill="#1f7a49">12••••34</tspan></text><line x1="58" y1="482" x2="58" y2="496" class="gl" stroke="#5a9e78" stroke-width="2"></line><text x="70" y="495" font-size="10.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">✓ pass</text><rect x="40" y="508" width="320" height="30" rx="9" class="grBg grBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="56" y="527" font-size="13"><tspan class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="500">plan runs</tspan><tspan class="grn" fill="#2f8a5a"> — assume roles, touch AWS</tspan></text><rect x="40" y="554" width="680" height="58" rx="12" class="rjBg rjBd" fill="#fbeae3" stroke="#e0b3a0" stroke-width="1"></rect><text x="60" y="588" font-size="12" class="red" fill="#b5482a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SAFETY:</text><text x="128" y="580" font-size="13.5" class="tx" fill="#1c1c22">Fail either assert and Terragrunt refuses to run — no plan, no apply. A wrong folder</text><text x="128" y="598" font-size="13.5" class="tx" fill="#1c1c22">or an account typo is a hard stop, printed as a SAFETY: error.</text><text x="40" y="636" font-size="13" class="mut" fill="#6c6c73">The “I applied prod’s config from the preprod folder” catastrophe is impossible by construction,</text><text x="40" y="654" font-size="13" class="mut" fill="#6c6c73">not by discipline. A SAFETY: error is the rail working — fix the directory, never delete the assert.</text></svg>