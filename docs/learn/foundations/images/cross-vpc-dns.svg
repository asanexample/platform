<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" width="760" height="556" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#fbeae3"]{fill:#542a18}[stroke="#fbeae3"]{stroke:#542a18}[fill="#e0b3a0"]{fill:#dea892}[stroke="#e0b3a0"]{stroke:#dea892}[fill="#b5482a"]{fill:#dd795e}[stroke="#b5482a"]{stroke:#dd795e}[fill="#f4f6f9"]{fill:#17181a}[stroke="#f4f6f9"]{stroke:#17181a}[fill="#d7dbe2"]{fill:#353c49}[stroke="#d7dbe2"]{stroke:#353c49}[fill="#c06a4a"]{fill:#daa18c}[stroke="#c06a4a"]{stroke:#daa18c}[fill="#f6d5c8"]{fill:#602f1c}[stroke="#f6d5c8"]{stroke:#602f1c}[fill="#d99a80"]{fill:#e0a78f}[stroke="#d99a80"]{stroke:#e0a78f}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#5a9e78"]{fill:#91c2a7}[stroke="#5a9e78"]{stroke:#91c2a7}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#fbf3e6"]{fill:#523c18}[stroke="#fbf3e6"]{stroke:#523c18}[fill="#d8b877"]{fill:#e1c68e}[stroke="#d8b877"]{stroke:#e1c68e}[fill="#9a6a12"]{fill:#eca82d}[stroke="#9a6a12"]{stroke:#eca82d}[fill="#eef4f0"]{fill:#1a1d1b}[stroke="#eef4f0"]{stroke:#1a1d1b}[fill="#bcdcc9"]{fill:#a0cfb3}[stroke="#bcdcc9"]{stroke:#a0cfb3}[fill="#efeeeb"]{fill:#1f1e1c}[stroke="#efeeeb"]{stroke:#1f1e1c}[fill="#dcdbd6"]{fill:#2a2925}[stroke="#dcdbd6"]{stroke:#2a2925}}</style><rect x="0" y="0" width="760" height="548" rx="0" class="bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">CROSS-VPC DNS · §5</text><text x="40" y="92" font-size="27" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">The room has a number, but no listed address</text><text x="40" y="118" font-size="15" class="mut" fill="#6c6c73">The corridor gives the platform account an IP path to the preprod cluster — but not a working</text><text x="40" y="138" font-size="15" class="mut" fill="#6c6c73">name. EKS’s private zone is invisible to Route 53, so the lookup returns public IPs that don’t route.</text><rect x="40" y="164" width="680" height="134" rx="13" class="rjBg rjBd" fill="#fbeae3" stroke="#e0b3a0" stroke-width="1"></rect><text x="58" y="187" font-size="10.5" class="red" fill="#b5482a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">THE GAP · the name resolves, the packet dies</text><rect x="56" y="198" width="196" height="56" rx="10" class="card cardBd" fill="#f4f6f9" stroke="#d7dbe2" stroke-width="1"></rect><text x="69" y="220" font-size="12" class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ArgoCD</text><text x="69" y="238" font-size="11.5" class="mut" fill="#6c6c73">resolves the API hostname</text><line x1="256" y1="226" x2="296" y2="226" class="rl" stroke="#c06a4a" stroke-width="2"></line><path d="M298 226 L291 221 L291 231 Z" class="rlF" fill="#c06a4a"></path><rect x="300" y="198" width="196" height="56" rx="10" class="card cardBd" fill="#f4f6f9" stroke="#d7dbe2" stroke-width="1"></rect><text x="313" y="220" font-size="12" class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">public DNS answer</text><text x="313" y="238" font-size="11.5" class="mut" fill="#6c6c73">points at unroutable IPs</text><line x1="500" y1="226" x2="536" y2="226" class="rl" stroke="#c06a4a" stroke-width="2"></line><path d="M538 226 L531 221 L531 231 Z" class="rlF" fill="#c06a4a"></path><rect x="540" y="198" width="164" height="56" rx="10" class="rjBox rjBoxBd" fill="#f6d5c8" stroke="#d99a80" stroke-width="1"></rect><text x="553" y="220" font-size="12" class="red" fill="#b5482a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">✗ packet dies</text><text x="553" y="238" font-size="11.5" class="mut" fill="#6c6c73">unroutable</text><text x="58" y="278" font-size="12.5" class="tx" fill="#1c1c22">EKS’s private zone is managed internally — invisible to the Route 53 API, so you can’t share it.</text><text x="380" y="318" font-size="10.5" class="grn" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">the bridge · dns_method = phz</text><path d="M380 332 L375 325 L385 325 Z" class="glF" fill="#5a9e78"></path><rect x="40" y="340" width="680" height="116" rx="13" class="grBg grBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><rect x="56" y="354" width="214" height="64" rx="10" class="amBg amBd" fill="#fbf3e6" stroke="#d8b877" stroke-width="1"></rect><text x="70" y="374" font-size="10" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">DYNAMIC ENI LOOKUP</text><text x="70" y="392" font-size="11.5" class="mut" fill="#6c6c73">Assume a role in preprod,</text><text x="70" y="407" font-size="11.5" class="mut" fill="#6c6c73">query EC2 for live ENIs — each apply.</text><line x1="272" y1="386" x2="312" y2="386" class="gl" stroke="#5a9e78" stroke-width="2"></line><path d="M314 386 L307 381 L307 391 Z" class="glF" fill="#5a9e78"></path><rect x="318" y="354" width="386" height="64" rx="10" class="card cardBd" fill="#eef4f0" stroke="#bcdcc9" stroke-width="1"></rect><text x="332" y="374" font-size="10" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.3px">OUR OWN PHZ · in the platform VPC</text><text x="332" y="392" font-size="11.5" class="mut" fill="#6c6c73">Write an A-record for the preprod API name → the live private IPs.</text><text x="332" y="407" font-size="11.5" class="grn" fill="#1f7a49">The name now resolves to something routable.</text><text x="58" y="440" font-size="12.5" class="tx" fill="#1c1c22">Re-discovered on every apply — no static list to go stale when an EKS upgrade rotates the ENIs.</text><rect x="40" y="470" width="680" height="76" rx="12" class="panel panelBd" fill="#efeeeb" stroke="#dcdbd6" stroke-width="1"></rect><text x="60" y="493" font-size="10.5" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">FAIL LOUD</text><text x="60" y="511" font-size="13" class="tx" fill="#1c1c22">Empty lookup? The script refuses to write an empty record (it would sever access) and stops at plan</text><text x="60" y="511" font-size="13" class="tx" fill="#1c1c22"></text><text x="60" y="529" font-size="13"><tspan class="mut" fill="#6c6c73">time. A control-plane lookup that can return “nothing” must treat nothing as an </tspan><tspan class="tx" fill="#1c1c22">error, not data.</tspan></text></svg>