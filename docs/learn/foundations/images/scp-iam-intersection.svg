<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" xml:space="preserve" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#dfe3ea"]{fill:#2f3847}[stroke="#dfe3ea"]{stroke:#2f3847}[fill="#4a4a52"]{fill:#dfdfe2}[stroke="#4a4a52"]{stroke:#dfdfe2}[fill="#f6ead4"]{fill:#5b441b}[stroke="#f6ead4"]{stroke:#5b441b}[fill="#9a6a12"]{fill:#eca82d}[stroke="#9a6a12"]{stroke:#eca82d}[fill="#a05236"]{fill:#ce8064}[stroke="#a05236"]{stroke:#ce8064}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#5a76a8"]{fill:#95a8c9}[stroke="#5a76a8"]{stroke:#95a8c9}[fill="#c9e6d5"]{fill:#2a5a3d}[stroke="#c9e6d5"]{stroke:#2a5a3d}[fill="#3f9e6d"]{fill:#70c99b}[stroke="#3f9e6d"]{stroke:#70c99b}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#4f8a68"]{fill:#7eb796}[stroke="#4f8a68"]{stroke:#7eb796}}</style><rect x="0" y="0" width="760" height="460" rx="0" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">SCPs · THE CEILING</text><text x="40" y="92" font-size="27" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Effective = the SCP ceiling ∩ your IAM grant</text><text x="40" y="118" font-size="15" fill="#6c6c73">An SCP never grants — it only carves the maximum down from above the account, where even</text><text x="40" y="138" font-size="15" fill="#6c6c73">root can’t escape it. IAM grants from inside. What you can do is the intersection of the two.</text><rect x="40" y="174" width="660" height="42" rx="9" fill="#dfe3ea"></rect><text x="56" y="200" font-size="13" fill="#4a4a52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FullAWSAccess  ·  the maximum AWS attaches everywhere</text><rect x="40" y="230" width="520" height="42" rx="9" fill="#f6ead4"></rect><text x="56" y="256" font-size="13" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">− SCP ceiling  ·  denies carved from above the account</text><text x="700" y="251" font-size="11" fill="#a05236" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">even root can’t escape</text><rect x="40" y="286" width="400" height="42" rx="9" fill="#eaf0fc"></rect><text x="56" y="312" font-size="13" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">∩ IAM grant  ·  from inside the account</text><text x="700" y="307" font-size="11" fill="#5a76a8" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">admins can rewrite</text><rect x="40" y="342" width="300" height="42" rx="9" fill="#c9e6d5"></rect><rect x="40" y="351" width="4" height="24" rx="2" fill="#3f9e6d"></rect><text x="56" y="368" font-size="13" fill="#1f7a49" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">= effective permission</text><text x="700" y="363" font-size="11" fill="#4f8a68" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">every layer only subtracts</text><text x="40" y="416" font-size="13" fill="#6c6c73">SCP = a ceiling, not a grant · enforced by the Org above the account · deny-only in practice —</text><text x="40" y="434" font-size="13" fill="#6c6c73">there is no allow-override lower down, so each layer in the chain can only take permissions away.</text></svg>