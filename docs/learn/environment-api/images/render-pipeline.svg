<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 706" width="760" height="706" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#9a6a12"]{fill:#eca82d}[stroke="#9a6a12"]{stroke:#eca82d}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#fbf3e6"]{fill:#523c18}[stroke="#fbf3e6"]{stroke:#523c18}[fill="#d8b877"]{fill:#e1c68e}[stroke="#d8b877"]{stroke:#e1c68e}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#f0eff1"]{fill:#1c1a1e}[stroke="#f0eff1"]{stroke:#1c1a1e}[fill="#d9d9dd"]{fill:#242429}[stroke="#d9d9dd"]{stroke:#242429}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#74b98f"]{fill:#9fd0b2}[stroke="#74b98f"]{stroke:#9fd0b2}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#eef7f1"]{fill:#21472e}[stroke="#eef7f1"]{stroke:#21472e}[fill="#bcdcc9"]{fill:#a0cfb3}[stroke="#bcdcc9"]{stroke:#a0cfb3}[fill="#d3ecdd"]{fill:#255639}[stroke="#d3ecdd"]{stroke:#255639}[fill="#eef4ef"]{fill:#1a1d1a}[stroke="#eef4ef"]{stroke:#1a1d1a}}</style><rect x="0" y="0" width="760" height="706" rx="0" class="bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">INSIDE THE COMPOSITION · RENDER</text><text x="40" y="92" font-size="27" font-weight="600"><tspan class="tx" fill="#1c1c22">footprint = f(</tspan><tspan class="blue" fill="#2f5fd0">your claim</tspan><tspan class="tx" fill="#1c1c22">, </tspan><tspan class="amb" fill="#9a6a12">this cluster’s constants</tspan><tspan class="tx" fill="#1c1c22">)</tspan></text><text x="40" y="118" font-size="15" class="mut" fill="#6c6c73">The Composition stores nothing. Every reconcile, a three-step pipeline reads two inputs</text><text x="40" y="138" font-size="15" class="mut" fill="#6c6c73">and emits desired resources. Same recipe, different constants per cluster.</text><rect x="40" y="164" width="330" height="86" rx="12" class="blbg" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text x="56" y="188" font-size="10" class="blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">INPUT 1 · YOUR CLAIM</text><text x="56" y="208" font-size="14.5" class="tx" fill="#1c1c22" font-weight="600">What you asked for</text><text x="56" y="226" font-size="11.5" class="blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">team · product · stage · services · quota</text><text x="56" y="242" font-size="11.5" class="mut" fill="#6c6c73">Portable — no account IDs, no ARNs.</text><rect x="390" y="164" width="330" height="86" rx="12" class="ambg" fill="#fbf3e6" stroke="#d8b877" stroke-width="1"></rect><text x="406" y="188" font-size="10" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">INPUT 2 · CLUSTER CONSTANTS</text><text x="406" y="208" font-size="14.5" class="tx" fill="#1c1c22" font-weight="600">EnvironmentConfig</text><text x="406" y="226" font-size="11.5" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ECR registry · account IDs · boundary ARN…</text><text x="406" y="242" font-size="11.5" class="mut" fill="#6c6c73">Per-cluster — injected, never in the claim.</text><text x="380" y="270" font-size="10.5" class="mut" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">read together, every reconcile</text><line x1="380" y1="277" x2="380" y2="286" class="line" stroke="#9a9aa1" stroke-width="2"></line><path d="M380 290 L375 282 L385 282 Z" class="lineF" fill="#9a9aa1"></path><text x="40" y="312" font-size="10.5" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">THE PIPELINE · mode: Pipeline</text><rect x="40" y="324" width="680" height="50" rx="12" class="card cardBd" fill="#f0eff1" stroke="#d9d9dd" stroke-width="1"></rect><text x="60" y="346" font-size="12"><tspan class="mut" fill="#6c6c73">01  </tspan><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="500">load-environment</tspan></text><text x="60" y="362" font-size="10.5" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">function-environment-configs</text><text x="236" y="353" font-size="13.5"><tspan class="tx" fill="#1c1c22">Pull </tspan><tspan class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">platform-cluster-config</tspan><tspan class="tx" fill="#1c1c22"> into the pipeline </tspan><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">.context</tspan></text><line x1="70" y1="374" x2="70" y2="386" class="line" stroke="#9a9aa1" stroke-width="2"></line><rect x="40" y="386" width="680" height="50" rx="12" class="grbg grbd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><rect x="40" y="398" width="4" height="26" rx="2" class="grbd" fill="#74b98f"></rect><text x="60" y="408" font-size="12"><tspan class="grn" fill="#1f7a49">02  </tspan><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">render-resources</tspan></text><text x="60" y="424" font-size="10.5" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">function-go-templating</text><text x="236" y="415" font-size="13.5"><tspan class="tx" fill="#1c1c22">One big go-template → </tspan><tspan class="tx" fill="#1c1c22" font-weight="600">one YAML doc per desired resource</tspan></text><line x1="70" y1="436" x2="70" y2="448" class="line" stroke="#9a9aa1" stroke-width="2"></line><rect x="40" y="448" width="680" height="50" rx="12" class="card cardBd" fill="#f0eff1" stroke="#d9d9dd" stroke-width="1"></rect><text x="60" y="470" font-size="12"><tspan class="mut" fill="#6c6c73">03  </tspan><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="500">ready</tspan></text><text x="60" y="486" font-size="10.5" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">function-auto-ready</text><text x="236" y="477" font-size="13.5"><tspan class="tx" fill="#1c1c22">Mark the </tspan><tspan class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">XEnvironment </tspan><tspan class="grn" fill="#1f7a49" font-weight="600">Ready</tspan><tspan class="tx" fill="#1c1c22"> when every composed resource is healthy</tspan></text><line x1="70" y1="498" x2="70" y2="510" class="line" stroke="#9a9aa1" stroke-width="2"></line><path d="M70 514 L65 506 L75 506 Z" class="lineF" fill="#9a9aa1"></path><rect x="40" y="520" width="680" height="64" rx="12" class="grbg2 grbd2" fill="#eef7f1" stroke="#bcdcc9" stroke-width="1"></rect><text x="56" y="542" font-size="10.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">DESIRED STATE · what should exist</text><rect x="56" y="552" width="180" height="20" rx="6" class="chip" fill="#d3ecdd"></rect><text x="67" y="566" font-size="11.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Objects — K8s manifests</text><rect x="244" y="552" width="168" height="20" rx="6" class="chip" fill="#d3ecdd"></rect><text x="255" y="566" font-size="11.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">AWS managed resources</text><rect x="420" y="552" width="150" height="20" rx="6" class="chip" fill="#d3ecdd"></rect><text x="431" y="566" font-size="11.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">a status write-back</text><rect x="40" y="596" width="680" height="80" rx="12" class="panel grbd" fill="#eef4ef" stroke="#a3ccb4" stroke-width="1" stroke-dasharray="4 3"></rect><text x="60" y="638" font-size="20" class="grn" fill="#1f7a49">↻</text><text x="90" y="624" font-size="10.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">RENDER vs RECONCILE</text><text x="90" y="642" font-size="13" class="tx" fill="#1c1c22">The template only declares — it creates nothing. Crossplane diffs desired vs</text><text x="90" y="658" font-size="13" class="tx" fill="#1c1c22">observed and drives the providers to make it real, forever. This is the desired half.</text></svg>