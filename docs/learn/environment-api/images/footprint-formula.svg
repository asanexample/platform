lass="grn" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">shop · today</text><line x1="40" y1="526" x2="720" y2="526" class="axis" stroke="#d9d9dd" stroke-width="1"></line><line x1="40" y1="572" x2="720" y2="572" class="axis" stroke="#d9d9dd" stroke-width="1"></line><text x="380" y="588" font-size="11" class="mut" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">services declared  →  same shell every time, one stack each</text><text x="40" y="620" font-size="13" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">*</text><text x="50" y="620" font-size="13" class="mut" fill="#6c6c73">+5 is the ceiling, not a rule. A service gets its own cloud identity (IAM Role + Pod Identity)</text><text x="40" y="638" font-size="13" class="mut" fill="#6c6c73">only if it asks for one — otherwise it just adds its 3 image-registry resources.</text></svg>