="158" font-size="15" class="mut" fill="#6c6c73">Weeks later, every row still reads True True.</text><circle cx="46" cy="177" r="3.5" class="dot" fill="#2f9e63"></circle><text x="58" y="181" font-size="11.5" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">each dot below = one managed resource, reporting </text><text x="402" y="181" font-size="11.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SYNCED True · READY True</text><rect x="230" y="204" width="300" height="64" rx="12" class="blbg" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text x="380" y="227" font-size="10" class="blue" fill="#2f5fd0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.6px">THE CLAIM · IN GIT</text><text x="380" y="248" font-size="14.5" class="blue" fill="#2f5fd0" text-anchor="middle" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">XEnvironment · alpha-shop-dev</text><text x="380" y="263" font-size="11.5" class="mut" fill="#6c6c73" text-anchor="middle">team · product · stage — about 12 lines</text><text x="380" y="292" font-size="11" class="amb" fill="#9a6a12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">Composition renders ↻</text><line x1="380" y1="299" x2="380" y2="308" class="line" stroke="#9a9aa1" stroke-width="2"></line><path d="M380 312 L375 304 L385 304 Z" class="lineF" fill="#9a9aa1"></path><rect x="40" y="324" width="332" height="306" rx="13" class="panel panelBd" fill="#efeeeb" stroke="#dcdbd6" stroke-width="1"></rect><text x="54" y="348" font-size="12" class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">In the cluster</text><rect x="275" y="336" width="83" height="18" rx="9" class="badgeBg" fill="#d3ecdd"></rect><text x="316.5" y="348" font-size="10" class="grn" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">12 objects</text><rect x="54" y="364" width="304" height="44" rx="8" class="chbg" fill="#eef7f1" stroke="#bcdcc9" stroke-width="1"></rect><circle cx="68" cy="380" r="3" class="dot" fill="#2f9e63"></circle><text x="80" y="383" font-size="12" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Namespace</text><text x="80" y="399" font-size="11.5" class="mut" fill="#6c6c73">alpha-shop-dev, labelled + PSA baseline</text><rect x="54" y="416" width="304" height="44" rx="8" class="chbg" fill="#eef7f1" stroke="#bcdcc9" stroke-width="1"></rect><circle cx="68" cy="432" r="3" class="dot" fill="#2f9e63"></circle><text x="80" y="435" font-size="12" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ResourceQuota · LimitRange</text><text x="80" y="451" font-size="11.5" class="mut" fill="#6c6c73">cost &amp; blast-radius guardrails</text><rect x="54" y="468" width="304" height="44" rx="8" class="chbg" fill="#eef7f1" stroke="#bcdcc9" stroke-width="1"></rect><circle cx="68" cy="484" r="3" class="dot" fill="#2f9e63"></circle><text x="80" y="487" font-size="12" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">NetworkPolicy · CiliumNetworkPolicy</text><text x="80" y="503" font-size="11.5" class="mut" fill="#6c6c73">default-deny · DNS · gateway · IMDS-deny</text><rect x="54" y="520" width="304" height="44" rx="8" class="chbg" fill="#eef7f1" stroke="#bcdcc9" stroke-width="1"></rect><circle cx="68" cy="536" r="3" class="dot" fill="#2f9e63"></circle><text x="80" y="539" font-size="12" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">RoleBinding</text><text x="80" y="555" font-size="11.5" class="mut" fill="#6c6c73">the team’s developers, in this namespace</text><rect x="54" y="572" width="304" height="44" rx="8" class="chbg" fill="#eef7f1" stroke="#bcdcc9" stroke-width="1"></rect><circle cx="68" cy="588" r="3" class="dot" fill="#2f9e63"></circle><text x="80" y="591" font-size="12" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Kyverno ClusterPolicy ×2</text><text x="80" y="607" font-size="11.5" class="mut" fill="#6c6c73">restrict-images · restrict-route-hostnames</text><rect x="388" y="324" width="332" height="150" rx="13" class="panel panelBd" fill="#efeeeb" stroke="#dcdbd6" stroke-width="1"></rect><text x="402" y="348" font-size="12" class="tx" fill="#1c1c22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">AWS · workload account</text><rect x="681.5" y="336" width="24.5" height="18" rx="9" class="badgeBg" fill="#d3ecdd"></rect><text x="693.75" y="348" font-size="10" class="grn" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2</text><rect x="402" y="364" width="304" height="44" rx="8" class="chbg" fill="#eef7f1" stroke="#bcdcc9" stroke-width="1"></rect><circle cx="416" cy="380" r="3" class="dot" fill="#2f9e63"></circle><text x="428" y="383" font-size="12" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">IAM Role</text><text x="428" y="399" font-size="11.5" class="mut" fill="#6c6c73">Pod-alpha-shop-dev-storefront</text><rect x="402" y="416" width="304" height="44" rx="8" class="chbg" fill="#eef7f1" stroke="#bcdcc9" stroke-width="1"></rect><circle cx="416" cy="432" r="3" class="dot" fill="#2f9e63"></circle><text x="428" y="435" font-size="12" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">PodIdentityAssociation</text><text x="428" y="451" font-size="11.5" class="mut" fill="#6c6c73">pod → AWS, no static keys</text><rect x="388" y="488" width="332" height="166" rx="13" class="panel ambd" fill="#efeeeb" stroke="#d8b877" stroke-width="1" stroke-dasharray="4 3"></rect><text x="402" y="512" 