<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" width="760" height="478" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#f4f1ea"]{fill:#473d25}[stroke="#f4f1ea"]{stroke:#473d25}[fill="#d8b877"]{fill:#e1c68e}[stroke="#d8b877"]{stroke:#e1c68e}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#9a6a12"]{fill:#eca82d}[stroke="#9a6a12"]{stroke:#eca82d}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#eef4ef"]{fill:#1a1d1a}[stroke="#eef4ef"]{stroke:#1a1d1a}}</style><rect x="0" y="0" width="760" height="478" rx="0" class="bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">THE ONE IDEA TO LEAVE WITH</text><text x="40" y="92" font-size="28" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">You declare it. A machine keeps it true.</text><text x="40" y="118" font-size="15" class="mut" fill="#6c6c73">The Environment API is a thermostat pointed at infrastructure. You write the state</text><text x="40" y="138" font-size="15" class="mut" fill="#6c6c73">you want — a claim — and a control plane spends its life closing the gap to reality.</text><rect x="40" y="172" width="192" height="128" rx="13" class="blbg" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><rect x="284" y="172" width="192" height="128" rx="13" class="card ambd" fill="#f4f1ea" stroke="#d8b877" stroke-width="1"></rect><rect x="528" y="172" width="192" height="128" rx="13" class="grbg" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="56" y="199" font-size="10" class="blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.6px">THE CLAIM</text><text x="56" y="224" font-size="16" class="tx" fill="#1c1c22" font-weight="600">What you want</text><text x="56" y="247" font-size="12.5" class="mut" fill="#6c6c73">An XEnvironment — team ·</text><text x="56" y="263" font-size="12.5" class="mut" fill="#6c6c73">product · stage. A</text><text x="56" y="279" font-size="12.5" class="mut" fill="#6c6c73">statement in git.</text><text x="300" y="199" font-size="10" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.6px">THE COMPOSITION  ↻</text><text x="300" y="224" font-size="16" class="tx" fill="#1c1c22" font-weight="600">The machine</text><text x="300" y="247" font-size="12.5" class="mut" fill="#6c6c73">One recipe — reads the</text><text x="300" y="263" font-size="12.5" class="mut" fill="#6c6c73">claim and renders the</text><text x="300" y="279" font-size="12.5" class="mut" fill="#6c6c73">whole footprint.</text><text x="544" y="199" font-size="10" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.6px">MANAGED RESOURCES</text><text x="544" y="224" font-size="16" class="tx" fill="#1c1c22" font-weight="600">What&#39;s real</text><text x="544" y="247" font-size="12.5" class="mut" fill="#6c6c73">Namespace, registry,</text><text x="544" y="263" font-size="12.5" class="mut" fill="#6c6c73">IAM role, network rules</text><text x="544" y="279" font-size="12.5" class="mut" fill="#6c6c73">— actually out there.</text><text x="258" y="231" font-size="10" class="mut" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">reads</text><line x1="238" y1="240" x2="272" y2="240" class="line" stroke="#9a9aa1" stroke-width="2"></line><path d="M274 240 L266 235 L266 245 Z" class="lineF" fill="#9a9aa1"></path><text x="502" y="231" font-size="10" class="mut" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">renders</text><line x1="482" y1="240" x2="516" y2="240" class="line" stroke="#9a9aa1" stroke-width="2"></line><path d="M518 240 L510 235 L510 245 Z" class="lineF" fill="#9a9aa1"></path><rect x="40" y="316" width="680" height="78" rx="13" class="panel grbd" fill="#eef4ef" stroke="#a3ccb4" stroke-width="1" stroke-dasharray="4 3"></rect><text x="60" y="368" font-size="26" class="grn" fill="#1f7a49">↻</text><text x="92" y="344" font-size="10.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">THE RECONCILE LOOP · LEVEL-TRIGGERED</text><text x="92" y="366" font-size="14" class="tx" fill="#1c1c22">Every pass compares what’s real against what you declared and closes</text><text x="92" y="384" font-size="14" class="tx" fill="#1c1c22">whatever gap it finds — a manual delete, a crash, quiet drift. It never stops.</text><text x="690" y="352" font-size="9.5" class="mut" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">feeds back</text><line x1="664" y1="366" x2="712" y2="366" class="line" stroke="#9a9aa1" stroke-width="2" stroke-dasharray="4 3"></line><path d="M660 366 L668 361 L668 371 Z" class="lineF" fill="#9a9aa1"></path><text x="40" y="422" font-size="11" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">DELETE THE ECR REPO BY HAND?</text><text x="40" y="443" font-size="13.5" class="mut" fill="#6c6c73">The next reconcile recreates it — you didn’t re-run anything; the loop noticed the room</text><text x="40" y="461" font-size="13.5" class="mut" fill="#6c6c73">went cold. A control plane never stops, where a script runs once and walks away.</text></svg>