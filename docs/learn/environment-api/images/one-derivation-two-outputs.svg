<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" width="760" height="478" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#d3ecdd"]{fill:#255639}[stroke="#d3ecdd"]{stroke:#255639}[fill="#5a9e78"]{fill:#91c2a7}[stroke="#5a9e78"]{stroke:#91c2a7}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#fbf3e6"]{fill:#523c18}[stroke="#fbf3e6"]{stroke:#523c18}[fill="#d8b877"]{fill:#e1c68e}[stroke="#d8b877"]{stroke:#e1c68e}[fill="#9a6a12"]{fill:#eca82d}[stroke="#9a6a12"]{stroke:#eca82d}[fill="#efeeeb"]{fill:#1f1e1c}[stroke="#efeeeb"]{stroke:#1f1e1c}[fill="#dcdbd6"]{fill:#2a2925}[stroke="#dcdbd6"]{stroke:#2a2925}}</style><rect x="0" y="0" width="760" height="520" rx="0" class="bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">THE STATUS WRITE-BACK</text><text x="40" y="92" font-size="28" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">One host list. Two consumers that can’t drift.</text><text x="40" y="118" font-size="15" class="mut" fill="#6c6c73">Near the end of the template, the environment’s allowed hosts are computed once. That</text><text x="40" y="138" font-size="15" class="mut" fill="#6c6c73">single list feeds two outputs in the same pass — the status you read, and the guardrail.</text><rect x="40" y="170" width="300" height="190" rx="13" class="grbg grbd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="58" y="200" font-size="10" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">ONE DERIVATION</text><text x="58" y="226" font-size="16" class="grn" fill="#1f7a49" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">$allowed</text><text x="58" y="250" font-size="13" class="tx" fill="#1c1c22">The host list, built in one pass:</text><rect x="58" y="264" width="264" height="26" rx="6" class="chip" fill="#d3ecdd"></rect><text x="70" y="281" font-size="11" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">&lt;product&gt;-&lt;team&gt;-&lt;stage&gt;.&lt;baseDomain&gt;</text><rect x="58" y="296" width="264" height="26" rx="6" class="chip" fill="#d3ecdd"></rect><text x="70" y="313" font-size="11" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">+ any bound spec.domains</text><line x1="340" y1="236" x2="420" y2="236" class="lineG" stroke="#5a9e78" stroke-width="2"></line><path d="M422 236 L414 231 L414 241 Z" class="lineGF" fill="#5a9e78"></path><line x1="340" y1="236" x2="362" y2="236" class="lineG" stroke="#5a9e78" stroke-width="2"></line><line x1="362" y1="236" x2="362" y2="320" class="lineG" stroke="#5a9e78" stroke-width="2"></line><line x1="362" y1="320" x2="420" y2="320" class="lineG" stroke="#5a9e78" stroke-width="2"></line><path d="M422 320 L414 315 L414 325 Z" class="lineGF" fill="#5a9e78"></path><rect x="426" y="170" width="294" height="86" rx="13" class="blbg" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text x="444" y="196" font-size="10" class="blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">OUTPUT 1 · WHAT YOU READ</text><text x="444" y="216" font-size="14" class="blue" fill="#2f5fd0" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">status.domains</text><text x="444" y="236" font-size="12.5" class="mut" fill="#6c6c73">The hosts reported on the XEnvironment.</text><rect x="426" y="274" width="294" height="86" rx="13" class="ambg" fill="#fbf3e6" stroke="#d8b877" stroke-width="1"></rect><text x="444" y="300" font-size="10" class="amb" fill="#9a6a12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">OUTPUT 2 · THE GUARDRAIL</text><text x="444" y="320" font-size="14" class="amb" fill="#9a6a12" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">restrict-route-hostnames</text><text x="444" y="340" font-size="12.5" class="mut" fill="#6c6c73">The Kyverno allow-list that admits traffic.</text><rect x="40" y="380" width="680" height="64" rx="12" class="panel panelBd" fill="#efeeeb" stroke="#dcdbd6" stroke-width="1"></rect><text x="58" y="412" font-size="12" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">= same $allowed</text><text x="180" y="406" font-size="13" class="tx" fill="#1c1c22">Computed from the same variable, in the same pass — so the status and the</text><text x="180" y="424" font-size="13" class="tx" fill="#1c1c22">guardrail can never disagree. Drift between them isn’t fixed here; it’s made impossible.</text></svg>