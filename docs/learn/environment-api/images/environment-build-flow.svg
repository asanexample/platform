<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" width="760" height="668" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#f0eff1"]{fill:#1c1a1e}[stroke="#f0eff1"]{stroke:#1c1a1e}[fill="#d9d9dd"]{fill:#242429}[stroke="#d9d9dd"]{stroke:#242429}[fill="#dbe6fa"]{fill:#192f57}[stroke="#dbe6fa"]{stroke:#192f57}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#d3ecdd"]{fill:#255639}[stroke="#d3ecdd"]{stroke:#255639}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#d8b877"]{fill:#e1c68e}[stroke="#d8b877"]{stroke:#e1c68e}}</style><rect x="0" y="0" width="760" height="668" rx="0" class="bg" fill="#f6f6f3"></rect><text x="40" y="54" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6px">THE WHOLE FLOW · END TO END</text><text x="40" y="92" font-size="28" class="tx" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">From a pull request to a live footprint</text><text x="40" y="118" font-size="15" class="mut" fill="#6c6c73">Nobody runs kubectl by hand. You edit one file; GitOps delivers it; the Composition</text><text x="40" y="138" font-size="15" class="mut" fill="#6c6c73">builds the footprint — and every piece is watched forever.</text><rect x="40" y="166" width="11" height="11" rx="3" class="blueFill" fill="#2f5fd0"></rect><text x="58" y="176" font-size="11.5" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">git &amp; delivery</text><rect x="176" y="166" width="11" height="11" rx="3" class="grnFill" fill="#1f7a49"></rect><text x="194" y="176" font-size="11.5" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">build &amp; reconcile</text><text x="340" y="176" font-size="15" class="grn" fill="#1f7a49">↻</text><text x="356" y="176" font-size="11.5" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">watched forever</text><rect x="40" y="200" width="680" height="52" rx="12" class="blbg" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><rect x="40" y="212" width="4" height="28" rx="2" class="blueFill" fill="#2f5fd0"></rect><text x="60" y="221" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">01</text><text x="84" y="221" font-size="9.5" class="blue" fill="#2f5fd0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">HUMAN</text><text x="60" y="240" font-size="13" class="blue" fill="#2f5fd0" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">You</text><text x="200" y="231" font-size="15" class="tx" fill="#1c1c22" font-weight="500">Edit dev.yaml, open a PR, merge it</text><text x="536" y="227" font-size="12.5" class="mut" fill="#6c6c73">The only step a human</text><text x="536" y="243" font-size="12.5" class="mut" fill="#6c6c73">does by hand.</text><rect x="40" y="266" width="680" height="52" rx="12" class="card cardBd" fill="#f0eff1" stroke="#d9d9dd" stroke-width="1"></rect><rect x="40" y="278" width="4" height="28" rx="2" class="blueFill" fill="#2f5fd0"></rect><text x="60" y="287" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">02</text><text x="60" y="306" font-size="13" class="blue" fill="#2f5fd0" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">git</text><text x="200" y="297" font-size="15" class="tx" fill="#1c1c22" font-weight="500">The claim is now the source of truth</text><text x="536" y="293" font-size="12.5" class="mut" fill="#6c6c73">One file describes the</text><text x="536" y="309" font-size="12.5" class="mut" fill="#6c6c73">desired footprint.</text><rect x="40" y="332" width="680" height="52" rx="12" class="card cardBd" fill="#f0eff1" stroke="#d9d9dd" stroke-width="1"></rect><rect x="40" y="344" width="4" height="28" rx="2" class="blueFill" fill="#2f5fd0"></rect><text x="60" y="353" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">03</text><text x="60" y="372" font-size="13" class="blue" fill="#2f5fd0" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ArgoCD</text><text x="200" y="363" font-size="15" class="tx" fill="#1c1c22" font-weight="500">Sync the claim onto the preprod cluster</text><rect x="536" y="343" width="64" height="16" rx="5" class="badgeBg" fill="#dbe6fa"></rect><text x="568" y="354" font-size="9" class="blue" fill="#2f5fd0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">COURIER</text><text x="536" y="374" font-size="12" class="mut" fill="#6c6c73">only delivers</text><rect x="40" y="398" width="680" height="52" rx="12" class="card cardBd" fill="#f0eff1" stroke="#d9d9dd" stroke-width="1"></rect><rect x="40" y="410" width="4" height="28" rx="2" class="blueFill" fill="#2f5fd0"></rect><text x="60" y="419" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">04</text><text x="60" y="438" font-size="13" class="blue" fill="#2f5fd0" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">XEnvironment</text><text x="200" y="429" font-size="15" class="tx" fill="#1c1c22" font-weight="500">The claim now exists on the cluster</text><text x="536" y="433" font-size="12.5" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SYNCED ✓  READY ✓</text><rect x="40" y="464" width="680" height="52" rx="12" class="grbg" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><rect x="40" y="476" width="4" height="28" rx="2" class="grnFill" fill="#1f7a49"></rect><text x="60" y="485" font-size="12" class="mut" fill="#6c6c73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">05</text><text x="60" y="504" font-size="13" class="grn" fill="#1f7a49" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Composition</text><text x="200" y="495" font-size="15" class="tx" fill="#1c1c22" font-weight="500">Reconcile the claim into a real footprint</text><rect x="536" y="475" width="60" height="16" rx="5" class="badgeBg" fill="#d3ecdd"></rect><text x="566" y="486" font-size="9" class="grn" fill="#1f7a49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.5px">BUILDER</text><text x="536" y="506" font-size="12" class="mut" fill="#6c6c73">creates it all</text><text x="176" y="353" font-size="13" class="mut" fill="#6c6c73">↻</text><text x="176" y="485" font-size="13" class="grn" fill="#1f7a49">↻</text><line x1="57" y1="252" x2="57" y2="266" class="line" stroke="#9a9aa1" stroke-width="2"></line><line x1="57" y1="318" x2="57" y2="332" class="line" stroke="#9a9aa1" stroke-width="2"></line><line x1="57" y1="384" x2="57" y2="398" class="line" stroke="#9a9aa1" stroke-width="2"></line><line x1="57" y1="450" x2="57" y2="464" class="line" stroke="#a3ccb4" stroke-width="2"></line><text x="380" y="540" font-size="11" class="mut" fill="#6c6c73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.4px">creates &amp; then watches ↻</text><rect x="40" y="552" width="218" height="66" rx="11" class="grbg grbd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="54" y="573" font-size="11" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Cluster objects</text><text x="54" y="591" font-size="12" class="mut" fill="#6c6c73">ns · quota · netpol ·</text><text x="54" y="607" font-size="12" class="mut" fill="#6c6c73">rolebinding · kyverno</text><rect x="270" y="552" width="218" height="66" rx="11" class="grbg grbd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text x="284" y="573" font-size="11" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">AWS · workload acct</text><text x="284" y="591" font-size="12" class="mut" fill="#6c6c73">IAM role + Pod Identity</text><rect x="500" y="552" width="218" height="66" rx="11" class="grbg ambd" fill="#e8f5ee" stroke="#d8b877" stroke-width="1" stroke-dasharray="4 3"></rect><text x="514" y="573" font-size="11" class="grn" fill="#1f7a49" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">AWS · platform acct</text><text x="514" y="591" font-size="12" class="mut" fill="#6c6c73">ECR repo — the one</text><text x="514" y="607" font-size="12" class="mut" fill="#6c6c73">cross-account hop</text><text x="40" y="646" font-size="13.5" class="mut" fill="#6c6c73">ArgoCD delivers · the Composition builds · the loop maintains. Three different jobs</text><text x="40" y="664" font-size="13.5" class="mut" fill="#6c6c73">people often blur into one — keep them apart and the system stops being mysterious.</text></svg>