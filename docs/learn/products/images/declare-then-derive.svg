<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" width="760" height="426" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#dbe6fa"]{fill:#192f57}[stroke="#dbe6fa"]{stroke:#192f57}[fill="#8fb0ee"]{fill:#80a7ef}[stroke="#8fb0ee"]{stroke:#80a7ef}[fill="#d3ecdd"]{fill:#255639}[stroke="#d3ecdd"]{stroke:#255639}[fill="#7bbd97"]{fill:#9fd1b4}[stroke="#7bbd97"]{stroke:#9fd1b4}}</style><style>@media(prefers-color-scheme:dark){.f_bg{fill:#15161c}.f_blueBg{fill:#172a50}.f_greenBg{fill:#16331f}.f_blueHl{fill:#16243f}.f_greenHl{fill:#102a1c}.s_blueBd{stroke:#40639e}.s_greenBd{stroke:#2f6a45}.s_blueHlBd{stroke:#5a7fc0}.s_greenHlBd{stroke:#3f8a5c}.s_narrow{stroke:#33343c}.f_narrow{stroke:#33343c}.f_text{fill:#e6e6ea}.f_muted{fill:#9a9aa3}.f_blue{fill:#7fa0ee}.f_green{fill:#4fd08a}}</style><rect class="f_bg" x="0" y="0" width="760" height="426" fill="#f6f6f3"></rect><text class="mono f_muted" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.6px"><tspan x="40">THE PLATFORM’S SIGNATURE MOVE</tspan></text><text class="f_text" x="40" y="92" font-size="28" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px"><tspan x="40">Declare once, then derive</tspan></text><text class="f_muted" x="40" y="118" font-size="15" fill="#6c6c73"><tspan x="40">Onboarding a Product isn’t a special case — it’s one instance of the shape the whole</tspan><tspan x="40" dy="20">platform runs on. A small governed declaration in git; deterministic code projects it out.</tspan></text><text class="mono f_blue" x="167.5" y="168" font-size="10.5" fill="#2f5fd0" letter-spacing="0.04em" text-anchor="middle"><tspan x="167.5">YOU DECLARE (in git)</tspan></text><text class="mono f_muted" x="380" y="168" font-size="10.5" fill="#6c6c73" letter-spacing="0.04em" text-anchor="middle"><tspan x="380">DERIVE</tspan></text><text class="mono f_green" x="590" y="168" font-size="10.5" fill="#1f7a49" letter-spacing="0.04em" text-anchor="middle"><tspan x="590">THE PLATFORM PROJECTS</tspan></text><rect x="40" y="184" width="255" height="58" rx="11" class="f_blueBg s_blueBd" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text class="mono f_blue" x="56" y="208" font-size="10" fill="#2f5fd0"><tspan x="56">Identity</tspan></text><text class="f_text" x="56" y="227" font-size="13.5" fill="#1c1c22" font-weight="500"><tspan x="56">people &amp; roles</tspan></text><text class="f_muted" x="380" y="206" font-size="15" fill="#6c6c73" text-anchor="middle"><tspan x="380">↻</tspan></text><line class="s_narrow" x1="324" y1="219" x2="428" y2="219" stroke="#9a9aa1" stroke-width="2"></line><path class="f_narrow" fill="#9a9aa1" d="M436 219 L428 214 L428 224 Z"></path><rect x="460" y="184" width="260" height="58" rx="11" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text class="mono f_green" x="476" y="208" font-size="10" fill="#1f7a49"><tspan x="476">access</tspan></text><text class="f_text" x="476" y="227" font-size="13.5" fill="#1c1c22" font-weight="500"><tspan x="476">into every system</tspan></text><rect x="40" y="254" width="255" height="58" rx="11" class="f_blueBg s_blueBd" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text class="mono f_blue" x="56" y="278" font-size="10" fill="#2f5fd0"><tspan x="56">Self-service</tspan></text><text class="f_text" x="56" y="297" font-size="13.5" fill="#1c1c22" font-weight="500"><tspan x="56">abstract intent</tspan></text><text class="f_muted" x="380" y="276" font-size="15" fill="#6c6c73" text-anchor="middle"><tspan x="380">↻</tspan></text><line class="s_narrow" x1="324" y1="289" x2="428" y2="289" stroke="#9a9aa1" stroke-width="2"></line><path class="f_narrow" fill="#9a9aa1" d="M436 289 L428 284 L428 294 Z"></path><rect x="460" y="254" width="260" height="58" rx="11" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text class="mono f_green" x="476" y="278" font-size="10" fill="#1f7a49"><tspan x="476">least-privilege</tspan></text><text class="f_text" x="476" y="297" font-size="13.5" fill="#1c1c22" font-weight="500"><tspan x="476">IAM, scoped</tspan></text><rect x="40" y="324" width="255" height="58" rx="11" class="f_blueHl s_blueHlBd" fill="#dbe6fa" stroke="#8fb0ee" stroke-width="1"></rect><text class="mono f_blue" x="56" y="348" font-size="10" fill="#2f5fd0"><tspan x="56">Product · this module</tspan></text><text class="f_text" x="56" y="367" font-size="13.5" fill="#1c1c22" font-weight="600"><tspan x="56">a Product record</tspan></text><text class="f_blue" x="380" y="346" font-size="15" fill="#2f5fd0" text-anchor="middle"><tspan x="380">↻</tspan></text><line class="s_narrow" x1="324" y1="359" x2="428" y2="359" stroke="#9a9aa1" stroke-width="2"></line><path class="f_narrow" fill="#9a9aa1" d="M436 359 L428 354 L428 364 Z"></path><rect x="460" y="324" width="260" height="58" rx="11" class="f_greenHl s_greenHlBd" fill="#d3ecdd" stroke="#7bbd97" stroke-width="1"></rect><text class="mono f_green" x="476" y="348" font-size="10" fill="#1f7a49"><tspan x="476">its per-product footprint</tspan></text><text class="f_text" x="476" y="367" font-size="13.5" fill="#1c1c22" font-weight="600"><tspan x="476">push role · policies · delivery</tspan></text><text class="f_muted" x="40" y="400" font-size="13" fill="#6c6c73"><tspan x="40">Same shape every time: one place to be right, and being right there makes everything downstream</tspan><tspan x="40" dy="18">right — re-derived on every change, so nothing drifts. <tspan class="f_text" fill="#1c1c22">Learn it once; every subsystem is less surprising.</tspan></tspan></text></svg>