<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 632" width="760" height="632" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#9fbaf0"]{fill:#81a5ee}[stroke="#9fbaf0"]{stroke:#81a5ee}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#f4f4f0"]{fill:#1d1d19}[stroke="#f4f4f0"]{stroke:#1d1d19}[fill="#e0e0da"]{fill:#282823}[stroke="#e0e0da"]{stroke:#282823}[fill="#dbe6fa"]{fill:#192f57}[stroke="#dbe6fa"]{stroke:#192f57}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}[fill="#f7efdc"]{fill:#584519}[stroke="#f7efdc"]{stroke:#584519}[fill="#e0be7e"]{fill:#e6c68a}[stroke="#e0be7e"]{stroke:#e6c68a}}</style><style>@media(prefers-color-scheme:dark){.f_bg{fill:#15161c}.f_blueBg{fill:#172a50}.f_greenBg{fill:#16331f}.f_ambBg{fill:#2b2410}.f_codeBg{fill:#0e0f14}.f_hl{fill:#16243f}.s_blueBd{stroke:#40639e}.s_greenBd{stroke:#2f6a45}.s_ambBd{stroke:#6b5520}.s_codeBd{stroke:#2a2b33}.s_narrow{stroke:#33343c}.f_narrow{stroke:#33343c}.f_text{fill:#e6e6ea}.f_muted{fill:#9a9aa3}.f_dim{fill:#74747d}.f_blue{fill:#7fa0ee}.f_green{fill:#4fd08a}.f_amber{fill:#e0b050}}</style><rect class="f_bg" x="0" y="0" width="760" height="632" fill="#f6f6f3"></rect><text class="mono f_muted" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.6px" xml:space="preserve"><tspan x="40">ONBOARD A PRODUCT · THE DERIVATION</tspan></text><text class="f_text" x="40" y="92" font-size="27" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px" xml:space="preserve"><tspan x="40">One file. The platform derives the rest.</tspan></text><text class="f_muted" x="40" y="118" font-size="15" fill="#6c6c73" xml:space="preserve"><tspan x="40">You author one small Product file and open a PR. You provision none of the infrastructure</tspan><tspan x="40" dy="20">by hand — merge reconciles it into being.</tspan></text><rect x="40" y="158" width="680" height="154" rx="13" class="f_blueBg s_blueBd" fill="#eaf0fc" stroke="#9fbaf0" stroke-width="1"></rect><text class="mono f_blue" x="60" y="184" font-size="12.5" fill="#2f5fd0" font-weight="600" xml:space="preserve"><tspan x="60">gitops/products/alpha/checkout.yaml</tspan></text><text class="f_muted" x="330" y="184" font-size="12" fill="#6c6c73" xml:space="preserve"><tspan x="330">the one file you write</tspan></text><rect x="60" y="196" width="600" height="112" rx="8" class="f_codeBg s_codeBd" fill="#f4f4f0" stroke="#e0e0da" stroke-width="1"></rect><text class="mono f_text" x="76" y="218" font-size="12.5" fill="#1c1c22" xml:space="preserve"><tspan x="76">kind: Product</tspan></text><text class="mono f_text" x="76" y="235" font-size="12.5" fill="#1c1c22" xml:space="preserve"><tspan x="76">metadata: { name: alpha-checkout }</tspan></text><text class="mono f_text" x="76" y="252" font-size="12.5" fill="#1c1c22" xml:space="preserve"><tspan x="76">spec:</tspan></text><text class="mono f_text" x="76" y="269" font-size="12.5" fill="#1c1c22" xml:space="preserve"><tspan x="76">  team: alpha</tspan></text><rect x="68" y="273" width="584" height="19" rx="4" class="f_hl" fill="#dbe6fa"></rect><text class="mono f_blue" x="76" y="286" font-size="12.5" fill="#2f5fd0" font-weight="500" xml:space="preserve"><tspan x="76">  repo: asanexample/alpha-checkout   # the trust anchor</tspan></text><text class="mono f_text" x="76" y="303" font-size="12.5" fill="#1c1c22" xml:space="preserve"><tspan x="76">  tenancy: pooled</tspan></text><line class="s_narrow" x1="200" y1="314" x2="200" y2="330" stroke="#9a9aa1" stroke-width="2"></line><path class="f_narrow" fill="#9a9aa1" d="M200 338 L194 330 L206 330 Z"></path><text class="mono f_muted" x="218" y="332" font-size="11" fill="#6c6c73">merge fires <tspan class="f_amber" fill="#8a6410">registry-reconcile</tspan> — a privileged apply, not you</text><text class="mono f_green" x="40" y="356" font-size="11" fill="#1f7a49" letter-spacing="0.05em" xml:space="preserve"><tspan x="40">▸ DERIVED AUTOMATICALLY — four units, from that one file</tspan></text><rect x="40" y="368" width="335" height="64" rx="11" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text class="mono f_green" x="56" y="392" font-size="13" fill="#1f7a49" font-weight="500" xml:space="preserve"><tspan x="56">CI push role</tspan></text><text class="f_text" x="56" y="410" font-size="12" fill="#1c1c22" xml:space="preserve"><tspan x="56">keyless (GitHub OIDC), federated</tspan></text><text class="f_text" x="56" y="424" font-size="12" fill="#1c1c22" xml:space="preserve"><tspan x="56">to spec.repo — no stored keys</tspan></text><rect x="385" y="368" width="335" height="64" rx="11" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text class="mono f_green" x="401" y="392" font-size="13" fill="#1f7a49" font-weight="500" xml:space="preserve"><tspan x="401">Kyverno policies</tspan></text><text class="f_text" x="401" y="410" font-size="12" fill="#1c1c22" xml:space="preserve"><tspan x="401">verify-images / verify-attestations</tspan></text><text class="f_text" x="401" y="424" font-size="12" fill="#1c1c22" xml:space="preserve"><tspan x="401">for this product</tspan></text><rect x="40" y="442" width="335" height="64" rx="11" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text class="mono f_green" x="56" y="466" font-size="13" fill="#1f7a49" font-weight="500" xml:space="preserve"><tspan x="56">ArgoCD delivery</tspan></text><text class="f_text" x="56" y="484" font-size="12" fill="#1c1c22" xml:space="preserve"><tspan x="56">one AppProject + ApplicationSet,</tspan></text><text class="f_text" x="56" y="498" font-size="12" fill="#1c1c22" xml:space="preserve"><tspan x="56">ready to deliver Environments</tspan></text><rect x="385" y="442" width="335" height="64" rx="11" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a3ccb4" stroke-width="1"></rect><text class="mono f_green" x="401" y="466" font-size="13" fill="#1f7a49" font-weight="500" xml:space="preserve"><tspan x="401">github-teams grant</tspan></text><text class="f_text" x="401" y="484" font-size="12" fill="#1c1c22" xml:space="preserve"><tspan x="401">owning org-team’s push on the</tspan></text><text class="f_text" x="401" y="498" font-size="12" fill="#1c1c22" xml:space="preserve"><tspan x="401">team-product repo</tspan></text><rect x="40" y="520" width="680" height="54" rx="11" class="f_ambBg s_ambBd" fill="#f7efdc" stroke="#e0be7e" stroke-width="1" stroke-dasharray="6 5"></rect><rect x="58" y="536" width="127.6" height="22" rx="11" class="s_ambBd" fill="none" stroke="#e0be7e" stroke-width="1"></rect><text class="mono f_amber" x="121.8" y="551" font-size="11" fill="#8a6410" text-anchor="middle" xml:space="preserve"><tspan x="121.8">NOT here — later</tspan></text><text class="f_text" x="201.6" y="543" font-size="12.5" fill="#1c1c22"><tspan x="201.6">Per-service ECR repositories are provisioned by Crossplane when you claim an</tspan><tspan x="201.6" dy="16">Environment — not by registry-reconcile.</tspan></text><text class="f_muted" x="40" y="608" font-size="13" fill="#6c6c73"><tspan x="40"><tspan class="f_dim mono" fill="#9a9aa1">ONE RULE · </tspan>never hand-create the derived units. If one is wrong, fix spec.repo and re-reconcile —</tspan><tspan x="40" dy="18">patching derived IAM or policy directly just drifts and gets overwritten.</tspan></text></svg>