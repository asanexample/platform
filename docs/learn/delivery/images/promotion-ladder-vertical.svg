<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 954" width="760" height="954" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}[fill="#efefea"]{fill:#1f1f1c}[stroke="#efefea"]{stroke:#1f1f1c}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#c7c7c1"]{fill:#34342f}[stroke="#c7c7c1"]{stroke:#34342f}[fill="#fdf3e2"]{fill:#533d18}[stroke="#fdf3e2"]{stroke:#533d18}[fill="#e0be7e"]{fill:#e6c68a}[stroke="#e0be7e"]{stroke:#e6c68a}[fill="#ffffff"]{fill:#141414}[stroke="#ffffff"]{stroke:#141414}[fill="#a9d3ba"]{fill:#9fd0b3}[stroke="#a9d3ba"]{stroke:#9fd0b3}[fill="#eef3fd"]{fill:#17294f}[stroke="#eef3fd"]{stroke:#17294f}[fill="#b3c2ec"]{fill:#1f346c}[stroke="#b3c2ec"]{stroke:#1f346c}[fill="#c9992e"]{fill:#e2bf71}[stroke="#c9992e"]{stroke:#e2bf71}[fill="#fbf0d8"]{fill:#584419}[stroke="#fbf0d8"]{stroke:#584419}[fill="#7a5410"]{fill:#e9a630}[stroke="#7a5410"]{stroke:#e9a630}[fill="#3f9d6b"]{fill:#6fc899}[stroke="#3f9d6b"]{stroke:#6fc899}}</style><rect class="bg" x="0" y="0" width="760" height="954" fill="#f6f6f3"></rect><text class="muted mono" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.6px"><tspan x="40">PROMOTION &amp; RELEASE · THE LADDER</tspan></text><text class="text" x="40" y="92" font-size="28" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px"><tspan x="40">One digest earns its way to prod</tspan></text><text class="muted" x="40" y="120" font-size="15" fill="#6c6c73"><tspan x="40">The <tspan class="text" fill="#1c1c22" font-weight="600">same</tspan> signed digest climbs rung by rung. Every hop up to staging is</tspan><tspan x="40" dy="20">automatic once health checks pass — only the last hop, into prod,</tspan><tspan x="40" dy="20">waits for a human to sign off.</tspan></text><rect x="40" y="186" width="12" height="12" rx="3" class="c-green" fill="#1f7a49"></rect><text class="muted mono" x="60" y="196" font-size="12" fill="#6c6c73"><tspan x="60">auto — health check is the examiner</tspan></text><rect x="340" y="186" width="12" height="12" rx="3" class="c-amber" fill="#8a6410"></rect><text class="muted mono" x="360" y="196" font-size="12" fill="#6c6c73"><tspan x="360">gated — a person is the examiner</tspan></text><rect x="40" y="226" width="104" height="572" rx="14" class="railbg brd" fill="#efefea" stroke="#e4e4df" stroke-width="1"></rect><line class="railLine" x1="92" y1="244" x2="92" y2="780" stroke="undefined" stroke-width="2" stroke-dasharray="4 4"></line><rect x="48" y="460" width="88" height="104" rx="8" class="railbg" fill="#efefea"></rect><text class="dim mono" x="92" y="478" font-size="9.5" fill="#9a9aa1" letter-spacing="0.12em" text-anchor="middle"><tspan x="92">ONE SIGNED</tspan><tspan x="92" dy="12">DIGEST</tspan></text><text class="c-blue mono" x="92" y="510" font-size="12" fill="#2f5fd0" text-anchor="middle"><tspan x="92">sha256:</tspan><tspan x="92" dy="14">f6b37d…</tspan></text><text class="muted" x="92" y="542" font-size="11" fill="#6c6c73" text-anchor="middle"><tspan x="92">never rebuilt</tspan><tspan x="92" dy="13">between stages</tspan></text><line class="tie" x1="144" y1="261" x2="170" y2="261" stroke="#c7c7c1" stroke-width="1.5" stroke-dasharray="3 3"></line><rect x="170" y="226" width="550" height="70" rx="12" class="cardProd cardProdBd" fill="#fdf3e2" stroke="#e0be7e" stroke-width="1"></rect><rect x="170" y="234" width="3" height="54" rx="1.5" class="c-amber" fill="#8a6410"></rect><text class="dim mono" x="188" y="252" font-size="11" fill="#9a9aa1"><tspan x="188">rung 5</tspan></text><text class="c-amber mono" x="188" y="278" font-size="22" fill="#8a6410" font-weight="500"><tspan x="188">prod</tspan></text><text class="text" x="288" y="257" font-size="14.5" fill="#1c1c22"><tspan x="288">Real users. The last performance —</tspan><tspan x="288" dy="18">never the rehearsal.</tspan></text><rect x="588.2" y="248" width="115.8" height="26" rx="13" class="chipAmberBd" fill="none" stroke="#e0be7e" stroke-width="1"></rect><text class="c-amber mono" x="646.1" y="265" font-size="11" fill="#8a6410" text-anchor="middle"><tspan x="646.1">human-approved</tspan></text><line class="tie" x1="144" y1="397" x2="170" y2="397" stroke="#c7c7c1" stroke-width="1.5" stroke-dasharray="3 3"></line><rect x="170" y="362" width="550" height="70" rx="12" class="card brd" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="170" y="370" width="3" height="54" rx="1.5" class="c-blue" fill="#2f5fd0"></rect><text class="dim mono" x="188" y="388" font-size="11" fill="#9a9aa1"><tspan x="188">rung 4</tspan></text><text class="c-blue mono" x="188" y="414" font-size="22" fill="#2f5fd0" font-weight="500"><tspan x="188">staging</tspan></text><text class="text" x="288" y="402" font-size="14.5" fill="#1c1c22"><tspan x="288">A prod-like dress rehearsal.</tspan></text><rect x="594.9" y="384" width="109.10000000000001" height="26" rx="13" class="chipGreenBd" fill="none" stroke="#a9d3ba" stroke-width="1"></rect><text class="c-green mono" x="649.4499999999999" y="401" font-size="11" fill="#1f7a49" text-anchor="middle"><tspan x="649.4499999999999">auto-promoted</tspan></text><line class="tie" x1="144" y1="519" x2="170" y2="519" stroke="#c7c7c1" stroke-width="1.5" stroke-dasharray="3 3"></line><rect x="170" y="484" width="550" height="70" rx="12" class="card brd" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="170" y="492" width="3" height="54" rx="1.5" class="c-blue" fill="#2f5fd0"></rect><text class="dim mono" x="188" y="510" font-size="11" fill="#9a9aa1"><tspan x="188">rung 3</tspan></text><text class="c-blue mono" x="188" y="536" font-size="22" fill="#2f5fd0" font-weight="500"><tspan x="188">uat</tspan></text><text class="text" x="288" y="524" font-size="14.5" fill="#1c1c22"><tspan x="288">User-acceptance checks.</tspan></text><rect x="594.9" y="506" width="109.10000000000001" height="26" rx="13" class="chipGreenBd" fill="none" stroke="#a9d3ba" stroke-width="1"></rect><text class="c-green mono" x="649.4499999999999" y="523" font-size="11" fill="#1f7a49" text-anchor="middle"><tspan x="649.4499999999999">auto-promoted</tspan></text><line class="tie" x1="144" y1="641" x2="170" y2="641" stroke="#c7c7c1" stroke-width="1.5" stroke-dasharray="3 3"></line><rect x="170" y="606" width="550" height="70" rx="12" class="card brd" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="170" y="614" width="3" height="54" rx="1.5" class="c-blue" fill="#2f5fd0"></rect><text class="dim mono" x="188" y="632" font-size="11" fill="#9a9aa1"><tspan x="188">rung 2</tspan></text><text class="c-blue mono" x="188" y="658" font-size="22" fill="#2f5fd0" font-weight="500"><tspan x="188">test</tspan></text><text class="text" x="288" y="646" font-size="14.5" fill="#1c1c22"><tspan x="288">Automated test suite runs here.</tspan></text><rect x="594.9" y="628" width="109.10000000000001" height="26" rx="13" class="chipGreenBd" fill="none" stroke="#a9d3ba" stroke-width="1"></rect><text class="c-green mono" x="649.4499999999999" y="645" font-size="11" fill="#1f7a49" text-anchor="middle"><tspan x="649.4499999999999">auto-promoted</tspan></text><line class="tie" x1="144" y1="763" x2="170" y2="763" stroke="#c7c7c1" stroke-width="1.5" stroke-dasharray="3 3"></line><rect x="170" y="728" width="550" height="70" rx="12" class="cardDev cardDevBd" fill="#eef3fd" stroke="#b3c2ec" stroke-width="1"></rect><rect x="170" y="736" width="3" height="54" rx="1.5" class="c-blue" fill="#2f5fd0"></rect><text class="dim mono" x="188" y="754" font-size="11" fill="#9a9aa1"><tspan x="188">rung 1 · base</tspan></text><text class="c-blue mono" x="188" y="780" font-size="22" fill="#2f5fd0" font-weight="500"><tspan x="188">dev</tspan></text><text class="text" x="288" y="759" font-size="14.5" fill="#1c1c22"><tspan x="288">Where your merged change lands</tspan><tspan x="288" dy="18">first — on the preprod cluster.</tspan></text><rect x="615" y="750" width="89" height="26" rx="13" class="chipBlueBd" fill="none" stroke="#b3c2ec" stroke-width="1"></rect><text class="c-blue mono" x="659.5" y="767" font-size="11" fill="#2f5fd0" text-anchor="middle"><tspan x="659.5">you merged</tspan></text><line class="lineGate" x1="210" y1="356" x2="210" y2="310" stroke="#c9992e" stroke-width="2"></line><path class="arrowGate" fill="#c9992e" d="M210 302 L204 312 L216 312 Z"></path><rect x="230" y="314" width="330.4" height="30" rx="8" class="pillGateBg pillGateBd" fill="#fbf0d8" stroke="#e0be7e" stroke-width="1"></rect><text class="pillGateTxt mono" x="395.2" y="333" font-size="12" fill="#7a5410" font-weight="500" text-anchor="middle"><tspan x="395.2">GATED · a human release-approver signs off</tspan></text><line class="lineAuto" x1="210" y1="478" x2="210" y2="446" stroke="#3f9d6b" stroke-width="2" stroke-dasharray="4 4"></line><path class="arrowAuto" fill="#3f9d6b" d="M210 438 L204 448 L216 448 Z"></path><rect x="230" y="445" width="193" height="26" rx="8" class="pillAutoBd" fill="none" stroke="#a9d3ba" stroke-width="1"></rect><text class="pillAutoTxt mono" x="326.5" y="462" font-size="11" fill="#1f7a49" text-anchor="middle"><tspan x="326.5">auto · health checks pass</tspan></text><line class="lineAuto" x1="210" y1="600" x2="210" y2="568" stroke="#3f9d6b" stroke-width="2" stroke-dasharray="4 4"></line><path class="arrowAuto" fill="#3f9d6b" d="M210 560 L204 570 L216 570 Z"></path><rect x="230" y="567" width="193" height="26" rx="8" class="pillAutoBd" fill="none" stroke="#a9d3ba" stroke-width="1"></rect><text class="pillAutoTxt mono" x="326.5" y="584" font-size="11" fill="#1f7a49" text-anchor="middle"><tspan x="326.5">auto · health checks pass</tspan></text><line class="lineAuto" x1="210" y1="722" x2="210" y2="690" stroke="#3f9d6b" stroke-width="2" stroke-dasharray="4 4"></line><path class="arrowAuto" fill="#3f9d6b" d="M210 682 L204 692 L216 692 Z"></path><rect x="230" y="689" width="193" height="26" rx="8" class="pillAutoBd" fill="none" stroke="#a9d3ba" stroke-width="1"></rect><text class="pillAutoTxt mono" x="326.5" y="706" font-size="11" fill="#1f7a49" text-anchor="middle"><tspan x="326.5">auto · health checks pass</tspan></text><rect x="40" y="824" width="680" height="104" rx="12" class="card brd" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="40" y="832" width="3" height="88" rx="1.5" class="c-amber" fill="#8a6410"></rect><text class="muted mono" x="62" y="852" font-size="11" fill="#6c6c73" letter-spacing="0.1em"><tspan x="62">LIKE BELT PROMOTIONS IN A MARTIAL ART</tspan></text><text class="text" x="62" y="876" font-size="14" fill="#1c1c22"><tspan x="62">You earn each rank by demonstrating you&#39;re ready, and the final rank has a human examiner</tspan><tspan x="62" dy="20">watching. The image earns its way to prod by running cleanly at every lower rung first — so</tspan><tspan x="62" dy="20">prod is never where a change is tried for the first time.</tspan></text></svg>