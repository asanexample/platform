<rect class="bg" x="0" y="0" width="760" height="552" fill="#f6f6f3"></rect>
<text class="muted mono" x="40" y="52" font-size="12" fill="#6c6c73" letter-spacing="1.8px">OBSERVABILITY · STORAGE · THE REPEATING SHAPE</text>
<text class="text" x="40" y="89" font-size="26" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">The database is cattle. S3 is the herd.</text>
<text class="muted" x="40" y="117" font-size="14.5" fill="#6c6c73">Every store has the same body — a tiny hot working set on disk you can lose, in front of a big cheap</text>
<text class="muted" x="40" y="136" font-size="14.5" fill="#6c6c73">durable tail on your own S3.</text>
<rect x="40" y="190" width="158" height="72" rx="10" fill="#eaf1fb" stroke="#c4d8f4" stroke-width="1"></rect>
<text class="mono" x="56" y="210" font-size="12" fill="#2c66c4" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">Prometheus</text>
<text class="muted" x="56" y="228" font-size="11" fill="#4a5a73">15d scraper. Lose it,</text>
<text class="muted" x="56" y="243" font-size="11" fill="#4a5a73">rebuild it — history is</text>
<text class="muted" x="56" y="258" font-size="11" fill="#4a5a73">safe in S3.</text>
<text class="mono" x="40" y="284" font-size="9.5" fill="#3d6fc0" font-family="ui-monospace,Menlo,Consolas,monospace">remote_write</text>
<line x1="120" y1="290" x2="192" y2="290" stroke="#7a9fd0" stroke-width="2"></line>
<path d="M192 290 L184 286 L184 294 Z" fill="#7a9fd0"></path>
<text class="muted" x="40" y="304" font-size="10" fill="#8a8a91">every sample → the hot buffer</text>
<rect x="218" y="180" width="502" height="222" rx="14" fill="#eeeeea" stroke="#d2d2cb" stroke-width="1.5"></rect>
<text class="text" x="236" y="204" font-size="14" fill="#1c1c22" font-weight="600">Mimir <tspan class="mono" font-size="11" font-weight="400" fill="#8a8a91" font-family="ui-monospace,Menlo,Consolas,monospace">· cross-section</tspan></text>
<text class="mono" x="236" y="226" font-size="10" fill="#3d6fc0" font-family="ui-monospace,Menlo,Consolas,monospace">HOT · gp3, disposable <tspan fill="#8a8a91">— wipe = lose ~15m recent, not history</tspan></text>
<rect x="236" y="236" width="146" height="40" rx="8" fill="#dce8fa" stroke="#9fbce8" stroke-width="1"></rect>
