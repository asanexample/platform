<text class="muted" x="150" y="458" font-size="11" fill="#3a5560">same disposable-hot / durable-S3 body</text>
<text class="muted" x="40" y="504" font-size="13.5" fill="#6c6c73">Own the generator, not the meter: cheap S3 + compute you already run, data never leaves your account.</text>
