<text class="text" x="58" y="440" font-size="13.5" fill="#0f6f8e" font-weight="600">One rule, N tenants</text>
<text class="muted" x="58" y="458" font-size="12" fill="#3a5560">Add a tenant — the whole web wires itself. The</text>
<text class="muted" x="58" y="474" font-size="12" fill="#3a5560">jumps stay <tspan fill="#0a2831" font-style="italic">inside</tspan> a column; a tenant links only</text>
<text class="muted" x="58" y="490" font-size="12" fill="#3a5560">to its own stores.</text>
