<rect x="387.3" y="419.3" width="331.5" height="73.5" rx="9.8" fill="none" stroke="#c0392b" stroke-width="2.5" clip-path="url(#abar1)"></rect>
<text class="text" x="404" y="440" font-size="13.5" fill="#a5342a" font-weight="600">Off-convention → nowhere</text>
<rect x="404" y="450" width="118" height="18" rx="5" fill="#efe6e4"></rect>
<text class="mono" x="463" y="463" font-size="10" fill="#8a8a8f" text-anchor="middle" text-decoration="line-through" font-family="ui-monospace,Menlo,Consolas,monospace">mimir-team-typo</text>
<text x="532" y="464" font-size="13" fill="#a05545">→</text>
<text x="552" y="465" font-size="13" fill="#c0392b">✗</text>
<text class="muted" x="404" y="486" font-size="12" fill="#6a4a44">links nowhere, <tspan fill="#7a2018" font-style="italic">silently</tspan>.</text>
<text class="muted" x="40" y="520" font-size="13.5" fill="#6c6c73">No file names both sides of a jump. The UID naming scheme is the only thing holding the web together.</text>
