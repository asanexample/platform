<text class="muted mono" x="40" y="52" font-size="12" fill="#6c6c73" letter-spacing="1.8px">OBSERVABILITY · CORRELATION · THE WIRING</text>
<text class="text" x="40" y="89" font-size="26" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">The convention <tspan fill="#1f8fb0" font-style="italic">is</tspan> the contract.</text>
<text class="muted" x="40" y="117" font-size="14.5" fill="#6c6c73">Every jump between stores is one rule — <tspan class="mono" fill="#0f7f9e" font-family="ui-monospace,Menlo,Consolas,monospace">replace(uid, &#34;mimir&#34;, &#34;tempo&#34;)</tspan> — not a</text>
<text class="muted" x="40" y="136" font-size="14.5" fill="#6c6c73">hard-coded target. Write it once; it wires every tenant for free.</text>
