<text x="40" y="378" font-size="10.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#9a6a0a">tempo→loki:</tspan><tspan fill="#5f5f66"> tracesToLogsV2</tspan></text>
