<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 606" width="760" height="606" style="color-scheme:light dark" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="760" height="606" fill="light-dark(#f6f6f3,#1c1e26)"></rect>
<text x="40" y="52" font-size="12" fill="light-dark(#6c6c73,#a6a6ad)" letter-spacing="1.8px" font-family="ui-monospace,Menlo,Consolas,monospace">OBSERVABILITY · TENANCY · PER-TEAM ISOLATION</text>
<text x="40" y="89" font-size="26" fill="light-dark(#1c1c22,#e9e9ee)" font-weight="600" letter-spacing="-0.3px">Hard write-split, soft read scoping.</text>
<text x="40" y="117" font-size="14.5" fill="light-dark(#6c6c73,#a6a6ad)">Per-team isolation is layered: writes are physically split into real per-team tenants; reads are scoped</text>
<text x="40" y="136" font-size="14.5" fill="light-dark(#6c6c73,#a6a6ad)">organizationally; the network underneath is the only hard data-plane boundary.</text>

<rect x="40" y="158" width="680" height="120" rx="12" fill="light-dark(#f9f0da,#2a2416)" stroke="light-dark(#e0b84a,#6a5a2a)" stroke-width="1.3" stroke-dasharray="6 4"></rect>
<rect x="58" y="172" width="94" height="20" rx="5" fill="#e0a52a"></rect>
<text x="105" y="186" font-size="9.5" fill="#4a3208" text-anchor="middle" letter-spacing="0.4px" font-family="ui-monospace,Menlo,Consolas,monospace">READ PLANE</text>
<text x="162" y="187" font-size="14" fill="light-dark(#1c1c22,#e9e9ee)" font-weight="600">soft — RBAC / organizational boundary</text>
<text x="702" y="186" font-size="10" fill="light-dark(#8a6410,#e6c46a)" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">dashed = not a data-plane gate</text>
<rect x="58" y="204" width="128" height="40" rx="8" fill="light-dark(#f4ead0,#332c18)" stroke="light-dark(#e0cd9c,#5a4c28)" stroke-width="1"></rect>
<text x="72" y="221" font-size="11" fill="light-dark(#8a6410,#e6c46a)" font-family="ui-monospace,Menlo,Consolas,monospace">Mimir (alpha)</text>
<text x="72" y="236" font-size="9.5" fill="light-dark(#9a8a5a,#b0a06a)" font-family="ui-monospace,Menlo,Consolas,monospace">static X-Scope-OrgID</text>
<rect x="194" y="204" width="128" height="40" rx="8" fill="light-dark(#f4ead0,#332c18)" stroke="light-dark(#e0cd9c,#5a4c28)" stroke-width="1"></rect>
<text x="208" y="221" font-size="11" fill="light-dark(#8a6410,#e6c46a)" font-family="ui-monospace,Menlo,Consolas,monospace">Mimir (bravo)</text>
<text x="208" y="236" font-size="9.5" fill="light-dark(#9a8a5a,#b0a06a)" font-family="ui-monospace,Menlo,Consolas,monospace">static X-Scope-OrgID</text>
<text x="340" y="214" font-size="12.5" fill="light-dark(#4a3c1c,#d8c48a)">Isolation = Grafana <tspan font-weight="600">folder permissions</tspan> +</text>
<text x="340" y="231" font-size="12.5" fill="light-dark(#4a3c1c,#d8c48a)">namespace-filtered per-team dashboards.</text>
<text x="58" y="264" font-size="11.5" fill="light-dark(#7a6a4f,#c9b985)">RBAC / organizational boundary — <tspan font-weight="600">not</tspan> a data-plane gate.</text>

<rect x="40" y="292" width="680" height="164" rx="12" fill="light-dark(#e7f4ec,#1e2a22)" stroke="light-dark(#7cc79b,#3f8a63)" stroke-width="1.5"></rect>
<rect x="58" y="306" width="100" height="20" rx="5" fill="#1f8a5b"></rect>
<text x="108" y="320" font-size="9.5" fill="#eafcf1" text-anchor="middle" letter-spacing="0.4px" font-family="ui-monospace,Menlo,Consolas,monospace">WRITE PLANE</text>
<text x="168" y="321" font-size="14" fill="light-dark(#1c1c22,#e9e9ee)" font-weight="600">hard — real per-team tenants</text>
<text x="702" y="320" font-size="10" fill="light-dark(#2c7a56,#7fd6a6)" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">solid walls = data-plane fact</text>
<text x="58" y="344" font-size="12.5" fill="light-dark(#25402f,#bfe0cc)"><tspan fill="light-dark(#1c7a4f,#7fd6a6)" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">cortex-tenant</tspan> splits each namespace&#39;s series into its own Mimir/Loki tenant.</text>
<rect x="58" y="358" width="200" height="52" rx="9" fill="light-dark(#dcefe3,#24352b)" stroke="light-dark(#3c9a6c,#46785c)" stroke-width="2"></rect>
<text x="72" y="381" font-size="13" fill="light-dark(#1c7a4f,#7fd6a6)" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">alpha</text>
<text x="72" y="398" font-size="10.5" fill="light-dark(#5f7d6c,#a6a6ad)">preprod spoke → feeds</text>
<rect x="272" y="358" width="200" height="52" rx="9" fill="light-dark(#dcefe3,#24352b)" stroke="light-dark(#3c9a6c,#46785c)" stroke-width="2"></rect>
<text x="286" y="381" font-size="13" fill="light-dark(#1c7a4f,#7fd6a6)" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">bravo</text>
<text x="286" y="398" font-size="10.5" fill="light-dark(#5f7d6c,#a6a6ad)">preprod spoke → feeds</text>
<rect x="486" y="358" width="216" height="52" rx="9" fill="light-dark(#ececea,#23242a)" stroke="light-dark(#a8a8a2,#55555c)" stroke-width="2"></rect>
<text x="500" y="381" font-size="13" fill="light-dark(#3a3a40,#d0d0d6)" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">platform</text>
<text x="500" y="398" font-size="10.5" fill="light-dark(#6c6c73,#a6a6ad)">hub → feeds</text>
<text x="58" y="438" font-size="11.5" fill="light-dark(#5f7d6c,#a6a6ad)">preprod spoke feeds <tspan fill="light-dark(#1c7a4f,#7fd6a6)" font-weight="600">alpha</tspan> · <tspan fill="light-dark(#1c7a4f,#7fd6a6)" font-weight="600">bravo</tspan>  —  hub feeds <tspan fill="light-dark(#3a3a40,#d0d0d6)" font-weight="600">platform</tspan>. Each is a real, separate tenant.</text>

<rect x="40" y="470" width="680" height="60" rx="12" fill="light-dark(#e2eff2,#172329)" stroke="light-dark(#b8dbe4,#3f7f92)" stroke-width="1"></rect>
<rect x="58" y="488" width="86" height="24" rx="6" fill="light-dark(#d2e9ef,#1b2a30)" stroke="light-dark(#b8dbe4,#3f7f92)" stroke-width="1"></rect>
<text x="101" y="503" font-size="10" fill="light-dark(#0f6f8e,#7fc6da)" text-anchor="middle" letter-spacing="0.5px" font-family="ui-monospace,Menlo,Consolas,monospace">FLOOR</text>
<text x="160" y="494" font-size="12.5" fill="light-dark(#1c3a44,#b8d8e0)">The network is the real invariant: <tspan fill="light-dark(#0f6f8e,#7fc6da)" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">observability</tspan> is default-deny + ClusterIP-only.</text>
<text x="160" y="512" font-size="12.5" fill="light-dark(#0a2831,#d6ecf2)" font-style="italic">No tenant pod can even reach a store to name a tenant.</text>

<text x="40" y="566" font-size="13.5" fill="light-dark(#6c6c73,#a6a6ad)">Write split = <tspan fill="light-dark(#1f8a5b,#7fd6a6)" font-weight="600">hard &amp; live.</tspan>  Read scoping = <tspan fill="light-dark(#9a6a0a,#e6c46a)" font-weight="600">soft &amp; live.</tspan>  The only hard data-plane boundary is the <tspan fill="light-dark(#0f6f8e,#7fc6da)" font-weight="600">network.</tspan></text>
</svg>