ac84}[fill="#1c7a4f"]{fill:#41d893}[stroke="#1c7a4f"]{stroke:#41d893}[fill="#dcefe3"]{fill:#255035}[stroke="#dcefe3"]{stroke:#255035}[fill="#3c9a6c"]{fill:#6ac89a}[stroke="#3c9a6c"]{stroke:#6ac89a}[fill="#5f7d6c"]{fill:#81988b}[stroke="#5f7d6c"]{stroke:#81988b}[fill="#ececea"]{fill:#20201d}[stroke="#ececea"]{stroke:#20201d}[fill="#a8a8a2"]{fill:#909088}[stroke="#a8a8a2"]{stroke:#909088}[fill="#3a3a40"]{fill:#dfdfe2}[stroke="#3a3a40"]{stroke:#dfdfe2}[fill="#e2eff2"]{fill:#23464e}[stroke="#e2eff2"]{stroke:#23464e}[fill="#b8dbe4"]{fill:#275966}[stroke="#b8dbe4"]{stroke:#275966}[fill="#d2e9ef"]{fill:#204e5a}[stroke="#d2e9ef"]{stroke:#204e5a}[fill="#0f6f8e"]{fill:#2bbeee}[stroke="#0f6f8e"]{stroke:#2bbeee}[fill="#1c3a44"]{fill:#5aa5be}[stroke="#1c3a44"]{stroke:#5aa5be}[fill="#0a2831"]{fill:#3db7dc}[stroke="#0a2831"]{stroke:#3db7dc}[fill="#9a6a0a"]{fill:#f6b022}[stroke="#9a6a0a"]{stroke:#f6b022}[fill="#b83a2c"]{fill:#dd6f63}[stroke="#b83a2c"]{stroke:#dd6f63}}</style>
<rect class="bg" x="0" y="0" width="760" height="726" fill="#f6f6f3"></rect>


<text class="muted mono" x="40" y="52" font-size="12" fill="#6c6c73" letter-spacing="1.8px">OBSERVABILITY · TENANCY · WHAT&#39;S ACTUALLY LIVE</text>
<text class="text" x="40" y="89" font-size="26" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Hard writes, soft reads, one retired middle.</text>
<text class="muted" x="40" y="117" font-size="14.5" fill="#6c6c73">Per-team isolation is honest only if you say which layer is real. The write split is a data-plane fact; the</text>
<text class="muted" x="40" y="136" font-size="14.5" fill="#6c6c73">read scoping is an organizational boundary; the fail-closed proxy was pulled.</text>


<rect x="40" y="158" width="680" height="98" rx="12" fill="#f9f0da" stroke="#e0b84a" stroke-width="1.3" stroke-dasharray="6 4"></rect>
<rect x="58" y="172" width="86" height="20" rx="5" fill="#e0a52a"></rect>
<text class="mono" x="101" y="186" font-size="9.5" fill="#4a3208" text-anchor="middle" letter-spacing="0.4px" font-family="ui-monospace,Menlo,Consolas,monospace">READ PLANE</text>
<text class="text" x="156" y="187" font-size="14" fill="#1c1c22" font-weight="600">soft — RBAC boundary</text>
<text class="mono" x="702" y="186" font-size="10" fill="#8a6410" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">dashed = not a data-plane gate</text>
<rect x="58" y="204" width="98" height="26" rx="7" fill="#f4ead0" stroke="#e0cd9c" stroke-width="1"></rect>
<text class="mono" x="107" y="221" font-size="10.5" fill="#8a6410" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Mimir (alpha)</text>
<rect x="162" y="204" width="98" height="26" rx="7" fill="#f4ead0" stroke="#e0cd9c" stroke-width="1"></rect>
<text class="mono" x="211" y="221" font-size="10.5" fill="#8a6410" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Mimir (bravo)</text>
<text class="text" x="272" y="213" font-size="12" fill="#4a3c1c">per-team datasource, <tspan font-style="italic" fill="#123">static</tspan> <tspan class="mono" font-family="ui-monospace,monospace" font-size="10.5">X-Scope-OrgID</tspan> → gateway.</text>
<text class="text" x="272" y="228" font-size="12" fill="#4a3c1c">Isolation = Grafana <tspan font-weight="600">folder permissions</tspan> + dashboards <tspan class="mono" font-family="ui-monospace,monospace" font-size="10">#1157</tspan>.</text>
<text class="muted" x="58" y="248" font-size="11.5" fill="#7a6a4f">An editable panel can still query another tenant — an RBAC boundary, not a wall.</text>


<rect x="40" y="268" width="680" height="70" rx="12" fill="#fae9e6" stroke="#e0a59c" stroke-width="1"></rect>
<rect x="58" y="282" width="148" height="20" rx="6" fill="#f7ded9" stroke="#e6b3aa" stroke-width="1"></rect>
<text class="mono" x="132" y="296" font-size="9.5" fill="#a63527" text-anchor="middle" letter-spacing="0.3px" font-family="ui-monospace,Menlo,Consolas,monospace">BUILT → RETIRED · #1269</text>
<text class="text" x="218" y="297" font-size="13.5" fill="#a5342a" font-weight="600" text-decoration="line-through">tenant-proxy + loki-tenant-proxy</text>
<text x="702" y="300" font-size="16" fill="#c0392b" text-anchor="end">✗</text>
<text class="text" x="58" y="318" font-size="12" fill="#5a201a">Fail-closed; verified the OIDC token, overwrote <tspan class="mono" font-family="ui-monospace,monospace" font-size="10.5">X-Scope-OrgID</tspan>. Retired because OSS Grafana&#39;s <tspan class="mono" fill="#a5342a" font-family="ui-monospace,monospace" font-size="10.5">oauthPassThru</tspan></text>
<text class="muted" x="58" y="333" font-size="12" fill="#6a4a44">couldn&#39;t forward the SSO token → proxy fail-closed → every dashboard blanked. Modules inert, <tspan class="mono" fill="#a5342a" font-family="ui-monospace,monospace" font-size="10.5">read_proxy_url = &#34;&#34;</tspan>.</text>


<rect x="40" y="350" width="680" height="132" rx="12" fill="#e7f4ec" stroke="#7cc79b" stroke-width="1.5"></rect>
<rect x="58" y="364" width="90" height="20" rx="5" fill="#1f8a5b"></rect>
<text class="mono" x="103" y="378" font-size="9.5" fill="#eafcf1" text-anchor="middle" letter-spacing="0.4px" font-family="ui-monospace,Menlo,Consolas,monospace">WRITE PLANE</text>
<text class="text" x="160" y="379" font-size="14" fill="#1c1c22" font-weight="600">hard — real tenants</text>
<text class="mono" x="702" y="378" font-size="10" fill="#2c7a56" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">solid walls = data-plane fact</text>
<text class="text" x="58" y="401" font-size="12" fill="#25402f"><tspan class="mono" fill="#1c7a4f" font-family="ui-monospace,monospace" font-size="10.5">cortex-tenant</tspan> splits each environment namespace&#39;s series into its own Mimir/Loki tenant — not one bucket with a label.</text>
<rect x="58" y="414" width="204" height="52" rx="9" fill="#dcefe3" stroke="#3c9a6c" stroke-width="2"></rect>
<text class="mono" x="72" y="437" font-size="13" fill="#1c7a4f" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">alpha</text>
<text class="muted" x="72" y="454" font-size="10.5" fill="#5f7d6c">← preprod spoke feeds</text>
<rect x="278" y="414" width="204" height="52" rx="9" fill="#dcefe3" stroke="#3c9a6c" stroke-width="2"></rect>
<text class="mono" x="292" y="437" font-size="13" fill="#1c7a4f" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">bravo</text>
<text class="muted" x="292" y="454" font-size="10.5" fill="#5f7d6c">← preprod spoke feeds</text>
<rect x="498" y="414" width="204" height="52" rx="9" fill="#ececea" stroke="#a8a8a2" stroke-width="2"></rect>
<text class="mono" x="512" y="437" font-size="13" fill="#3a3a40" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">platform</text>
<text class="muted" x="512" y="454" font-size="10.5" fill="#6c6c73">← hub (no env ns)</text>


<rect x="40" y="494" width="680" height="58" rx="12" fill="#e2eff2" stroke="#b8dbe4" stroke-width="1"></rect>
<rect x="58" y="512" width="86" height="22" rx="6" fill="#d2e9ef" stroke="#b8dbe4" stroke-width="1"></rect>
<text class="mono" x="101" y="522" font-size="9.5" fill="#0f6f8e" text-anchor="middle" letter-spacing="0.4px" font-family="ui-monospace,Menlo,Consolas,monospace">THE</text>
<text class="mono" x="101" y="531" font-size="9.5" fill="#0f6f8e" text-anchor="middle" letter-spacing="0.4px" font-family="ui-monospace,Menlo,Consolas,monospace">FLOOR</text>
<text class="text" x="160" y="518" font-size="12.5" fill="#1c3a44">The network is the real invariant: <tspan class="mono" fill="#0f6f8e" font-family="ui-monospace,monospace" font-size="11">observability</tspan> is default-deny + ClusterIP-only.</text>
<text class="text" x="160" y="536" font-size="12.5" fill="#0a2831" font-style="italic">No tenant pod can even reach a store to name a tenant.</text>


<text class="muted" x="40" y="592" font-size="13.5" fill="#6c6c73">Write separation = <tspan fill="#1f8a5b" font-weight="600">real &amp; live.</tspan>  Read scoping = <tspan fill="#9a6a0a" font-weight="600">soft &amp; live.</tspan>  Hard read gate = <tspan fill="#b83a2c" font-weight="600">retired.</tspan>  Say all three.</text>
</svg>