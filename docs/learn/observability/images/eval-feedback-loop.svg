<rect class="bg" x="0" y="0" width="760" height="566" fill="#f6f6f3"></rect>


<text class="muted mono" x="40" y="50" font-size="12" fill="#6c6c73" letter-spacing="1.8px">OBSERVABILITY · AGENT · THE FEEDBACK LOOP</text>
<text class="text" x="40" y="84" font-size="24" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">The signal a service can&#39;t have: <tspan fill="#0f6f8e" font-style="italic">was it right?</tspan></text>
<text class="muted" x="40" y="110" font-size="13.5" fill="#6c6c73">Observing an agent adds a consumer no normal workload has — a human verdict that closes the loop and tells you</text>
<text class="muted" x="40" y="127" font-size="13.5" fill="#6c6c73">whether the agent is actually any good.</text>


<circle cx="380" cy="320" r="150" fill="none" stroke="#ccccc4" stroke-width="2"></circle>

