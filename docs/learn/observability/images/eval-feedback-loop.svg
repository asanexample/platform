<rect x="300" y="296" width="160" height="48" rx="11" fill="#d2e9ef" stroke="#8dc4d4" stroke-width="1.5"></rect>
<text x="380" y="316" font-size="13.5" fill="#0a4a5c" font-weight="600" text-anchor="middle">Is the agent</text>
<text x="380" y="333" font-size="13.5" fill="#0a4a5c" font-weight="600" text-anchor="middle">calibrated?</text>


<rect x="305" y="147" width="150" height="46" rx="9" fill="#efe6f9" stroke="#cdb4e8" stroke-width="1"></rect>
<text x="380" y="167" font-size="12" fill="#1c1c22" font-weight="500" text-anchor="middle">Agent emits</text>
<text x="380" y="182" font-size="10" fill="#8a4fc4" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">triage_disposition</text>
<circle cx="313" cy="147" r="9" fill="#8a4fc4"></circle><text x="313" y="151" font-size="10" fill="#fff" text-anchor="middle" font-family="ui-monospace,monospace">1</text>


<rect x="448" y="251" width="150" height="46" rx="9" fill="#efe6f9" stroke="#cdb4e8" stroke-width="1"></rect>
<text x="523" y="271" font-size="12" fill="#1c1c22" font-weight="500" text-anchor="middle">Slack proposal</text>
<text x="523" y="286" font-size="10.5" fill="#7a52a0" text-anchor="middle">→ owning team</text>
<circle cx="456" cy="251" r="9" fill="#8a4fc4"></circle><text x="456" y="255" font-size="10" fill="#fff" text-anchor="middle" font-family="ui-monospace,monospace">2</text>


<rect x="393" y="418" width="150" height="46" rx="9" fill="#e7f4ec" stroke="#a8d8bd" stroke-width="1"></rect>
<text x="468" y="438" font-size="12" fill="#1c1c22" font-weight="500" text-anchor="middle">Human verdict</text>
<text x="468" y="453" font-size="9.5" fill="#1c7a4f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Accept·Correct·Dismiss</text>
<circle cx="401" cy="418" r="9" fill="#1c7a4f"></circle><text x="401" y="422" font-size="10" fill="#fff" text-anchor="middle" font-family="ui-monospace,monospace">3</text>


<rect x="217" y="418" width="150" height="46" rx="9" fill="#e7f4ec" stroke="#a8d8bd" stroke-width="1"></rect>
<text x="292" y="437" font-size="9.5" fill="#1c7a4f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">triage_feedback_total</text>
<text x="292" y="453" font-size="10.5" fill="#3c7a5c" text-anchor="middle">counter · durable</text>
<circle cx="225" cy="418" r="9" fill="#1c7a4f"></circle><text x="225" y="422" font-size="10" fill="#fff" text-anchor="middle" font-family="ui-monospace,monospace">4</text>


<rect x="162" y="251" width="150" height="46" rx="9" fill="#e2eff2" stroke="#8dc4d4" stroke-width="1"></rect>
<text x="237" y="271" font-size="12" fill="#1c1c22" font-weight="500" text-anchor="middle">Accept-rate</text>
<text x="237" y="286" font-size="10.5" fill="#0f6f8e" text-anchor="middle">by disposition</text>
<circle cx="170" cy="251" r="9" fill="#0f6f8e"></circle><text x="170" y="255" font-size="10" fill="#fff" text-anchor="middle" font-family="ui-monospace,monospace">5</text>


<rect x="24" y="150" width="188" height="104" rx="10" fill="#eaf1fb" stroke="#c4d8f4" stroke-width="1"></rect>
<rect x="25.3" y="151.3" width="185.5" height="101.5" rx="8.8" fill="none" stroke="#2c66c4" stroke-width="2.5" clip-path="url(#abar0)"></rect>
<text x="38" y="172" font-size="12" fill="#2c66c4" font-weight="600">Same four-signal machine</text>
<text x="38" y="190" font-size="10.5" fill="#4a5a73">token metrics → Mimir;</text>
<text x="38" y="205" font-size="9.5" fill="#4a5a73" font-family="ui-monospace,Menlo,Consolas,monospace">invoke_agent→chat→execute_tool</text>
<text x="38" y="220" font-size="10.5" fill="#4a5a73">spans → Tempo. The verdict</text>
<text x="38" y="235" font-size="10.5" fill="#4a5a73">counter is the <tspan fill="#2c66c4" font-weight="600">new</tspan> part.</text>


<rect x="548" y="150" width="188" height="104" rx="10" fill="#fae9e6" stroke="#ecc3bc" stroke-width="1"></rect>
<rect x="549.3" y="151.3" width="185.5" height="101.5" rx="8.8" fill="none" stroke="#c0392b" stroke-width="2.5" clip-path="url(#abar1)"></rect>
<text x="562" y="172" font-size="12" fill="#a5342a" font-weight="600">Confidently wrong</text>
<text x="562" y="191" font-size="9.5" fill="#7a2018" font-family="ui-monospace,Menlo,Consolas,monospace">confident_lead</text>
<text x="562" y="206" font-size="10.5" fill="#6a4a44">+ a <tspan font-style="italic" fill="#7a2018">low</tspan> accept-rate = the</text>
<text x="562" y="221" font-size="10.5" fill="#6a4a44">agent is wrong — the failure</text>
<text x="562" y="236" font-size="10.5" fill="#6a4a44">metrics alone can&#39;t see it.</text>


<rect x="40" y="486" width="680" height="40" rx="10" fill="#f9f0da" stroke="#e8d4a0" stroke-width="1"></rect>
<rect x="52" y="497" width="46" height="18" rx="5" fill="#f0e0b8"></rect>
<text x="75" y="510" font-size="9" fill="#8a5c0a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">COLD</text>
<text x="112" y="511" font-size="11.5" fill="#5f5f66">Cold agent = only <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">target_info</tspan>; counters are zero-recording — no series until the first verdict.</text>


<text class="muted" x="40" y="550" font-size="13" fill="#6c6c73">A service emits what it <tspan fill="#1c1c22" font-style="italic">did.</tspan> An agent also gets told whether it was <tspan fill="#1c1c22" font-style="italic">right</tspan> — and that loop is the whole point.</text>
</svg>