<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 528" width="760" height="528" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#f2eafb"]{fill:#321751}[stroke="#f2eafb"]{stroke:#321751}[fill="#d9c4f0"]{fill:#3f1d64}[stroke="#d9c4f0"]{stroke:#3f1d64}[fill="#6f5a86"]{fill:#9d8ab2}[stroke="#6f5a86"]{stroke:#9d8ab2}[fill="#cf5a48"]{fill:#e3978c}[stroke="#cf5a48"]{stroke:#e3978c}[fill="#c0392b"]{fill:#e07266}[stroke="#c0392b"]{stroke:#e07266}[fill="#a5342a"]{fill:#d75e54}[stroke="#a5342a"]{stroke:#d75e54}[fill="#ececea"]{fill:#20201d}[stroke="#ececea"]{stroke:#20201d}[fill="#d2d2cb"]{fill:#2f2f2a}[stroke="#d2d2cb"]{stroke:#2f2f2a}[fill="#8a8a91"]{fill:#898990}[stroke="#8a8a91"]{stroke:#898990}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#a8a8a2"]{fill:#909088}[stroke="#a8a8a2"]{stroke:#909088}[fill="#33333a"]{fill:#dedee2}[stroke="#33333a"]{stroke:#dedee2}[fill="#fae9e6"]{fill:#532118}[stroke="#fae9e6"]{stroke:#532118}[fill="#e6b3aa"]{fill:#e09b8f}[stroke="#e6b3aa"]{stroke:#e09b8f}[fill="#f9f0da"]{fill:#584619}[stroke="#f9f0da"]{stroke:#584619}[fill="#e8d4a0"]{fill:#e5cc8a}[stroke="#e8d4a0"]{stroke:#e5cc8a}[fill="#b0790f"]{fill:#f2ad29}[stroke="#b0790f"]{stroke:#f2ad29}[fill="#9a6a0a"]{fill:#f6b022}[stroke="#9a6a0a"]{stroke:#f6b022}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}[fill="#e2eff2"]{fill:#23464e}[stroke="#e2eff2"]{stroke:#23464e}[fill="#b8dbe4"]{fill:#275966}[stroke="#b8dbe4"]{stroke:#275966}[fill="#0f6f8e"]{fill:#2bbeee}[stroke="#0f6f8e"]{stroke:#2bbeee}[fill="#3a6070"]{fill:#669cb3}[stroke="#3a6070"]{stroke:#669cb3}[fill="#1c3a44"]{fill:#5aa5be}[stroke="#1c3a44"]{stroke:#5aa5be}[fill="#0a2831"]{fill:#3db7dc}[stroke="#0a2831"]{stroke:#3db7dc}}</style><defs><clipPath id="abar0"><rect x="227.0" y="219.0" width="8.0" height="48.0"/></clipPath></defs>
<rect class="bg" x="0" y="0" width="760" height="528" fill="#f6f6f3"></rect>

<text class="muted mono" x="40" y="52" font-size="12" fill="#6c6c73" letter-spacing="1.8px">OBSERVABILITY · TENANCY · THE NETWORK PERIMETER</text>
<text class="text" x="40" y="89" font-size="26" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">The apartment number is not a key.</text>
<text class="muted" x="40" y="117" font-size="14.5" fill="#6c6c73">The tenant header is just a label anyone could write. What actually keeps stores unreachable is the</text>
<text class="muted" x="40" y="136" font-size="14.5" fill="#6c6c73">network — default-deny, ClusterIP-only, one guarded door.</text>


<rect x="40" y="182" width="150" height="52" rx="10" fill="#f2eafb" stroke="#d9c4f0" stroke-width="1"></rect>
<text class="text" x="56" y="205" font-size="12" fill="#1c1c22" font-weight="600">tenant pod</text>
<text class="muted" x="56" y="222" font-size="10.5" fill="#6f5a86">in an app namespace</text>

<line x1="40" y1="256" x2="176" y2="256" stroke="#cf5a48" stroke-width="2" stroke-dasharray="5 4"></line>
<text x="186" y="261" font-size="14" fill="#c0392b">✕</text>
<text class="mono" x="40" y="280" font-size="9.5" fill="#a5342a" font-family="ui-monospace,Menlo,Consolas,monospace">can&#39;t even reach a store —</text>
<text class="mono" x="40" y="293" font-size="9.5" fill="#a5342a" font-family="ui-monospace,Menlo,Consolas,monospace">blocked at the namespace edge</text>

<rect x="40" y="308" width="104" height="20" rx="5" fill="#ececea" stroke="#d2d2cb" stroke-width="1"></rect>
<text class="mono" x="52" y="322" font-size="9.5" fill="#6c6c73" font-family="ui-monospace,Menlo,Consolas,monospace">X-Scope-OrgID</text>
<text class="muted" x="40" y="344" font-size="10" fill="#8a8a91">just a mailing label — no auth</text>


<rect x="210" y="176" width="510" height="200" rx="14" fill="#efefec" stroke="#a8a8a2" stroke-width="2"></rect>
<text class="mono" x="228" y="202" font-size="12" fill="#33333a" font-family="ui-monospace,Menlo,Consolas,monospace">namespace: observability</text>
<rect x="574" y="188" width="128" height="20" rx="5" fill="#fae9e6" stroke="#e6b3aa" stroke-width="1"></rect>
<text class="mono" x="638" y="202" font-size="9.5" fill="#a5342a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">default-deny ingress</text>

<rect x="228" y="220" width="474" height="46" rx="9" fill="#f9f0da" stroke="#e8d4a0" stroke-width="1"></rect>
<rect x="229.3" y="221.3" width="471.5" height="43.5" rx="7.8" fill="none" stroke="#b0790f" stroke-width="2.5" clip-path="url(#abar0)"></rect>
<text class="text" x="244" y="240" font-size="12" fill="#9a6a0a" font-weight="600">Gateway-Envoy · the one door</text>
<text class="mono" x="244" y="256" font-size="10" fill="#8a6410" font-family="ui-monospace,Menlo,Consolas,monospace">fromEntities: [ingress]</text>

<rect x="228" y="278" width="112" height="36" rx="8" fill="#e2eff2" stroke="#b8dbe4" stroke-width="1"></rect>
<text class="mono" x="284" y="300" font-size="11" fill="#0f6f8e" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">Mimir</text>
<rect x="348" y="278" width="112" height="36" rx="8" fill="#e2eff2" stroke="#b8dbe4" stroke-width="1"></rect>
<text class="mono" x="404" y="300" font-size="11" fill="#0f6f8e" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">Loki</text>
<rect x="468" y="278" width="112" height="36" rx="8" fill="#e2eff2" stroke="#b8dbe4" stroke-width="1"></rect>
<text class="mono" x="524" y="300" font-size="11" fill="#0f6f8e" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">Tempo</text>
<rect x="588" y="278" width="114" height="36" rx="8" fill="#e2eff2" stroke="#b8dbe4" stroke-width="1"></rect>
<text class="mono" x="645" y="300" font-size="10.5" fill="#0f6f8e" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">Pyroscope</text>
<text class="mono" x="228" y="336" font-size="10" fill="#3a6070" font-family="ui-monospace,Menlo,Consolas,monospace">ClusterIP-only — never on the Gateway</text>


<rect x="40" y="392" width="680" height="44" rx="11" fill="#e2eff2" stroke="#b8dbe4" stroke-width="1"></rect>
<text class="text" x="58" y="414" font-size="13" fill="#1c3a44">The network is the <tspan font-weight="600" fill="#0a2831">real invariant.</tspan> The header names a tenant; the wall decides whether you can</text>
<text class="text" x="58" y="430" font-size="13" fill="#1c3a44">knock at all.</text>


<text class="muted" x="40" y="474" font-size="13.5" fill="#6c6c73">Only the Gateway&#39;s <tspan class="mono" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">ingress</tspan> identity gets through the one door — everything else is denied before a</text>
<text class="muted" x="40" y="493" font-size="13.5" fill="#6c6c73">tenant name is ever read.</text>
</svg>