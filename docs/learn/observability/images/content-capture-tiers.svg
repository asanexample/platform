<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" width="760" height="508" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#e7f4ec"]{fill:#224b32}[stroke="#e7f4ec"]{stroke:#224b32}[fill="#bfe0cc"]{fill:#2d5e41}[stroke="#bfe0cc"]{stroke:#2d5e41}[fill="#1f8a5b"]{fill:#40d996}[stroke="#1f8a5b"]{stroke:#40d996}[fill="#1c7a4f"]{fill:#41d893}[stroke="#1c7a4f"]{stroke:#41d893}[fill="#33333a"]{fill:#dedee2}[stroke="#33333a"]{stroke:#dedee2}[fill="#5f5f66"]{fill:#8c8c94}[stroke="#5f5f66"]{stroke:#8c8c94}[fill="#f9f0da"]{fill:#584619}[stroke="#f9f0da"]{stroke:#584619}[fill="#e8d4a0"]{fill:#e5cc8a}[stroke="#e8d4a0"]{stroke:#e5cc8a}[fill="#b0790f"]{fill:#f2ad29}[stroke="#b0790f"]{stroke:#f2ad29}[fill="#9a6a0a"]{fill:#f6b022}[stroke="#9a6a0a"]{stroke:#f6b022}[fill="#f3e6c4"]{fill:#634f1d}[stroke="#f3e6c4"]{stroke:#634f1d}[fill="#e0cd9c"]{fill:#dfc990}[stroke="#e0cd9c"]{stroke:#dfc990}[fill="#8a5c0a"]{fill:#f4aa24}[stroke="#8a5c0a"]{stroke:#f4aa24}[fill="#a5883a"]{fill:#cfb46c}[stroke="#a5883a"]{stroke:#cfb46c}[fill="#fae9e6"]{fill:#532118}[stroke="#fae9e6"]{stroke:#532118}[fill="#ecc3bc"]{fill:#68291e}[stroke="#ecc3bc"]{stroke:#68291e}[fill="#c0392b"]{fill:#e07266}[stroke="#c0392b"]{stroke:#e07266}[fill="#a5342a"]{fill:#d75e54}[stroke="#a5342a"]{stroke:#d75e54}[fill="#a05545"]{fill:#c88779}[stroke="#a05545"]{stroke:#c88779}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#dcdcd5"]{fill:#2a2a25}[stroke="#dcdcd5"]{stroke:#2a2a25}[fill="#c8c8c0"]{fill:#35352f}[stroke="#c8c8c0"]{stroke:#35352f}}</style><defs><clipPath id="abar0"><rect x="39.0" y="161.0" width="9.0" height="52.0"/></clipPath><clipPath id="abar1"><rect x="39.0" y="221.0" width="9.0" height="52.0"/></clipPath><clipPath id="abar2"><rect x="39.0" y="281.0" width="9.0" height="52.0"/></clipPath></defs>
<rect class="bg" x="0" y="0" width="760" height="508" fill="#f6f6f3"></rect>

<text class="muted mono" x="40" y="52" font-size="12" fill="#6c6c73" letter-spacing="1.8px">OBSERVABILITY · AGENT · WHAT&#39;S DEFERRED</text>
<text class="text" x="40" y="89" font-size="26" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Metadata always, content maybe, PII never.</text>
<text class="muted" x="40" y="117" font-size="14.5" fill="#6c6c73">Agent telemetry has three tiers of fidelity — and the deeper you capture, the more it costs and the</text>
<text class="muted" x="40" y="136" font-size="14.5" fill="#6c6c73">more it&#39;s gated. The richest tier is deliberately deferred.</text>


<rect x="40" y="162" width="168" height="50" rx="10" fill="#e7f4ec" stroke="#bfe0cc" stroke-width="1"></rect>
<rect x="41.3" y="163.3" width="165.5" height="47.5" rx="8.8" fill="none" stroke="#1f8a5b" stroke-width="2.5" clip-path="url(#abar0)"></rect>
<text class="text" x="56" y="184" font-size="13" fill="#1c1c22" font-weight="600">Metadata</text>
<text class="mono" x="56" y="200" font-size="10" fill="#1c7a4f" font-family="ui-monospace,Menlo,Consolas,monospace">always-on · live</text>
<text class="text" x="256" y="182" font-size="12.5" fill="#33333a">token counts, latencies, dispositions, verdicts — <tspan class="mono" fill="#1c7a4f" font-family="ui-monospace,monospace" font-size="11">gen_ai.*</tspan></text>
<text class="muted" x="256" y="199" font-size="12.5" fill="#5f5f66">attributes with <tspan fill="#1c1c22">no message bodies</tspan>. Cheap, safe, shipping today.</text>


<rect x="40" y="222" width="168" height="50" rx="10" fill="#f9f0da" stroke="#e8d4a0" stroke-width="1"></rect>
<rect x="41.3" y="223.3" width="165.5" height="47.5" rx="8.8" fill="none" stroke="#b0790f" stroke-width="2.5" clip-path="url(#abar1)"></rect>
<text class="text" x="56" y="244" font-size="13" fill="#1c1c22" font-weight="600">Content</text>
<text class="mono" x="56" y="260" font-size="10" fill="#9a6a0a" font-family="ui-monospace,Menlo,Consolas,monospace">deferred · gated</text>
<rect x="224" y="235" width="98" height="24" rx="6" fill="#f3e6c4" stroke="#e0cd9c" stroke-width="1"></rect>
<text class="mono" x="273" y="251" font-size="9.5" fill="#8a5c0a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">redaction gate</text>
<text x="330" y="252" font-size="12" fill="#a5883a">→</text>
<text class="text" x="352" y="242" font-size="12.5" fill="#33333a">prompt + completion bodies — only after</text>
<text class="muted" x="352" y="259" font-size="12.5" fill="#5f5f66">scrubbing. Lowest-ROI feature, so it&#39;s <tspan fill="#1c1c22" font-style="italic">deferred.</tspan></text>


<rect x="40" y="282" width="168" height="50" rx="10" fill="#fae9e6" stroke="#ecc3bc" stroke-width="1"></rect>
<rect x="41.3" y="283.3" width="165.5" height="47.5" rx="8.8" fill="none" stroke="#c0392b" stroke-width="2.5" clip-path="url(#abar2)"></rect>
<text class="text" x="56" y="304" font-size="13" fill="#1c1c22" font-weight="600">Regulated</text>
<text class="mono" x="56" y="320" font-size="10" fill="#a5342a" font-family="ui-monospace,Menlo,Consolas,monospace">hipaa / pci</text>
<text x="228" y="313" font-size="14" fill="#c0392b">⊘</text>
<text x="250" y="312" font-size="12" fill="#a05545">→</text>
<text class="text" x="272" y="302" font-size="12.5" fill="#33333a">content capture <tspan font-weight="600" fill="#a5342a">never</tspan> — metadata-only,</text>
<text class="muted" x="272" y="319" font-size="12.5" fill="#5f5f66">permanently. A hard terminal, not a deferral.</text>


<rect x="40" y="352" width="680" height="34" rx="10" fill="#efefec" stroke="#dcdcd5" stroke-width="1"></rect>
<text class="mono" x="58" y="373" font-size="10" fill="#6c6c73" font-family="ui-monospace,Menlo,Consolas,monospace">fidelity ↑</text>
<line x1="128" y1="369" x2="560" y2="369" stroke="#c8c8c0" stroke-width="1" stroke-dasharray="3 3"></line>
<text class="mono" x="574" y="373" font-size="10" fill="#6c6c73" font-family="ui-monospace,Menlo,Consolas,monospace">cost ↑ · ROI ↓ · gating ↑</text>


<text class="muted" x="40" y="426" font-size="13.5" fill="#6c6c73">Metadata is the whole live signal today; content is a deferred nice-to-have; regulated data is a wall,</text>
<text class="muted" x="40" y="445" font-size="13.5" fill="#6c6c73">not a roadmap item.</text>
</svg>