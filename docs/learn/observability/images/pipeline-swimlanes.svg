<text class="muted mono" x="40" y="52" font-size="12" fill="#6c6c73" letter-spacing="1.8px">OBSERVABILITY · COLLECTION · KERNEL TO STORE</text>
<text class="text" x="40" y="89" font-size="26" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Draw the whole pipeline from memory.</text>
<text class="muted" x="40" y="117" font-size="14.5" fill="#6c6c73">Every signal takes the same journey — collected below the process, shipped by a collector shaped for its</text>
<text class="muted" x="40" y="136" font-size="14.5" fill="#6c6c73">job, landing in its own store. Different lanes, one grammar.</text>
