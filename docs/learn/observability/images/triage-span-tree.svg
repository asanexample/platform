<text class="muted mono" x="40" y="52" font-size="12" fill="#6c6c73" letter-spacing="1.8px">OBSERVABILITY · AGENT · ONE TRIAGE, END TO END</text>
<text class="text" x="40" y="89" font-size="26" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Inside a single agent trace.</text>
<text class="muted" x="40" y="117" font-size="14.5" fill="#6c6c73">One triage is one trace — a nested span tree carrying <tspan class="mono" fill="#8a4fc4" font-family="ui-monospace,Menlo,Consolas,monospace">gen_ai.*</tspan> attributes at each level. Here&#39;s a</text>
<text class="muted" x="40" y="136" font-size="14.5" fill="#6c6c73">real one, alert to disposition.</text>


