<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#e7f4ec"]{fill:#224b32}[stroke="#e7f4ec"]{stroke:#224b32}[fill="#bfe0cc"]{fill:#2d5e41}[stroke="#bfe0cc"]{stroke:#2d5e41}[fill="#1f8a5b"]{fill:#40d996}[stroke="#1f8a5b"]{stroke:#40d996}[fill="#2c7a56"]{fill:#54c591}[stroke="#2c7a56"]{stroke:#54c591}[fill="#dcefe3"]{fill:#255035}[stroke="#dcefe3"]{stroke:#255035}[fill="#a8d8bd"]{fill:#9bd4b4}[stroke="#a8d8bd"]{stroke:#9bd4b4}[fill="#1c7a4f"]{fill:#41d893}[stroke="#1c7a4f"]{stroke:#41d893}[fill="#3c7a5c"]{fill:#63b58e}[stroke="#3c7a5c"]{stroke:#63b58e}[fill="#fae9e6"]{fill:#532118}[stroke="#fae9e6"]{stroke:#532118}[fill="#ecc3bc"]{fill:#68291e}[stroke="#ecc3bc"]{stroke:#68291e}[fill="#c0392b"]{fill:#e07266}[stroke="#c0392b"]{stroke:#e07266}[fill="#a5342a"]{fill:#d75e54}[stroke="#a5342a"]{stroke:#d75e54}[fill="#f5ddd8"]{fill:#5a251a}[stroke="#f5ddd8"]{stroke:#5a251a}[fill="#e6b3aa"]{fill:#e09b8f}[stroke="#e6b3aa"]{stroke:#e09b8f}[fill="#f4ded9"]{fill:#5a261a}[stroke="#f4ded9"]{stroke:#5a261a}[fill="#e0a59c"]{fill:#df9b90}[stroke="#e0a59c"]{stroke:#df9b90}[fill="#a05545"]{fill:#c88779}[stroke="#a05545"]{stroke:#c88779}[fill="#f7e6e2"]{fill:#552419}[stroke="#f7e6e2"]{stroke:#552419}[fill="#e6bcb4"]{fill:#6a2f23}[stroke="#e6bcb4"]{stroke:#6a2f23}[fill="#b06a5c"]{fill:#cfa299}[stroke="#b06a5c"]{stroke:#cfa299}[fill="#7a5a54"]{fill:#a98780}[stroke="#7a5a54"]{stroke:#a98780}[fill="#f2eafb"]{fill:#321751}[stroke="#f2eafb"]{stroke:#321751}[fill="#d9c4f0"]{fill:#3f1d64}[stroke="#d9c4f0"]{stroke:#3f1d64}[fill="#8a4fc4"]{fill:#b892dd}[stroke="#8a4fc4"]{stroke:#b892dd}[fill="#7a52a0"]{fill:#a889c5}[stroke="#7a52a0"]{stroke:#a889c5}[fill="#efe6f9"]{fill:#341853}[stroke="#efe6f9"]{stroke:#341853}[fill="#cdb4e8"]{fill:#45216c}[stroke="#cdb4e8"]{stroke:#45216c}[fill="#7a45b0"]{fill:#a881d0}[stroke="#7a45b0"]{stroke:#a881d0}[fill="#b58fd0"]{fill:#bd99d6}[stroke="#b58fd0"]{stroke:#bd99d6}[fill="#6f5a86"]{fill:#9d8ab2}[stroke="#6f5a86"]{stroke:#9d8ab2}}</style><defs><clipPath id="abar0"><rect x="39.0" y="157.0" width="214.0" height="11.0"/></clipPath><clipPath id="abar1"><rect x="265.0" y="157.0" width="214.0" height="11.0"/></clipPath><clipPath id="abar2"><rect x="491.0" y="157.0" width="214.0" height="11.0"/></clipPath></defs>
<rect class="bg" x="0" y="0" width="760" height="408" fill="#f6f6f3"></rect>
<text class="muted mono" x="40" y="52" font-size="12" fill="#6c6c73" letter-spacing="1.8px">OBSERVABILITY · COLLECTION · THE THREE ALLOYS</text>
<text class="text" x="40" y="89" font-size="26" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">One binary, three topologies.</text>
<text class="muted" x="40" y="117" font-size="14.5" fill="#6c6c73">The same Alloy runs three different ways over the cluster — and the shape is dictated by the signal.</text>
<text class="muted" x="40" y="136" font-size="14.5" fill="#6c6c73">Merge any two and one breaks.</text>
<rect x="40" y="158" width="212" height="164" rx="12" fill="#e7f4ec" stroke="#bfe0cc" stroke-width="1"></rect>
<rect x="41.3" y="159.3" width="209.5" height="161.5" rx="10.8" fill="none" stroke="#1f8a5b" stroke-width="2.5" clip-path="url(#abar0)"></rect>
<text class="text" x="56" y="184" font-size="13.5" fill="#1c1c22" font-weight="600">log DaemonSet</text>
<text class="mono" x="56" y="200" font-size="10" fill="#2c7a56" font-family="ui-monospace,Menlo,Consolas,monospace">per-node · logs</text>
<rect x="56" y="214" width="58" height="34" rx="6" fill="#dcefe3" stroke="#a8d8bd" stroke-width="1"></rect><text class="mono" x="85" y="236" font-size="10" fill="#1c7a4f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">n1</text>
<rect x="120" y="214" width="58" height="34" rx="6" fill="#dcefe3" stroke="#a8d8bd" stroke-width="1"></rect><text class="mono" x="149" y="236" font-size="10" fill="#1c7a4f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">n2</text>
<rect x="184" y="214" width="58" height="34" rx="6" fill="#dcefe3" stroke="#a8d8bd" stroke-width="1"></rect><text class="mono" x="213" y="236" font-size="10" fill="#1c7a4f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">n3</text>
<text class="muted" x="56" y="272" font-size="11" fill="#3c7a5c">one per node — each tails</text>
<text class="muted" x="56" y="287" font-size="11" fill="#3c7a5c">its own node’s thirds.</text>
<rect x="266" y="158" width="212" height="164" rx="12" fill="#fae9e6" stroke="#ecc3bc" stroke-width="1"></rect>
<rect x="267.3" y="159.3" width="209.5" height="161.5" rx="10.8" fill="none" stroke="#c0392b" stroke-width="2.5" clip-path="url(#abar1)"></rect>
<text class="text" x="282" y="184" font-size="13.5" fill="#1c1c22" font-weight="600">events singleton</text>
<text class="mono" x="282" y="200" font-size="10" fill="#a5342a" font-family="ui-monospace,Menlo,Consolas,monospace">×1 · cluster events</text>
<rect x="282" y="214" width="58" height="34" rx="6" fill="#f5ddd8" stroke="#e6b3aa" stroke-width="1"></rect><text class="mono" x="311" y="236" font-size="10" fill="#a5342a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">n1</text>
<rect x="346" y="214" width="58" height="34" rx="6" fill="#f4ded9" stroke="#e0a59c" stroke-width="1" stroke-dasharray="4 3"></rect><text class="mono" x="375" y="236" font-size="10" fill="#a05545" text-anchor="middle" text-decoration="line-through" font-family="ui-monospace,Menlo,Consolas,monospace">n2</text><text x="397" y="225" font-size="11" fill="#c0392b" text-anchor="middle">✕</text>
<rect x="410" y="214" width="58" height="34" rx="6" fill="#f7e6e2" stroke="#e6bcb4" stroke-width="1" stroke-dasharray="4 3"></rect><text class="mono" x="439" y="236" font-size="10" fill="#b06a5c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">n3</text>
<text class="muted" x="282" y="272" font-size="11" fill="#7a5a54">a 2nd replica double-counts</text>
<text class="muted" x="282" y="287" font-size="11" fill="#7a5a54">every event.</text>
<rect x="492" y="158" width="212" height="164" rx="12" fill="#f2eafb" stroke="#d9c4f0" stroke-width="1"></rect>
<rect x="493.3" y="159.3" width="209.5" height="161.5" rx="10.8" fill="none" stroke="#8a4fc4" stroke-width="2.5" clip-path="url(#abar2)"></rect>
<text class="text" x="508" y="184" font-size="13.5" fill="#1c1c22" font-weight="600">profiler DaemonSet</text>
<text class="mono" x="508" y="200" font-size="10" fill="#7a52a0" font-family="ui-monospace,Menlo,Consolas,monospace">per-node · privileged</text>
<rect x="508" y="214" width="58" height="34" rx="6" fill="#efe6f9" stroke="#cdb4e8" stroke-width="1"></rect><text class="mono" x="537" y="236" font-size="10" fill="#7a45b0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">n1</text><rect x="553" y="223" width="9" height="7" rx="1.5" fill="#b58fd0"></rect><path d="M554.5 223 v-2 a3 3 0 0 1 6 0 v2" fill="none" stroke="#b58fd0" stroke-width="1.3"></path>
<rect x="572" y="214" width="58" height="34" rx="6" fill="#efe6f9" stroke="#cdb4e8" stroke-width="1"></rect><text class="mono" x="601" y="236" font-size="10" fill="#7a45b0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">n2</text>
<rect x="636" y="214" width="58" height="34" rx="6" fill="#efe6f9" stroke="#cdb4e8" stroke-width="1"></rect><text class="mono" x="665" y="236" font-size="10" fill="#7a45b0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">n3</text>
<text class="muted" x="508" y="272" font-size="11" fill="#6f5a86">per node, but fenced —</text>
<text class="muted" x="508" y="287" font-size="11" fill="#6f5a86">needs privileged access.</text>
<text class="muted" x="40" y="358" font-size="13.5" fill="#6c6c73">One binary, but the topology is a property of the <tspan class="text" fill="#1c1c22" font-style="italic">signal</tspan> — merging any two collapses a guarantee.</text>
</svg>