ke:#532118}[fill="#ecc3bc"]{fill:#68291e}[stroke="#ecc3bc"]{stroke:#68291e}[fill="#c0392b"]{fill:#e07266}[stroke="#c0392b"]{stroke:#e07266}[fill="#a5342a"]{fill:#d75e54}[stroke="#a5342a"]{stroke:#d75e54}[fill="#7a5a54"]{fill:#a98780}[stroke="#7a5a54"]{stroke:#a98780}[fill="#c0654e"]{fill:#da9f90}[stroke="#c0654e"]{stroke:#da9f90}[fill="#f5ddd8"]{fill:#5a251a}[stroke="#f5ddd8"]{stroke:#5a251a}[fill="#e6b3aa"]{fill:#e09b8f}[stroke="#e6b3aa"]{stroke:#e09b8f}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#8a8a8f"]{fill:#8a8a8f}[stroke="#8a8a8f"]{stroke:#8a8a8f}[fill="#f9f0da"]{fill:#584619}[stroke="#f9f0da"]{stroke:#584619}[fill="#e8d4a0"]{fill:#e5cc8a}[stroke="#e8d4a0"]{stroke:#e5cc8a}[fill="#b0790f"]{fill:#f2ad29}[stroke="#b0790f"]{stroke:#f2ad29}[fill="#9a6a0a"]{fill:#f6b022}[stroke="#9a6a0a"]{stroke:#f6b022}[fill="#7a6a3f"]{fill:#b39e66}[stroke="#7a6a3f"]{stroke:#b39e66}[fill="#c8a44a"]{fill:#dfc88e}[stroke="#c8a44a"]{stroke:#dfc88e}[fill="#33333a"]{fill:#dedee2}[stroke="#33333a"]{stroke:#dedee2}[fill="#dcdcd5"]{fill:#2a2a25}[stroke="#dcdcd5"]{stroke:#2a2a25}[fill="#b83a2c"]{fill:#dd6f63}[stroke="#b83a2c"]{stroke:#dd6f63}}</style><defs><clipPath id="abar0"><rect x="39.0" y="201.0" width="8.0" height="44.0"/></clipPath><clipPath id="abar1"><rect x="39.0" y="251.0" width="8.0" height="44.0"/></clipPath><clipPath id="abar2"><rect x="39.0" y="337.0" width="8.0" height="44.0"/></clipPath><clipPath id="abar3"><rect x="39.0" y="387.0" width="8.0" height="44.0"/></clipPath></defs>
<rect class="bg" x="0" y="0" width="760" height="636" fill="#f6f6f3"></rect>


<text class="muted mono" x="40" y="52" font-size="12" fill="#6c6c73" letter-spacing="1.8px">OBSERVABILITY · ALERTING · THE ROUTING TREE</text>
<text class="text" x="40" y="89" font-size="26" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Severity routes it. Order matters.</text>
<text class="muted" x="40" y="117" font-size="14.5" fill="#6c6c73">Before the triage agent ever resolves an owner, Alertmanager fans an alert by severity — with one</text>
<text class="muted" x="40" y="136" font-size="14.5" fill="#6c6c73">always-on tap and one inversion that&#39;s easy to get wrong.</text>


<rect x="40" y="160" width="104" height="30" rx="9" fill="#ececea" stroke="#c8c8c0" stroke-width="1.3"></rect>
<text class="text" x="92" y="180" font-size="13.5" fill="#1c1c22" font-weight="600" text-anchor="middle">alert fired</text>
<line x1="152" y1="175" x2="720" y2="175" stroke="#d2d2cb" stroke-width="1"></line>


<rect x="40" y="202" width="168" height="42" rx="9" fill="#e7f4ec" stroke="#bfe0cc" stroke-width="1"></rect>
<rect x="41.3" y="203.3" width="165.5" height="39.5" rx="7.8" fill="none" stroke="#1f8a5b" stroke-width="2.5" clip-path="url(#abar0)"></rect>
<text class="mono" x="56" y="220" font-size="11" fill="#1c7a4f" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">Watchdog</text>
<text class="muted" x="56" y="235" font-size="10" fill="#5f7d6c">always-firing</text>
<text x="222" y="228" font-size="12" fill="#3c9a6c">→</text>
<rect x="242" y="202" width="460" height="42" rx="9" fill="#eaf6ee" stroke="#bfe0cc" stroke-width="1"></rect>
<text class="text" x="256" y="220" font-size="12.5" fill="#1c7a4f" font-weight="500">Healthchecks.io dead-man&#39;s switch</text>
<text class="mono" x="256" y="236" font-size="10" fill="#3c7a5c" font-family="ui-monospace,Menlo,Consolas,monospace">inverted: silence = broken · repeat 5m</text>


<rect x="40" y="252" width="168" height="42" rx="9" fill="#f2eafb" stroke="#d9c4f0" stroke-width="1"></rect>
<rect x="41.3" y="253.3" width="165.5" height="39.5" rx="7.8" fill="none" stroke="#8a4fc4" stroke-width="2.5" clip-path="url(#abar1)"></rect>
<text class="mono" x="56" y="270" font-size="11" fill="#8a4fc4" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">severity=critical</text>
<text class="mono" x="56" y="285" font-size="10" fill="#7a52a0" font-family="ui-monospace,Menlo,Consolas,monospace">side-tap · continue=true</text>
<text x="222" y="278" font-size="12" fill="#9a6ac0">→</text>
<rect x="242" y="252" width="460" height="42" rx="9" fill="#f6f0fb" stroke="#d9c4f0" stroke-width="1"></rect>
<text class="text" x="256" y="270" font-size="12.5" fill="#8a4fc4" font-weight="500">triage-agent webhook copy</text>
<text class="muted" x="256" y="286" font-size="10.5" fill="#6f5a86">evaluated <tspan fill="#3a2f47" font-style="italic">before</tspan> the critical receiver</text>


<rect x="242" y="300" width="460" height="30" rx="8" fill="#f6ecd2" stroke="#e0cd9c" stroke-width="1" stroke-dasharray="4 3"></rect>
<rect x="254" y="308" width="54" height="15" rx="4" fill="#f0e0b8"></rect>
<text class="mono" x="281" y="319" font-size="9" fill="#8a5c0a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">CAVEAT</text>
<text class="muted" x="318" y="320" font-size="11.5" fill="#5f5f66">flip <tspan class="mono" fill="#8a5c0a" font-family="ui-monospace,monospace" font-size="10">continue→false</tspan> and the agent becomes a silent black hole.</text>


<rect x="40" y="338" width="168" height="42" rx="9" fill="#fae9e6" stroke="#ecc3bc" stroke-width="1"></rect>
<rect x="41.3" y="339.3" width="165.5" height="39.5" rx="7.8" fill="none" stroke="#c0392b" stroke-width="2.5" clip-path="url(#abar2)"></rect>
<text class="mono" x="56" y="356" font-size="11" fill="#a5342a" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">severity=critical</text>
<text class="muted" x="56" y="371" font-size="10" fill="#7a5a54">receiver</text>
<text x="222" y="364" font-size="12" fill="#c0654e">→</text>
<rect x="242" y="347" width="56" height="24" rx="7" fill="#f5ddd8" stroke="#e6b3aa" stroke-width="1"></rect>
<text class="mono" x="270" y="363" font-size="11" fill="#a5342a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">SNS</text>
<rect x="306" y="347" width="64" height="24" rx="7" fill="#f5ddd8" stroke="#e6b3aa" stroke-width="1"></rect>
<text class="mono" x="338" y="363" font-size="11" fill="#a5342a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">Slack</text>
<rect x="378" y="347" width="196" height="24" rx="7" fill="#efefec" stroke="#d2d2cb" stroke-width="1" stroke-dasharray="4 3"></rect>
<text class="mono" x="390" y="363" font-size="11" fill="#8a8a8f" font-family="ui-monospace,Menlo,Consolas,monospace">PagerDuty <tspan font-size="9">dormant — trial lapsed</tspan></text>


<rect x="40" y="388" width="168" height="42" rx="9" fill="#f9f0da" stroke="#e8d4a0" stroke-width="1"></rect>
<rect x="41.3" y="389.3" width="165.5" height="39.5" rx="7.8" fill="none" stroke="#b0790f" stroke-width="2.5" clip-path="url(#abar3)"></rect>
<text class="mono" x="56" y="406" font-size="11" fill="#9a6a0a" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">severity=warning</text>
<text class="muted" x="56" y="421" font-size="10" fill="#7a6a3f">receiver</text>
<text x="222" y="414" font-size="12" fill="#c8a44a">→</text>
<text x="242" y="414" font-size="12.5" fill="#33333a"><tspan class="mono" font-family="ui-monospace,monospace" font-size="11">Slack</tspan> <tspan fill="#8a8a8f" font-size="11.5">(SNS only if Slack off)</tspan></text>


<rect x="40" y="444" width="680" height="36" rx="9" fill="#efefec" stroke="#dcdcd5" stroke-width="1"></rect>
<text class="mono" x="58" y="466" font-size="12" fill="#b83a2c" font-family="ui-monospace,Menlo,Consolas,monospace">critical</text>
<text x="120" y="467" font-size="14" fill="#6c6c73">⊣</text>
<text class="mono" x="138" y="466" font-size="12" fill="#9a6a0a" font-family="ui-monospace,Menlo,Consolas,monospace">warning</text>
<text class="muted" x="196" y="466" font-size="12" fill="#5f5f66">a firing critical <tspan fill="#1c1c22" font-style="italic">mutes</tspan> the matching warning (inhibition edge).</text>


<text class="muted" x="40" y="516" font-size="13.5" fill="#6c6c73">Severity gets it <tspan class="text" fill="#1c1c22" font-style="italic">out</tspan> (and to the dead-man&#39;s switch + the agent tap); ownership — who actually gets</text>
<text class="muted" x="40" y="535" font-size="13.5" fill="#6c6c73">paged — happens next, in the agent.</text>
</svg>