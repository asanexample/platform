<text x="414" y="261" font-size="12" fill="#1c1c22"><tspan class="mono" fill="#1c7a4f" font-family="ui-monospace,monospace" font-size="10">environments/**/prod.yaml</tspan> registry</text>
<path d="M549 277 L557 277 L553 283 Z" fill="#6fb08f"></path>
<text class="mono" x="402" y="285" font-size="9.5" fill="#2c7a56" font-family="ui-monospace,Menlo,Consolas,monospace">ENGINE</text>
<rect x="402" y="291" width="302" height="46" rx="8" fill="#f0f8f3" stroke="#bfe0cc" stroke-width="1"></rect>
<text x="414" y="309" font-size="11.5" fill="#1c1c22">Terragrunt <tspan class="mono" fill="#1c7a4f" font-family="ui-monospace,monospace" font-size="10">fileset+yamldecode</tspan> →</text>
<text x="414" y="325" font-size="11.5" fill="#1c1c22"><tspan class="mono" fill="#1c7a4f" font-family="ui-monospace,monospace" font-size="10">mimirtool rules sync</tspan> CronJob</text>
<path d="M549 340 L557 340 L553 346 Z" fill="#6fb08f"></path>
<text class="mono" x="402" y="348" font-size="9.5" fill="#2c7a56" font-family="ui-monospace,Menlo,Consolas,monospace">HOME</text>
<rect x="402" y="354" width="302" height="32" rx="8" fill="#f0f8f3" stroke="#bfe0cc" stroke-width="1"></rect>
<text x="414" y="374" font-size="12" fill="#1c1c22">Mimir <tspan class="mono" fill="#1c7a4f" font-family="ui-monospace,monospace" font-size="11">ruler</tspan> <tspan fill="#8a8a8f" font-size="10.5">(preprod tenant)</tspan></text>
<path d="M549 389 L557 389 L553 395 Z" fill="#c8a44a"></path>
<text class="mono" x="402" y="397" font-size="9.5" fill="#8a6410" font-family="ui-monospace,Menlo,Consolas,monospace">CONSUMER · non-human</text>
<rect x="402" y="403" width="302" height="44" rx="8" fill="#f9f0da" stroke="#e8d4a0" stroke-width="1"></rect>
<text x="414" y="421" font-size="12" fill="#1c1c22">the canary <tspan font-weight="600" fill="#9a6a0a">freeze gate</tspan> — a</text>
<text x="414" y="437" font-size="12" fill="#1c1c22">pre-flight AnalysisTemplate</text>
<text class="mono" x="402" y="469" font-size="10" fill="#2c7a56" font-family="ui-monospace,Menlo,Consolas,monospace">e.g. alpha-shop-prod · 99.9% (auto)</text>
<path d="M201 498 L213 498 L207 507 Z" fill="#5a97ab"></path>
<path d="M547 498 L559 498 L553 507 Z" fill="#5a97ab"></path>
<rect x="40" y="514" width="680" height="112" rx="12" fill="#e2eff2" stroke="#b8dbe4" stroke-width="1"></rect>
<rect x="58" y="528" width="98" height="20" rx="6" fill="#d2e9ef" stroke="#b8dbe4" stroke-width="1"></rect>
<text class="mono" x="107" y="542" font-size="9.5" fill="#0f6f8e" text-anchor="middle" letter-spacing="0.4px" font-family="ui-monospace,Menlo,Consolas,monospace">SAME SHAPE</text>
<text class="text" x="168" y="543" font-size="14" fill="#0a2831" font-weight="600">both emit the same multi-window, multi-burn-rate rules</text>
<rect x="58" y="558" width="320" height="30" rx="8" fill="#fae9e6" stroke="#ecc3bc" stroke-width="1"></rect>
<text x="70" y="577" font-size="10.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#b83a2c" font-weight="600">FAST</tspan> <tspan fill="#5f5f66">14.4×(5m∧1h) / 6×(30m∧6h)</tspan> <tspan fill="#b83a2c">→ PAGE</tspan></text>
<rect x="386" y="558" width="320" height="30" rx="8" fill="#f9f0da" stroke="#e8d4a0" stroke-width="1"></rect>
<text x="398" y="577" font-size="10.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#9a6a0a" font-weight="600">SLOW</tspan> <tspan fill="#5f5f66">3×(2h∧1d) / 1×(6h∧3d)</tspan> <tspan fill="#9a6a0a">→ TICKET</tspan></text>
<text class="muted" x="58" y="610" font-size="12" fill="#3a5560">Same 99.9%, different home.</text>
<rect x="40" y="638" width="680" height="44" rx="10" fill="#f9f0da" stroke="#e8d4a0" stroke-width="1" stroke-dasharray="5 3"></rect>
<rect x="56" y="650" width="46" height="20" rx="5" fill="#f0e0b8" stroke="#e0cd9c" stroke-width="1"></rect>
<text class="mono" x="79" y="664" font-size="9" fill="#8a5c0a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">NOTE</text>
<text class="muted" x="116" y="658" font-size="12" fill="#5f5f66">The freeze gate reads the service&#39;s <tspan fill="#1c1c22" font-style="italic">current</tspan> burn and freezes a rollout only if it&#39;s <tspan fill="#1c1c22" font-style="italic">already</tspan></text>
<text class="muted" x="116" y="674" font-size="12" fill="#5f5f66">≥2× budget — it never blocks a first deploy.</text>
<text class="muted" x="40" y="708" font-size="13.5" fill="#6c6c73">One SLO grammar; who authors it and who consumes it is what differs.</text>
</svg>