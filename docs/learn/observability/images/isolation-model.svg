<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" style="color-scheme:light dark" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="760" height="700" fill="light-dark(#f6f6f3,#1c1e26)"></rect>
<text x="40" y="52" font-size="12" fill="light-dark(#6c6c73,#a6a6ad)" letter-spacing="1.8px" font-family="ui-monospace,Menlo,Consolas,monospace">OBSERVABILITY · TENANCY · PER-TEAM ISOLATION</text>
<text x="40" y="90" font-size="27" fill="light-dark(#1c1c22,#e9e9ee)" font-weight="600" letter-spacing="-0.3px">Real write-split, soft read scoping.</text>
<text x="40" y="118" font-size="14.5" fill="light-dark(#6c6c73,#a6a6ad)">Be honest about what&#39;s hard and what&#39;s soft. <tspan fill="light-dark(#1c1c22,#e9e9ee)">Writes</tspan> are physically separated per team — real,</text>
<text x="40" y="137" font-size="14.5" fill="light-dark(#6c6c73,#a6a6ad)">live. <tspan fill="light-dark(#1c1c22,#e9e9ee)">Reads</tspan> are scoped by Grafana RBAC, not a data-layer gate. The one true boundary underneath</text>
<text x="40" y="156" font-size="14.5" fill="light-dark(#6c6c73,#a6a6ad)">both is the network.</text>

<rect x="40" y="178" width="680" height="42" rx="10" fill="light-dark(#f9f0da,#2a2416)" stroke="light-dark(#e8d4a0,#5a4c28)" stroke-width="1"></rect>
<rect x="54" y="189" width="112" height="20" rx="6" fill="light-dark(#f3e6c4,#332c18)" stroke="light-dark(#e0cd9c,#5a4c28)" stroke-width="1"></rect>
<text x="110" y="203" font-size="11" fill="light-dark(#8a5c0a,#e6c46a)" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">X-Scope-OrgID</text>
<text x="180" y="204" font-size="13" fill="light-dark(#4a3c1c,#d8c48a)">names a tenant — but anything that reaches a store could set it. <tspan font-style="italic">It&#39;s routing, not a lock.</tspan></text>

<rect x="40" y="236" width="334" height="298" rx="12" fill="light-dark(#e7f4ec,#1e2a22)" stroke="light-dark(#bfe0cc,#3f8a63)" stroke-width="1"></rect>
<rect x="40" y="236" width="334" height="3" rx="1.5" fill="#1f8a5b"></rect>
<text x="58" y="266" font-size="16" fill="light-dark(#1c1c22,#e9e9ee)" font-weight="600">Write path</text>
<rect x="286" y="252" width="72" height="18" rx="5" fill="#1f8a5b"></rect>
<text x="322" y="265" font-size="9.5" fill="#eafcf1" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">REAL · LIVE</text>
<text x="58" y="284" font-size="10.5" fill="light-dark(#2c7a56,#7fd6a6)" font-family="ui-monospace,Menlo,Consolas,monospace">physical separation</text>
<line x1="58" y1="298" x2="356" y2="298" stroke="light-dark(#bfe0cc,#3a5446)" stroke-width="1"></line>
<rect x="58" y="310" width="298" height="42" rx="9" fill="light-dark(#dcefe3,#24352b)" stroke="light-dark(#bfe0cc,#46785c)" stroke-width="1"></rect>
<text x="72" y="330" font-size="12.5" fill="light-dark(#1c1c22,#e9e9ee)" font-weight="600">ingest</text>
<text x="72" y="345" font-size="11" fill="light-dark(#5f7d6c,#a6a6ad)">Alloy · Prometheus remote-write</text>
<path d="M202 356 L196 350 L208 350 Z" fill="#3c9a6c"></path>
<rect x="58" y="366" width="298" height="42" rx="9" fill="light-dark(#dcefe3,#24352b)" stroke="light-dark(#bfe0cc,#46785c)" stroke-width="1"></rect>
<text x="72" y="386" font-size="12.5" fill="light-dark(#1c7a4f,#7fd6a6)" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">cortex-tenant</text>
<text x="72" y="401" font-size="11" fill="light-dark(#5f7d6c,#a6a6ad)">write-splits each series by team</text>
<path d="M202 412 L196 406 L208 406 Z" fill="#3c9a6c"></path>
<rect x="58" y="422" width="143" height="42" rx="8" fill="light-dark(#d0ecdb,#24352b)" stroke="light-dark(#a8d8bd,#46785c)" stroke-width="1"></rect>
<text x="129" y="440" font-size="12.5" fill="light-dark(#1c7a4f,#7fd6a6)" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">alpha</text>
<text x="129" y="454" font-size="9.5" fill="light-dark(#5f7d6c,#a6a6ad)" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">tenant</text>
<rect x="213" y="422" width="143" height="42" rx="8" fill="light-dark(#d0ecdb,#24352b)" stroke="light-dark(#a8d8bd,#46785c)" stroke-width="1"></rect>
<text x="284" y="440" font-size="12.5" fill="light-dark(#1c7a4f,#7fd6a6)" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">bravo</text>
<text x="284" y="454" font-size="9.5" fill="light-dark(#5f7d6c,#a6a6ad)" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">tenant</text>
<text x="58" y="492" font-size="12" fill="light-dark(#25402f,#bfe0cc)">Each team&#39;s series <tspan font-style="italic">physically separated</tspan></text>
<text x="58" y="509" font-size="12" fill="light-dark(#25402f,#bfe0cc)">into its own tenant — real, end-to-end.</text>

<rect x="386" y="236" width="334" height="298" rx="12" fill="light-dark(#f9f0da,#2a2416)" stroke="light-dark(#e8d4a0,#5a4c28)" stroke-width="1"></rect>
<rect x="386" y="236" width="334" height="3" rx="1.5" fill="#b0790f"></rect>
<text x="404" y="266" font-size="16" fill="light-dark(#1c1c22,#e9e9ee)" font-weight="600">Read path</text>
<rect x="628" y="252" width="74" height="18" rx="5" fill="#b0790f"></rect>
<text x="665" y="265" font-size="9.5" fill="#fdf6e6" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">SOFT · RBAC</text>
<text x="404" y="284" font-size="10.5" fill="light-dark(#8a6410,#e6c46a)" font-family="ui-monospace,Menlo,Consolas,monospace">organizational boundary</text>
<line x1="404" y1="298" x2="702" y2="298" stroke="light-dark(#e8d4a0,#5a4c28)" stroke-width="1"></line>
<rect x="404" y="310" width="298" height="42" rx="9" fill="light-dark(#f4ead0,#332c18)" stroke="light-dark(#e8d4a0,#5a4c28)" stroke-width="1"></rect>
<circle cx="420" cy="331" r="5" fill="#e8823a"></circle>
<text x="434" y="327" font-size="12.5" fill="light-dark(#1c1c22,#e9e9ee)" font-weight="600">Grafana query</text>
<text x="434" y="343" font-size="11" fill="light-dark(#7a6a4f,#c9b985)">a team opens its dashboard</text>
<path d="M548 356 L542 350 L554 350 Z" fill="#b08a3a"></path>
<rect x="404" y="366" width="298" height="42" rx="9" fill="light-dark(#f4ead0,#332c18)" stroke="light-dark(#e8d4a0,#5a4c28)" stroke-width="1"></rect>
<text x="418" y="385" font-size="12" fill="light-dark(#8a5c0a,#e6c46a)" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">Mimir (&lt;team&gt;)</text>
<text x="418" y="400" font-size="10.5" fill="light-dark(#7a6a4f,#c9b985)">per-tenant datasource · static <tspan font-family="ui-monospace,Menlo,Consolas,monospace">X-Scope-OrgID</tspan></text>
<path d="M548 412 L542 406 L554 406 Z" fill="#b08a3a"></path>
<rect x="404" y="422" width="298" height="52" rx="9" fill="light-dark(#f6ecd2,#332c18)" stroke="light-dark(#e0cd9c,#5a4c28)" stroke-width="1" stroke-dasharray="4 3"></rect>
<text x="418" y="439" font-size="12" fill="light-dark(#4a3c1c,#d8c48a)" font-weight="600">enforced by Grafana</text>
<text x="418" y="455" font-size="10.5" fill="light-dark(#7a6a4f,#c9b985)">dashboard-folder permissions +</text>
<text x="418" y="469" font-size="10.5" fill="light-dark(#7a6a4f,#c9b985)">per-team dashboards</text>
<text x="404" y="498" font-size="12" fill="light-dark(#4a3c1c,#d8c48a)">An <tspan font-style="italic">organizational / RBAC</tspan> boundary —</text>
<text x="404" y="515" font-size="12" fill="light-dark(#4a3c1c,#d8c48a)">not a data-layer gate.</text>

<rect x="40" y="546" width="680" height="60" rx="12" fill="light-dark(#e2eff2,#172329)" stroke="light-dark(#b8dbe4,#3f7f92)" stroke-width="1.5"></rect>
<text x="58" y="571" font-size="10" fill="light-dark(#0f6f8e,#7fc6da)" letter-spacing="0.6px" font-family="ui-monospace,Menlo,Consolas,monospace">THE FLOOR</text>
<text x="58" y="590" font-size="14" fill="light-dark(#1c1c22,#e9e9ee)" font-weight="600">Network default-deny</text>
<line x1="216" y1="560" x2="216" y2="592" stroke="light-dark(#b8dbe4,#3f7f92)" stroke-width="1"></line>
<text x="232" y="572" font-size="12.5" fill="light-dark(#1c3a44,#b8d8e0)">Stores are <tspan fill="light-dark(#0f6f8e,#7fc6da)" font-family="ui-monospace,Menlo,Consolas,monospace">ClusterIP-only</tspan>; no tenant namespace can reach them. <tspan font-style="italic">The only true</tspan></text>
<text x="232" y="590" font-size="12.5" fill="light-dark(#1c3a44,#b8d8e0)"><tspan font-style="italic">data-layer boundary</tspan> — both halves above rest on it.</text>

<text x="40" y="646" font-size="14" fill="light-dark(#6c6c73,#a6a6ad)">So the honest picture: <tspan fill="light-dark(#1f8a5b,#7fd6a6)" font-weight="600">write isolation is real</tspan> and physical; <tspan fill="light-dark(#9a6a0a,#e6c46a)" font-weight="600">read isolation is</tspan></text>
<text x="40" y="666" font-size="14" fill="light-dark(#6c6c73,#a6a6ad)"><tspan fill="light-dark(#9a6a0a,#e6c46a)" font-weight="600">organizational</tspan>, enforced in Grafana; and the only hard data-layer wall is the <tspan fill="light-dark(#0f6f8e,#7fc6da)" font-weight="600">network</tspan> beneath both.</text>
</svg>