<text class="dim mono" x="270" y="384" font-size="10" fill="#9a9aa1">└ derived</text>
<text class="text" x="330" y="384" font-size="12" fill="#33333a"><tspan font-weight="500" fill="#1c1c22">Cost</tspan> = tokens × model price  <tspan fill="#b5b5ad">·</tspan>  <tspan font-weight="500" fill="#1c1c22">Eval</tspan> answers: is the agent any good?</text>


