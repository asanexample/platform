<text class="mono" x="117" y="442" font-size="9.5" fill="#0f6f8e" text-anchor="middle" letter-spacing="0.4px" font-family="ui-monospace,Menlo,Consolas,monospace">SAME MACHINE</text>
<text class="text" x="192" y="435" font-size="13" fill="#1c3a44">The same four-signal machine — <tspan class="mono" fill="#0f6f8e" font-family="ui-monospace,Menlo,Consolas,monospace">Mimir · Tempo · Grafana</tspan> — pointed at a new kind of</text>
<text class="muted" x="192" y="453" font-size="13" fill="#3a5560">workload. No new stack.</text>


<rect x="40" y="482" width="680" height="52" rx="11" fill="#efefec" stroke="#d2d2cb" stroke-width="1" stroke-dasharray="5 3"></rect>
<rect x="58" y="497" width="80" height="20" rx="6" fill="#e8e8e2" stroke="#d2d2cb" stroke-width="1" stroke-dasharray="4 2"></rect>
<text class="dim mono" x="98" y="511" font-size="9.5" fill="#8a8a91" text-anchor="middle" letter-spacing="0.4px">DEFERRED</text>
<text class="muted" x="154" y="505" font-size="12.5" fill="#5f5f66">Content capture + a dedicated LLM lens (Langfuse). <tspan fill="#1f8a5b">Live today:</tspan> real token counts, spans, and</text>
<text class="muted" x="154" y="523" font-size="12.5" fill="#5f5f66">verdict counters.</text>


<text class="muted" x="40" y="572" font-size="13.5" fill="#6c6c73">The observers get observed — <tspan class="text" fill="#1c1c22" font-weight="500">audit, cost, and an eval signal</tspan> from the same seam.</text>
