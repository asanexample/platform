<text class="muted mono" x="40" y="52" font-size="12" fill="#6c6c73" letter-spacing="1.8px">OBSERVABILITY · AGENT OBSERVABILITY · ADR-076</text>
<text class="text" x="40" y="90" font-size="27" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">One seam out, three signals in.</text>
<text class="muted" x="40" y="118" font-size="14.5" fill="#6c6c73">The platform&#39;s AI agents are just another workload — instrumented <tspan class="text" fill="#1c1c22" font-style="italic">once</tspan> with OpenTelemetry&#39;s</text>
<text class="muted" x="40" y="137" font-size="14.5" fill="#6c6c73">GenAI semantic conventions, fanned out to the same LGTM+P machine.</text>


