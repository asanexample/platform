<text class="text" x="56" y="222" font-size="15" fill="#1c1c22" font-weight="600">Triage copilot</text>
<text class="t-violet mono" x="56" y="240" font-size="10" fill="#7a52a0">an AI agent</text>
<line x1="56" y1="252" x2="174" y2="252" stroke="#d9c4f0" stroke-width="1"></line>
<text class="muted" x="56" y="272" font-size="11.5" fill="#6f5a86">one invocation</text>


