<text class="muted mono" x="40" y="52" font-size="12" fill="#6c6c73" letter-spacing="1.9px">OBSERVABILITY · THE FOUR SIGNALS</text>
<text class="text" x="40" y="90" font-size="27" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">Four questions, one pane.</text>
<text class="muted" x="40" y="118" font-size="14.5" fill="#6c6c73">Each signal answers a different question, and each lands in its own store. The power isn&#39;t any one</text>
<text class="muted" x="40" y="137" font-size="14.5" fill="#6c6c73">of them — it&#39;s having all four for the same moment, under one Grafana.</text>
<rect x="40" y="164" width="161" height="176" rx="11" fill="#eaf1fb" stroke="#c4d8f4" stroke-width="1"></rect>
