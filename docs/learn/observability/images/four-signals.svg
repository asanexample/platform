<text class="mono" x="56" y="207" font-size="10.5" fill="#3d6fc0" font-family="ui-monospace,Menlo,Consolas,monospace">numbers over time</text>
<line x1="56" y1="220" x2="185" y2="220" stroke="#c4d8f4" stroke-width="1"></line>
<text class="text" x="56" y="242" font-size="12.5" fill="#243a5c">Rate? Errors? p99</text>
<text class="text" x="56" y="258" font-size="12.5" fill="#243a5c">latency? CPU?</text>
<text class="muted" x="56" y="284" font-size="11" fill="#7a7a80">cheap, aggregate — bad</text>
<text class="muted" x="56" y="299" font-size="11" fill="#7a7a80">at &#34;why this one request&#34;</text>
