ke:#a98780}}</style>
<rect class="bg" x="0" y="0" width="760" height="470" fill="#f6f6f3"></rect>
<text class="muted mono" x="40" y="52" font-size="12" fill="#6c6c73" letter-spacing="1.8px">OBSERVABILITY · CORRELATION · THE RETURN JUMP</text>
<text class="text" x="40" y="88" font-size="24" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px">A loop for the instrumented, a one-way street for the rest.</text>
<text class="muted" x="40" y="116" font-size="14.5" fill="#6c6c73">The forward walk — <tspan class="mono" fill="#5a6a86" font-family="ui-monospace,Menlo,Consolas,monospace">metric → trace → logs / profile</tspan> — works for everyone. Only the return</text>
<text class="muted" x="40" y="135" font-size="14.5" fill="#6c6c73">jump <tspan class="mono" fill="#2c7a56" font-family="ui-monospace,Menlo,Consolas,monospace">logs → trace</tspan> depends on the SDK.</text>
<rect x="40" y="158" width="334" height="230" rx="12" fill="#e7f4ec" stroke="#bfe0cc" stroke-width="1"></rect>
<text class="text" x="58" y="184" font-size="14" fill="#1c1c22" font-weight="600">SDK / L1</text>
<text class="mono" x="132" y="184" font-size="10" fill="#1c7a4f" font-family="ui-monospace,Menlo,Consolas,monospace">closed loop</text>
<line x1="120" y1="227" x2="166" y2="227" stroke="#7a8faa" stroke-width="1.5"></line>
