<text x="612" y="284" font-size="16" fill="#c0392b" text-anchor="middle">✕</text>
<rect x="404" y="214" width="62" height="26" rx="8" fill="#dce8fa" stroke="#9fbce8" stroke-width="1"></rect><text x="435" y="231" font-size="12" fill="#2c66c4" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">metric</text>
<rect x="517" y="214" width="58" height="26" rx="8" fill="#f7efd8" stroke="#e0cd9c" stroke-width="1"></rect><text x="546" y="231" font-size="12" fill="#9a6a0a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">trace</text>
<rect x="626" y="214" width="56" height="26" rx="8" fill="#dcefe3" stroke="#a8d8bd" stroke-width="1"></rect><text x="654" y="231" font-size="12" fill="#1c7a4f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">logs</text>
<rect x="514" y="300" width="64" height="26" rx="8" fill="#efe6f9" stroke="#cdb4e8" stroke-width="1"></rect><text x="546" y="317" font-size="12" fill="#8a4fc4" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">profile</text>
<line x1="404" y1="361" x2="418" y2="361" stroke="#cf5a48" stroke-width="2" stroke-dasharray="4 3"></line>
<text class="muted" x="426" y="357" font-size="11.5" fill="#7a5a54">Beyla never stamps <tspan class="mono" font-family="ui-monospace,monospace" font-size="10">trace_id</tspan> into the</text>
<text class="muted" x="426" y="372" font-size="11.5" fill="#7a5a54">app&#39;s own logs — the return jump never lights up.</text>
<text class="muted" x="40" y="424" font-size="13.5" fill="#6c6c73">The forward walk works for everyone. Only L1 gets the round trip.</text>
