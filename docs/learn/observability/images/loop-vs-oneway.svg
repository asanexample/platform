<path d="M209 251 L214 241 L219 251 Z" fill="#1f9a63"></path>
<rect x="58" y="214" width="62" height="26" rx="8" fill="#dce8fa" stroke="#9fbce8" stroke-width="1"></rect><text x="89" y="231" font-size="12" fill="#2c66c4" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">metric</text>
<rect x="171" y="214" width="58" height="26" rx="8" fill="#f7efd8" stroke="#e0cd9c" stroke-width="1"></rect><text x="200" y="231" font-size="12" fill="#9a6a0a" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">trace</text>
<rect x="280" y="214" width="56" height="26" rx="8" fill="#dcefe3" stroke="#a8d8bd" stroke-width="1"></rect><text x="308" y="231" font-size="12" fill="#1c7a4f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">logs</text>
<rect x="168" y="300" width="64" height="26" rx="8" fill="#efe6f9" stroke="#cdb4e8" stroke-width="1"></rect><text x="200" y="317" font-size="12" fill="#8a4fc4" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">profile</text>
<rect x="58" y="360" width="14" height="3" rx="1.5" fill="#1f9a63"></rect>
<text class="muted" x="80" y="357" font-size="11.5" fill="#3c7a5c">log lines carry <tspan class="mono" font-family="ui-monospace,monospace" font-size="10">trace_id</tspan> in Loki structured</text>
<text class="muted" x="80" y="372" font-size="11.5" fill="#3c7a5c">metadata (Alloy promotes it) — a log clicks back to its trace.</text>
<rect x="386" y="158" width="334" height="230" rx="12" fill="#fae9e6" stroke="#ecc3bc" stroke-width="1"></rect>
<text class="text" x="404" y="184" font-size="14" fill="#1c1c22" font-weight="600">Beyla-only / L0</text>
<text class="mono" x="516" y="184" font-size="10" fill="#a5342a" font-family="ui-monospace,Menlo,Consolas,monospace">one-way</text>
