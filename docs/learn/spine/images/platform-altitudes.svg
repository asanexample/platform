<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 692" width="760" height="692" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#9fbaf0"]{fill:#81a5ee}[stroke="#9fbaf0"]{stroke:#81a5ee}[fill="#7f9be0"]{fill:#8aa4e5}[stroke="#7f9be0"]{stroke:#8aa4e5}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a9d3ba"]{fill:#9fd0b3}[stroke="#a9d3ba"]{stroke:#9fd0b3}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#ffffff"]{fill:#141414}[stroke="#ffffff"]{stroke:#141414}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#4a4a50"]{fill:#dfdfe2}[stroke="#4a4a50"]{stroke:#dfdfe2}[fill="#f7efdc"]{fill:#584519}[stroke="#f7efdc"]{stroke:#584519}[fill="#e0be7e"]{fill:#e6c68a}[stroke="#e0be7e"]{stroke:#e6c68a}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}[fill="#f0eafa"]{fill:#2d1851}[stroke="#f0eafa"]{stroke:#2d1851}[fill="#cdb6ec"]{fill:#3f1f6b}[stroke="#cdb6ec"]{stroke:#3f1f6b}[fill="#6a3fb0"]{fill:#9b79d2}[stroke="#6a3fb0"]{stroke:#9b79d2}[fill="#e2f1f4"]{fill:#1f4951}[stroke="#e2f1f4"]{stroke:#1f4951}[fill="#a9d3dc"]{fill:#98ccd7}[stroke="#a9d3dc"]{stroke:#98ccd7}[fill="#0f6f86"]{fill:#2cc7ec}[stroke="#0f6f86"]{stroke:#2cc7ec}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}}</style><rect class="f_bg" x="0" y="0" width="760" height="692" fill="#f6f6f3"></rect><text class="mono f_muted" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.6px"><tspan x="40">THE MAP · WHAT SITS ON WHAT</tspan></text><text class="f_text" x="40" y="92" font-size="28" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px"><tspan x="40">Control planes all the way down</tspan></text><text class="f_muted" x="40" y="118" font-size="15" fill="#6c6c73"><tspan x="40">Each layer takes the one below as a given, hides it, and offers a simpler abstraction up.</tspan><tspan x="40" dy="20">Read bottom to top — every rung raises the floor.</tspan></text><rect x="40" y="176" width="56" height="392" rx="12" class="f_gitBg s_gitBd" fill="#eaf0fc" stroke="#9fbaf0" stroke-width="1"></rect><line class="s_gitLine" x1="68" y1="192" x2="68" y2="552" stroke="#7f9be0" stroke-width="2" stroke-dasharray="4 4"></line><text class="mono f_blue" transform="rotate(-90 68 372)" x="68" y="372" font-size="13" fill="#2f5fd0" text-anchor="middle" letter-spacing="0.04em">git · declared state</text><rect x="108" y="176" width="504" height="72" rx="11" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a9d3ba" stroke-width="1"></rect><rect x="108" y="184" width="3" height="56" rx="1.5" class="f_green" fill="#1f7a49"></rect><text class="mono f_green" x="124" y="203" font-size="14" fill="#1f7a49" font-weight="600"><tspan x="124">Your workload</tspan></text><text class="mono f_muted" x="598" y="203" font-size="11.5" fill="#6c6c73" text-anchor="end"><tspan x="598">user space</tspan></text><text class="f_muted" x="124" y="226" font-size="12.5" fill="#6c6c73"><tspan>A Product’s Service, serving real traffic — </tspan><tspan class="f_text" fill="#1c1c22">the thin layer you write.</tspan></text><rect x="108" y="256" width="504" height="72" rx="11" class="f_card s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="108" y="264" width="3" height="56" rx="1.5" class="f_blue" fill="#2f5fd0"></rect><text class="mono f_blue" x="124" y="283" font-size="14" fill="#2f5fd0" font-weight="500"><tspan x="124">Delivery</tspan></text><text class="mono f_muted" x="598" y="283" font-size="11.5" fill="#6c6c73" text-anchor="end"><tspan x="598">ArgoCD · Argo Rollouts</tspan></text><text class="f_muted" x="124" y="306" font-size="12.5" fill="#6c6c73"><tspan>takes </tspan><tspan class="f_text" fill="#1c1c22">a home + a version in git</tspan><tspan> → offers </tspan><tspan class="f_text" fill="#1c1c22">that version, safely running</tspan></text><rect x="108" y="336" width="504" height="72" rx="11" class="f_card s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="108" y="344" width="3" height="56" rx="1.5" class="f_blue" fill="#2f5fd0"></rect><text class="mono f_blue" x="124" y="363" font-size="14" fill="#2f5fd0" font-weight="500"><tspan x="124">Provisioning</tspan></text><text class="mono f_muted" x="598" y="363" font-size="11.5" fill="#6c6c73" text-anchor="end"><tspan x="598">Crossplane · Environment API</tspan></text><text class="f_muted" x="124" y="386" font-size="12.5" fill="#6c6c73"><tspan>takes </tspan><tspan class="f_text" fill="#1c1c22">a cluster</tspan><tspan> → offers </tspan><tspan class="f_text" fill="#1c1c22">isolated, governed homes on request</tspan></text><rect x="108" y="416" width="504" height="72" rx="11" class="f_card s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="108" y="424" width="3" height="56" rx="1.5" class="f_blue" fill="#2f5fd0"></rect><text class="mono f_blue" x="124" y="443" font-size="14" fill="#2f5fd0" font-weight="500"><tspan x="124">The cluster</tspan></text><text class="mono f_muted" x="598" y="443" font-size="11.5" fill="#6c6c73" text-anchor="end"><tspan x="598">EKS · Cilium · Karpenter · Gateway API</tspan></text><text class="f_muted" x="124" y="466" font-size="12.5" fill="#6c6c73"><tspan>takes </tspan><tspan class="f_text" fill="#1c1c22">an account + network</tspan><tspan> → offers </tspan><tspan class="f_text" fill="#1c1c22">a place to run containers</tspan></text><rect x="108" y="496" width="504" height="72" rx="11" class="f_card s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="108" y="504" width="3" height="56" rx="1.5" class="f_neutral" fill="#4a4a50"></rect><text class="mono f_neutral" x="124" y="523" font-size="14" fill="#4a4a50" font-weight="500"><tspan x="124">Cloud foundations</tspan></text><text class="mono f_muted" x="598" y="523" font-size="11.5" fill="#6c6c73" text-anchor="end"><tspan x="598">accounts · SCPs · network · IaC</tspan></text><text class="f_muted" x="124" y="546" font-size="12.5" fill="#6c6c73"><tspan>takes </tspan><tspan class="f_text" fill="#1c1c22">raw AWS</tspan><tspan> → </tspan><tspan class="f_text" fill="#1c1c22">named, networked, guardrailed accounts</tspan></text><rect x="624" y="176" width="28" height="392" rx="10" class="f_amberBg s_amberBd" fill="#f7efdc" stroke="#e0be7e" stroke-width="1"></rect><text class="mono f_amber" transform="rotate(-90 638 372)" x="638" y="372" font-size="11.5" fill="#8a6410" text-anchor="middle" letter-spacing="0.04em">Policy</text><rect x="658" y="176" width="28" height="392" rx="10" class="f_violetBg s_violetBd" fill="#f0eafa" stroke="#cdb6ec" stroke-width="1"></rect><text class="mono f_violet" transform="rotate(-90 672 372)" x="672" y="372" font-size="11.5" fill="#6a3fb0" text-anchor="middle" letter-spacing="0.04em">Identity</text><rect x="692" y="176" width="28" height="392" rx="10" class="f_cyanBg s_cyanBd" fill="#e2f1f4" stroke="#a9d3dc" stroke-width="1"></rect><text class="mono f_cyan" transform="rotate(-90 706 372)" x="706" y="372" font-size="11.5" fill="#0f6f86" text-anchor="middle" letter-spacing="0.04em">Observability</text><rect x="40" y="584" width="680" height="54" rx="12" class="f_gitBg s_gitBd" fill="#eaf0fc" stroke="#9fbaf0" stroke-width="1"></rect><text class="f_blue" x="60" y="606" font-size="13.5" fill="#2f5fd0"><tspan x="60">Every rung is the <tspan font-weight="600">same shape</tspan>: declare desired state in git, a control plane reconciles reality</tspan><tspan x="60" dy="19">to it — forever. Different nouns per altitude; one identical verb.</tspan></text><text class="f_muted" x="40" y="668" font-size="13" fill="#6c6c73"><tspan x="40"><tspan class="f_dim mono" fill="#9a9aa1">UTILITIES IN THE WALLS · </tspan><tspan class="f_amber" fill="#8a6410">Policy</tspan>, <tspan class="f_violet" fill="#6a3fb0">identity</tspan>, <tspan class="f_cyan" fill="#0f6f86">observability</tspan> cut vertically through every altitude —</tspan><tspan x="40" dy="18">which is why &#34;what layer is Kyverno?&#34; has no answer: it&#39;s all of them.</tspan></text></svg>