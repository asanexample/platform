<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 886" width="760" height="886" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><defs><clipPath id="abar0"><rect x="57.0" y="343.0" width="10.0" height="60.0"/></clipPath><clipPath id="abar1"><rect x="57.0" y="415.0" width="10.0" height="78.0"/></clipPath></defs><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#d8b877"]{fill:#e1c68e}[stroke="#d8b877"]{stroke:#e1c68e}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a9d3ba"]{fill:#9fd0b3}[stroke="#a9d3ba"]{stroke:#9fd0b3}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#7bbd97"]{fill:#9fd1b4}[stroke="#7bbd97"]{stroke:#9fd1b4}[fill="#ffffff"]{fill:#141414}[stroke="#ffffff"]{stroke:#141414}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#fbf2df"]{fill:#554219}[stroke="#fbf2df"]{stroke:#554219}[fill="#e0be7e"]{fill:#e6c68a}[stroke="#e0be7e"]{stroke:#e6c68a}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#c3ccdf"]{fill:#303d5a}[stroke="#c3ccdf"]{stroke:#303d5a}[fill="#5f78b8"]{fill:#9babd4}[stroke="#5f78b8"]{stroke:#9babd4}}</style><rect class="f_bg" x="0" y="0" width="760" height="886" fill="#f6f6f3"></rect><text class="mono f_muted" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.6px"><tspan x="40">DATA PLANE · IN MOTION</tspan></text><text class="f_text" x="40" y="92" font-size="28" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px"><tspan x="40">One request, edge to pod and back</tspan></text><text class="f_muted" x="40" y="118" font-size="15" fill="#6c6c73"><tspan x="40">A live request flows through the running result of the platform — not the machinery that</tspan><tspan x="40" dy="20">built it. Follow one HTTP GET, and notice what it never touches.</tspan></text><rect x="40" y="176" width="680" height="564" rx="16" class="s_obsBd" fill="none" stroke="#d8b877" stroke-width="1" stroke-dasharray="6 5"></rect><circle cx="66" cy="198" r="4.5" class="f_amber" fill="#8a6410"></circle><text class="mono f_amber" x="78" y="202" font-size="11" fill="#8a6410" letter-spacing="0.05em"><tspan x="78">OBSERVED THE WHOLE TIME</tspan></text><text class="f_muted" x="268" y="202" font-size="12" fill="#6c6c73"><tspan x="268">OpenTelemetry + eBPF · traces + RED metrics, uninstrumented</tspan></text><rect x="58" y="228" width="644" height="44" rx="11" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a9d3ba" stroke-width="1"></rect><rect x="58" y="236" width="3" height="28" rx="1.5" class="f_green" fill="#1f7a49"></rect><text class="mono f_mono2" x="74" y="255" font-size="12" fill="#6c6c73"><tspan x="74">1</tspan></text><text class="mono f_green" x="98" y="255" font-size="13.5" fill="#1f7a49" font-weight="500"><tspan x="98">Browser</tspan></text><text class="f_text" x="262" y="255" font-size="13" fill="#1c1c22"><tspan x="262">GET  shop-acme-dev…</tspan></text><line class="s_greenLine" x1="92" y1="272" x2="92" y2="286" stroke="#7bbd97" stroke-width="2"></line><rect x="58" y="286" width="644" height="44" rx="11" class="f_card s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="58" y="294" width="3" height="28" rx="1.5" class="f_green" fill="#1f7a49"></rect><text class="mono f_mono2" x="74" y="313" font-size="12" fill="#6c6c73"><tspan x="74">2</tspan></text><text class="mono f_green" x="98" y="313" font-size="13.5" fill="#1f7a49" font-weight="500"><tspan x="98">DNS · Route53</tspan></text><text class="f_text" x="262" y="313" font-size="13" fill="#1c1c22"><tspan x="262">Host → the shared gateway’s IP  · published by external-dns</tspan></text><line class="s_greenLine" x1="92" y1="330" x2="92" y2="344" stroke="#7bbd97" stroke-width="2"></line><rect x="58" y="344" width="644" height="58" rx="11" class="f_card s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="59.3" y="345.3" width="641.5" height="55.5" rx="9.8" fill="none" stroke="#1f7a49" stroke-width="2.5" clip-path="url(#abar0)"></rect><text class="mono f_mono2" x="74" y="378" font-size="12" fill="#6c6c73"><tspan x="74">3</tspan></text><text class="mono f_green" x="98" y="378" font-size="13.5" fill="#1f7a49" font-weight="500"><tspan x="98">NLB → Envoy</tspan></text><text class="f_text" x="262" y="369" font-size="13" fill="#1c1c22"><tspan x="262">The single ingress; TLS terminated (cert-manager),</tspan><tspan x="262" dy="16">acting under Cilium identity  ingress</tspan></text><line class="s_greenLine" x1="92" y1="402" x2="92" y2="416" stroke="#7bbd97" stroke-width="2"></line><rect x="58" y="416" width="644" height="76" rx="11" class="f_amberBg s_amberBd" fill="#fbf2df" stroke="#e0be7e" stroke-width="1"></rect><rect x="59.3" y="417.3" width="641.5" height="73.5" rx="9.8" fill="none" stroke="#8a6410" stroke-width="2.5" clip-path="url(#abar1)"></rect><text class="mono f_mono2" x="74" y="442" font-size="12" fill="#6c6c73"><tspan x="74">4</tspan></text><text class="mono f_amber" x="98" y="442" font-size="13.5" fill="#8a6410" font-weight="500"><tspan x="98">HTTPRoute</tspan></text><text class="f_amber" x="262" y="442" font-size="13" fill="#8a6410"><tspan x="262">Gateway API routes by Host →  shop-web  Service</tspan></text><text class="f_amber" x="98" y="464" font-size="12" fill="#8a6410"><tspan x="98">◀ the one coupling — if mid-rollout, the route is weighted 10%</tspan></text><text class="f_amber" x="98" y="479" font-size="12" fill="#8a6410"><tspan x="98">canary / 90% stable. Rollouts edited it, then left the path.</tspan></text><line class="s_greenLine" x1="92" y1="492" x2="92" y2="506" stroke="#7bbd97" stroke-width="2"></line><rect x="58" y="506" width="644" height="44" rx="11" class="f_card s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="58" y="514" width="3" height="28" rx="1.5" class="f_green" fill="#1f7a49"></rect><text class="mono f_mono2" x="74" y="533" font-size="12" fill="#6c6c73"><tspan x="74">5</tspan></text><text class="mono f_green" x="98" y="533" font-size="13.5" fill="#1f7a49" font-weight="500"><tspan x="98">Cilium · netpol</tspan></text><text class="f_text" x="262" y="533" font-size="13" fill="#1c1c22"><tspan x="262">Must permit  fromEntities:[ingress]  — or the packet is dropped</tspan></text><line class="s_greenLine" x1="92" y1="550" x2="92" y2="564" stroke="#7bbd97" stroke-width="2"></line><rect x="58" y="564" width="644" height="44" rx="11" class="f_card s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="58" y="572" width="3" height="28" rx="1.5" class="f_green" fill="#1f7a49"></rect><text class="mono f_mono2" x="74" y="591" font-size="12" fill="#6c6c73"><tspan x="74">6</tspan></text><text class="mono f_green" x="98" y="591" font-size="13.5" fill="#1f7a49" font-weight="500"><tspan x="98">Cilium · eBPF LB</tspan></text><text class="f_text" x="262" y="591" font-size="13" fill="#1c1c22"><tspan x="262">Load-balances to a healthy pod — no kube-proxy</tspan></text><line class="s_greenLine" x1="92" y1="608" x2="92" y2="622" stroke="#7bbd97" stroke-width="2"></line><rect x="58" y="622" width="644" height="44" rx="11" class="f_card s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="58" y="630" width="3" height="28" rx="1.5" class="f_green" fill="#1f7a49"></rect><text class="mono f_mono2" x="74" y="649" font-size="12" fill="#6c6c73"><tspan x="74">7</tspan></text><text class="mono f_green" x="98" y="649" font-size="13.5" fill="#1f7a49" font-weight="500"><tspan x="98">The pod serves</tspan></text><text class="f_text" x="262" y="649" font-size="13" fill="#1c1c22"><tspan x="262">Renders · Pod Identity for AWS · east-west via mTLS</tspan></text><line class="s_greenLine" x1="92" y1="666" x2="92" y2="680" stroke="#7bbd97" stroke-width="2"></line><rect x="58" y="680" width="644" height="44" rx="11" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a9d3ba" stroke-width="1"></rect><rect x="58" y="688" width="3" height="28" rx="1.5" class="f_green" fill="#1f7a49"></rect><text class="mono f_mono2" x="74" y="707" font-size="12" fill="#6c6c73"><tspan x="74">8</tspan></text><text class="mono f_green" x="98" y="707" font-size="13.5" fill="#1f7a49" font-weight="500"><tspan x="98">↩ Response</tspan></text><text class="f_text" x="262" y="707" font-size="13" fill="#1c1c22"><tspan x="262">Retraces the path back out — milliseconds later, the page</tspan></text><rect x="40" y="758" width="680" height="104" rx="14" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><text class="mono f_muted" x="62" y="786" font-size="11" fill="#6c6c73" letter-spacing="0.05em"><tspan x="62">✗ NOT IN THE PATH</tspan></text><text class="f_muted" x="210" y="786" font-size="12.5" fill="#6c6c73"><tspan x="210">— the control plane set the stage and stepped out</tspan></text><rect x="62" y="806" width="67.2" height="30" rx="8" class="s_blueBdDim" fill="none" stroke="#c3ccdf" stroke-width="1" stroke-dasharray="5 4"></rect><text class="mono f_blueDim" x="95.6" y="825" font-size="12.5" fill="#5f78b8" text-anchor="middle"><tspan x="95.6">ArgoCD</tspan></text><rect x="141.2" y="806" width="96" height="30" rx="8" class="s_blueBdDim" fill="none" stroke="#c3ccdf" stroke-width="1" stroke-dasharray="5 4"></rect><text class="mono f_blueDim" x="189.2" y="825" font-size="12.5" fill="#5f78b8" text-anchor="middle"><tspan x="189.2">Crossplane</tspan></text><rect x="249.2" y="806" width="74.4" height="30" rx="8" class="s_blueBdDim" fill="none" stroke="#c3ccdf" stroke-width="1" stroke-dasharray="5 4"></rect><text class="mono f_blueDim" x="286.4" y="825" font-size="12.5" fill="#5f78b8" text-anchor="middle"><tspan x="286.4">Kyverno</tspan></text><rect x="335.6" y="806" width="81.6" height="30" rx="8" class="s_blueBdDim" fill="none" stroke="#c3ccdf" stroke-width="1" stroke-dasharray="5 4"></rect><text class="mono f_blueDim" x="376.40000000000003" y="825" font-size="12.5" fill="#5f78b8" text-anchor="middle"><tspan x="376.40000000000003">the Gate</tspan></text><rect x="429.20000000000005" y="806" width="38.4" height="30" rx="8" class="s_blueBdDim" fill="none" stroke="#c3ccdf" stroke-width="1" stroke-dasharray="5 4"></rect><text class="mono f_blueDim" x="448.40000000000003" y="825" font-size="12.5" fill="#5f78b8" text-anchor="middle"><tspan x="448.40000000000003">CI</tspan></text></svg>