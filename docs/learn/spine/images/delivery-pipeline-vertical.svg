8">a new digest</tspan></text><text class="dim mono" x="528" y="470" font-size="9.5" fill="#9a9aa1" letter-spacing="0.4px"><tspan x="528">→ TOWARD</tspan></text><text class="text" x="528" y="484" font-size="12.5" fill="#1c1c22"><tspan x="528">a Release PR</tspan><tspan x="528" dy="14">(platform repo)</tspan></text><line class="l-git" x1="196" y1="564" x2="164" y2="564" stroke="#b3c2ec" stroke-width="2" stroke-dasharray="3 3"></line><path class="f-git" fill="#b3c2ec" d="M156 564 L165 558 L165 570 Z"></path><rect class="card" x="196" y="520" width="524" height="88" rx="12" fill="#ffffff" stroke="#e4e4df"></rect><rect class="a-git" x="196" y="528" width="3" height="72" rx="1.5" fill="#2f5fd0"></rect><text class="dim mono" x="212" y="546" font-size="12" fill="#9a9aa1"><tspan x="212">04</tspan></text><text class="dim" x="320" y="546" font-size="14" fill="#9a9aa1" text-anchor="end">↻</text><text class="a-git mono" x="212" y="566" font-size="13" fill="#2f5fd0" font-weight="500"><tspan x="212">The Gate</tspan></text><text class="text" x="342" y="551" font-size="15" fill="#1c1c22" font-weight="500"><tspan x="342">Climb the ladder —</tspan><tspan x="342" dy="18">auto below prod,</tspan><tspan x="342" dy="18">human at prod</tspan></text><line class="divln" x1="520" y1="534" x2="520" y2="594" stroke="#eae8e2"></line><text class="dim mono" x="528" y="547" font-size="9.5" fill="#9a9aa1" letter-spacing="0.4px"><tspan x="528">WATCHES</tspan></text><text class="text" x="528" y="561" font-size="12.5" fill="#1c1c22"><tspan x="528">the Release PR + health</tspan></text><text class="dim mono" x="528" y="575" font-size="9.5" fill="#9a9aa1" letter-spacing="0.4px"><tspan x="528">→ TOWARD</tspan></text><text class="text" x="528" y="589" font-size="12.5" fill="#1c1c22"><tspan x="528">a merged Release record</tspan></text><line class="l-git" x1="196" y1="662" x2="164" y2="662" stroke="#b3c2ec" stroke-width="2" stroke-dasharray="3 3"></line><path class="f-git" fill="#b3c2ec" d="M156 662 L165 656 L165 668 Z"></path><rect class="card" x="196" y="618" width="524" height="88" rx="12" fill="#ffffff" stroke="#e4e4df"></rect><rect class="a-git" x="196" y="626" width="3" height="72" rx="1.5" fill="#2f5fd0"></rect><text class="dim mono" x="212" y="644" font-size="12" fill="#9a9aa1"><tspan x="212">05</tspan></text><text class="dim" x="320" y="644" font-size="14" fill="#9a9aa1" text-anchor="end">↻</text><text class="a-git mono" x="212" y="664" font-size="13" fill="#2f5fd0" font-weight="500"><tspan x="212">Argo CD</tspan></text><text class="text" x="342" y="658" font-size="15" fill="#1c1c22" font-weight="500"><tspan x="342">Sync manifests onto</tspan><tspan x="342" dy="18">the cluster</tspan></text><line class="divln" x1="520" y1="632" x2="520" y2="692" stroke="#eae8e2"></line><text class="dim mono" x="528" y="645" font-size="9.5" fill="#9a9aa1" letter-spacing="0.4px"><tspan x="528">WATCHES</tspan></text><text class="text" x="528" y="659" font-size="12.5" fill="#1c1c22"><tspan x="528">the platform git repo</tspan></text><text class="dim mono" x="528" y="673" font-size="9.5" fill="#9a9aa1" letter-spacing="0.4px"><tspan x="528">→ TOWARD</tspan></text><text class="text" x="528" y="687" font-size="12.5" fill="#1c1c22"><tspan x="528">cluster = git</tspan></text><line class="l-cluster" x1="196" y1="760" x2="164" y2="760" stroke="#a9d3ba" stroke-width="2" stroke-dasharray="3 3"></line><path class="f-cluster" fill="#a9d3ba" d="M156 760 L165 754 L165 766 Z"></path><rect class="card" x="196" y="716" width="524" height="88" rx="12" fill="#ffffff" stroke="#e4e4df"></rect><rect class="a-cluster" x="196" y="724" width="3" height="72" rx="1.5" fill="#1f7a49"></rect><text class="dim mono" x="212" y="742" font-size="12" fill="#9a9aa1"><tspan x="212">06</tspan></text><text class="dim" x="320" y="742" font-size="14" fill="#9a9aa1" text-anchor="end">↻</text><text class="a-cluster mono" x="212" y="762" font-size="13" fill="#1f7a49" font-weight="500"><tspan x="212">Kyverno</tspan></text>