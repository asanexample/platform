ono" x="528" y="862" font-size="9.5" fill="#9a9aa1" letter-spacing="0.4px"><tspan x="528">→ TOWARD</tspan></text><text class="text" x="528" y="876" font-size="12.5" fill="#1c1c22"><tspan x="528">traffic on a</tspan><tspan x="528" dy="14">healthy version</tspan></text><line class="l-cluster" x1="196" y1="956" x2="164" y2="956" stroke="#a9d3ba" stroke-width="2" stroke-dasharray="3 3"></line><path class="f-cluster" fill="#a9d3ba" d="M156 956 L165 950 L165 962 Z"></path><rect class="card" x="196" y="912" width="524" height="88" rx="12" fill="#ffffff" stroke="#e4e4df"></rect><rect class="a-cluster" x="196" y="920" width="3" height="72" rx="1.5" fill="#1f7a49"></rect><text class="dim mono" x="212" y="938" font-size="12" fill="#9a9aa1"><tspan x="212">08</tspan></text><text class="dim" x="320" y="938" font-size="14" fill="#9a9aa1" text-anchor="end">↻</text><text class="a-cluster mono" x="212" y="958" font-size="12" fill="#1f7a49" font-weight="500"><tspan x="212">Karpenter · Cilium</tspan><tspan x="212" dy="15">· Pod ID</tspan></text><text class="text" x="342" y="952" font-size="15" fill="#1c1c22" font-weight="500"><tspan x="342">Give it a node, a</tspan><tspan x="342" dy="18">network, an identity</tspan></text><line class="divln" x1="520" y1="926" x2="520" y2="986" stroke="#eae8e2"></line><text class="dim mono" x="528" y="932" font-size="9.5" fill="#9a9aa1" letter-spacing="0.4px"><tspan x="528">WATCHES</tspan></text><text class="text" x="528" y="946" font-size="12.5" fill="#1c1c22"><tspan x="528">unschedulable + new pods</tspan></text><text class="dim mono" x="528" y="960" font-size="9.5" fill="#9a9aa1" letter-spacing="0.4px"><tspan x="528">→ TOWARD</tspan></text><text class="text" x="528" y="974" font-size="12.5" fill="#1c1c22"><tspan x="528">nodes · net ·</tspan><tspan x="528" dy="14">scoped creds</tspan></text><line class="l-cluster" x1="196" y1="1054" x2="164" y2="1054" stroke="#a9d3ba" stroke-width="2" stroke-dasharray="3 3"></line><path class="f-cluster" fill="#a9d3ba" d="M156 1054 L165 1048 L165 1060 Z"></path><rect class="card" x="196" y="1010" width="524" height="88" rx="12" fill="#ffffff" stroke="#e4e4df"></rect><rect class="a-cluster" x="196" y="1018" width="3" height="72" rx="1.5" fill="#1f7a49"></rect><text class="dim mono" x="212" y="1036" font-size="12" fill="#9a9aa1"><tspan x="212">09</tspan></text><text class="dim" x="320" y="1036" font-size="14" fill="#9a9aa1" text-anchor="end">↻</text><text class="a-cluster mono" x="212" y="1056" font-size="13" fill="#1f7a49" font-weight="500"><tspan x="212">Gateway API ·</tspan><tspan x="212" dy="15">cert-manager</tspan></text><text class="text" x="342" y="1050" font-size="15" fill="#1c1c22" font-weight="500"><tspan x="342">Route live traffic in,</tspan><tspan x="342" dy="18">encrypted</tspan></text><line class="divln" x1="520" y1="1024" x2="520" y2="1084" stroke="#eae8e2"></line><text class="dim mono" x="528" y="1030" font-size="9.5" fill="#9a9aa1" letter-spacing="0.4px"><tspan x="528">WATCHES</tspan></text><text class="text" x="528" y="1044" font-size="12.5" fill="#1c1c22"><tspan x="528">routes + certs</tspan></text><text class="dim mono" x="528" y="1058" font-size="9.5" fill="#9a9aa1" letter-spacing="0.4px"><tspan x="528">→ TOWARD</tspan></text><text class="text" x="528" y="1072" font-size="12.5" fill="#1c1c22"><tspan x="528">traffic → healthy</tspan><tspan x="528" dy="14">pods, TLS</tspan></text><line class="l-signals" x1="196" y1="1152" x2="164" y2="1152" stroke="#d9c79b" stroke-width="2" stroke-dasharray="3 3"></line><path class="f-signals" fill="#d9c79b" d="M156 1152 L165 1146 L165 1158 Z"></path><rect class="card" x="196" y="1108" width="524" height="88" rx="12" fill="#ffffff" stroke="#e4e4df"></rect><rect class="a-signals" x="196" y="1116" width="3" height="72" rx="1.5" fill="#8a6410"></rect><text class="dim mono" x="212" y="1134" font-size="12" fill="#9a9aa1"><tspan x="212">10</tspan></text><text class="dim" x="320" y="1134" font-size="14" fill="#9a9aa1" text-anchor="end">↻</text><text class="a-signals mono" x="212" y="1154" font-size="13" fill="#8a6410" font-weight="500"><tspan x="212">Observability ·</tspan><tspan x="212" dy="15">on-call</tspan></text><text class="text" x="342" y="1148" font-size="15" fill="#1c1c22" font-weight="500"><tspan x="342">Watch signals · page</tspan><tspan x="342" dy="18">the owning team</tspan></text><line class="divln" x1="520" y1="1122" x2="520" y2="1182" stroke="#eae8e2"></line><text class="dim mono" x="528" y="1128" font-size="9.5" fill="#9a9aa1" letter-spacing="0.4px"><tspan x="528">WATCHES</tspan></text><text class="text" x="528" y="1142" font-size="12.5" fill="#1c1c22"><tspan x="528">the running service</tspan></text><text class="dim mono" x="528" y="1156" font-size="9.5" fill="#9a9aa1" letter-spacing="0.4px"><tspan x="528">→ TOWARD</tspan></text><text class="text" x="528" y="1170" font-size="12.5" fill="#1c1c22"><tspan x="528">SLOs met · right</tspan><tspan x="528" dy="14">team paged</tspan></text><text class="muted" x="40" y="1232" font-size="14" fill="#6c6c73"><tspan x="40">Every plane pulls from this shared truth — none talks to the next. The whole job is</tspan><tspan x="40" dy="20">to make <tspan class="green" fill="#1f7a49" font-weight="600">cluster</tspan> match <tspan class="blue" fill="#2f5fd0" font-weight="600">git</tspan>, and keep it there. Roll back a stateless change by</tspan><tspan x="40" dy="20">reverting the commit — the same choreography ships the revert.</tspan></text></svg>