<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 852" width="760" height="852" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#8f8f95"]{fill:#89898f}[stroke="#8f8f95"]{stroke:#89898f}[fill="#eeeeeb"]{fill:#1f1f1c}[stroke="#eeeeeb"]{stroke:#1f1f1c}[fill="#cfcfc9"]{fill:#31312b}[stroke="#cfcfc9"]{stroke:#31312b}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#3f9d6b"]{fill:#6fc899}[stroke="#3f9d6b"]{stroke:#6fc899}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#a9d3ba"]{fill:#9fd0b3}[stroke="#a9d3ba"]{stroke:#9fd0b3}[fill="#d8d8d3"]{fill:#2c2c27}[stroke="#d8d8d3"]{stroke:#2c2c27}[fill="#b4462f"]{fill:#da7965}[stroke="#b4462f"]{stroke:#da7965}[fill="#8a8a86"]{fill:#8e8e8a}[stroke="#8a8a86"]{stroke:#8e8e8a}[fill="#ffffff"]{fill:#141414}[stroke="#ffffff"]{stroke:#141414}[fill="#9fbaf0"]{fill:#81a5ee}[stroke="#9fbaf0"]{stroke:#81a5ee}[fill="#5566b0"]{fill:#929ecf}[stroke="#5566b0"]{stroke:#929ecf}[fill="#b0b0aa"]{fill:#909088}[stroke="#b0b0aa"]{stroke:#909088}}</style><rect class="f_bg" x="0" y="0" width="760" height="852" fill="#f6f6f3"></rect><text class="mono f_muted" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.6px"><tspan x="40">THE ONE IDEA</tspan></text><text class="f_text" x="40" y="92" font-size="28" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px"><tspan x="40">There is no conductor</tspan></text><text class="f_muted" x="40" y="120" font-size="15" fill="#6c6c73"><tspan x="40">Throw away the belt. What&#39;s really there is a room of thermostats — independent</tspan><tspan x="40" dy="20">control loops, each watching a shared source of truth, closing the gap you declared.</tspan></text><rect x="40" y="166" width="680" height="214" rx="16" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><text class="mono f_muted" x="64" y="196" font-size="12" fill="#6c6c73" letter-spacing="0.08em"><tspan x="64">ONE CONTROL LOOP — THE THERMOSTAT</tspan></text><rect x="64" y="224" width="150" height="100" rx="12" class="f_desiredBg s_desiredBd" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text class="mono f_blue" x="80" y="266" font-size="17" fill="#2f5fd0" font-weight="500"><tspan x="80">desired</tspan></text><text class="f_blue" x="80" y="288" font-size="12.5" fill="#2f5fd0"><tspan x="80">what you declared,</tspan><tspan x="80" dy="15">in git</tspan></text><text class="mono f_dim" x="242" y="260" font-size="9.5" fill="#9a9aa1" text-anchor="middle"><tspan x="242">reads</tspan></text><line class="s_neutralArrow" x1="216" y1="274" x2="266" y2="274" stroke="#8f8f95" stroke-width="2"></line><path class="f_neutralArrow" fill="#8f8f95" d="M268 274 L260 269 L260 279 Z"></path><rect x="284" y="224" width="190" height="100" rx="12" class="f_ctrlBg s_ctrlBd" fill="#eeeeeb" stroke="#cfcfc9" stroke-width="1"></rect><text class="f_text" x="379" y="262" font-size="26" fill="#1c1c22" text-anchor="middle"><tspan x="379">↻</tspan></text><text class="f_text" x="379" y="286" font-size="15" fill="#1c1c22" font-weight="600" text-anchor="middle"><tspan x="379">controller</tspan></text><text class="f_muted" x="379" y="304" font-size="11.5" fill="#6c6c73" text-anchor="middle"><tspan x="379">compares desired vs</tspan><tspan x="379" dy="14">actual, closes any gap</tspan></text><text class="mono f_green" x="510" y="258" font-size="9.5" fill="#1f7a49" text-anchor="middle"><tspan x="510">acts</tspan></text><line class="s_greenArrow" x1="480" y1="268" x2="538" y2="268" stroke="#3f9d6b" stroke-width="2"></line><path class="f_greenArrow" fill="#3f9d6b" d="M540 268 L532 263 L532 273 Z"></path><line class="s_greenArrow" x1="540" y1="284" x2="482" y2="284" stroke="#3f9d6b" stroke-width="2" stroke-dasharray="4 4"></line><path class="f_greenArrow" fill="#3f9d6b" d="M480 284 L488 279 L488 289 Z"></path><text class="mono f_green" x="510" y="300" font-size="9.5" fill="#1f7a49" text-anchor="middle"><tspan x="510">observes</tspan></text><rect x="546" y="224" width="150" height="100" rx="12" class="f_actualBg s_actualBd" fill="#e8f5ee" stroke="#a9d3ba" stroke-width="1"></rect><text class="mono f_green" x="562" y="266" font-size="17" fill="#1f7a49" font-weight="500"><tspan x="562">actual</tspan></text><text class="f_green" x="562" y="288" font-size="12.5" fill="#1f7a49"><tspan x="562">what’s really</tspan><tspan x="562" dy="15">running</tspan></text><text class="f_muted" x="380" y="360" font-size="13.5" fill="#6c6c73" text-anchor="middle">Watch · compare · act · repeat — <tspan class="f_text" fill="#1c1c22">forever, and unprompted</tspan>. Noticing is all it does.</text><text class="f_muted" x="40" y="414" font-size="15" fill="#6c6c73"><tspan x="40">The whole platform is a dozen of these, each a thermostat for its own concern. So the</tspan><tspan x="40" dy="20">mental model to unlearn is this:</tspan></text><rect x="40" y="436" width="680" height="150" rx="16" class="f_orchBg s_orchBd" fill="#efefec" stroke="#d8d8d3" stroke-width="1" stroke-dasharray="6 5"></rect><text class="mono f_red" x="64" y="466" font-size="13" fill="#b4462f"><tspan x="64">✗</tspan></text><text class="mono f_orchText" x="84" y="466" font-size="12" fill="#8a8a86" letter-spacing="0.07em"><tspan x="84">ORCHESTRATION — THE MODEL YOU IMAGINE</tspan></text><rect x="64" y="484" width="96" height="40" rx="8" class="f_card s_orchBd" fill="#ffffff" stroke="#d8d8d3" stroke-width="1"></rect><text class="mono f_orchText" x="112" y="500" font-size="10.5" fill="#8a8a86" text-anchor="middle"><tspan x="112">pipeline</tspan></text><text class="mono f_orchText" x="112" y="515" font-size="10.5" fill="#8a8a86" text-anchor="middle"><tspan x="112">pushes →</tspan></text><line class="s_orchLine" x1="172" y1="504" x2="624" y2="504" stroke="#cfcfc9" stroke-width="2"></line><path class="f_orchLine" fill="#cfcfc9" d="M628 504 L620 499 L620 509 Z"></path><rect x="232" y="495" width="52" height="18" rx="3" class="f_orchBg" fill="#efefec"></rect><text class="f_orchText" x="258" y="508" font-size="13" fill="#8a8a86" text-anchor="middle"><tspan x="258">build</tspan></text><rect x="362" y="495" width="52" height="18" rx="3" class="f_orchBg" fill="#efefec"></rect><text class="f_orchText" x="388" y="508" font-size="13" fill="#8a8a86" text-anchor="middle"><tspan x="388">test</tspan></text><rect x="492" y="495" width="52" height="18" rx="3" class="f_orchBg" fill="#efefec"></rect><text class="f_orchText" x="518" y="508" font-size="13" fill="#8a8a86" text-anchor="middle"><tspan x="518">ship</tspan></text><rect x="636" y="487" width="60" height="34" rx="8" class="s_orchBd" fill="none" stroke="#d8d8d3" stroke-width="1"></rect><text class="f_orchText" x="666" y="508" font-size="13" fill="#8a8a86" text-anchor="middle"><tspan x="666">prod</tspan></text><text class="f_orchText" x="64" y="554" font-size="13.5" fill="#8a8a86"><tspan x="64">One machine carries your package station to station.</tspan><tspan x="64" dy="19" class="f_red" fill="#b4462f" font-weight="600">There is no belt. There is no robot. Nothing pushes your code.</tspan></text><rect x="40" y="602" width="680" height="228" rx="16" class="f_panelBg s_choreoBd" fill="#efefec" stroke="#a9d3ba" stroke-width="1"></rect><text class="mono f_green" x="64" y="632" font-size="13" fill="#1f7a49"><tspan x="64">✓</tspan></text><text class="mono f_green" x="84" y="632" font-size="12" fill="#1f7a49" letter-spacing="0.07em"><tspan x="84">CHOREOGRAPHY — WHAT&#39;S ACTUALLY THERE</tspan></text><rect x="320" y="686" width="120" height="88" rx="14" class="f_gitBg s_gitBd" fill="#eaf0fc" stroke="#9fbaf0" stroke-width="1"></rect><text class="mono f_blue" x="380" y="722" font-size="22" fill="#2f5fd0" font-weight="600" text-anchor="middle"><tspan x="380">git</tspan></text><text class="f_blue" x="380" y="744" font-size="11" fill="#2f5fd0" text-anchor="middle"><tspan x="380">the shared</tspan><tspan x="380" dy="13">source of truth</tspan></text><text class="mono" x="252" y="702" font-size="12.5" text-anchor="end"><tspan class="f_loopGlyph" fill="#5566b0">↻</tspan> <tspan class="f_text" fill="#1c1c22">CI</tspan></text><line class="s_loopArrow" x1="262" y1="698" x2="310" y2="698" stroke="#b0b0aa" stroke-width="2" stroke-dasharray="4 4"></line><path class="f_loopArrow" fill="#b0b0aa" d="M314 698 L306 693 L306 703 Z"></path><text class="mono" x="252" y="734" font-size="12.5" text-anchor="end"><tspan class="f_loopGlyph" fill="#5566b0">↻</tspan> <tspan class="f_text" fill="#1c1c22">ArgoCD</tspan></text><line class="s_loopArrow" x1="262" y1="730" x2="310" y2="730" stroke="#b0b0aa" stroke-width="2" stroke-dasharray="4 4"></line><path class="f_loopArrow" fill="#b0b0aa" d="M314 730 L306 725 L306 735 Z"></path><text class="mono" x="252" y="766" font-size="12.5" text-anchor="end"><tspan class="f_loopGlyph" fill="#5566b0">↻</tspan> <tspan class="f_text" fill="#1c1c22">Kyverno</tspan></text><line class="s_loopArrow" x1="262" y1="762" x2="310" y2="762" stroke="#b0b0aa" stroke-width="2" stroke-dasharray="4 4"></line><path class="f_loopArrow" fill="#b0b0aa" d="M314 762 L306 757 L306 767 Z"></path><path class="f_loopArrow" fill="#b0b0aa" d="M446 698 L454 693 L454 703 Z"></path><line class="s_loopArrow" x1="450" y1="698" x2="498" y2="698" stroke="#b0b0aa" stroke-width="2" stroke-dasharray="4 4"></line><text class="mono" x="508" y="702" font-size="12.5"><tspan class="f_loopGlyph" fill="#5566b0">↻</tspan> <tspan class="f_text" fill="#1c1c22">Rollouts</tspan></text><path class="f_loopArrow" fill="#b0b0aa" d="M446 730 L454 725 L454 735 Z"></path><line class="s_loopArrow" x1="450" y1="730" x2="498" y2="730" stroke="#b0b0aa" stroke-width="2" stroke-dasharray="4 4"></line><text class="mono" x="508" y="734" font-size="12.5"><tspan class="f_loopGlyph" fill="#5566b0">↻</tspan> <tspan class="f_text" fill="#1c1c22">Karpenter</tspan></text><path class="f_loopArrow" fill="#b0b0aa" d="M446 762 L454 757 L454 767 Z"></path><line class="s_loopArrow" x1="450" y1="762" x2="498" y2="762" stroke="#b0b0aa" stroke-width="2" stroke-dasharray="4 4"></line><text class="mono" x="508" y="766" font-size="12.5"><tspan class="f_loopGlyph" fill="#5566b0">↻</tspan> <tspan class="f_text" fill="#1c1c22">Gateway</tspan></text><text class="f_muted" x="380" y="800" font-size="13.5" fill="#6c6c73" text-anchor="middle"><tspan x="380">A dozen independent loops, none talking to the others. Each just <tspan class="f_text" fill="#1c1c22">watches git</tspan>.</tspan><tspan x="380" dy="19">Change a file, and they notice — because noticing is all they do.</tspan></text></svg>