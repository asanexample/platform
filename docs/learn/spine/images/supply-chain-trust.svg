<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 792" width="760" height="792" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#ffffff"]{fill:#141414}[stroke="#ffffff"]{stroke:#141414}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#8f8f95"]{fill:#89898f}[stroke="#8f8f95"]{stroke:#89898f}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#6f88c4"]{fill:#98abd7}[stroke="#6f88c4"]{stroke:#98abd7}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#a9d3ba"]{fill:#9fd0b3}[stroke="#a9d3ba"]{stroke:#9fd0b3}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#fbf2df"]{fill:#554219}[stroke="#fbf2df"]{stroke:#554219}[fill="#e0be7e"]{fill:#e6c68a}[stroke="#e0be7e"]{stroke:#e6c68a}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}}</style><rect class="f_bg" x="0" y="0" width="760" height="792" fill="#f6f6f3"></rect><text class="mono f_muted" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.6px"><tspan x="40">SUPPLY CHAIN</tspan></text><text class="f_text" x="40" y="92" font-size="28" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px"><tspan x="40">Why the cluster can trust a blob</tspan></text><text class="f_muted" x="40" y="118" font-size="15" fill="#6c6c73"><tspan x="40">A container image is just bytes in a registry, and names can be overwritten. So CI turns</tspan><tspan x="40" dy="20">your merge into an artifact that carries its own proof — a seal and a receipt, each</tspan><tspan x="40" dy="20">signed by an identity nothing can steal.</tspan></text><rect x="40" y="184" width="680" height="46" rx="12" class="f_card s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="40" y="192" width="3" height="30" rx="1.5" class="f_blue" fill="#2f5fd0"></rect><text class="mono" x="64" y="213" font-size="14"><tspan class="f_blue" fill="#2f5fd0" font-weight="500">source</tspan>  <tspan class="f_muted" fill="#6c6c73">your merge — acme-shop @ a1b2c3</tspan></text><line class="s_narrow" x1="360" y1="240" x2="360" y2="258" stroke="#8f8f95" stroke-width="2"></line><path class="f_narrow" fill="#8f8f95" d="M360 266 L354 258 L366 258 Z"></path><text class="mono f_muted" x="376" y="260" font-size="11" fill="#6c6c73"><tspan x="376">CI builds — via a shared, paved-road workflow</tspan></text><rect x="40" y="270" width="680" height="80" rx="14" class="f_blueBg s_blueBd" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text class="mono f_blue" x="64" y="296" font-size="11" fill="#2f5fd0" letter-spacing="0.06em"><tspan x="64">THE ARTIFACT</tspan></text><text class="mono" x="64" y="326" font-size="18" font-weight="500"><tspan class="f_blue" fill="#2f5fd0">shop-web</tspan><tspan class="f_digestDim" fill="#6f88c4">@sha256:f6b37d…</tspan></text><text class="f_blue" x="470" y="298" font-size="12.5" fill="#2f5fd0"><tspan x="470">Named by digest — a</tspan><tspan x="470" dy="16">fingerprint of the exact</tspan><tspan x="470" dy="16">bytes; the platform pins it.</tspan></text><text class="mono f_dim" x="380" y="378" font-size="11" fill="#9a9aa1" text-anchor="middle"><tspan x="380">↓   two independent proofs get attached   ↓</tspan></text><rect x="40" y="398" width="333" height="152" rx="12" class="f_card s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="40" y="398" width="333" height="3" rx="1.5" class="f_blue" fill="#2f5fd0"></rect><text class="mono f_blue" x="60" y="426" font-size="14" fill="#2f5fd0" font-weight="500"><tspan x="60">cosign signature</tspan></text><text class="f_dim" x="60" y="444" font-size="12" fill="#9a9aa1" font-style="italic"><tspan x="60">the wax seal</tspan></text><text class="f_text" x="60" y="468" font-size="13" fill="#1c1c22"><tspan x="60">Break one byte and the seal</tspan><tspan x="60" dy="16.5">no longer matches — visibly.</tspan><tspan x="60" dy="16.5">Proves the bytes are CI’s own.</tspan></text><rect x="56" y="514" width="301" height="26" rx="7" class="f_blueBg s_blueBd" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text class="mono f_blue" x="69" y="531" font-size="10.5" fill="#2f5fd0"><tspan x="69">keyless · CI’s short-lived OIDC</tspan></text><rect x="387" y="398" width="333" height="152" rx="12" class="f_card s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><rect x="387" y="398" width="333" height="3" rx="1.5" class="f_green" fill="#1f7a49"></rect><text class="mono f_green" x="407" y="426" font-size="14" fill="#1f7a49" font-weight="500"><tspan x="407">SLSA provenance</tspan></text><rect x="668" y="411" width="34" height="20" rx="10" class="s_greenBd" fill="none" stroke="#a9d3ba" stroke-width="1"></rect><text class="mono f_green" x="685" y="425" font-size="10.5" fill="#1f7a49" text-anchor="middle"><tspan x="685">L3</tspan></text><text class="f_dim" x="407" y="444" font-size="12" fill="#9a9aa1" font-style="italic"><tspan x="407">the notarized receipt</tspan></text><text class="f_text" x="407" y="468" font-size="13" fill="#1c1c22"><tspan x="407">States which repo, commit,</tspan><tspan x="407" dy="16.5">and workflow built it — not</tspan><tspan x="407" dy="16.5">just sealed, but made here.</tspan></text><rect x="403" y="514" width="301" height="26" rx="7" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a9d3ba" stroke-width="1"></rect><text class="mono f_green" x="416" y="531" font-size="10.5" fill="#1f7a49"><tspan x="416">separate · isolated builder</tspan></text><line class="s_narrow" x1="360" y1="562" x2="360" y2="580" stroke="#8f8f95" stroke-width="2"></line><path class="f_narrow" fill="#8f8f95" d="M360 588 L354 580 L366 580 Z"></path><text class="mono f_muted" x="376" y="582" font-size="11" fill="#6c6c73"><tspan x="376">both recorded in</tspan></text><rect x="40" y="600" width="680" height="56" rx="12" class="f_amberBg s_amberBd" fill="#fbf2df" stroke="#e0be7e" stroke-width="1"></rect><rect x="40" y="608" width="3" height="40" rx="1.5" class="f_amber" fill="#8a6410"></rect><text class="mono f_amber" x="64" y="634" font-size="15" fill="#8a6410" font-weight="500"><tspan x="64">transparency log</tspan></text><text class="f_text" x="228" y="624" font-size="13" fill="#1c1c22"><tspan x="228">The notary co-signs — a public, tamper-evident,</tspan><tspan x="228" dy="17">append-only witness anyone can check.</tspan></text><rect x="40" y="672" width="680" height="56" rx="12" class="f_panelBg s_greenBd" fill="#efefec" stroke="#a9d3ba" stroke-width="1" stroke-dasharray="6 5"></rect><rect x="58" y="687" width="132" height="26" rx="13" class="s_greenBd" fill="none" stroke="#a9d3ba" stroke-width="1"></rect><text class="mono f_green" x="124" y="704" font-size="10.5" fill="#1f7a49" text-anchor="middle"><tspan x="124">↩ later, at deploy</tspan></text><text class="f_text" x="210" y="696" font-size="13" fill="#1c1c22"><tspan x="210"><tspan class="f_green" fill="#1f7a49" font-weight="600">Kyverno re-verifies the seal</tspan> before admitting — trust is checked</tspan><tspan x="210" dy="17">at the moment of use, never on faith.</tspan></text><text class="f_muted" x="40" y="752" font-size="13" fill="#6c6c73"><tspan x="40"><tspan class="f_dim mono" fill="#9a9aa1">WHERE THE METAPHOR BREAKS · </tspan>The seal proves origin and integrity — that this</tspan><tspan x="40" dy="18">came from where it claims, unaltered. It never proves the code is good.</tspan></text></svg>