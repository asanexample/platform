<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" width="760" height="690" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#6f88c4"]{fill:#98abd7}[stroke="#6f88c4"]{stroke:#98abd7}[fill="#b4462f"]{fill:#da7965}[stroke="#b4462f"]{stroke:#da7965}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#ffffff"]{fill:#141414}[stroke="#ffffff"]{stroke:#141414}[fill="#a9d3ba"]{fill:#9fd0b3}[stroke="#a9d3ba"]{stroke:#9fd0b3}[fill="#f4f4f0"]{fill:#1d1d19}[stroke="#f4f4f0"]{stroke:#1d1d19}[fill="#e0e0da"]{fill:#282823}[stroke="#e0e0da"]{stroke:#282823}[fill="#d8ecdf"]{fill:#285136}[stroke="#d8ecdf"]{stroke:#285136}}</style><style>@media(prefers-color-scheme:dark){.f_bg{fill:#15161c}.f_blueBg{fill:#172a50}.f_codeBg{fill:#0e0f14}.f_hl{fill:#16243f}.s_blueBd{stroke:#40639e}.s_greenBd{stroke:#2f6a45}.s_codeBd{stroke:#2a2b33}.f_text{fill:#e6e6ea}.f_muted{fill:#9a9aa3}.f_dim{fill:#74747d}.f_blue{fill:#7fa0ee}.f_green{fill:#4fd08a}}</style><defs><clipPath id="abar0"><rect x="173.0" y="209.0" width="11.0" height="76.0"></rect></clipPath><clipPath id="abar1"><rect x="173.0" y="327.0" width="11.0" height="216.0"></rect></clipPath></defs><rect class="f_bg" x="0" y="0" width="760" height="690" fill="#f6f6f3"></rect><text class="mono f_muted" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.6px" xml:space="preserve"><tspan x="40">PROMOTION · THE SURPRISING HOP</tspan></text><text class="f_text" x="40" y="92" font-size="28" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px" xml:space="preserve"><tspan x="40">The digest goes to a different repo</tspan></text><text class="f_muted" x="40" y="118" font-size="15" fill="#6c6c73" xml:space="preserve"><tspan x="40">You’d expect the deployed version recorded back in your app repo. It isn’t —</tspan><tspan x="40" dy="20">and the reason is entirely about trust.</tspan></text><text class="mono f_dim" x="225" y="180" font-size="11" fill="#9a9aa1" letter-spacing="0.05em" xml:space="preserve"><tspan x="225">to record:</tspan></text><rect x="272" y="164" width="300" height="28" rx="8" class="f_blueBg s_blueBd" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text class="mono" x="422" y="182" font-size="13.5" text-anchor="middle"><tspan class="f_blue" fill="#2f5fd0">shop-storefront</tspan><tspan class="f_digestDim" fill="#6f88c4">@sha256:f6b37d…</tspan></text><text class="mono f_red" x="99" y="237" font-size="11" fill="#b4462f" text-anchor="middle" xml:space="preserve"><tspan x="99">✗ not here</tspan></text><line class="s_red" x1="48" y1="247" x2="160" y2="247" stroke="#b4462f" stroke-width="2" stroke-dasharray="5 4"></line><path class="f_red" fill="#b4462f" d="M168 247 L160 242 L160 252 Z"></path><rect x="174" y="210" width="546" height="74" rx="12" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><rect x="175.3" y="211.3" width="543.5" height="71.5" rx="10.8" fill="none" stroke="#2f5fd0" stroke-width="2.5" clip-path="url(#abar0)"></rect><text x="194" y="238" font-size="14" class="mono"><tspan class="f_blue" fill="#2f5fd0" font-weight="500">app repo</tspan>  <tspan class="f_muted" fill="#6c6c73" font-size="12">asanexample/alpha-shop</tspan></text><rect x="584" y="223" width="120" height="22" rx="11" class="s_red" fill="none" stroke="#b4462f" stroke-width="1"></rect><text class="mono f_red" x="644" y="238" font-size="10" fill="#b4462f" text-anchor="middle" xml:space="preserve"><tspan x="644">main · protected</tspan></text><text class="f_text" x="194" y="262" font-size="13" fill="#1c1c22" xml:space="preserve"><tspan x="194">Locked down — no bots, no automated commits. The digest is never written here.</tspan></text><text class="f_muted" x="40" y="306" font-size="15" fill="#6c6c73"><tspan x="40">Instead, a <tspan class="f_text" fill="#1c1c22" font-weight="600">promote</tspan> step opens a pull request on the platform repo —</tspan><tspan x="40" dy="20">editing exactly one file:</tspan></text><text class="mono f_green" x="99" y="425" font-size="11" fill="#1f7a49" text-anchor="middle" xml:space="preserve"><tspan x="99">✓ opens a PR</tspan></text><line class="s_green" x1="48" y1="435" x2="160" y2="435" stroke="#1f7a49" stroke-width="2"></line><path class="f_green" fill="#1f7a49" d="M168 435 L160 430 L160 440 Z"></path><rect x="174" y="328" width="546" height="214" rx="12" class="f_card s_greenBd" fill="#ffffff" stroke="#a9d3ba" stroke-width="1"></rect><rect x="175.3" y="329.3" width="543.5" height="211.5" rx="10.8" fill="none" stroke="#1f7a49" stroke-width="2.5" clip-path="url(#abar1)"></rect><text x="194" y="358" font-size="14" class="mono"><tspan class="f_green" fill="#1f7a49" font-weight="500">platform repo</tspan>  <tspan class="f_muted" fill="#6c6c73" font-size="12">a different repository</tspan></text><rect x="194" y="372" width="506" height="120" rx="9" class="f_codeBg s_codeBd" fill="#f4f4f0" stroke="#e0e0da" stroke-width="1"></rect><text class="mono f_dim" x="210" y="396" font-size="12.5" fill="#9a9aa1" xml:space="preserve"><tspan x="210"># gitops/releases/alpha/shop/dev.yaml</tspan></text><text class="mono f_text" x="210" y="413" font-size="12.5" fill="#1c1c22" xml:space="preserve"><tspan x="210">kind: Release</tspan></text><text class="mono f_text" x="210" y="430" font-size="12.5" fill="#1c1c22" xml:space="preserve"><tspan x="210">spec:</tspan></text><text class="mono f_text" x="210" y="447" font-size="12.5" fill="#1c1c22" xml:space="preserve"><tspan x="210">  services:</tspan></text><text class="mono f_text" x="210" y="464" font-size="12.5" fill="#1c1c22" xml:space="preserve"><tspan x="210">    storefront:</tspan></text><rect x="202" y="468" width="490" height="19" rx="4" class="f_hl" fill="#d8ecdf"></rect><text class="mono f_green" x="210" y="481" font-size="12.5" fill="#1f7a49" font-weight="500" xml:space="preserve"><tspan x="210">      digest: sha256:f6b37d…</tspan></text><text class="f_muted" x="194" y="516" font-size="13" fill="#6c6c73"><tspan class="f_text" fill="#1c1c22" font-weight="600">The Release record</tspan> — the deployed version of this service, in this stage.</text><rect x="40" y="564" width="333" height="94" rx="12" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><text class="mono f_muted" x="62" y="590" font-size="11" fill="#6c6c73" letter-spacing="0.05em" xml:space="preserve"><tspan x="62">01 · PROTECTED MAIN</tspan></text><text class="f_text" x="62" y="612" font-size="12.5" fill="#1c1c22" xml:space="preserve"><tspan x="62">Pushing the digest into your repo</tspan><tspan x="62" dy="16">means un-protecting the branch you</tspan><tspan x="62" dy="16">most want locked. So it lives elsewhere.</tspan></text><rect x="387" y="564" width="333" height="94" rx="12" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><text class="mono f_muted" x="409" y="590" font-size="11" fill="#6c6c73" letter-spacing="0.05em" xml:space="preserve"><tspan x="409">02 · ONE SOURCE OF TRUTH</tspan></text><text class="f_text" x="409" y="612" font-size="12.5" fill="#1c1c22" xml:space="preserve"><tspan x="409">A version-controlled file with the git</tspan><tspan x="409" dy="16">history of every promotion — what runs</tspan><tspan x="409" dy="16">where. Not a dashboard, not a log.</tspan></text></svg>