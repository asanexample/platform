<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 632" width="760" height="632" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><defs><clipPath id="abar0"><rect x="39.0" y="507.0" width="11.0" height="106.0"/></clipPath><clipPath id="abar1"><rect x="386.0" y="507.0" width="11.0" height="106.0"/></clipPath></defs><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#4aa877"]{fill:#83cba5}[stroke="#4aa877"]{stroke:#83cba5}[fill="#c3ccdf"]{fill:#303d5a}[stroke="#c3ccdf"]{stroke:#303d5a}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#a9d3ba"]{fill:#9fd0b3}[stroke="#a9d3ba"]{stroke:#9fd0b3}[fill="#fbeeea"]{fill:#512517}[stroke="#fbeeea"]{stroke:#512517}[fill="#e6b9ab"]{fill:#e0a28f}[stroke="#e6b9ab"]{stroke:#e0a28f}[fill="#b4462f"]{fill:#da7965}[stroke="#b4462f"]{stroke:#da7965}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}}</style><rect class="f_bg" x="0" y="0" width="760" height="632" fill="#f6f6f3"></rect><text class="mono f_muted" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.6px"><tspan x="40">PROGRESSIVE DELIVERY</tspan></text><text class="f_text" x="40" y="92" font-size="28" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px"><tspan x="40">The canary takes the first hit</tspan></text><text class="f_muted" x="40" y="118" font-size="15" fill="#6c6c73"><tspan x="40">A Rollout never swaps all pods at once. It runs the new version beside the old, sends it</tspan><tspan x="40" dy="20">a slice of real traffic, and widens only while the metrics stay healthy.</tspan></text><rect x="40" y="176" width="490" height="252" rx="16" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><text class="mono f_muted" x="64" y="204" font-size="11" fill="#6c6c73" letter-spacing="0.04em">TRAFFIC TO CANARY  </text><rect x="230" y="195" width="11" height="11" rx="2" class="f_canaryBar" fill="#4aa877"></rect><text class="mono f_muted" x="246" y="204" font-size="11" fill="#6c6c73"><tspan x="246">new</tspan></text><rect x="288" y="195" width="11" height="11" rx="2" class="f_stableBar" fill="#c3ccdf"></rect><text class="mono f_muted" x="304" y="204" font-size="11" fill="#6c6c73"><tspan x="304">stable</tspan></text><text class="mono f_text" x="64" y="241" font-size="15" fill="#1c1c22" font-weight="500"><tspan x="64">10%</tspan></text><rect x="112" y="225" width="394" height="22" rx="6" class="f_stableBar" fill="#c3ccdf"></rect><rect x="112" y="225" width="39" height="22" rx="6" class="f_canaryBar" fill="#4aa877"></rect><rect x="112" y="225" width="394" height="22" rx="6" class="s_border" fill="none" stroke="#e4e4df" stroke-width="1"></rect><text class="mono f_green" x="64" y="264" font-size="10.5" fill="#1f7a49"><tspan x="64">analyze ↓</tspan></text><text class="f_muted" x="140" y="264" font-size="11.5" fill="#6c6c73"><tspan x="140">error rate · latency · SLO</tspan></text><text class="mono f_green" x="506" y="264" font-size="10.5" fill="#1f7a49" text-anchor="end"><tspan x="506">✓ widen</tspan></text><text class="mono f_text" x="64" y="287" font-size="15" fill="#1c1c22" font-weight="500"><tspan x="64">25%</tspan></text><rect x="112" y="271" width="394" height="22" rx="6" class="f_stableBar" fill="#c3ccdf"></rect><rect x="112" y="271" width="99" height="22" rx="6" class="f_canaryBar" fill="#4aa877"></rect><rect x="112" y="271" width="394" height="22" rx="6" class="s_border" fill="none" stroke="#e4e4df" stroke-width="1"></rect><text class="mono f_green" x="64" y="310" font-size="10.5" fill="#1f7a49"><tspan x="64">analyze ↓</tspan></text><text class="f_muted" x="140" y="310" font-size="11.5" fill="#6c6c73"><tspan x="140">error rate · latency · SLO</tspan></text><text class="mono f_green" x="506" y="310" font-size="10.5" fill="#1f7a49" text-anchor="end"><tspan x="506">✓ widen</tspan></text><text class="mono f_text" x="64" y="333" font-size="15" fill="#1c1c22" font-weight="500"><tspan x="64">50%</tspan></text><rect x="112" y="317" width="394" height="22" rx="6" class="f_stableBar" fill="#c3ccdf"></rect><rect x="112" y="317" width="197" height="22" rx="6" class="f_canaryBar" fill="#4aa877"></rect><rect x="112" y="317" width="394" height="22" rx="6" class="s_border" fill="none" stroke="#e4e4df" stroke-width="1"></rect><text class="mono f_green" x="64" y="356" font-size="10.5" fill="#1f7a49"><tspan x="64">analyze ↓</tspan></text><text class="f_muted" x="140" y="356" font-size="11.5" fill="#6c6c73"><tspan x="140">error rate · latency · SLO</tspan></text><text class="mono f_green" x="506" y="356" font-size="10.5" fill="#1f7a49" text-anchor="end"><tspan x="506">✓ widen</tspan></text><text class="mono f_green" x="64" y="379" font-size="15" fill="#1f7a49" font-weight="600"><tspan x="64">100%</tspan></text><rect x="112" y="363" width="394" height="22" rx="6" class="f_canaryBar s_canaryBd" fill="#4aa877" stroke="#a9d3ba" stroke-width="1"></rect><text class="mono f_green" x="64" y="402" font-size="10.5" fill="#1f7a49"><tspan x="64">promoted — the new version is fully live</tspan></text><rect x="546" y="176" width="174" height="252" rx="16" class="f_redBg s_redBd" fill="#fbeeea" stroke="#e6b9ab" stroke-width="1" stroke-dasharray="6 5"></rect><text class="mono f_red" x="566" y="210" font-size="13" fill="#b4462f" font-weight="500"><tspan x="566">✗ any breach</tspan></text><text class="f_text" x="566" y="234" font-size="12.5" fill="#1c1c22"><tspan x="566">At any step, if the</tspan><tspan x="566" dy="16">metrics go bad, the</tspan><tspan x="566" dy="16">Rollout auto-reverts to</tspan><tspan x="566" dy="16">the old version.</tspan></text><rect x="566" y="376" width="140" height="0" rx="0" class="s_redBd" fill="none" stroke="#e6b9ab" stroke-width="1"></rect><line class="s_redBd" x1="566" y1="376" x2="700" y2="376" stroke="#e6b9ab"></line><text class="mono f_red" x="566" y="398" font-size="11" fill="#b4462f"><tspan x="566">no human · no page</tspan></text><text class="f_muted" x="40" y="456" font-size="13" fill="#6c6c73"><tspan x="40"><tspan class="f_dim mono" fill="#9a9aa1">THE CANARY IN THE COAL MINE · </tspan>A small slice of real traffic hits the new</tspan><tspan x="40" dy="18">version first, so if it’s toxic only a fraction of requests notice. Unlike the coal-mine</tspan><tspan x="40" dy="18">bird, yours isn’t sacrificed — the early warning triggers the rollback that prevents harm.</tspan></text><rect x="40" y="508" width="333" height="104" rx="12" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><rect x="41.3" y="509.3" width="330.5" height="101.5" rx="10.8" fill="none" stroke="#8a6410" stroke-width="2.5" clip-path="url(#abar0)"></rect><text class="mono f_amber" x="62" y="534" font-size="11" fill="#8a6410" letter-spacing="0.05em"><tspan x="62">BUILT FROM OBSERVABILITY</tspan></text><text class="f_text" x="62" y="556" font-size="12.5" fill="#1c1c22"><tspan x="62">The metrics the analysis reads are</tspan><tspan x="62" dy="16">the same signals observability already</tspan><tspan x="62" dy="16">collects — made of it, not bolted on.</tspan></text><rect x="387" y="508" width="333" height="104" rx="12" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><rect x="388.3" y="509.3" width="330.5" height="101.5" rx="10.8" fill="none" stroke="#2f5fd0" stroke-width="2.5" clip-path="url(#abar1)"></rect><text class="mono f_blue" x="409" y="534" font-size="11" fill="#2f5fd0" letter-spacing="0.05em"><tspan x="409">REHEARSED EVERYWHERE</tspan></text><text class="f_text" x="409" y="556" font-size="12.5" fill="#1c1c22"><tspan x="409">A Rollout runs on every stage, so by</tspan><tspan x="409" dy="16">prod its canary has rehearsed at dev,</tspan><tspan x="409" dy="16">test, uat, staging. Prod is never first.</tspan></text></svg>