<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" width="760" height="668" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><defs><clipPath id="abar0"><rect x="39.0" y="585.0" width="11.0" height="60.0"/></clipPath></defs><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#f7e8e3"]{fill:#552819}[stroke="#f7e8e3"]{stroke:#552819}[fill="#dca595"]{fill:#dda392}[stroke="#dca595"]{stroke:#dda392}[fill="#b4402b"]{fill:#dc725e}[stroke="#b4402b"]{stroke:#dc725e}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#177a44"]{fill:#3adf85}[stroke="#177a44"]{stroke:#3adf85}[fill="#e6f2ea"]{fill:#264932}[stroke="#e6f2ea"]{stroke:#264932}[fill="#a3ccb4"]{fill:#a2cdb4}[stroke="#a3ccb4"]{stroke:#a2cdb4}}</style><rect class="f_bg" x="0" y="0" width="760" height="668" fill="#f6f6f3"></rect><text class="f_muted mono" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.5px"><tspan x="40">SWISS CHEESE · WATCH THE LAYERS HOLD</tspan></text><text class="f_text" x="40" y="92" font-size="28" fill="#1c1c22" font-weight="600"><tspan x="40">No single failure is fatal</tspan></text><text class="f_muted" x="40" y="118" font-size="15" fill="#6c6c73"><tspan x="40">Each layer is a slice with holes — no control is perfect. A threat only lands if the holes</tspan><tspan x="40" dy="20">align across every slice. Follow one attack: a poisoned dependency shop pulls in.</tspan></text><rect x="40" y="158" width="680" height="52" rx="11" class="f_redBg s_redBd" fill="#f7e8e3" stroke="#dca595" stroke-width="1"></rect><text class="mono f_red" x="58" y="188" font-size="13" fill="#b4402b" font-weight="500"><tspan x="58">Code / CI</tspan></text><text class="f_text" x="170" y="180" font-size="12.5" fill="#1c1c22"><tspan x="170">Trivy · Semgrep · gitleaks match known patterns —</tspan><tspan x="170" dy="16">a novel payload has nothing to match.</tspan></text><rect x="644.4" y="173" width="59.599999999999994" height="22" rx="11" class="s_redBd" fill="none" stroke="#dca595" stroke-width="1" stroke-dasharray="4 3"></rect><text class="mono f_red" x="674.1999999999999" y="188" font-size="11" fill="#b4402b" text-anchor="middle"><tspan x="674.1999999999999">✗ hole</tspan></text><text class="mono f_red" x="380" y="231" font-size="14" fill="#b4402b" text-anchor="middle"><tspan x="380">↓ the attack slips through</tspan></text><rect x="40" y="244" width="680" height="58" rx="11" class="f_redBg s_redBd" fill="#f7e8e3" stroke="#dca595" stroke-width="1"></rect><text class="mono f_red" x="58" y="271" font-size="13" fill="#b4402b" font-weight="500"><tspan x="58">Container /</tspan></text><text class="mono f_red" x="58" y="287" font-size="13" fill="#b4402b" font-weight="500"><tspan x="58">admission</tspan></text><text class="f_text" x="190" y="269" font-size="12.5" fill="#1c1c22"><tspan x="190">The image is validly signed — it did come from shop’s</tspan><tspan x="190" dy="16">repo. Signing proves origin, not innocence.</tspan></text><rect x="644.4" y="262" width="59.599999999999994" height="22" rx="11" class="s_redBd" fill="none" stroke="#dca595" stroke-width="1" stroke-dasharray="4 3"></rect><text class="mono f_red" x="674.1999999999999" y="277" font-size="11" fill="#b4402b" text-anchor="middle"><tspan x="674.1999999999999">✗ hole</tspan></text><text class="mono f_muted" x="380" y="324" font-size="12" fill="#6c6c73" text-anchor="middle"><tspan x="380">the code is now running — two holes lined up. now it tries to spread:</tspan></text><rect x="40" y="338" width="680" height="234" rx="14" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><text class="mono f_greenStrong" x="58" y="364" font-size="11" fill="#177a44"><tspan x="58">↓ BUT THESE SLICES HOLD — THEIR HOLES DON’T ALIGN</tspan></text><rect x="56" y="376" width="648" height="32" rx="8" class="f_greenBg s_greenBd" fill="#e6f2ea" stroke="#a3ccb4" stroke-width="1"></rect><text class="mono f_greenStrong" x="70" y="396" font-size="12" fill="#177a44" font-weight="500"><tspan x="70">Least privilege</tspan></text><text class="f_text" x="244" y="396" font-size="12.5" fill="#1c1c22"><tspan x="244">only shop’s scoped role — not other teams’ data, not platform roles</tspan></text><rect x="56" y="414" width="648" height="32" rx="8" class="f_greenBg s_greenBd" fill="#e6f2ea" stroke="#a3ccb4" stroke-width="1"></rect><text class="mono f_greenStrong" x="70" y="434" font-size="12" fill="#177a44" font-weight="500"><tspan x="70">IMDS deny · no secrets</tspan></text><text class="f_text" x="244" y="434" font-size="12.5" fill="#1c1c22"><tspan x="244">can’t reach metadata for node creds; no long-lived keys to steal</tspan></text><rect x="56" y="452" width="648" height="32" rx="8" class="f_greenBg s_greenBd" fill="#e6f2ea" stroke="#a3ccb4" stroke-width="1"></rect><text class="mono f_greenStrong" x="70" y="472" font-size="12" fill="#177a44" font-weight="500"><tspan x="70">Network policy</tspan></text><text class="f_text" x="244" y="472" font-size="12.5" fill="#1c1c22"><tspan x="244">reaches only what Cilium allows — no free exfiltration path</tspan></text><rect x="56" y="490" width="648" height="32" rx="8" class="f_greenBg s_greenBd" fill="#e6f2ea" stroke="#a3ccb4" stroke-width="1"></rect><text class="mono f_greenStrong" x="70" y="510" font-size="12" fill="#177a44" font-weight="500"><tspan x="70">Account boundary</tspan></text><text class="f_text" x="244" y="510" font-size="12.5" fill="#1c1c22"><tspan x="244">total control of shop-dev still cannot touch prod — different account</tspan></text><rect x="56" y="528" width="648" height="32" rx="8" class="f_greenBg s_greenBd" fill="#e6f2ea" stroke="#a3ccb4" stroke-width="1"></rect><text class="mono f_greenStrong" x="70" y="548" font-size="12" fill="#177a44" font-weight="500"><tspan x="70">Runtime · Falco</tspan></text><text class="f_text" x="244" y="548" font-size="12.5" fill="#1c1c22"><tspan x="244">a spawned shell or sensitive-path read trips an alert</tspan></text><rect x="40" y="586" width="680" height="58" rx="12" class="f_greenBg s_greenBd" fill="#e6f2ea" stroke="#a3ccb4" stroke-width="1"></rect><rect x="41.3" y="587.3" width="677.5" height="55.5" rx="10.8" fill="none" stroke="#177a44" stroke-width="2.5" clip-path="url(#abar0)"></rect><rect x="58" y="604" width="79.4" height="22" rx="11" class="s_greenBd" fill="none" stroke="#a3ccb4" stroke-width="1"></rect><text class="mono f_greenStrong" x="97.7" y="619" font-size="11" fill="#177a44" text-anchor="middle"><tspan x="97.7">CONTAINED</tspan></text><text class="f_text" x="153.4" y="610" font-size="12.5" fill="#1c1c22"><tspan x="153.4">One slice failed completely — the breach was still contained. Defense in depth is not</tspan><tspan x="153.4" dy="16">&#34;every layer is perfect,&#34; but &#34;no single failure is fatal.&#34;</tspan></text></svg>