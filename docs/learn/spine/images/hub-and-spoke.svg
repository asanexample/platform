<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 642" width="760" height="642" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><defs><clipPath id="abar0"><rect x="39.0" y="485.0" width="11.0" height="86.0"/></clipPath><clipPath id="abar1"><rect x="386.0" y="485.0" width="11.0" height="86.0"/></clipPath></defs><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#d4d4ce"]{fill:#2e2e29}[stroke="#d4d4ce"]{stroke:#2e2e29}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#9fbaf0"]{fill:#81a5ee}[stroke="#9fbaf0"]{stroke:#81a5ee}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#dbe6fa"]{fill:#192f57}[stroke="#dbe6fa"]{stroke:#192f57}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#7f9be0"]{fill:#8aa4e5}[stroke="#7f9be0"]{stroke:#8aa4e5}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#9ececf"]{fill:#9ed0d1}[stroke="#9ececf"]{stroke:#9ed0d1}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}}</style><rect class="f_bg" x="0" y="0" width="760" height="642" fill="#f6f6f3"></rect><text class="mono f_muted" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.6px"><tspan x="40">WHERE IT RUNS · HUB &amp; SPOKES</tspan></text><text class="f_text" x="40" y="92" font-size="28" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px"><tspan x="40">Shared once, resilient everywhere</tspan></text><text class="f_muted" x="40" y="118" font-size="15" fill="#6c6c73"><tspan x="40">Across isolated AWS accounts: expensive shared planes live once on the hub; workloads</tspan><tspan x="40" dy="20">and a federated Environment API run on each spoke. git coordinates it all — no conductor.</tspan></text><rect x="40" y="160" width="560" height="44" rx="12" class="f_panelBg s_mgmtBd" fill="#efefec" stroke="#d4d4ce" stroke-width="1" stroke-dasharray="6 5"></rect><text class="mono f_text" x="58" y="187" font-size="13" fill="#1c1c22" font-weight="500"><tspan x="58">mgmt account</tspan></text><text class="f_muted" x="168" y="187" font-size="12" fill="#6c6c73"><tspan x="168">org root · Terraform state · break-glass — governs, no workloads</tspan></text><text class="mono f_muted" x="620" y="181" font-size="10.5" fill="#6c6c73"><tspan x="620">governs</tspan></text><text class="f_muted" x="690" y="181" font-size="13" fill="#6c6c73"><tspan x="690">↓</tspan></text><rect x="40" y="218" width="680" height="104" rx="14" class="f_hubBg s_hubBd" fill="#eaf0fc" stroke="#9fbaf0" stroke-width="1"></rect><text class="mono f_blue" x="58" y="246" font-size="14" fill="#2f5fd0" font-weight="600"><tspan x="58">platform account</tspan></text><rect x="238" y="231" width="66.1" height="24" rx="7" class="f_hubBg s_hubBd" fill="#eaf0fc" stroke="#9fbaf0" stroke-width="1"></rect><text class="mono f_blue" x="249" y="247" font-size="10.5" fill="#2f5fd0"><tspan x="249">THE HUB</tspan></text><text class="f_muted" x="702" y="246" font-size="12" fill="#6c6c73" text-anchor="end"><tspan x="702">shared planes · built once</tspan></text><rect x="58" y="264" width="215.2" height="24" rx="7" class="f_chipBg s_chipBd" fill="#dbe6fa" stroke="#b9cbee" stroke-width="1"></rect><text class="mono f_blue" x="69" y="280" font-size="11.5" fill="#2f5fd0"><tspan x="69">ArgoCD — delivers everywhere</tspan></text><rect x="281.2" y="264" width="235.89999999999998" height="24" rx="7" class="f_chipBg s_chipBd" fill="#dbe6fa" stroke="#b9cbee" stroke-width="1"></rect><text class="mono f_blue" x="292.2" y="280" font-size="11.5" fill="#2f5fd0"><tspan x="292.2">Team/Product/Release registries</tspan></text><rect x="525.0999999999999" y="264" width="77.19999999999999" height="24" rx="7" class="f_chipBg s_chipBd" fill="#dbe6fa" stroke="#b9cbee" stroke-width="1"></rect><text class="mono f_blue" x="536.0999999999999" y="280" font-size="11.5" fill="#2f5fd0"><tspan x="536.0999999999999">Keycloak</tspan></text><rect x="58" y="296" width="139.3" height="24" rx="7" class="f_chipBg s_chipBd" fill="#dbe6fa" stroke="#b9cbee" stroke-width="1"></rect><text class="mono f_blue" x="69" y="312" font-size="11.5" fill="#2f5fd0"><tspan x="69">observability hub</tspan></text><rect x="205.3" y="296" width="118.6" height="24" rx="7" class="f_chipBg s_chipBd" fill="#dbe6fa" stroke="#b9cbee" stroke-width="1"></rect><text class="mono f_blue" x="216.3" y="312" font-size="11.5" fill="#2f5fd0"><tspan x="216.3">XAgent runtime</tspan></text><rect x="331.9" y="296" width="153.1" height="24" rx="7" class="f_chipBg s_chipBd" fill="#dbe6fa" stroke="#b9cbee" stroke-width="1"></rect><text class="mono f_blue" x="342.9" y="312" font-size="11.5" fill="#2f5fd0"><tspan x="342.9">Transit Gateway hub</tspan></text><line class="s_blueArrow" x1="150" y1="330" x2="150" y2="346" stroke="#7f9be0" stroke-width="2"></line><path class="f_blueArrow" fill="#7f9be0" d="M150 354 L145 346 L155 346 Z"></path><text class="mono f_blue" x="168" y="348" font-size="11" fill="#2f5fd0"><tspan x="168">one ArgoCD reconciles each spoke from git — cross-account, still no conductor</tspan></text><rect x="40" y="364" width="333" height="104" rx="14" class="f_spokeBg s_spokeBd" fill="#e8f5ee" stroke="#9ececf" stroke-width="1"></rect><text class="mono f_green" x="58" y="392" font-size="13.5" fill="#1f7a49" font-weight="600"><tspan x="58">preprod account</tspan></text><rect x="193.5" y="379" width="52" height="24" rx="7" class="f_spokeBg s_spokeBd" fill="#e8f5ee" stroke="#9ececf" stroke-width="1"></rect><text class="mono f_green" x="204.5" y="395" font-size="10" fill="#1f7a49"><tspan x="204.5">SPOKE</tspan></text><text class="mono f_green" x="58" y="416" font-size="12" fill="#1f7a49"><tspan x="58">workloads</tspan></text><text class="mono f_green" x="58" y="436" font-size="12" fill="#1f7a49" font-weight="500"><tspan x="58">▸ federated Environment API</tspan></text><text class="mono f_green" x="58" y="454" font-size="12" fill="#1f7a49"><tspan x="58">Kyverno enforce · observability spoke</tspan></text><rect x="387" y="364" width="333" height="104" rx="14" class="f_spokeBg s_spokeBd" fill="#e8f5ee" stroke="#9ececf" stroke-width="1"></rect><text class="mono f_green" x="405" y="392" font-size="13.5" fill="#1f7a49" font-weight="600"><tspan x="405">prod account</tspan></text><rect x="515" y="379" width="52" height="24" rx="7" class="f_spokeBg s_spokeBd" fill="#e8f5ee" stroke="#9ececf" stroke-width="1"></rect><text class="mono f_green" x="526" y="395" font-size="10" fill="#1f7a49"><tspan x="526">SPOKE</tspan></text><text class="f_muted" x="704" y="392" font-size="11" fill="#6c6c73" text-anchor="end"><tspan x="704">same pattern</tspan></text><text class="mono f_green" x="405" y="416" font-size="12" fill="#1f7a49"><tspan x="405">workloads</tspan></text><text class="mono f_green" x="405" y="436" font-size="12" fill="#1f7a49" font-weight="500"><tspan x="405">▸ federated Environment API</tspan></text><text class="mono f_green" x="405" y="454" font-size="12" fill="#1f7a49"><tspan x="405">Kyverno enforce · observability spoke</tspan></text><rect x="40" y="486" width="333" height="84" rx="12" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><rect x="41.3" y="487.3" width="330.5" height="81.5" rx="10.8" fill="none" stroke="#2f5fd0" stroke-width="2.5" clip-path="url(#abar0)"></rect><text class="mono f_blue" x="62" y="510" font-size="11" fill="#2f5fd0" letter-spacing="0.05em"><tspan x="62">SHARED VS. FEDERATED</tspan></text><text class="f_text" x="62" y="531" font-size="12" fill="#1c1c22"><tspan x="62">ArgoCD is shared — one, delivering</tspan><tspan x="62" dy="15.5">everywhere. Provisioning is federated so a</tspan><tspan x="62" dy="15.5">hub outage can’t freeze a spoke’s self-healing.</tspan></text><rect x="387" y="486" width="333" height="84" rx="12" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><rect x="388.3" y="487.3" width="330.5" height="81.5" rx="10.8" fill="none" stroke="#8a6410" stroke-width="2.5" clip-path="url(#abar1)"></rect><text class="mono f_amber" x="409" y="510" font-size="11" fill="#8a6410" letter-spacing="0.05em"><tspan x="409">THE ACCOUNT IS THE FENCE</tspan></text><text class="f_text" x="409" y="531" font-size="12" fill="#1c1c22"><tspan x="409">Preprod genuinely cannot touch prod —</tspan><tspan x="409" dy="15.5">separate billing, IAM, an SCP wall. Enforced</tspan><tspan x="409" dy="15.5">by AWS, not a policy we hope holds.</tspan></text></svg>