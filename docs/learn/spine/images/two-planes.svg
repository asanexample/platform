<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 670" width="760" height="670" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><defs><clipPath id="abar0"><rect x="39.0" y="175.0" width="682.0" height="15.0"/></clipPath><clipPath id="abar1"><rect x="39.0" y="175.0" width="682.0" height="15.0"/></clipPath><clipPath id="abar2"><rect x="39.0" y="473.0" width="11.0" height="106.0"/></clipPath></defs><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#5f78c4"]{fill:#95a6da}[stroke="#5f78c4"]{stroke:#95a6da}[fill="#3f8a5f"]{fill:#68bd8c}[stroke="#3f8a5f"]{stroke:#68bd8c}[fill="#eeeeea"]{fill:#20201c}[stroke="#eeeeea"]{stroke:#20201c}[fill="#8a6410"]{fill:#ecb02d}[stroke="#8a6410"]{stroke:#ecb02d}[fill="#c0392b"]{fill:#e07266}[stroke="#c0392b"]{stroke:#e07266}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}}</style><rect class="f_bg" x="0" y="0" width="760" height="670" fill="#f6f6f3"></rect><text class="mono f_muted" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.6px"><tspan x="40">THE SPLIT · WHY IT MATTERS</tspan></text><text class="f_text" x="40" y="92" font-size="28" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px"><tspan x="40">Two planes, one clean seam</tspan></text><text class="f_muted" x="40" y="118" font-size="15" fill="#6c6c73"><tspan x="40">The control plane makes things exist and keeps them healthy. The data plane serves</tspan><tspan x="40" dy="20">real users. Different components, and — the payoff — different failure consequences.</tspan></text><rect x="40" y="176" width="680" height="278" rx="16" class="f_panelBg" fill="#efefec"></rect><rect x="40" y="176" width="680" height="278" rx="16" class="s_border" fill="none" stroke="#e4e4df" stroke-width="1"></rect><rect x="144" y="176" width="4" height="0"></rect><rect x="41.3" y="177.3" width="677.5" height="275.5" rx="14.8" fill="none" stroke="#2f5fd0" stroke-width="2.5" clip-path="url(#abar0)"></rect><rect x="41.3" y="177.3" width="677.5" height="275.5" rx="14.8" fill="none" stroke="#1f7a49" stroke-width="2.5" clip-path="url(#abar1)"></rect><text class="mono f_blue" x="162" y="204" font-size="14" fill="#2f5fd0" font-weight="600"><tspan x="162">Control plane</tspan></text><text class="f_muted" x="162" y="222" font-size="12.5" fill="#6c6c73"><tspan x="162">a deployment</tspan></text><text class="mono f_green" x="450" y="204" font-size="14" fill="#1f7a49" font-weight="600"><tspan x="450">Data plane</tspan></text><text class="f_muted" x="450" y="222" font-size="12.5" fill="#6c6c73"><tspan x="450">a request</tspan></text><line class="s_border" x1="144" y1="176" x2="144" y2="390" stroke="#e4e4df"></line><line class="s_border" x1="432" y1="176" x2="432" y2="390" stroke="#e4e4df"></line><line class="s_border" x1="40" y1="234" x2="720" y2="234" stroke="#e4e4df"></line><text class="mono f_muted" x="56" y="266" font-size="11" fill="#6c6c73" letter-spacing="0.04em"><tspan x="56">JOB</tspan></text><text class="f_text" x="162" y="258" font-size="13.5" fill="#1c1c22"><tspan x="162">Make things exist,</tspan><tspan x="162" dy="16">keep them healthy</tspan></text><text class="f_text" x="450" y="258" font-size="13.5" fill="#1c1c22"><tspan x="450">Serve real user traffic</tspan></text><line class="s_border" x1="40" y1="290" x2="720" y2="290" stroke="#e4e4df"></line><text class="mono f_muted" x="56" y="322" font-size="11" fill="#6c6c73" letter-spacing="0.04em"><tspan x="56">CAST</tspan></text><text class="mono f_blueMono" x="162" y="314" font-size="12" fill="#5f78c4"><tspan x="162">ArgoCD · Crossplane ·</tspan><tspan x="162" dy="16">Kyverno · Rollouts · CI</tspan></text><text class="mono f_greenMono" x="450" y="314" font-size="12" fill="#3f8a5f"><tspan x="450">DNS · Envoy · Cilium ·</tspan><tspan x="450" dy="16">your pod · Pod Identity</tspan></text><line class="s_border" x1="40" y1="346" x2="720" y2="346" stroke="#e4e4df"></line><text class="mono f_muted" x="56" y="370" font-size="11" fill="#6c6c73" letter-spacing="0.04em"><tspan x="56">TRIGGERED</tspan><tspan x="56" dy="14">BY</tspan></text><text class="f_text" x="162" y="372" font-size="13.5" fill="#1c1c22"><tspan x="162">A git change</tspan></text><text class="f_text" x="450" y="372" font-size="13.5" fill="#1c1c22"><tspan x="450">A user’s click</tspan></text><line class="s_border" x1="40" y1="390" x2="720" y2="390" stroke="#e4e4df"></line><rect x="41" y="391" width="678" height="62" rx="0" class="f_rowHi" fill="#eeeeea"></rect><rect x="40" y="390" width="680" height="64" rx="0" class="s_border" fill="none" stroke="#e4e4df" stroke-width="1"></rect><line class="s_border" x1="144" y1="390" x2="144" y2="454" stroke="#e4e4df"></line><line class="s_border" x1="432" y1="390" x2="432" y2="454" stroke="#e4e4df"></line><text class="mono f_text" x="56" y="418" font-size="11" fill="#1c1c22" font-weight="500" letter-spacing="0.04em"><tspan x="56">IF IT’S</tspan><tspan x="56" dy="14">DOWN</tspan></text><text class="f_amber" x="162" y="418" font-size="14" fill="#8a6410" font-weight="600"><tspan x="162">Can’t change things</tspan></text><text class="f_muted" x="162" y="437" font-size="12" fill="#6c6c73"><tspan x="162">new deploys wait — site keeps serving</tspan></text><text class="f_red" x="450" y="418" font-size="14" fill="#c0392b" font-weight="600"><tspan x="450">Traffic stops</tspan></text><text class="f_muted" x="450" y="437" font-size="12" fill="#6c6c73"><tspan x="450">real users are affected, now</tspan></text><rect x="40" y="176" width="680" height="278" rx="16" class="s_border" fill="none" stroke="#e4e4df" stroke-width="1"></rect><rect x="40" y="474" width="680" height="104" rx="12" class="f_panelBg s_border" fill="#efefec" stroke="#e4e4df" stroke-width="1"></rect><rect x="41.3" y="475.3" width="677.5" height="101.5" rx="10.8" fill="none" stroke="#2f5fd0" stroke-width="2.5" clip-path="url(#abar2)"></rect><text class="mono f_muted" x="62" y="502" font-size="11" fill="#6c6c73" letter-spacing="0.08em"><tspan x="62">AIR TRAFFIC CONTROL</tspan></text><text class="f_text" x="62" y="526" font-size="14" fill="#1c1c22"><tspan x="62">If the control plane goes dark, <tspan font-weight="600">planes already in the air keep flying</tspan>. The request path</tspan><tspan x="62" dy="19">depends on almost none of the control plane, by design — so the blast radius of a control-</tspan><tspan x="62" dy="19">plane outage is “can’t change things,” not “everything is down.”</tspan></text><text class="f_muted" x="40" y="594" font-size="13" fill="#6c6c73"><tspan x="40"><tspan class="f_dim mono" fill="#9a9aa1">THE ONE CLEAN COUPLING · </tspan>The control plane never steers traffic packet-by-packet.</tspan><tspan x="40" dy="18">It edits one piece of data-plane config — the HTTPRoute weight — then steps out. Configure, then step back.</tspan></text></svg>