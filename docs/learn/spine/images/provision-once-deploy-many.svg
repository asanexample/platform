<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 566" width="760" height="566" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif"><style>@media(prefers-color-scheme:dark){[fill="#f6f6f3"]{fill:#1b1b18}[stroke="#f6f6f3"]{stroke:#1b1b18}[fill="#6c6c73"]{fill:#898990}[stroke="#6c6c73"]{stroke:#898990}[fill="#1c1c22"]{fill:#dddde3}[stroke="#1c1c22"]{stroke:#dddde3}[fill="#efefec"]{fill:#1f1f1b}[stroke="#efefec"]{stroke:#1f1f1b}[fill="#a9d3ba"]{fill:#9fd0b3}[stroke="#a9d3ba"]{stroke:#9fd0b3}[fill="#1f7a49"]{fill:#45d487}[stroke="#1f7a49"]{stroke:#45d487}[fill="#e4e4df"]{fill:#252521}[stroke="#e4e4df"]{stroke:#252521}[fill="#ffffff"]{fill:#141414}[stroke="#ffffff"]{stroke:#141414}[fill="#8f8f95"]{fill:#89898f}[stroke="#8f8f95"]{stroke:#89898f}[fill="#e8f5ee"]{fill:#214b35}[stroke="#e8f5ee"]{stroke:#214b35}[fill="#eaf0fc"]{fill:#172a50}[stroke="#eaf0fc"]{stroke:#172a50}[fill="#b9cbee"]{fill:#1e3869}[stroke="#b9cbee"]{stroke:#1e3869}[fill="#2f5fd0"]{fill:#7798e3}[stroke="#2f5fd0"]{stroke:#7798e3}[fill="#9a9aa1"]{fill:#888890}[stroke="#9a9aa1"]{stroke:#888890}}</style><rect class="f_bg" x="0" y="0" width="760" height="566" fill="#f6f6f3"></rect><text class="mono f_muted" x="40" y="54" font-size="12" fill="#6c6c73" letter-spacing="1.6px"><tspan x="40">DELIVERY · THE SPLIT</tspan></text><text class="f_text" x="40" y="92" font-size="28" fill="#1c1c22" font-weight="600" letter-spacing="-0.3px"><tspan x="40">Provision once, deploy many</tspan></text><text class="f_muted" x="40" y="118" font-size="15" fill="#6c6c73"><tspan x="40">A deploy isn’t building a house — it’s a tenant moving into one already built, inspected,</tspan><tspan x="40" dy="20">and furnished. Two different loops, on two different timescales.</tspan></text><rect x="40" y="176" width="680" height="118" rx="16" class="f_panelBg s_greenBd" fill="#efefec" stroke="#a9d3ba" stroke-width="1"></rect><text class="mono f_green" x="64" y="204" font-size="12" fill="#1f7a49" letter-spacing="0.06em"><tspan x="64">DEPLOYED MANY TIMES</tspan></text><rect x="232" y="191" width="96" height="20" rx="10" class="s_border" fill="none" stroke="#e4e4df" stroke-width="1"></rect><text class="mono f_muted" x="280" y="205" font-size="11" fill="#6c6c73" text-anchor="middle"><tspan x="280">every merge</tspan></text><rect x="64" y="222" width="138" height="56" rx="10" class="f_nodeBg s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><text class="mono f_green" x="77" y="246" font-size="12" fill="#1f7a49" font-weight="500"><tspan x="77">Release</tspan></text><text class="f_muted" x="77" y="264" font-size="10.5" fill="#6c6c73"><tspan x="77">the merged digest</tspan></text><line class="s_narrow" x1="208" y1="250" x2="220" y2="250" stroke="#8f8f95" stroke-width="2"></line><path class="f_narrow" fill="#8f8f95" d="M222 250 L215 245 L215 255 Z"></path><rect x="228" y="222" width="138" height="56" rx="10" class="f_nodeBg s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><text class="mono f_green" x="241" y="246" font-size="12" fill="#1f7a49" font-weight="500"><tspan x="241">ApplicationSet</tspan></text><text class="f_muted" x="241" y="264" font-size="10.5" fill="#6c6c73"><tspan x="241">one Release → one App</tspan></text><line class="s_narrow" x1="372" y1="250" x2="384" y2="250" stroke="#8f8f95" stroke-width="2"></line><path class="f_narrow" fill="#8f8f95" d="M386 250 L379 245 L379 255 Z"></path><rect x="392" y="222" width="138" height="56" rx="10" class="f_nodeBg s_border" fill="#ffffff" stroke="#e4e4df" stroke-width="1"></rect><text class="mono f_green" x="405" y="246" font-size="12" fill="#1f7a49" font-weight="500"><tspan x="405">Application</tspan></text><text class="f_muted" x="405" y="264" font-size="10.5" fill="#6c6c73"><tspan x="405">pulls overlays/dev</tspan></text><line class="s_narrow" x1="536" y1="250" x2="548" y2="250" stroke="#8f8f95" stroke-width="2"></line><path class="f_narrow" fill="#8f8f95" d="M550 250 L543 245 L543 255 Z"></path><rect x="556" y="222" width="138" height="56" rx="10" class="f_greenBg s_greenBd" fill="#e8f5ee" stroke="#a9d3ba" stroke-width="1"></rect><text class="mono f_green" x="569" y="246" font-size="12" fill="#1f7a49" font-weight="500"><tspan x="569">workload</tspan></text><text class="f_muted" x="569" y="264" font-size="10.5" fill="#6c6c73"><tspan x="569">manifests + digest</tspan></text><line class="s_greenBd" x1="360" y1="302" x2="360" y2="320" stroke="#1f7a49" stroke-width="2"></line><path class="f_green" fill="#1f7a49" d="M360 328 L354 320 L366 320 Z"></path><text class="mono f_green" x="376" y="322" font-size="11" fill="#1f7a49"><tspan x="376">the tenant moves into a house that already exists</tspan></text><rect x="40" y="342" width="680" height="156" rx="16" class="f_blueBg s_blueBd" fill="#eaf0fc" stroke="#b9cbee" stroke-width="1"></rect><text class="mono f_blue" x="64" y="372" font-size="12" fill="#2f5fd0" letter-spacing="0.06em"><tspan x="64">PROVISIONED ONCE</tspan></text><rect x="210" y="358" width="196" height="20" rx="10" class="s_blueBd" fill="none" stroke="#b9cbee" stroke-width="1"></rect><text class="mono f_blue" x="308" y="372" font-size="11" fill="#2f5fd0" text-anchor="middle"><tspan x="308">namespace: acme-shop-dev</tspan></text><text class="f_muted" x="696" y="372" font-size="12" fill="#6c6c73" text-anchor="end"><tspan x="696">the house</tspan></text><rect x="64" y="388" width="149" height="54" rx="9" class="f_card s_blueBd" fill="#ffffff" stroke="#b9cbee" stroke-width="1"></rect><text class="f_text" x="138.5" y="412" font-size="12.5" fill="#1c1c22" font-weight="500" text-anchor="middle"><tspan x="138.5">dedicated</tspan></text><text class="f_text" x="138.5" y="428" font-size="12.5" fill="#1c1c22" font-weight="500" text-anchor="middle"><tspan x="138.5">registry</tspan></text><rect x="225" y="388" width="149" height="54" rx="9" class="f_card s_blueBd" fill="#ffffff" stroke="#b9cbee" stroke-width="1"></rect><text class="f_text" x="299.5" y="412" font-size="12.5" fill="#1c1c22" font-weight="500" text-anchor="middle"><tspan x="299.5">scoped</tspan></text><text class="f_text" x="299.5" y="428" font-size="12.5" fill="#1c1c22" font-weight="500" text-anchor="middle"><tspan x="299.5">AWS perms</tspan></text><rect x="386" y="388" width="149" height="54" rx="9" class="f_card s_blueBd" fill="#ffffff" stroke="#b9cbee" stroke-width="1"></rect><text class="f_text" x="460.5" y="412" font-size="12.5" fill="#1c1c22" font-weight="500" text-anchor="middle"><tspan x="460.5">network</tspan></text><text class="f_text" x="460.5" y="428" font-size="12.5" fill="#1c1c22" font-weight="500" text-anchor="middle"><tspan x="460.5">policies</tspan></text><rect x="547" y="388" width="149" height="54" rx="9" class="f_card s_blueBd" fill="#ffffff" stroke="#b9cbee" stroke-width="1"></rect><text class="f_text" x="621.5" y="412" font-size="12.5" fill="#1c1c22" font-weight="500" text-anchor="middle"><tspan x="621.5">resource</tspan></text><text class="f_text" x="621.5" y="428" font-size="12.5" fill="#1c1c22" font-weight="500" text-anchor="middle"><tspan x="621.5">quotas</tspan></text><text class="f_muted" x="64" y="472" font-size="12.5" fill="#6c6c73"><tspan x="64">Declared once via the <tspan class="f_blue" fill="#2f5fd0" font-weight="600">Environment API</tspan> (Crossplane), reconciled from git — built, inspected,</tspan><tspan x="64" dy="16">and furnished before any workload arrived.</tspan></text><text class="f_muted" x="40" y="524" font-size="13" fill="#6c6c73"><tspan x="40"><tspan class="f_dim mono" fill="#9a9aa1">SAME RECONCILE PATTERN, TWO CLOCKS · </tspan>The environment reconciles toward git once,</tspan><tspan x="40" dy="18">when declared. The workload reconciles on every merge. Provision once; deploy many.</tspan></text></svg>