 x="610.5">reality</tspan></text><text class="f_green" x="610.5" y="409" font-size="12.5" fill="#1f7a49" font-weight="500" text-anchor="middle"><tspan x="610.5">the workload runs</tspan></text><text class="f_muted" x="380" y="460" font-size="13.5" fill="#6c6c73" text-anchor="middle"><tspan x="380">Same shape at every altitude: <tspan class="f_blue" fill="#2f5fd0">declared state in git</tspan> → a controller always watching →</tspan><tspan x="380" dy="19"><tspan class="f_green" fill="#1f7a49">reality driven to match</tspan>. You don&#39;t learn a dozen systems — you learn one pattern, stacked.</tspan></text></svg>