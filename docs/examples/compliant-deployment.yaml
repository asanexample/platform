# Minimal Kyverno-compliant Deployment for an environment namespace (preprod/platform, ADR-014).
# The canonical concrete example for CLAUDE.md's "Authoring Policy-Compliant Workloads" section. Adapt the
# team/product/service/image to yours; the
# New Product scaffolder emits the same compliant shape as an Argo Rollout (ADR-056) — this Deployment form is
# the minimal equivalent (scaffolder/templates/new-product/skeleton/k8s/ renders kind: Rollout).
#
# Illustrative names: team `alpha`, product `shop`, service `storefront` → namespace alpha-shop-dev, repo alpha-shop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-alpha-shop
  labels:
    app: app-alpha-shop
    app.kubernetes.io/name: app-alpha-shop
    team: alpha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-alpha-shop
  template:
    metadata:
      labels:
        app: app-alpha-shop
        app.kubernetes.io/name: app-alpha-shop
        team: alpha
    spec:
      # Named SA (never `default`) — Pod Identity binds AWS creds here IF the Environment claim declares any
      # (services.<svc>.permissions.aws, ADR-041). NEVER an `eks.amazonaws.com/role-arn` IRSA annotation here
      # (platform-only; a cross-team annotation is denied by disallow-irsa-annotation-cross-team).
      serviceAccountName: app-alpha
      # App does not talk to the Kubernetes API — drop the SA token (least privilege). Pod Identity injects its
      # OWN projected token, so this does not affect AWS access. (Kyverno auto-injects this if omitted.)
      automountServiceAccountToken: false
      containers:
        - name: storefront
          # Product-scoped ECR image (v3: team-<team>/<product>-<service>), with an EXPLICIT immutable tag/digest
          # — never :latest, never untagged. Cross-team images are denied (restrict-images). The :placeholder tag
          # is the pre-first-deploy seed; each overlay's `images:` pins the signed digest CI promotes per stage
          # (promote-by-PR, #377). The image must be cosign-signed (verify-images-product, Enforce on preprod).
          image: 829808296602.dkr.ecr.us-east-1.amazonaws.com/team-alpha/shop-storefront:placeholder
          ports:
            - containerPort: 8080
          # Resource requests AND limits (cpu + memory) are REQUIRED on every container.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # livenessProbe AND readinessProbe are REQUIRED on every container.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
# Auto-injected by Kyverno mutate when omitted (do not bother setting): the container securityContext
# (allowPrivilegeEscalation: false, capabilities.drop: [ALL], seccompProfile.type: RuntimeDefault) and the
# `team` label. Services must be ClusterIP; HTTPRoute hostnames must be in the Environment's allow-list.
# Regulated tiers (hipaa/pci) additionally REQUIRE runAsNonRoot: true + readOnlyRootFilesystem: true.
#
# Also auto-handled by ADR-085 (do not author): graceful-drain defaults (a container preStop sleep +
# terminationGracePeriodSeconds) and topologySpreadConstraints are mutate-injected, and a maxUnavailable=1
# PodDisruptionBudget is generated per workload (selector derived from this Deployment, GC'd with it). Run
# >=2 replicas for these to matter (required in *-prod), and handle SIGTERM in-app to actually drain in-flight.
---
# Default workload autoscaler (ADR-078 Phase 2 — "elastic by construction"). The New Product scaffolder emits
# this against the Rollout; for a plain Deployment it targets the Deployment. The HPA scales on CPU and owns
# the replica count at runtime (so, under GitOps, ignore /spec/replicas so a controller doesn't fight it), and
# Karpenter provisions/reclaims nodes to match. In *-prod keep minReplicas >= 2 (satisfies the replica floor).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-alpha-shop
  labels:
    app.kubernetes.io/name: app-alpha-shop
    team: alpha
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-alpha-shop
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
