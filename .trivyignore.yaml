# Trivy ignore file — accepted findings from the #112 (108a) baseline triage.
# Each entry is PATH-SCOPED so the underlying check still fires on any OTHER
# resource (this is a security gate, not a blanket mute). Paths are relative to
# the scan root (the `trivy config infra/modules` target).
misconfigurations:
  - id: AWS-0104
    paths:
      - "aws/ssm-bastion/main.tf"
    statement: >-
      SSM bastion uses an egress-only security group (no ingress). Broad egress
      to 0.0.0.0/0 is required because AWS SSM endpoints resolve to IPs outside
      the VPC; documented in the module.

  - id: AWS-0104
    paths:
      - "aws/tailscale-router/main.tf"
    statement: >-
      The Tailscale subnet router uses an egress-only security group (no
      ingress). Broad egress to 0.0.0.0/0 on 443/3478/41641 is required: the
      Tailscale coordination server, DERP relays, and STUN/WireGuard peers
      resolve to arbitrary internet IPs that cannot be enumerated as a CIDR.
      Forwarded subnet traffic is separately scoped to the advertised VPC CIDR.

  - id: AWS-0040
    paths:
      - "aws/eks/main.tf"
    statement: >-
      The EKS module intentionally SUPPORTS a public endpoint: it is needed
      during bootstrap (Cilium installs before Tailscale/SSM exist) and for the
      documented preprod cross-VPC-DNS case. Deployed posture is set explicitly
      per unit (platform = private). See the #108 triage.

  - id: AWS-0041
    paths:
      - "aws/eks/main.tf"
    statement: >-
      public_access_cidrs only takes effect when a consumer explicitly enables
      public access; the 0.0.0.0/0 default exists for the documented
      bootstrap/preprod case. Production units must scope CIDRs. See #108 triage.

  - id: AWS-0015
    paths:
      - "aws/cloudtrail/main.tf"
    statement: >-
      CloudTrail logs are encrypted with SSE-KMS (AWS-managed key). A dedicated
      customer-managed CMK is tracked hardening in #118 (regulated-tier),
      deferred to avoid key-policy/cross-account complexity now.

  - id: AWS-0095
    paths:
      - "aws/cost-monitoring/main.tf"
    statement: >-
      The cost-alerts SNS topic is intentionally unencrypted (ADR-092 #1054):
      the AWS-managed key (alias/aws/sns) cannot grant the budgets.amazonaws.com
      / costalerts.amazonaws.com publishers, and AWS Chatbot cannot subscribe to
      a managed-key-encrypted topic — so SSE-KMS here would silently break
      delivery. Payloads are low-sensitivity (account ids + dollar amounts). A
      customer-managed CMK whose key policy admits those principals is the #118
      upgrade path.

  - id: AWS-0132
    paths:
      - "aws/cloudtrail/main.tf"
      - "aws/state_bootstrap/main.tf"
    statement: >-
      Buckets use SSE-KMS (AWS-managed key). Customer-managed CMK for the audit
      and state buckets is tracked in #118; deferred to avoid cross-account KMS
      key-policy complexity (consistent with the s3 module's encryption choice).

  - id: AWS-0132
    paths:
      - "aws/cost-export/main.tf"
    statement: >-
      The CUR bucket uses SSE-S3 (AES256), not a CMK, by necessity (#668): the
      CUR service (billingreports.amazonaws.com) can't use the AWS-managed KMS
      key, and AES256 keeps the cross-account OpenCost reader free of kms:Decrypt.
      Contents are billing data (not secrets). CMK is the regulated-tier upgrade
      (#118), same as the observability stores.

  - id: AWS-0132
    paths:
      - "aws/cnpg-backups/main.tf"
    statement: >-
      The CNPG backup bucket uses SSE-S3 (AES256), the house S3 baseline (same as
      agent-eval-store / the LGTM + cost-export stores). A dedicated CMK trips the
      Infracost gate (+$1/mo on module defaults) and adds key-policy complexity;
      CMK is the regulated-tier upgrade (#118). Backups are already TLS-only,
      versioned, PAB'd, and prefix-scoped by least-privilege IAM (#1119).

  - id: AWS-0132
    paths:
      - "observability-mimir/s3.tf"
    statement: >-
      The Mimir blocks bucket uses SSE-S3 (AES256), not a CMK. AES256 is the right
      fit for a high-churn metrics block store: it avoids per-object KMS
      GenerateDataKey cost/throttle and keeps the Mimir IRSA free of kms perms (an
      SSE-KMS bucket would require kms:GenerateDataKey*/Decrypt or writes fail). It
      is Grafana's documented default. CMK is the regulated-tier upgrade (#118).

  - id: AWS-0132
    paths:
      - "observability-loki/main.tf"
    statement: >-
      The Loki chunks bucket uses SSE-S3 (AES256), not a CMK — same rationale as the
      Mimir blocks bucket (AWS-0132 above): AES256 fits a high-churn log store (no
      per-object KMS GenerateDataKey cost/throttle) and keeps the Loki Pod Identity
      role free of kms perms (an SSE-KMS bucket would require
      kms:GenerateDataKey*/Decrypt or writes fail). CMK is the regulated-tier upgrade (#118).

  - id: AWS-0132
    paths:
      - "observability-tempo/main.tf"
    statement: >-
      The Tempo traces bucket uses SSE-S3 (AES256), not a CMK — same rationale as the
      Loki/Mimir buckets (AWS-0132 above): AES256 fits a high-churn trace store and keeps
      the Tempo Pod Identity role free of kms perms (an SSE-KMS bucket would require
      kms:GenerateDataKey*/Decrypt or writes fail). CMK is the regulated-tier upgrade (#118).

  - id: AWS-0132
    paths:
      - "observability-pyroscope/main.tf"
    statement: >-
      The Pyroscope profiles bucket uses SSE-S3 (AES256), not a CMK — same rationale as the
      Loki/Mimir/Tempo buckets (AWS-0132 above): AES256 fits a high-churn profile store and keeps
      the Pyroscope Pod Identity role free of kms perms (an SSE-KMS bucket would require
      kms:GenerateDataKey*/Decrypt or writes fail). CMK is the regulated-tier upgrade (#118).

  - id: AWS-0136
    paths:
      - "aws/sns-notifications/main.tf"
    statement: >-
      The platform-alerts topic uses SSE-KMS (AWS-managed alias/aws/sns key).
      Customer-managed CMK is tracked in #118, consistent with the cloudtrail
      (AWS-0015) and state-bucket (AWS-0132) encryption choice; deferred to avoid
      the publisher key-policy complexity for now.

  - id: KSV-0041
    paths:
      - "cloudnative-pg/charts/barman-cloud-plugin/templates/plugin.yaml"
    statement: >-
      Vendored upstream Barman Cloud plugin release manifest (v0.13.0, verbatim).
      The plugin's ClusterRole legitimately manages Secrets — it reads each
      ObjectStore's S3 credentials and manages backup-related secrets on behalf of
      the CNPG operator. This is the plugin's required, upstream-defined RBAC; we
      vendor the release manifest unmodified and can't narrow it without forking. #1119.
