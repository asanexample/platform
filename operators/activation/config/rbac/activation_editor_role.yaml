# This rule is not used by the project activation itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the platform.refplat.org.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: activation
    app.kubernetes.io/managed-by: kustomize
  name: activation-editor-role
rules:
- apiGroups:
  - platform.refplat.org
  resources:
  - activations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.refplat.org
  resources:
  - activations/status
  verbs:
  - get
